<style>
:root{
  --ocean:#0d6e75; --ocean-d:#0a565c; --ocean-l:#e6f2f3;
  --sand:#f7f4ee; --surface:#ffffff; --line:#e7e2d8;
  --ink:#1f2a2c; --muted:#6c7a7c;
  --coral:#e8663d; --coral-d:#cf5530;
  --green:#1f9d6b; --amber:#e0a32e; --red:#d34c4c; --blue:#3a78c2; --gray:#9aa6a7; --purple:#7e57c2;
  --shadow:0 1px 2px rgba(16,40,42,.06),0 8px 24px rgba(16,40,42,.08);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px}
.app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--ocean);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;padding-top:max(14px,env(safe-area-inset-top))}
.topbar .brand{font-weight:800;letter-spacing:.2px;font-size:18px;display:flex;align-items:center;gap:9px}
.topbar .logobox{background:#fff;border-radius:9px;padding:5px 11px;display:inline-flex;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.topbar .logobox img{height:26px;display:block}
.loginlogo{display:flex;justify-content:center;margin:2px 0 14px}
.loginlogo img{height:62px;max-width:80%;object-fit:contain}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(232,102,61,.25)}
.topbar .sp{flex:1}
.topbar .who{font-size:13px;opacity:.95;text-align:right;line-height:1.2}
.iconbtn{color:#fff;background:rgba(255,255,255,.14);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.iconbtn:active{transform:scale(.96)}
.content{flex:1;padding:16px;padding-bottom:46px}
.backrow{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
.backbtn{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.h1{font-size:22px;font-weight:800;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px;transition:transform .08s}
.tile:active{transform:translateY(1px) scale(.995)}
.tile .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;color:#fff}
.tile .t{font-weight:700;font-size:16px}
.tile .d{color:var(--muted);font-size:12.5px;line-height:1.35}
.tile .badge{align-self:flex-start;background:var(--ocean-l);color:var(--ocean-d);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:16px}
.field{margin-bottom:13px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
.field .req{color:var(--coral)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink)}

const esHKJefatura = u => !!u && (esGD(u) || (u.hk && u.hk.perfil==='jefatura_hk'));
const esHKCamarero = u => !!u && !!(u.hk && u.hk.perfil==='camarero_hab');

let ACCESOS = null;     // {rol:{cap:bool}} configurable por el desarrollador

/* {area:true|false} · Qué ILD de servicio se consolidan en las filas
   Desayuno/Almuerzo/Cena del Dashboard. Se configura desde Config › ILD ›
   Comidas: detectarlo solo por "tiene pregunta de comida" agrupaba también los

function defaultPuede(u,cap){
  if(!u) return false;
  const [mod,sub]=cap.split(".");
  if(!sub){
    if(cap==='compras') return u.rol!=='colaborador';
    if(cap==='sistemas'||cap==='mantenimiento') return true;
    if(cap==='ild') return ildAreasDe(u).length>0 || esGD(u);
    if(cap==='housekeeping') return tieneHK(u);
    if(cap==='kanban') return esGD(u) || ["compras","sistemas","mantenimiento"].some(m=>(u.gestiona||[]).includes(m));
    return true;
  }
  if(sub==='gestion') return gestionaModulo(u,mod);
  if(sub==='tablero') return gestionaModulo(u,mod) || esGD(u);
  if(cap==='kanban.editar') return esDev(u) || (u.gestiona||[]).length>0;
  return false;
}
function puede(u,cap){ if(esDev(u)) return true;
  if(ACCESOS && ACCESOS[u.rol] && (cap in ACCESOS[u.rol])) return !!ACCESOS[u.rol][cap];
  return defaultPuede(u,cap); }
const areaModo = a => AMODO[a] || (a==='Áreas Públicas'?'lista':'normal');
/* Quiénes pueden recibir una asignación.
   Antes se cruzaban solo las áreas del usuario contra las de los colaboradores.
   Eso dejaba la lista vacía en dos casos reales:
     - Gerencia y Desarrollador no tienen áreas asignadas.
     - Una jefatura puede no tenerlas (hoy es el caso de Soporte Sistemas).
   Ahora se prueban tres fuentes en orden y nunca se devuelve una lista vacía
   cuando hay un módulo de por medio: bloquear la asignación es peor que
   mostrar de más. */
const equipoDe = (u, modulo) => {
  const colabs = USERS.filter(x=>x.rol==='colaborador');
  const porAreas = set => colabs.filter(x=>(x.areas||[]).some(ar=>set.has(ar))).map(x=>x.nombre);
  const propias = new Set((u && u.areas) || []);
  /* Gerencia y Desarrollador ven todos los módulos, así que el área que tengan
     asignada es incidental y no dice a quién corresponde la tarea. Para ellos
     manda el módulo, no su área. */
  const amplio = esGD(u) || esDev(u);
  // 1. áreas propias, para una jefatura de área
  if(!amplio && propias.size){ const r = porAreas(propias); if(r.length) return r; }
  // 2. áreas de las jefaturas que gestionan ese módulo
  if(modulo){
    const jefes = USERS.filter(x=>x.rol==='aprobador' && gestionaModulo(x,modulo));
    const deJefes = new Set(jefes.reduce((acc,x)=>acc.concat(x.areas||[]),[]));
    if(deJefes.size){ const r = porAreas(deJefes); if(r.length) return r; }
  }
  // 3. gerencia o desarrollador sin módulo que acote: sus propias áreas
  if(amplio && propias.size){ const r = porAreas(propias); if(r.length) return r; }
  // 4. último recurso: todos los colaboradores, antes que dejar la lista vacía
  return (modulo || amplio) ? colabs.map(x=>x.nombre) : [];
};

const TZ_EC="America/Guayaquil";
const nowISO = () => new Date().toISOString();
function hoyEC(){ try{ return new Date().toLocaleDateString("en-CA",{timeZone:TZ_EC}); }catch(e){ return new Date(Date.now()-5*3600000).toISOString().slice(0,10); } }
/* ===== v6.8 · Todas las fechas en hora de Ecuador (UTC-5) =====
   Los registros se guardan en UTC (nowISO). Cortar ese ISO a 10 caracteres
   devuelve el día UTC, así que todo lo enviado después de las 19:00 de Ecuador
   aparecía como del día siguiente: por eso algunos ILD y tickets caían en el
   día equivocado. ymdEC() es el único camino permitido para responder
   "¿de qué día calendario es esto?" y hoyEC() para "¿qué día es hoy?". */
function ymdEC(v){
  if(v==null || v==="") return "";
  const s=String(v).trim();
  /* Una fecha sin hora (input type=date, FechaTentativa, FechaSolicitud) ya es
     un día de calendario: convertirla otra vez la correría un día. */
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s);
  if(isNaN(d)) return s.slice(0,10);
  try{ return d.toLocaleDateString("en-CA",{timeZone:TZ_EC}); }
  catch(e){ return new Date(d.getTime()-5*3600000).toISOString().slice(0,10); }
}
/* Hoy en Ecuador, descompuesto. Reemplaza a new Date() cuando lo que se busca
   es el año, el mes o el día actual (los selectores de mes, los días esperados). */
function hoyPartesEC(){ const p=hoyEC().split("-").map(Number); return {y:p[0],m:p[1]-1,d:p[2]}; }
function hoyDateEC(){ const p=hoyPartesEC(); return new Date(p.y,p.m,p.d); }
const anioEC = v => Number(ymdEC(v).slice(0,4));
const mesEC  = v => Number(ymdEC(v).slice(5,7))-1;
/* Suma días a un "YYYY-MM-DD" sin salirse del calendario. */
function sumaDiasYMD(ymd,n){ const p=String(ymd).split("-").map(Number);
  const d=new Date(p[0],p[1]-1,p[2]+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const fmtDate = s => { if(!s) return "—"; const str=String(s);
  if(/^\d{4}-\d{2}-\d{2}/.test(str)){ const p=str.slice(0,10).split("-"); const d=new Date(+p[0],+p[1]-1,+p[2]);
    if(isNaN(d)) return str; return d.toLocaleDateString("es-EC",{day:"2-digit",month:"short",year:"numeric"}); }
  const d=new Date(str); if(isNaN(d)) return str;
  return d.toLocaleDateString("es-EC",{timeZone:TZ_EC,day:"2-digit",month:"short",year:"numeric"}); };
const fmtDT = s => { if(!s) return "—"; const d=new Date(s); if(isNaN(d)) return s;
  return d.toLocaleString("es-EC",{timeZone:TZ_EC,day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };
/* Para exportar a Excel: los campos "Fecha..." mezclan dos formas (una fecha
   pura de un input type=date, ej. "2026-08-11", y una fecha con hora de
   nowISO(), ej. "2026-08-11T19:32:00.000Z"). Antes se exportaba el valor
   crudo tal cual: una columna salía en UTC (hora corrida respecto a Ecuador)
   y otra como texto ISO sin formato — cada fecha se veía "diferente". Esta
   función homologa: fecha pura → solo día (sin forzar zona horaria, para no
   correrla un día), fecha con hora → día+hora en horario de Ecuador. */
function fmtCampoExport(v){
  if(v==null || v==="") return "";
  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return fmtDate(s);
  const d=new Date(s);
  if(isNaN(d)) return s;
  return d.toLocaleString("es-EC",{timeZone:TZ_EC,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
/* Aplica fmtCampoExport a toda columna cuyo nombre contenga "Fecha", para
   Compras/Sistemas/Mantenimiento (ILD ya tiene su propio ildToRow). */
function formatFechasExport(rows){
  return (rows||[]).map(r=>{ const o={...r};
    Object.keys(o).forEach(k=>{ if(/Fecha/.test(k)) o[k]=fmtCampoExport(o[k]); });
    return o; });
}

/* Identificador único, en texto.
   El esquema original (Date.now()%100000 y sumar 1) repetía la semilla cada 100
   segundos: dos equipos que abrían la app con esa diferencia generaban los mismos

   Con texto se combinan tres cosas y la unicidad queda garantizada:
     - el milisegundo

   Se usa solo [a-z0-9] para que también sirva como nombre de carpeta. */

  const t = Date.now();

};

function comprimirImg(dataUrl,maxPx=900,q=0.75){
  return new Promise(res=>{ const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){const s=Math.min(maxPx/w,maxPx/h);w=Math.round(w*s);h=Math.round(h*s);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q)); };
    img.onerror=()=>res(dataUrl); img.src=dataUrl; });
}

const GBASE="https://graph.microsoft.com/v1.0";
/* Token de Graph: se renueva solo. Antes se pedía una sola vez al abrir la app y,
   si la tablet quedaba encendida varias horas, el token vencía a media jornada.
   La app seguía marcando "En línea" (eso solo mira la red del wifi) pero cada
   envío fallaba con 401 y quedaba en la cola local sin que nadie se enterara
   por qué. Ahora gfetch detecta el 401, renueva el token solo y reintenta. */
let SESSION_EXPIRED=false;
async function refreshToken(){
  try{ await msInitApp(); const accs=msalApp.getAllAccounts(); if(!accs.length){ SESSION_EXPIRED=true; return false; }
    const r=await msalApp.acquireTokenSilent({scopes:MS_SCOPES,account:accs[0]});
    graphToken=r.accessToken; SESSION_EXPIRED=false; return true;
  }catch(e){ SESSION_EXPIRED=true; return false; }
}
/* Antes cada pantalla hacía "setRows(await Store.read(...))" sin try/catch: un
   401 por token vencido dejaba la lista vacía en silencio (pantallas "en blanco"
   como el caso de Mantenimiento/Mis tareas). Este helper reintenta una vez tras
   renovar el token y, si de verdad no hay forma de traer los datos, avisa en vez
   de quedarse callado. Se usa en todas las pantallas que cargan listas. */
async function cargarConReintento(leer, setter, toastFn, nombre){
  try{ setter(await leer()); return true; }
  catch(e){
    const ok = MODE==="graph" ? await refreshToken() : false;
    if(ok){ try{ setter(await leer()); return true; }catch(e2){} }
    if(toastFn) toastFn(`No se pudo cargar ${nombre||"la información"}. Toca "Reconectar Microsoft" arriba y vuelve a intentar. (${(e&&e.message)||e})`);
    return false;
  }
}
async function gfetch(path,method="GET",body=null,raw=false,headers=null,_retry){
  const h={Authorization:`Bearer ${graphToken}`};
  if(headers) Object.assign(h,headers);
  if(body && !(body instanceof ArrayBuffer)) h["Content-Type"]="application/json";
  else if(body instanceof ArrayBuffer) h["Content-Type"]="application/octet-stream";
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),30000);
  let r; try{ r=await fetch(GBASE+path,{method,headers:h,body:body?(body instanceof ArrayBuffer?body:JSON.stringify(body)):null,signal:ctrl.signal}); }
  catch(e){ clearTimeout(to); throw new Error("conexión: "+(e.name==="AbortError"?"tiempo de espera agotado":e.message)); }
  clearTimeout(to);
  if(r.status===204){ SESSION_EXPIRED=false; return null; }
  if(r.status===401 && !_retry){ const ok=await refreshToken(); if(ok) return gfetch(path,method,body,raw,headers,true); }
  if(!r.ok){ let extra=""; try{ const j=await r.json(); extra=j.error&&j.error.message?(" — "+j.error.message):""; }catch{} throw new Error(method+" "+path.split("?")[0]+": "+r.status+extra); }
  SESSION_EXPIRED=false;
  return raw?r.arrayBuffer():r.json();
}

async function spEnsureCols(site,lid,t){ if(SP_COLS[t]) return;
  let cols=[]; try{ const r=await gfetch(`/sites/${site}/lists/${lid}/columns?$select=id,name,displayName,text,readOnly,hidden,indexed`); cols=r.value||[]; }catch(e){}
  const findBy=pred=>cols.find(pred);
  // 1. columna de datos: busca "Data" (interno o visible); si no, cualquier multilínea editable; si no, la crea
  let dcol = findBy(c=>c.name==="Data") || findBy(c=>norm(c.displayName)==="data")
          || findBy(c=>c.text&&c.text.allowMultipleLines&&!c.readOnly&&!c.hidden&&c.name!=="Title");
  if(!dcol){ try{ const c=await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Data",text:{allowMultipleLines:true}}); dcol=c; }catch(e){} }
  SP_DCOL[t]=dcol?dcol.name:"Data";
  // 2. Fecha / Estado opcionales: usa el nombre interno real si existe; si no, intenta crear
  const fcol=findBy(c=>norm(c.displayName)==="fecha"||c.name==="Fecha");
  const ecol=findBy(c=>norm(c.displayName)==="estado"||c.name==="Estado");
  SP_COLS[t]={d:SP_DCOL[t], f:fcol?fcol.name:null, e:ecol?ecol.name:null};
  if(!fcol){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Fecha",text:{},indexed:true}); SP_COLS[t].f="Fecha"; }catch(e){} }
  if(!ecol){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Estado",text:{},indexed:true}); SP_COLS[t].e="Estado"; }catch(e){} }
  /* Si la columna Fecha/Estado ya existía sin indexar (listas creadas por versiones
     anteriores de esta app), el filtro server-side de readDesde/readRango cae al
     modo "no indexado": SharePoint puede rechazarlo cuando la lista crece (umbral
     de 5000 elementos), y el código termina descargando la lista COMPLETA para
     filtrar en el navegador. Se intenta indexar una sola vez; si falla (permisos,
     lista ya muy grande para indexar en caliente, etc.) se seguía como hasta ahora. */
  if(fcol && !fcol.indexed && fcol.id){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns/${fcol.id}`,"PATCH",{indexed:true}); }catch(e){} }
  if(ecol && !ecol.indexed && ecol.id){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns/${ecol.id}`,"PATCH",{indexed:true}); }catch(e){} }
}

   la app pesada y las aprobaciones se quedaban pendientes (timeout / reintento).
   Ahora se guarda la última lectura completa un rato corto: si dos acciones ocurren

const SP_ITEMS={}; const SP_LIST_TTL_MS=45000;

function spCacheGet(t){ const c=SP_ITEMS[t]; if(!c) return null;

  async readDesde(t,since){ await spEnsureList(t); const c=SP_COLS[t]||{};

    catch(e){ return (await this.read(t)).filter(r=>recFecha(r)>=since); } },
  async readRango(t,desde,hasta){ await spEnsureList(t); const c=SP_COLS[t]||{};

  async write(t,arr){ const site=await spSite(); const lid=await spEnsureList(t); const c=SP_COLS[t]||{d:"Data"};
    if(!SP_MAP[t]) await this.read(t); const map=SP_MAP[t]||new Map();
    for(const rec of arr){ const j=JSON.stringify(rec); const m=map.get(rec.id);
      const full={Title:String(rec.Codigo||rec.id||"").slice(0,255)}; full[c.d||"Data"]=j;

    const full={Title:String(rec.Codigo||rec.id||"").slice(0,255)}; full[c.d||"Data"]=j;
    if(c.f) full[c.f]=recFecha(rec); if(c.e) full[c.e]=recEstado(rec);

async function msEnsure(){

  }catch(e){ msErr=e.errorMessage||e.message||String(e); }
  return false;

/* ===== CONFIGURACIÓN ILD (checklist, áreas, aprobadores, usuarios, días esperados) ===== */
const DIAS_CFG = {
  feriados: [],            // fechas YYYY-MM-DD marcadas como feriado
  feriadosOpera: true,     // ¿en feriado se sigue inspeccionando? (por defecto sí)
  areas: {},               // areas[area] = {patron:'diario'|'finde'|'vsd'|'personalizado', dias:[0..6]}
  excepciones: {},         // excepciones["YYYY-MM-DD"] = { todas:0|1, areas:{ [area]:0|1 }, motivo:"" }
  ocupacion: {},           // ocupacion["YYYY-MM-DD"] = porcentaje
  reglaOcup: { activa:false, umbral:40, areas:[] }  // bajo ese umbral, estas áreas no aplican
};
function patronDias(p){ return p==='finde'?[0,6]:p==='vsd'?[0,5,6]:p==='diario'?[0,1,2,3,4,5,6]:null; }
/* Un ILD marcado como duplicado sigue existiendo con sus fotos y su revisión,
   pero no cuenta para métricas ni vuelve a pedir aprobación. La marca se pone
   en el campo duplicadoDe, que apunta al registro que sí cuenta. */
function esDuplicado(r){ return !!(r && r.duplicadoDe!=null && r.duplicadoDe!==''); }
function sinDuplicados(a){ return (a||[]).filter(r=>!esDuplicado(r)); }
function isoYMD(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }

/* ¿Le toca a esta área inspeccionar este día? Se resuelve en tres capas,
   y la primera que decide manda:
     1. Excepción puntual de esa fecha (lo que dijo la jefatura ese día)
     2. Regla por ocupación (si el hotel está bajo, ciertas áreas no aplican)
     3. Patrón base del área por día de la semana
   Sirve para responder "hoy cocina no, pero recepción sí". */
function aplicaDia(area, iso){
  if(!iso) return false;
  const ex = (DIAS_CFG.excepciones||{})[iso];
  if(ex){
    if(ex.areas && ex.areas[area]!=null) return !!ex.areas[area];
    if(ex.todas!=null) return !!ex.todas;
  }
  const rg = DIAS_CFG.reglaOcup||{};
  if(rg.activa && (rg.areas||[]).indexOf(area)>=0){
    const oc = (DIAS_CFG.ocupacion||{})[iso];
    if(oc!=null && oc!=="" && Number(oc) < Number(rg.umbral||0)) return false;
  }
  if((DIAS_CFG.feriados||[]).indexOf(iso)>=0 && DIAS_CFG.feriadosOpera===false) return false;
  const cfg = DIAS_CFG.areas[area] || {patron:'diario'};
  let set = cfg.patron==='personalizado' ? (cfg.dias||[]) : patronDias(cfg.patron);
  if(!set) set=[0,1,2,3,4,5,6];
  return set.indexOf(new Date(iso+"T00:00:00").getDay())>=0;
}
/* ¿Este día tiene una decisión manual, distinta de lo que dice el patrón? */
function esExcepcion(area, iso){
  const ex=(DIAS_CFG.excepciones||{})[iso];
  if(!ex) return false;
  if(ex.areas && ex.areas[area]!=null) return true;
  return ex.todas!=null;
}
function diasEsperados(area,year,month,hastaHoy){
  const hoy=hoyPartesEC(); const lastDay=new Date(year,month+1,0).getDate();
  const limit = (hastaHoy && hoy.y===year && hoy.m===month) ? hoy.d : lastDay;
  let n=0; for(let d=1; d<=limit; d++) if(aplicaDia(area,isoYMD(year,month,d))) n++;
  return n;
}
/* Igual que diasEsperados, pero para un mes puntual (mes 0–11) o para el año
   completo (mes=null): suma los días esperados de cada mes ya transcurrido,
   parándose en hoy si el año es el actual. La usa el Resumen Gerencial para
   que su "% Cumplimiento" se calcule sobre días esperados, igual que el
   Dashboard, y no solo sobre lo que ya se llegó a subir. */
function diasEsperadosPeriodo(area,year,mes){
  const hoy=hoyPartesEC();
  if(mes!=null) return diasEsperados(area,year,mes, year===hoy.y && mes===hoy.m);
  const maxM = (year===hoy.y) ? hoy.m : 11;
  let n=0; for(let m=0; m<=maxM; m++) n+=diasEsperados(area,year,m, year===hoy.y && m===hoy.m);
  return n;
}

/* ===== v6.7 · Normalización estructural =====
   Se ejecuta SIEMPRE tras cargar la configuración guardada (SharePoint o local),
   para que estos cambios no se pierdan si quedó un ILD_Config anterior.
   Es estructural, no por nombre: sobrevive a que una jefatura renombre el ILD.
     1. Si un checklist tiene una pregunta tipo 'apertura_cierre', ese ILD pasa a
        turno:true (Apertura/Cierre en la configuración del formulario, como
        Sunset Bar) y la pregunta se elimina del checklist.
     2. Almeja Playera de Servicio también opera con apertura y cierre. */
function _nrm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
function migrarV67(){
  try{
    Object.keys(CL).forEach(a=>{
      if(!Array.isArray(CL[a])) return;
      if(CL[a].some(it=>itemTipo(it)==='apertura_cierre')){
        CL[a]=CL[a].filter(it=>itemTipo(it)!=='apertura_cierre');
        if(AC[a]) AC[a].turno=true;
      }
    });
    Object.keys(AC).forEach(a=>{
      const n=_nrm(a);
      if(n.indexOf('almejaplayera')>=0 && _nrm(AC[a].g)==='servicio') AC[a].turno=true;
    });
  }catch(e){}
}

async function sendMail(to,subject,html){
  if(!NOTIF.enabled) return {ok:false,reason:"notificaciones desactivadas"};
  if(!APP.useGraph) return {ok:false,reason:"estás en modo demo local; inicia sesión con Microsoft"};
  if(!graphToken) return {ok:false,reason:"sin sesión de Microsoft (vuelve a iniciar sesión)"};
  const dest=(Array.isArray(to)?to:[to]).filter(Boolean).map(a=>({emailAddress:{address:String(a).trim()}}));
  if(!dest.length) return {ok:false,reason:"sin destinatario configurado"};
  try{
    let r=await postMail(graphToken,dest,subject,html);
    if(r.status===401||r.status===403){ const tk=await mailStepUp(); if(tk){ r=await postMail(tk,dest,subject,html); } }
    if(r.ok || r.status===202) return {ok:true};
    let m=""; try{ const j=await r.json(); m=(j.error&&j.error.message)?j.error.message:(j.error&&j.error.code)||""; }catch{}
    let ayuda="";
    if(r.status===403) ayuda=" · Falta consentimiento de Mail.Send o el buzón no permite envío. Usa 'Reconectar Microsoft'.";
    else if(r.status===401) ayuda=" · Sesión vencida: usa 'Reconectar Microsoft'.";
    else if(/MailboxNotEnabled|inactive|on-premise/i.test(m)) ayuda=" · La cuenta con la que iniciaste sesión no tiene buzón de correo activo.";
    return {ok:false,reason:(r.status+(m?(" — "+m):""))+ayuda};
  }catch(e){ return {ok:false,reason:e.message}; }
}

function exportXLSX(rows,sheet,filename){

/* ===== HOUSEKEEPING: QR (generar y escanear) ===== */
/* Cada habitación tiene un código QR permanente con este contenido — nunca el
   número de habitación "pelado", para no confundirlo con cualquier otro QR
   que alguien pudiera imprimir por su cuenta. */
const hkQRValor = roomId => "PPHK:HAB:" + roomId;
function hkParseQR(texto){
  const t = String(texto||"").trim();
  const m = t.match(/^PPHK:HAB:(.+)$/);
  return m ? m[1] : null;
}
function QRImg({value,size=170}){
  const ref = useRef();
  useEffect(()=>{
    if(!ref.current) return;
    ref.current.innerHTML = "";
    if(window.__noQR || typeof QRCode==="undefined"){
      ref.current.innerHTML = '<div style="font-size:11px;color:#a83232;padding:8px">QR no disponible</div>';
      return;
    }
    try{ new QRCode(ref.current, {text:value, width:size, height:size, correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ ref.current.innerHTML = '<div style="font-size:11px;color:#a83232;padding:8px">No se pudo generar el QR</div>'; }
  },[value,size]);
  return <div ref={ref} style={{display:"inline-block",background:"#fff",padding:8,borderRadius:8}}/>;
}

${SCR_OPEN} src="${QRCODEJS_DATAURI}">${SCR_CLOSE}
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:16px;background:#fff}
  .card{display:inline-block;width:210px;text-align:center;margin:8px;padding:14px;border:1px solid #ccc;border-radius:10px;page-break-inside:avoid;vertical-align:top}

</style></head><body>`;
  const foot = `
${SCR_OPEN}>

    try{ ${script} }catch(e){}

  const html = head + cards + foot;

}
/* Lector de QR con la cámara del dispositivo (jsQR + getUserMedia). No usa
   ninguna librería nativa del navegador para no depender de permisos aparte
   de la cámara, que ya se pide de forma explícita. */
function QRScanner({onDetect,onClose}){
  const videoRef=useRef(), canvasRef=useRef(), streamRef=useRef(null), rafRef=useRef(null), doneRef=useRef(false);
  const [err,setErr]=useState("");
  useEffect(()=>{
    let cancelled=false;
    function detener(){
      if(rafRef.current) cancelAnimationFrame(rafRef.current);
      if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    }
    (async()=>{
      if(window.__noJsQR || typeof jsQR==="undefined"){ setErr("No se pudo cargar el lector de QR."); return; }
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setErr("Este dispositivo/navegador no permite usar la cámara aquí."); return; }
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
        if(cancelled){ stream.getTracks().forEach(t=>t.stop()); return; }
        streamRef.current = stream;
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        const tick=()=>{
          if(doneRef.current || cancelled) return;
          const v=videoRef.current, c=canvasRef.current;
          if(v && v.readyState===v.HAVE_ENOUGH_DATA && v.videoWidth){
            c.width=v.videoWidth; c.height=v.videoHeight;
            const ctx=c.getContext("2d"); ctx.drawImage(v,0,0,c.width,c.height);
            let img; try{ img=ctx.getImageData(0,0,c.width,c.height); }catch(e){ img=null; }
            const code = img ? jsQR(img.data,c.width,c.height) : null;
            if(code && code.data){ doneRef.current=true; detener(); onDetect(code.data); return; }
          }
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
      }catch(e){ setErr("No se pudo acceder a la cámara: "+(e.message||e)); }
    })();
    return ()=>{ cancelled=true; detener(); };
  },[]);
  return <Modal title="Escanear QR de habitación" onClose={onClose}>
    {err
      ? <div className="lerr" style={{whiteSpace:"normal"}}>{err}</div>
      : <div>
          <video ref={videoRef} playsInline muted style={{width:"100%",borderRadius:12,background:"#000",maxHeight:360,objectFit:"cover"}}/>
          <canvas ref={canvasRef} style={{display:"none"}}/>
          <div className="hint" style={{marginTop:8}}>Apunta la cámara al código QR pegado en la puerta de la habitación.</div>
        </div>}
  </Modal>;
}

function ILD({user,toast,setFoto,bump}){
  const esDevv = esDev(user); const esGer = user.rol==='gerencia';
  const puedeRevisar = esGD(user) || user.rol==='aprobador';
  const showNuevo = !esGer;                                  // Gerencia no ingresa ILD
  const showChecklist = (user.rol==='aprobador' || esDevv);  // Gerencia no edita checklist
  const [tab,setTab]=useState(esGer?"bandeja":"nuevo");
  const [regs,setRegs]=useState([]);
  const [drafts,setDrafts]=useState([]);
  /* Ids de ILD que ya tienen una revisión esperando en la cola. Se sacan de la
     bandeja: si siguen apareciendo como Pendiente, la gente los vuelve a aprobar. */
  const [enCola,setEnCola]=useState([]);
  const cargarDrafts=async()=>{ try{ const c=await Cola.todas(user.nombre); setDrafts(c);
    setEnCola(c.filter(d=>d.payload&&d.payload.clase==="cambio"&&d.payload.tabla==="ILD"&&!d.conflicto)
      .map(d=>String(d.payload.recId))); }catch(e){} };
  async function enviarPendientes(silencioso){
    if(!navigator.onLine){ if(!silencioso)toast("Aún sin conexión. Intenta cuando tengas internet."); return; }
    const pend=await Cola.todas(user.nombre); if(!pend.length){ if(!silencioso)toast("No hay nada pendiente."); return; }
    if(Cola.ocupado()) return;
    const r=await Cola.enviar(user.nombre, cargarDrafts); await cargarDrafts(); load();
    if(r.ocupado || silencioso) return;
    if(r.sinRed) toast("Sin conexión todavía.");
    else if(r.fail) toast(`Quedan ${r.fail} por enviar.`);
    else if(r.ok) toast(`Listo, se enviaron ${r.ok}.`);
  }
  /* Vigencia de la bandeja: un ILD ya resuelto (Aprobado / Con observaciones) deja
     de mostrarse en la app pasados VIGENCIA_ILD_DIAS — sigue guardado en SharePoint
     tal cual, no se borra ni se archiva, solo no viaja a la pantalla. Los que
     siguen "Pendiente" NO se ocultan por antigüedad: se agregan aparte con
     readPendientesAntiguos para que una aprobación olvidada no desaparezca sola.
     Esto también reduce lo que hay que descargar/parsear cada vez que se abre la
     bandeja o se aprueba un ILD (reload() vuelve a llamar a load()). */
  const VIGENCIA_ILD_DIAS = 45;
  const load=async()=>cargarConReintento(async()=>{
    const desde = desdeDias(VIGENCIA_ILD_DIAS);
    const recientes = await Store.readDesde("ILD", desde);
    let viejosPendientes = [];
    try{ viejosPendientes = await Store.readPendientesAntiguos("ILD", desde); }catch(e){}
    if(!viejosPendientes.length) return recientes;
    const vistos = new Set(recientes.map(r=>r.id));
    return recientes.concat(viejosPendientes.filter(r=>!vistos.has(r.id)));
  }, setRegs, toast, "los ILD");
  useEffect(()=>{load(); cargarDrafts();},[]);
  useEffect(()=>{ const h=()=>enviarPendientes(true); window.addEventListener("online",h); return ()=>window.removeEventListener("online",h); },[user]);
  const guardarCfg=()=>{ cfgSave(); bump&&bump(); };
  return <div>
    <h1 className="h1">ILD · Inspección diaria</h1>
    <p className="sub">Lista de verificación por área y turno.</p>
    {(showNuevo||puedeRevisar||showChecklist||esDevv) && <div className="seg">
      {showNuevo && <button className={tab==="nuevo"?"on":""} onClick={()=>setTab("nuevo")}>Nuevo</button>}
      {showNuevo && <button className={tab==="mios"?"on":""} onClick={()=>{setTab("mios");load();}}>Mis ILD</button>}
      {drafts.length>0 && <button className={tab==="drafts"?"on":""} style={{color:"#7a5a12"}} onClick={()=>{setTab("drafts");cargarDrafts();}}>📥 Sin enviar ({drafts.length})</button>}
      {puedeRevisar && <button className={tab==="bandeja"?"on":""} onClick={()=>{setTab("bandeja");load();}}>{esGD(user)?"Todos":"Por aprobar"}</button>}
      {puedeRevisar && <button className={tab==="dash"?"on":""} onClick={()=>{setTab("dash");load();}}>Dashboard</button>}
      {esGD(user) && <button className={tab==="resumen"?"on":""} onClick={()=>setTab("resumen")}><Icon name="trendup" size={15} style={{marginRight:6}}/>Resumen Gerencial</button>}
      {showChecklist && <button className={tab==="check"?"on":""} onClick={()=>setTab("check")}>Checklist</button>}
      {esDevv && <button className={tab==="conf"?"on":""} onClick={()=>setTab("conf")}>Configurar</button>}
    </div>}
    {tab==="nuevo" && showNuevo && <ILDForm user={user} toast={toast} onSaved={()=>{load();setTab("mios");}} onDraft={()=>{cargarDrafts();setTab("drafts");}} setFoto={setFoto}/>}
    {tab==="mios" && showNuevo && <ILDMios user={user} regs={regs} setFoto={setFoto}/>}
    {tab==="drafts" && showNuevo && <DraftsPanel user={user} drafts={drafts} onEnviar={()=>enviarPendientes(false)} onReload={cargarDrafts} setFoto={setFoto} toast={toast}/>}
    {tab==="bandeja" && <ILDPanel user={user} regs={regs} enCola={enCola} reload={()=>{load();cargarDrafts();}} toast={toast} setFoto={setFoto}/>}
    {tab==="dash" && <ILDDash user={user}/>}
    {tab==="resumen" && <ResumenGerencialILD/>}
    {tab==="check" && showChecklist && <ChecklistEditor user={user} toast={toast} onSave={guardarCfg}/>}
    {tab==="conf" && esDevv && <ILDConfig user={user} toast={toast} onSave={guardarCfg}/>}
  </div>;
}

/* ===== Borradores offline (IndexedDB): guardar ILD en la tablet sin señal ===== */
const DDB={ _db:null,
  open(){ return new Promise((res,rej)=>{ if(this._db) return res(this._db);
    let rq; try{ rq=indexedDB.open("pp_offline",1); }catch(e){ return rej(e); }
    rq.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains("drafts")) db.createObjectStore("drafts",{keyPath:"id"}); };
    rq.onsuccess=e=>{ this._db=e.target.result; res(this._db); };
    rq.onerror=()=>rej(rq.error); }); },
  async all(){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const r=db.transaction("drafts","readonly").objectStore("drafts").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }catch(e){ return []; } },
  async put(d){ const db=await this.open(); return new Promise((res,rej)=>{ const r=db.transaction("drafts","readwrite").objectStore("drafts").put(d); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  async del(id){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const r=db.transaction("drafts","readwrite").objectStore("drafts").delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }catch(e){} }
};
/* =========================================================================
   COLA DE ENVÍO ÚNICA — ILD, Compras, Sistemas y Mantenimiento
   -------------------------------------------------------------------------
   Todo formulario se guarda primero en esta cola y luego se envía. Un solo
   camino para con señal y sin señal, así no hay dos formas de crear un registro.

   Cómo se evita el envío duplicado:
   1. El id del registro se crea al LLENAR el formulario, no al enviarlo.
      Si un envío se corta a medias y se reintenta, la capa de datos reconoce
      ese id y actualiza el registro en vez de crear otro.
   2. Antes de crear se consulta si el id ya está en SharePoint. Si el intento
      anterior sí llegó, no se vuelve a crear: solo se limpia la cola.
   3. Un candado permite un solo envío a la vez. El evento "online" se dispara
      varias veces cuando la señal va y viene, y antes eso lanzaba envíos en paralelo.
   4. Si una foto no se sube, el envío falla completo y el formulario se queda
      en la cola para reintentarlo. Antes se guardaba la referencia rota y la
      evidencia se perdía sin aviso.
   ========================================================================= */

/* Código secuencial a partir del mayor existente (no del conteo: si se borraba
   un registro, el conteo volvía atrás y repetía un código ya usado). */
function nextCodeUnico(prefix, arr){
  const pre = prefix + "-" + yr() + "-";
  let max = 0;
  const usados = new Set();
  (arr||[]).forEach(x=>{ const c = String(x.Codigo||""); usados.add(c);
    if(c.indexOf(pre)===0){ const n = parseInt(c.slice(pre.length),10); if(isFinite(n) && n>max) max = n; } });
  let n = max + 1;
  while(usados.has(pre + String(n).padStart(4,"0"))) n++;
  return pre + String(n).padStart(4,"0");
}

/* Candado de un solo uso por formulario, para los botones "Enviar/Crear".
   Por qué no basta con useState: dos clics o toques casi simultáneos (el caso
   real reportado: "de afán, doy clic varias veces") pueden procesarse ANTES de
   que React repinte el botón como deshabilitado. El segundo clic ejecuta el
   mismo handler de la última pintura, que todavía tiene "busy=false" en su
   clausura (closure) — por eso el chequeo "if(busy) return" fallaba. Un ref
   no depende de un repintado: se lee y se escribe al instante, así que el
   segundo clic sí ve que el primero ya puso el candado, sin importar si React
   ya volvió a renderizar. Se usa junto con el "busy" de estado solo para que
   el botón muestre "Enviando…"; el candado real es el ref. */
function useEnvioUnico(){
  const [busy,setBusy]=useState(false);
  const lock=useRef(false);
  async function unaVez(fn){
    if(lock.current) return;
    lock.current=true; setBusy(true);
    try{ await fn(); } finally { lock.current=false; setBusy(false); }
  }
  return [busy,unaVez];
}

/* Sube las fotos y falla si alguna no llegó, para poder reintentar. */
async function subirFotosEstricto(fotos, dir, prefijo){
  const r = await subirFotos(fotos, dir, prefijo);
  const malas = (r||[]).filter(f=>f && f.error).length;
  if(malas) throw new Error(`No se pudieron subir ${malas} de ${r.length} foto(s)`);
  return r;
}

const Cola = {
  /* Encola un CAMBIO sobre un registro que ya existe (aprobar, concluir, asignar…). */
  async cambio(payload, quien){
    /* Si ya hay un cambio pendiente que lleva ESTE registro al MISMO estado,
       se reemplaza en vez de agregar otro. Es lo que pasaba cuando la red fallaba:
       la persona volvía a tocar "Aprobar" y quedaban tres cambios idénticos en fila.
       Los agregados (avances) no se deduplican: cada uno es un texto distinto. */
    const campoEst = payload.campoEstado || "Estado";
    const destino = payload.patch ? payload.patch[campoEst] : undefined;
    if(destino!=null){
      try{
        const ds = await DDB.all();
        const gemelo = ds.find(d => d.payload && d.payload.clase==="cambio" && !d.conflicto
          && d.payload.tabla===payload.tabla
          && String(d.payload.recId)===String(payload.recId)
          && (d.payload.patch ? d.payload.patch[d.payload.campoEstado||"Estado"] : undefined)===destino);
        if(gemelo){
          await DDB.put({ ...gemelo, intentos:0, error:"",
            payload:{ ...payload, clase:"cambio", patchId:gemelo.payload.patchId, creado:gemelo.payload.creado } });
          return gemelo;
        }
      }catch(e){}
    }
    const it = { id: gid(), tabla: payload.tabla, quien: quien||"", conflicto:"",
                 payload: { ...payload, clase:"cambio", patchId: payload.patchId || ("p"+gid()), creado: nowISO() },
                 intentos: 0, error: "", createdAt: nowISO() };
    await DDB.put(it); return it;
  },
  /* Reintenta un cambio que quedó marcado como conflicto, pisando lo que haya. */
  async forzar(id){
    const ds = await DDB.all(); const d = ds.find(x=>x.id===id); if(!d) return;
    await DDB.put({ ...d, conflicto:"", error:"", payload:{ ...d.payload, forzar:true } });
  },
  /* Encola un registro ya construido por su módulo. rec.id debe venir puesto. */
  async add(payload, quien){
    const it = { id: gid(), tabla: payload.tabla, quien: quien||"", payload,
                 intentos: 0, error: "", createdAt: nowISO() };
    await DDB.put(it); return it;
  },
  /* Incluye los borradores del formato anterior (kind:"ILD") para no perderlos. */
  async todas(quien){
    const ds = await DDB.all();
    const out = [];
    for(const d of ds){
      if(d.payload && d.payload.tabla){ out.push(d); }
      else if(d.kind==="ILD" && d.payload){
        out.push({ ...d, tabla:"ILD", quien:(d.payload.usuario||""), viejo:true,
          payload:{ tabla:"ILD", viejo:true, rec:null, crudo:d.payload,
            fotos:d.payload.fotos||[], fotoField:"fotos", prefijo:"ILD",
            resumen:{ titulo:d.payload.area||"ILD", sub:d.payload.zona||d.payload.turno||"" } } });
      }
    }
    return quien ? out.filter(d=>(d.quien||"")===quien) : out;
  },
  async del(id){ await DDB.del(id); },
  /* Cuántos hay realmente por enviar y cuántos esperan una decisión. */
  async resumen(quien){
    const c = await this.todas(quien);
    return { porEnviar: c.filter(d=>!d.conflicto).length, enConflicto: c.filter(d=>!!d.conflicto).length, total: c.length };
  },
  /* Se ejecuta sola al abrir la app. Nadie tiene que decidir nada:
     los conflictos que ya no tienen sentido se descartan en silencio. */
  async autoLimpiar(quien){
    try{
      if(!navigator.onLine) return {quitados:0,quedan:0};
      const hay=(await this.todas(quien)).some(d=>!!d.conflicto);
      if(!hay) return {quitados:0,quedan:0};
      return await this.limpiarResueltos(quien);
    }catch(e){ return {quitados:0,quedan:0}; }
  },
  /* Descarta los conflictos que dejaron de tener sentido porque el registro ya
     quedó en el estado al que esa persona lo quería llevar. Es el caso típico:
     tocó "Aprobar" varias veces porque la red falló, y el primero sí llegó. */
  async limpiarResueltos(quien){
    const c = (await this.todas(quien)).filter(d=>!!d.conflicto);
    let quitados=0, quedan=0;
    for(const d of c){
      try{
        const pl=d.payload||{}; const campoEst=pl.campoEstado||"Estado";
        const destino=pl.patch?pl.patch[campoEst]:undefined;
        if(destino==null){ quedan++; continue; }
        const arr=await Store.read(pl.tabla);
        const rec=arr.find(x=>x.id===pl.recId) || (pl.recCodigo?arr.find(x=>x.Codigo===pl.recCodigo):null);
        if(!rec){ await DDB.del(d.id); quitados++; continue; }
        if(rec[campoEst]===destino){ await DDB.del(d.id); quitados++; } else quedan++;
      }catch(e){ quedan++; }
    }
    return { quitados, quedan };
  },
  _enviando: false,
  ocupado(){ return this._enviando; },
  async enviar(quien, onPaso){
    if(this._enviando) return { ocupado:true, ok:0, fail:0, dup:0, conf:0, total:0 };
    if(!navigator.onLine) return { sinRed:true, ok:0, fail:0, dup:0, conf:0, total:0 };
    this._enviando = true;
    let ok=0, fail=0, dup=0, conf=0, ultimo="", err="";
    try{
      /* Los conflictos quedan fuera del reintento: nunca se resuelven solos y
         reintentarlos en cada parpadeo de la red era lo que llenaba la pantalla
         de mensajes. Esperan una decisión de la persona. */
      const ds = (await this.todas(quien)).filter(d=>!d.conflicto);
      for(const d of ds){
        try{
          const esCambio = d.payload && d.payload.clase==="cambio";
          const r = esCambio ? await colaAplicarCambio(d) : await colaEnviarUno(d);
          if(r.conflicto){
            conf++;
            await DDB.put({ ...d, conflicto:`Otra persona lo movió a "${r.actual}". Tu cambio salía de "${r.esperado}" y no se aplicó para no borrar su trabajo.` });
            if(onPaso) try{ await onPaso(); }catch(_){}
            continue;
          }
          if(r.dup) dup++; else { ok++; ultimo = r.codigo || ""; }
          await DDB.del(d.id);
        }catch(e){
          fail++; err = String((e && e.message) || e).slice(0,200);
          try{ await DDB.put({ ...d, intentos:(d.intentos||0)+1, error:err }); }catch(_){}
        }
        if(onPaso) try{ await onPaso(); }catch(_){}
      }
      return { ok, fail, dup, conf, total: ds.length, ultimo, err };
    } finally { this._enviando = false; }
  }
};

async function colaEnviarUno(d){
  const pl = d.payload;
  const tabla = pl.tabla;

  /* Los borradores del formato viejo no traían id: se les asigna uno y se
     guarda ANTES de intentar, para que un reintento use el mismo. */
  if(pl.viejo && !pl.recId){
    pl.recId = gid();
    await DDB.put({ ...d, payload: pl });
  }
  const idReg = pl.viejo ? pl.recId : (pl.rec && pl.rec.id);
  if(!idReg) throw new Error("El registro no tiene id");

  const arr = await Store.read(tabla);

  /* ¿El intento anterior sí llegó? Entonces no se crea nada. */
  const ya = arr.find(x=>x.id===idReg);
  if(ya) return { dup:true, codigo: ya.Codigo };

  const campoFotos = pl.fotoField || "Fotos";
  const esLista = LIST_TABLES.includes(tabla);

  /* Datos base del registro, antes de tener Código todavía. */
  let baseRec;
  if(pl.viejo){
    const c = pl.crudo;
    baseRec = { id:idReg, area:c.area, turno:c.turno||"", selecciones:c.sel||{}, usuario:c.usuario,
      fecha:c.fecha||nowISO(), checks:c.checks||{}, textos:c.txt||{}, obs:c.obs||"",
      estado:"Pendiente", notaJef:"", aprobador:"", fechaAprobacion:"", notaGerencia:"",
      totalItems:c.totalItems||1, completados:c.completados||0,
      clItems:c.clItems||(CL[c.area]||[]), aprobadorEsperado:APR[c.area]||"—" };
    if(c.zona) baseRec.zona = c.zona;
  } else {
    baseRec = { ...pl.rec };
  }

  /* Código: la causa real de los códigos duplicados era calcularlo en el
     celular como "el mayor que veo + 1". Si dos tablets envían casi al mismo
     tiempo, ambas pueden ver el mismo máximo y calcular el mismo código.
     La corrección: para las listas de SharePoint (ILD, Compras, Sistemas,
     Mantenimiento) primero se crea el ítem con un código provisional, y el
     Código definitivo se arma con el ID que SharePoint le asigna a ESE ítem —
     un contador que lleva el propio servidor de forma atómica y que nunca
     repite, así lleguen dos envíos en el mismo segundo. Solo se usa el
     cálculo anterior (nextCodeUnico) como respaldo para alguna tabla que en
     el futuro no viva en una lista de SharePoint. */
  let Codigo;
  if(esLista){
    const spId = await ListStore.writeOne(tabla, { ...baseRec, Codigo:"" });
    Codigo = pl.prefijo + "-" + yr() + "-" + String(spId).padStart(4,"0");
  } else {
    Codigo = nextCodeUnico(pl.prefijo, arr);
  }

  /* Carpeta y prefijo de las fotos: {COD} y {ID} se reemplazan al enviar. */
  const sust = t => String(t||"").replace(/\{COD\}/g, Codigo).replace(/\{ID\}/g, idReg);
  let fotosData = [];
  if((pl.fotos||[]).length) fotosData = await subirFotosEstricto(pl.fotos, sust(pl.fotoDir), sust(pl.fotoPrefix));

  let cotizData = null;
  if(pl.cotiz){
    cotizData = await subirCotiz(pl.cotiz, sust(pl.fotoDir), Codigo);
    if(cotizData && cotizData.error) throw new Error("No se pudo subir la cotización");
  }

  const nuevo = pl.viejo
    ? { ...baseRec, Codigo, fotos: fotosData }
    : { ...baseRec, Codigo, [campoFotos]: fotosData };
  if(pl.cotizField && cotizData) nuevo[pl.cotizField] = cotizData;

  /* Para las listas, esto termina de grabar (PATCH) el mismo ítem creado
     arriba, ya con Código, fotos y el resto de los campos definitivos. */
  await Store.write(tabla, [nuevo, ...arr]);
  try{ colaNotificar(pl.notif, nuevo); }catch(e){}
  return { codigo: Codigo };
}

/* Aplica un cambio sobre un registro existente.
   Tres protecciones:
   - Si el cambio ya se aplicó antes (patchId registrado), no se repite: evita
     que un avance o una línea de historial se duplique al reintentar.
   - Si el registro cambió de estado mientras el equipo estaba sin señal, NO se
     pisa: se marca como conflicto y la persona decide.
   - Los agregados a arreglos (avances) se calculan sobre el registro fresco,
     no sobre la copia vieja que tenía el equipo. */
async function colaAplicarCambio(d){
  const pl = d.payload, tabla = pl.tabla;
  /* Antes esto era "const arr = await Store.read(tabla)": bajaba la lista ENTERA
     (todo el histórico de ILD, paginado de a 500) solo para ubicar un registro.
     Con Store.readOne, si el registro ya salió en la bandeja de esta sesión (el
     caso normal al aprobar), es una sola llamada liviana en vez de descargar y
     parsear meses de historial en cada "Aprobar". Esto es lo que hacía que, al
     aprobar varias ILD seguidas, la app se sintiera pesada y algunas quedaran
     pendientes por agotar el tiempo de espera. */
  const rec = await Store.readOne(tabla, pl.recId, pl.recCodigo);
  if(!rec) throw new Error("El registro ya no existe: "+(pl.recCodigo||pl.recId));

  const hechos = Array.isArray(rec.cambiosAplicados) ? rec.cambiosAplicados : [];
  if(pl.patchId && hechos.indexOf(pl.patchId)>=0) return { dup:true, codigo:rec.Codigo };

  /* ILD guarda el estado en "estado" y los demás módulos en "Estado". */
  /* Un conflicto solo existe si se cumplen tres cosas a la vez:
       a. el cambio mueve el estado (un avance o un comentario no compiten con nadie),
       b. el registro no está donde yo lo dejé, y
       c. tampoco está ya donde yo lo quería llevar.
     Si falta cualquiera de las tres, el cambio se aplica sin molestar a nadie.
     El último caso es frecuente: dos personas concluyen la misma tarea. No es un
     conflicto, es que ya está hecho — y se aplica igual para no perder el
     comentario ni las horas que traía este cambio. */
  const campoEst = pl.campoEstado || "Estado";
  const actual = rec[campoEst];
  const destino = pl.patch ? pl.patch[campoEst] : undefined;
  if(!pl.forzar && destino!=null && pl.estadoPrevio!=null && actual!=null
     && actual!==pl.estadoPrevio && actual!==destino){
    return { conflicto:true, actual, esperado:pl.estadoPrevio, codigo:rec.Codigo };
  }

  const extra = {};
  if((pl.fotos||[]).length){
    const sust = t => String(t||"").replace(/\{COD\}/g, rec.Codigo).replace(/\{ID\}/g, rec.id);
    extra[pl.fotoField||"FotosCierre"] = await subirFotosEstricto(pl.fotos, sust(pl.fotoDir), sust(pl.fotoPrefix));
  }

  const nuevo = { ...rec, ...(pl.patch||{}), ...extra };
  (pl.appends||[]).forEach(a=>{ const prev = Array.isArray(rec[a.campo]) ? rec[a.campo] : []; nuevo[a.campo] = [...prev, a.item]; });

  if(pl.patch && pl.patch.Estado && pl.patch.Estado!==rec.Estado){
    const h = Array.isArray(rec.historial) ? rec.historial : [];
    nuevo.historial = [...h, { estado:pl.patch.Estado, fecha:pl.creado||nowISO(), quien:d.quien||"", nota:(pl.nota||"").slice(0,300) }];
  }
  if(pl.patch && pl.patch.estado && pl.patch.estado!==rec.estado){
    const h = Array.isArray(rec.historial) ? rec.historial : [];
    nuevo.historial = [...h, { estado:pl.patch.estado, fecha:pl.creado||nowISO(), quien:d.quien||"", nota:(pl.nota||"").slice(0,300) }];
  }
  if(pl.patchId) nuevo.cambiosAplicados = [...hechos, pl.patchId].slice(-50);

  /* Se guarda SOLO este registro (ver Store.writeOne): en modo local reemplaza
     su entrada en la tabla; en SharePoint es un único PATCH al ítem que cambió,
     sin tocar ni volver a leer el resto de la lista. */
  await Store.writeOne(tabla, nuevo);
  try{ if(pl.avisar) await avisarCambio(pl, nuevo); }catch(e){}
  return { codigo: rec.Codigo };
}

async function avisarCambio(pl, nuevo){
  const a = pl.avisar;
  if(a.notif==="ildDecidido"){ Notif.ildDecidido(nuevo, a.quien); }
  else if(a.notif==="ticketFinalizado"){ Notif.ticketFinalizado(nuevo, a.tipo); }
  for(const p of (a.para||[])) await addNotif(p.nombre, p.texto, p.ildId||"", p.codigo||nuevo.Codigo||"");
}

function colaNotificar(n, nuevo){
  if(!n) return;
  if(n.t==="ild") Notif.ildSubido(nuevo, n.usuario);
  else if(n.t==="ticket") Notif.ticketNuevo(nuevo, n.usuario, n.tipo);
  else if(n.t==="compra") Notif.comprasNueva(nuevo, n.usuario);
}

          toast(r.quedan?`Se resolvieron ${r.quitados}. Quedan ${r.quedan}.`:`Listo, se resolvieron ${r.quitados}.`); }}>

        <span style={{background:d.conflicto?"#FBD9D9":"#F3E6C6",color:d.conflicto?"#8f2020":"#7a5a12",fontWeight:700,fontSize:11,padding:"3px 9px",borderRadius:20,whiteSpace:"nowrap"}}>{d.conflicto?"Conflicto":"Sin enviar"}</span></div>
      {d.conflicto && <div style={{background:"#FDF0F0",border:"1px solid #F3C9C9",borderRadius:9,padding:"9px 11px",marginTop:8,fontSize:12.5,color:"#8f2020"}}>

function ILDForm({user,toast,onSaved,setFoto,onDraft}){
  const areas=ildAreasDe(user);
  const [area,setArea]=useState(""); const [turno,setTurno]=useState("");
  const [checks,setChecks]=useState({}); const [sel,setSel]=useState({}); const [txt,setTxt]=useState({});
  const [fotos,setFotos]=useState([]); const [obs,setObs]=useState(""); const [busy,unaVez]=useEnvioUnico();
  const [zona,setZona]=useState("");
  const modo=area?areaModo(area):'normal';
  const needsTurno=area && AC[area]?.turno && modo!=='lista';
  const items=area?(CL[area]||[]):[];
  function resetCampos(){ setChecks({});setSel({});setTxt({});setFotos([]);setObs("");setZona(""); }
  useEffect(()=>{ resetCampos(); setTurno(""); },[area]);
  const req=fotosReq(area);
  /* Ítems "Sí/No (foto obligatoria si es Sí)": cada uno respondido "Sí" suma 1 foto
     obligatoria al total, además de las fotos fijas del área (req). Si se responde
     "No", ese ítem no exige foto. */
  const extraFotoObs = items.reduce((n,it,i)=> n + (itemTipo(it)==='sino_foto' && checks['yn-'+i]==='si' ? 1 : 0), 0);
  const reqTotal = req + extraFotoObs;
  // progreso
  let total=0,done=0;
  items.forEach((it,i)=>{ const t=itemTipo(it);
    if(t==='foto'){total++; if(checks[i])done++;}
    else if(t==='sino'||t==='sino_foto'){total++; if(checks['yn-'+i])done++;}
    else if(t==='apertura_cierre'||t==='comida'){total++; if(sel[i])done++;} });
  const pct=total?Math.round(done/total*100):0;
  async function onFiles(e){
    const files=Array.from(e.target.files); e.target.value="";
    const srcs=await Promise.all(files.map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=ev=>r(ev.target.result);rd.readAsDataURL(f);})));
    const comp=await Promise.all(srcs.map(s=>comprimirImg(s)));
    setFotos(prev=>[...prev,...comp].slice(0,Math.max(reqTotal,1)+4));
  }
  const [online,setOnline]=useState(navigator.onLine);
  useEffect(()=>{ const on=()=>setOnline(true),off=()=>setOnline(false);
    window.addEventListener("online",on); window.addEventListener("offline",off);
    return ()=>{ window.removeEventListener("online",on); window.removeEventListener("offline",off); }; },[]);
  function buildPayload(){ return {area, turno: modo==='lista'?"":(turno||AC[area]?.t||""),
    zona: modo==='lista'?zona:undefined, modo, checks:{...checks}, sel:{...sel}, txt:{...txt}, obs,
    fotos:[...fotos], usuario:user.nombre, fecha:nowISO(),
    totalItems: modo==='lista'?1:items.length, completados: modo==='lista'?1:done, clItems:(CL[area]||[])}; }
  /* Un solo camino: el ILD entra a la cola y en seguida se intenta enviar.
     Con señal el usuario ve el código; sin señal ve que quedó guardado. */
  async function encolarYEnviar(rec){
    await Cola.add({ tabla:"ILD", prefijo:"ILD", rec, fotos:[...fotos], fotoField:"fotos",
      fotoDir:"ILD_{ID}", fotoPrefix:"ILD{ID}", notif:{t:"ild",usuario:user.nombre},
      resumen:{ titulo:rec.area, sub:rec.zona||rec.turno||"" } }, user.nombre);
    onDraft&&onDraft();
    const r=await Cola.enviar(user.nombre);
    /* Se limpia el formulario en todos los casos: el ILD ya está a salvo en la cola.
       Dejarlo lleno invitaría a reenviarlo a mano y eso sí duplicaría. */
    resetCampos(); setArea(""); onDraft&&onDraft();
    if(r.ok||r.dup){ toast("ILD enviado"+(r.ultimo?": "+r.ultimo:"")); onSaved(); }
    else toast("Guardado sin señal. Se envía solo.");
  }
  async function enviar(){
    if(!area){toast("Selecciona un área");return;}
    if(modo==='lista'){
      if(!zona){toast("Elige una zona de la lista");return;}
      if(fotos.length<3){toast("Adjunta al menos 3 fotos");return;}
      if(fotos.length>5){toast("Máximo 5 fotos");return;}
      await unaVez(async()=>{
        try{
          await encolarYEnviar({ id:gid(), area, turno:"", zona, selecciones:{}, usuario:user.nombre, fecha:nowISO(),
            checks:{}, textos:{}, obs, estado:"Pendiente", notaJef:"", aprobador:"", fechaAprobacion:"",
            notaGerencia:"", totalItems:1, completados:1, clItems:(CL[area]||[]), aprobadorEsperado:APR[area]||"—" });
        }catch(e){ toast("No se pudo guardar en la tablet: "+(e.message||"")); }
      });
      return;
    }
    if(needsTurno && !turno){toast("Selecciona el turno");return;}
    const selFaltan=items.map((it,i)=>({it,i})).filter(o=>(itemTipo(o.it)==='apertura_cierre'||itemTipo(o.it)==='comida')&&!sel[o.i]);
    if(selFaltan.length){toast("Elige una opción en: "+itemText(selFaltan[0].it));return;}
    if(done<total && !confirm(`${total-done} ítems sin responder. ¿Enviar igual?`)) return;
    /* Las fotos que exige un "Sí" en un ítem Sí/No-con-foto son obligatorias de
       verdad (no se puede omitir con un simple "continuar igual"), a diferencia
       de las fotos fijas del área que sí admiten seguir sin ellas. */
    if(extraFotoObs>0 && fotos.length<reqTotal){
      toast(`Marcaste "Sí" en una observación que requiere foto: adjunta ${reqTotal-fotos.length} foto(s) más antes de enviar.`);
      return;
    }
    if(fotos.length<reqTotal && !confirm(`Solo ${fotos.length}/${reqTotal} fotos. ¿Continuar?`)) return;
    await unaVez(async()=>{
      try{
        await encolarYEnviar({ id:gid(), area, turno:turno||AC[area]?.t||"", selecciones:{...sel}, usuario:user.nombre,
          fecha:nowISO(), checks:{...checks}, textos:{...txt}, obs, estado:"Pendiente",
          notaJef:"", aprobador:"", fechaAprobacion:"", notaGerencia:"", totalItems:items.length,
          completados:done, clItems:(CL[area]||[]), aprobadorEsperado:APR[area]||"—" });
      }catch(e){ toast("No se pudo guardar en la tablet: "+(e.message||"")); }
    });
  }
  return <div>
    {!online && <div style={{background:"#FFF4E0",border:"1px solid #F3D9A6",borderLeft:"4px solid #FFA11F",borderRadius:10,padding:"9px 12px",marginBottom:10,fontSize:13,color:"#7a5a12"}}>
      📴 <b>Sin conexión.</b> Puedes llenar el ILD igual: al enviar se guardará en esta tablet y se subirá solo cuando vuelva el internet.</div>}
    <div className="card">
      <Field label="Área" req>
        <select className="inp" value={area} onChange={e=>setArea(e.target.value)}>
          <option value="">Selecciona…</option>
          {areas.map(a=><option key={a}>{a}</option>)}</select></Field>
      {area && <div className="hint">Aprobador: <b>{APR[area]||"—"}</b></div>}
    </div>
    {needsTurno && <div className="card"><h3>Turno</h3>
      <div className="opts">
        <button className={"opt"+(turno==="Apertura"?" on":"")} onClick={()=>{setTurno("Apertura");resetCampos();}}><Icon name="sun" size={16} style={{marginRight:6}}/>Apertura</button>
        <button className={"opt"+(turno==="Cierre"?" on":"")} onClick={()=>{setTurno("Cierre");resetCampos();}}><Icon name="moon" size={16} style={{marginRight:6}}/>Cierre</button>
      </div></div>}
    {area && modo==='lista' && <>
      <div className="card"><h3>Zona limpiada</h3>

function ILDPanel({user,regs,enCola,reload,toast,setFoto}){
  const [filtro,setFiltro]=useState("todos"); const [per,setPer]=useState(45); const [det,setDet]=useState(null); const [fGrupo,setFGrupo]=useState("__todas");
  const [verDup,setVerDup]=useState(false);
  const lim=new Date(); lim.setDate(lim.getDate()-per);
  /* Los "Pendiente" nunca se ocultan por el filtro de período: la vigencia de 45
     días (ver load() en el módulo ILD) solo aplica a los ya resueltos. Si un
     pendiente es más viejo que el período elegido igual se muestra, para no
     perder de vista una aprobación olvidada. */
  let base=regs.filter(r=>r.estado==='Pendiente' || new Date(r.fecha)>=lim);
  const nDupPeriodo=base.filter(esDuplicado).length;
  if(!verDup) base=base.filter(r=>!esDuplicado(r));
  /* Los que ya tienen revisión en cola se muestran como enviándose, nunca como
     pendientes de aprobar: así nadie los vuelve a tocar. */
  const espera=(enCola||[]).map(String);
  const nEspera=base.filter(r=>espera.includes(String(r.id))).length;
  const esSuyo=r=>(user.areas||[]).includes(r.area)||r.aprobadorEsperado===user.nombre||r.aprobador===user.nombre;
  if(!esGD(user)) base=base.filter(esSuyo);
  const grupoDe=r=>(AC[r.area]&&AC[r.area].g)||"(otros)";
  const gruposBandeja=[...new Set(base.map(grupoDe).filter(Boolean))].sort();
  if(filtro!=="todos") base=base.filter(r=>r.estado===filtro);
  if(fGrupo!=="__todas") base=base.filter(r=>grupoDe(r)===fGrupo);
  // Histórico completo de la jefatura (para exportar, sin filtro de período)
  const mios=esGD(user)?regs:regs.filter(esSuyo);
  function exportar(){ if(!mios.length){toast("No hay ILD para exportar");return;}
    const ok=exportXLSX(mios.map(ildToRow),"ILD",`ILD_${esGD(user)?"General":user.nombre.replace(/\s+/g,"_")}_${yr()}`);
    if(ok) toast("Exportando "+mios.length+" ILD…"); }
  return <div>
    <div className="row" style={{justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <span style={{color:"var(--muted)",fontSize:13}}>{mios.length} ILD visibles (últimos 45 días + pendientes)</span>
      <button className="btn green" style={{padding:"9px 14px"}} onClick={exportar}><Icon name="download" size={15} style={{marginRight:6}}/>Exportar Excel</button>
    </div>
    <div className="seg">
      {[["todos","Todos"],["Pendiente","Pendientes"],["Aprobado","Aprobados"],["Con observaciones","Con obs."]].map(([k,l])=>
        <button key={k} className={filtro===k?"on":""} onClick={()=>setFiltro(k)}>{l}</button>)}
    </div>
    <Field label="Filtrar por grupo"><select className="inp" value={fGrupo} onChange={e=>setFGrupo(e.target.value)}>
      <option value="__todas">Todos los grupos ({gruposBandeja.length})</option>
      {gruposBandeja.map(g=><option key={g} value={g}>{g}</option>)}</select></Field>
    <div className="row" style={{marginBottom:12}}>
      {[[15,"15d"],[30,"30d"],[45,"45d (todos)"]].map(([d,l])=>
        <button key={d} className={"btn "+(per===d?"ocean":"ghost")} style={{padding:"8px 14px"}} onClick={()=>setPer(d)}>{l}</button>)}
    </div>
    <div className="hint" style={{margin:"-4px 0 12px"}}>Los ILD ya resueltos (Aprobado / Con obs.) dejan de verse aquí a los 45 días —
      siguen guardados en SharePoint. Los Pendientes se ven siempre, sin importar su antigüedad.</div>
    {nEspera>0 && <div style={{background:"#FFF4E0",border:"1px solid #F3D9A6",borderRadius:9,padding:"9px 11px",marginBottom:12,fontSize:12.5,color:"#7a5a12"}}>
      {nEspera} ILD ya tienen tu revisión guardada, esperando señal. No hace falta volver a aprobarlos.</div>}
    {nDupPeriodo>0 && <div className="row" style={{marginBottom:12,alignItems:"center",gap:8,flexWrap:"wrap"}}>
      <span style={{fontSize:12.5,color:"var(--muted)",flex:1,minWidth:180}}>
        {nDupPeriodo} ILD marcados como duplicados. No cuentan para métricas ni requieren aprobación.</span>
      <button className={"btn "+(verDup?"ocean":"ghost")} style={{padding:"8px 12px",fontSize:12.5}} onClick={()=>setVerDup(v=>!v)}>
        {verDup?"Ocultarlos":"Verlos"}</button>
    </div>}
    {!base.length && <div className="empty"><div className="e"><Icon name="inbox" size={44}/></div>No hay ILD en este período</div>}
    {base.map(r=><div key={r.id} className="item" onClick={()=>setDet(r)}>
      <div className="top"><div>
        <div className="code">{r.Codigo||("ILD #"+r.id)}</div>
        <div className="ttl">{r.area}{r.turno?` · ${r.turno}`:""}</div>
        <div className="meta">{r.usuario} · {fmtDT(r.fecha)} · 📷 {(r.fotos||[]).length} · ✓ {r.completados}/{r.totalItems}</div>
        {esDuplicado(r) && <div className="meta" style={{marginTop:4,color:"#8f2020",fontWeight:700}}>
          Duplicado de {r.duplicadoCodigo||r.duplicadoDe} · no cuenta para métricas</div>}
        {espera.includes(String(r.id)) && <div className="meta" style={{marginTop:4,color:"#7a5a12",fontWeight:700}}>
          Tu revisión ya está guardada · se envía sola</div>}
      </div><Pill estado={r.estado==="Con observaciones"?"Con observaciones":r.estado==="Aprobado"?"Aprobado":"Solicitado"}/></div></div>)}
    {det && <ILDDetail user={user} r={det} onClose={()=>setDet(null)} reload={reload} toast={toast} setFoto={setFoto}/>}
  </div>;
}

function ILDMios({user,regs,setFoto}){
  const [det,setDet]=useState(null);
  const esColaborador = user.rol==='colaborador';
  const hace30 = desdeDias(30);
  const todosMiosCompleto=regs.filter(r=>r.usuario===user.nombre).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const validos=sinDuplicados(todosMiosCompleto);
  const nDup=todosMiosCompleto.length-validos.length;
  const ap=validos.filter(r=>r.estado==='Aprobado').length, ob=validos.filter(r=>r.estado==='Con observaciones').length, pe=validos.filter(r=>r.estado==='Pendiente').length;
  /* Para colaboradores (personal operativo, no jefatura): la lista solo muestra
     lo que todavía necesita su atención — Pendientes de aprobar (sin límite de
     antigüedad) y Con observaciones de los últimos 30 días. Un Aprobado, o una
     observación más vieja, ya no aporta nada que revisar y solo suma peso a la
     pantalla — pero el registro sigue completo en SharePoint y las jefaturas
     siguen viendo todo. Los KPIs de arriba sí reflejan el total real (dentro de
     lo que la app trae, ver la vigencia de 45 días), para que no se sienta que
     "desaparecieron" sus ILD aprobados. */
  const mios = esColaborador
    ? todosMiosCompleto.filter(r=>r.estado==='Pendiente' || (r.estado==='Con observaciones' && ymdEC(r.fecha)>=hace30))
    : todosMiosCompleto;
  const ocultosPorFiltro = esColaborador ? (todosMiosCompleto.length - mios.length) : 0;
  return <div>
    <div className="kpis">
      {[["Total",validos.length,"--blue"],["Aprobados",ap,"--green"],["Con obs.",ob,"--purple"],["Pendientes",pe,"--amber"]].map(([l,v,c])=>
        <div className="kpi" key={l} style={{borderTop:"3px solid "+cssVar(c)}}><div className="kn" style={{color:cssVar(c)}}>{v}</div><div className="kl">{l}</div></div>)}
    </div>
    {esColaborador && <div className="hint" style={{marginBottom:10}}>Aquí solo se listan los ILD que aún necesitan tu atención: pendientes de aprobar,
      y con observaciones de los últimos 30 días.{ocultosPorFiltro>0?` ${ocultosPorFiltro} ya aprobados u observaciones más antiguas no se muestran, pero siguen guardados.`:""}</div>}
    {nDup>0 && <div className="hint" style={{marginBottom:10}}>
      {nDup} de tus envíos quedaron marcados como duplicados y no se cuentan. Se conservan con sus fotos; aparecen abajo señalados.</div>}
    {!mios.length && <div className="empty"><div className="e"><Icon name="clipboard" size={44}/></div>{esColaborador?"No tienes ILD pendientes ni con observaciones recientes":"Aún no has subido ILD"}</div>}
    {mios.map(r=><div key={r.id} className="item" onClick={()=>setDet(r)} style={{cursor:"pointer"}}>
      <div className="top"><div>
        <div className="code">{r.Codigo||("ILD-"+r.id)}</div>
        <div className="ttl">{r.area}{r.turno?` · ${r.turno}`:""}</div>
        {esDuplicado(r) && <div className="meta" style={{color:"#8f2020",fontWeight:700}}>Duplicado de {r.duplicadoCodigo||r.duplicadoDe}</div>}
        <div className="meta">{fmtDT(r.fecha)}{r.aprobador?` · revisó: ${r.aprobador}`:""}</div></div>
        <Pill estado={r.estado==="Con observaciones"?"Con observaciones":r.estado==="Aprobado"?"Aprobado":"Solicitado"}/></div>
      {(r.notaJef||r.notaGerencia) && <div className="meta" style={{marginTop:6}}><Icon name="chat" size={15} style={{marginRight:6}}/>Toca para ver el comentario</div>}</div>)}
    {det && <ILDDetail user={user} r={det} onClose={()=>setDet(null)} reload={()=>{}} toast={()=>{}} setFoto={setFoto}/>}
  </div>;
}
