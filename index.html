function ComprasModal({modal,user,onClose,apply,toast,setFoto}){
  const {t,item}=modal;
  const [com,setCom]=useState(""); const [fecha,setFecha]=useState(item.FechaTentativa||""); const [cal,setCal]=useState(0);
  const [calT,setCalT]=useState(0); const [calC,setCalC]=useState(0);
  const [acta,setActa]=useState("Recibido conforme");
  const MSG_PRESU=NOTA_PRESUP;
  async function go(){
    if(t==="aprobar"){ await apply(item,{Estado:"En compra",Aprobador:user.nombre,FechaAprob:nowISO(),Comentario:com,FechaTentativa:fecha}); toast(MSG_PRESU); }
    else if(t==="enviarGG"){ await apply(item,{Estado:"En Gerencia",EnviadoGG:"Si",Aprobador:user.nombre,FechaAprob:nowISO(),Comentario:com}); Notif.comprasGerencia(item,user.nombre); toast("Enviada a Gerencia"); }
    else if(t==="aprobarGG"){ await apply(item,{Estado:"En compra",AprobadorGG:user.nombre,FechaGG:nowISO(),ComentarioGG:com}); toast(MSG_PRESU); }
    else if(t==="rechazar"){ if(!com.trim()){toast("El motivo es obligatorio");return;} await apply(item,{Estado:"Rechazada",Aprobador:user.nombre,FechaAprob:nowISO(),Comentario:com}); toast("Rechazada"); }
    else if(t==="rechazarGG"){ if(!com.trim()){toast("El motivo es obligatorio");return;} await apply(item,{Estado:"Rechazada",AprobadorGG:user.nombre,FechaGG:nowISO(),ComentarioGG:com}); toast("Rechazada por Gerencia"); }
    else if(t==="reprogramar"){ if(!fecha){toast("Indica la nueva fecha de entrega");return;} await apply(item,{FechaTentativa:fecha,Comentario:com?("Reprogramada — "+com):item.Comentario,Reprogramada:"Si"}); toast("Fecha reprogramada"); }
    else if(t==="baja"){ if(!com.trim()){toast("Indica el motivo de la baja");return;} await apply(item,{Estado:"Baja por presupuesto",Comentario:com,FechaCierre:nowISO()}); toast("Solicitud dada de baja"); }
    else if(t==="listo"){ await apply(item,{Estado:"Listo para entregar",FechaEntrega:nowISO()}); toast("Listo para entregar"); }
    else if(t==="recibir"){ await apply(item,{Estado:"Entregado",ActaEntrega:acta,ComentarioActa:com,Receptor:user.nombre,FechaCierre:nowISO()}); toast("Recibido registrado · acta generada"); }
    else if(t==="encuesta"){ if(!calT||!calC){toast("Califica el tiempo de entrega y la calidad");return;}
      await apply(item,{Estado:"Cerrada",EncuestaTiempo:calT,EncuestaCalidad:calC,EncuestaCal:Math.round((calT+calC)/2),EncuestaComentario:com,FechaEncuesta:nowISO()}); toast("¡Gracias por calificar!"); }
    onClose();
  }
  const titles={ver:"Detalle de la solicitud",aprobar:"Aprobar (Compras)",enviarGG:"Enviar a Gerencia General",aprobarGG:"Aprobar (Gerencia)",rechazar:"Rechazar",rechazarGG:"Rechazar (Gerencia)",reprogramar:"Reprogramar fecha de entrega",baja:"Dar de baja por presupuesto",listo:"Marcar listo",recibir:"Confirmar recibido · Acta de entrega",encuesta:"Calificar el servicio"};
  const needCom = t.startsWith("rechazar")||t==="baja";
  return <Modal title={titles[t]} onClose={onClose}>
    {t==="ver" ? <div>
      {[["Código",item.Codigo],["Solicitante",item.Solicitante],["Área",item.Area],["Tiempo de compra",item.TiempoCompra],
        ["Tipo de compra",item.TipoCompra],["Necesaria para",fmtDate(item.FechaNecesidad)],["Presupuesto",item.Presupuesto],
        ["Cantidad",`${item.Cantidad} ${item.Unidad}`],["Modelo",item.Modelo],["Descripción",item.Descripcion],
        ["Justificación",item.Justificacion],["Proveedores",item.Proveedores],["Estado",item.Estado],
        ["Tentativa entrega",fmtDate(item.FechaTentativa)],["Aprobó Compras",item.Aprobador||"—"],["Comentario",item.Comentario||"—"],
        ["Decisión Gerencia",item.AprobadorGG?`${item.AprobadorGG} · ${item.ComentarioGG||""}`:"—"],
        ["Acta",item.ActaEntrega||"—"],["Recibió",item.Receptor||"—"],["Calificación",item.EncuestaCal?item.EncuestaCal+"/10":"—"]].map(([k,v])=>
        <div className="kv" key={k}><b>{k}</b><span style={{textAlign:"right",maxWidth:"62%"}}>{v}</span></div>)}
      {(item.Fotos||[]).length>0 && <><h3 style={{margin:"12px 0 6px"}}>Foto</h3>
        <div className="fgrid">{item.Fotos.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
      {item.Cotizacion && <><h3 style={{margin:"12px 0 6px"}}>🧾 Cotización</h3>
        {item.Cotizacion.tipo==="pdf"
          ? <button className="btn ocean block" onClick={()=>abrirCotiz(item.Cotizacion)}>📄 Ver cotización (PDF)</button>
          : <div className="fgrid"><SpImg foto={item.Cotizacion} idx="C" onClick={setFoto}/></div>}</>}
      {["Entregado","Cerrada"].includes(item.Estado) && <button className="btn ocean block" style={{marginTop:12}} onClick={()=>actaCompra(item)}><Icon name="filetext" size={15} style={{marginRight:6}}/>Exportar Acta de Entrega (PDF)</button>}
      {item.Estado==="En compra" && notaPresupBox(12)}
    </div> : <div>
      {(t==="aprobar"||t==="reprogramar") && <Field label="Fecha tentativa de entrega" req={t==="reprogramar"} hint="La asigna el Coordinador de Compras. Vacía = no se marca como vencida."><input type="date" className="inp" value={fecha} onChange={e=>setFecha(e.target.value)}/></Field>}
      {t==="recibir" && <><Field label="Resultado de la entrega"><select className="inp" value={acta} onChange={e=>setActa(e.target.value)}><option>Recibido conforme</option><option>Recibido con observaciones</option></select></Field>
        <div className="hint">Al confirmar, el ítem queda como <b>Entregado</b> y podrás exportar el Acta en PDF.</div></>}
      {t==="encuesta" && <><Field label="Califica el tiempo de entrega (1-10)"><Stars value={calT} onChange={setCalT}/></Field>
        <Field label="Califica la calidad de la compra (1-10)"><Stars value={calC} onChange={setCalC}/></Field></>}
      <Field label={t.startsWith("rechazar")?"Motivo del rechazo":t==="baja"?"Motivo de la baja (p. ej. falta de presupuesto)":t==="reprogramar"?"Motivo de la reprogramación (opcional)":"Comentario"} req={needCom}><textarea className="inp" value={com} onChange={e=>setCom(e.target.value)}/></Field>
      <div className="row end"><button className="btn ghost" onClick={onClose}>Cancelar</button>
        <button className={"btn "+(needCom?"red":"primary")} onClick={go}>Confirmar</button></div></div>}
  </Modal>;
}

/* ===== TICKETS (Sistemas / Mantenimiento) con campos exactos del Form ===== */
function Tickets({tipo,user,toast,setFoto}){
  const isSis=tipo==="Sistemas";
  const chief=gestionaModulo(user,tipo.toLowerCase());
  const [tab,setTab]=useState("nuevo"); const [rows,setRows]=useState([]); const [modal,setModal]=useState(null);
  const load=async()=>cargarConReintento(()=>Store.read(tipo), setRows, toast, tipo); useEffect(()=>{load();},[]);
  const hoy=hoyEC();
  const vacioSis={Departamento:DEPTS_SIS[0],Urgencia:URGENCIA_SIS[1],Titulo:"",Descripcion:""};
  const vacioMto={Departamento:DEPTS[0],FechaSolicitud:hoy,TipoSolicitud:"Normal",Descripcion:""};
  const [f,setF]=useState(isSis?vacioSis:vacioMto); const [fotos,setFotos]=useState([]); const [busy,unaVez]=useEnvioUnico(); const aprobadores=USERS.filter(u=>u.rol==='aprobador').map(u=>u.nombre).sort(); const [solicOtro,setSolicOtro]=useState(""); const [areaOtro,setAreaOtro]=useState(DEPTS[0]);
  const ch=(k,v)=>setF(s=>({...s,[k]:v}));
  async function crear(){
    if(isSis){ if(!f.Titulo.trim()){toast("Falta el título de la tarea");return;} if(!f.Descripcion.trim()){toast("Falta la descripción");return;} }
    else { if(!f.Descripcion.trim()){toast("Falta la descripción de la novedad");return;}
      /* La foto es obligatoria en las órdenes de mantenimiento: sin imagen el
         técnico no sabe qué va a encontrar y el cierre no se puede comparar.
         Las tareas programadas quedan exentas porque nacen de la planificación,
         no de una novedad observada. */
      const esProgFoto = chief && solicOtro==="__prog";
      if(!esProgFoto && !fotos.length){toast("Adjunta la foto de la novedad: es obligatoria");return;} }
    await unaVez(async()=>{
      const esProg=chief&&solicOtro==="__prog";
      const solicitanteFinal=esProg?"Tarea programada":((chief&&solicOtro)?solicOtro:user.nombre);
      const base={id:gid(),FechaCreacion:nowISO(),Solicitante:solicitanteFinal,...f,
        ...(esProg?(isSis?{Urgencia:"Tarea programada"}:{TipoSolicitud:"Tarea programada"}):{}),Programada:esProg?"Si":"",
        CreadoPor:user.nombre,AreaSolicitante:(chief&&solicOtro&&!esProg)?areaOtro:"",
        Estado:"Nuevo",FechaTentativa:"",Asignado:"",ComentarioSoporte:"",FechaConcluido:"",
        EncuestaCal:"",EncuestaComentario:"",FechaEncuesta:""};
      await Cola.add({ tabla:tipo, prefijo:isSis?"SIS":"MTO", rec:base, fotos:[...fotos], fotoField:"Fotos",
        fotoDir:(isSis?"SIS":"MTO")+"_{COD}", fotoPrefix:"{COD}",
        notif:{t:"ticket",usuario:user.nombre,tipo},
        resumen:{ titulo:(isSis?f.Titulo:f.Descripcion)||"Ticket", sub:f.Departamento||"" } }, user.nombre);
      const rr=await Cola.enviar(user.nombre);
      toast(rr.ok||rr.dup ? ("Ticket creado"+(rr.ultimo?": "+rr.ultimo:""))
        : rr.sinRed ? "Sin señal: el ticket quedó guardado y se enviará solo cuando vuelva el internet."
        : "Guardado en el equipo. No se pudo enviar ahora. Se reintentará.");
      setF(isSis?vacioSis:vacioMto); setFotos([]); setSolicOtro(""); load(); setTab("mios");
    });
  }
  /* Todo cambio pasa por la cola: con señal se aplica en el momento, sin señal
     queda guardado y se aplica solo. El historial lo escribe la cola. */
  async function apply(ref,patch,nota,extras){
    const rid=(ref&&typeof ref==="object")?ref.id:ref;
    const cod=(ref&&typeof ref==="object")?(ref.Codigo||""):"";
    /* La ventana abierta puede tener una copia vieja del registro. Si la lista
       ya se recargó, ese dato es más reciente que el de la ventana. */
    const fila=(rows||[]).find(x=>x.id===rid);
    const base=fila||((ref&&typeof ref==="object")?ref:null);
    const prev=base?base.Estado:undefined;
    await Cola.cambio({ tabla:tipo, recId:rid, recCodigo:cod, patch:patch||{}, nota:nota||"",
      estadoPrevio:prev, campoEstado:"Estado", ...(extras||{}),
      resumen:{ titulo:((patch&&patch.Estado)?"→ "+patch.Estado:"Cambio")+(cod?" · "+cod:""), sub:tipo } }, user.nombre);
    const r=await Cola.enviar(user.nombre);
    if(r.ok||r.dup){ load(); return r; }
    /* Se refleja en pantalla lo que quedó pendiente, y el aviso se muestra con
       un pequeño retraso porque el módulo lanza el suyo justo después. */
    setRows(rs=>rs.map(x=>x.id===rid?{...x,...(patch||{}),_pendiente:true}:x));
    /* Un solo aviso, corto. El módulo ya dijo lo suyo y el aviso de arriba lleva
       la cuenta; repetir la explicación completa en cada acción era ruido. */
    setTimeout(()=>toast("Guardado sin señal. Se envía solo."),60);
    return r; }
  const mios=rows.filter(r=>r.Solicitante===user.nombre);
  const equipo=equipoDe(user, isSis?'sistemas':'mantenimiento');
  /* "Mi equipo" listaba los tickets SOLICITADOS por los técnicos, que no es lo que
     una jefatura de mantenimiento necesita ver: sus tareas ya están en Gestión y en
     Productividad. Queda solo en Sistemas. */
  const verEquipo=isSis && (user.rol==='aprobador'||esGD(user)||esDev(user)) && equipo.length>0;
  const delEquipo=rows.filter(r=>equipo.includes(r.Solicitante));
  /* "Mis tareas" (técnicos): solo tareas asignadas a ellos que sigan ACTIVAS —
     Asignada, Sin fecha asignada o En proceso (bucketEstado==="proceso"). Ni las
     "Nuevo" (aún no tomadas por nadie) ni las Concluidas/Cerradas/Rechazadas
     les aparecen: lo concluido queda para la jefatura en Gestión/Tablero. Si una
     tarea se reactiva, "reactivar" la vuelve a poner en "En proceso" — cae otra
     vez en este mismo filtro sin necesitar lógica aparte. */
  const asignadas=rows.filter(r=>!isSis && enEquipoMTO(r,user.nombre) && bucketEstado(r.Estado)==="proceso");
  const verTareas=!isSis && ildAreasDe(user).includes('Mantenimiento') && user.rol==='colaborador';
  const [soloHoy,setSoloHoy]=useState(false); const [gHoy,setGHoy]=useState(false); const [gFiltro,setGFiltro]=useState("todas");
  const hoyStr=hoyEC();
  const tareasMostrar=soloHoy?asignadas.filter(r=>(r.FechaTentativa||"").slice(0,10)===hoyStr):asignadas;
  /* Gestión son los requerimientos que llegan del hotel. Las tareas programadas
     son planificación interna y tienen su propia pestaña: mezclarlas distorsionaba
     los conteos y los tiempos de respuesta. */
  const correctivas=rows.filter(r=>r.Programada!=="Si");
  const programadas=rows.filter(r=>r.Programada==="Si");
  return <div>
    <h1 className="h1">{isSis?"Soporte de Sistemas":"Mantenimiento"}</h1>
    <p className="sub">{isSis?"Requerimiento de TI.":"Requerimiento de mantenimiento."}</p>
    <div className="seg" style={{flexWrap:"wrap"}}>
      <button className={tab==="nuevo"?"on":""} onClick={()=>setTab("nuevo")}>Nuevo</button>
      <button className={tab==="mios"?"on":""} onClick={()=>{setTab("mios");load();}}>{chief?"Tareas programadas":"Mis tickets"}</button>
      {user.rol==='gerencia' && <button className={tab==="prog"?"on":""} onClick={()=>{setTab("prog");load();}}>Tareas programadas</button>}
      {verTareas&&<button className={tab==="tareas"?"on":""} onClick={()=>{setTab("tareas");load();}}>Mis tareas{asignadas.length?` (${asignadas.length})`:""}</button>}
      {verEquipo&&<button className={tab==="equipo"?"on":""} onClick={()=>{setTab("equipo");load();}}>Mi equipo</button>}
      {puede(user,`${tipo.toLowerCase()}.gestion`)&&<button className={tab==="gestion"?"on":""} onClick={()=>{setTab("gestion");load();}}>Tickets {esDev(user)?"(todo)":""}</button>}
      {puede(user,`${tipo.toLowerCase()}.tablero`)&&<button className={tab==="tablero"?"on":""} onClick={()=>{setTab("tablero");load();}}><Icon name="chart" size={15} style={{marginRight:6}}/>Tablero</button>}
      {!isSis && puede(user,`${tipo.toLowerCase()}.tablero`)&&<button className={tab==="prod"?"on":""} onClick={()=>{setTab("prod");load();}}><Icon name="trendup" size={15} style={{marginRight:6}}/>Productividad</button>}
    </div>
    {tab==="nuevo" && <div className="card">
      {chief
        ? <><Field label="Usuario que solicita" req hint="Puedes registrar a nombre de un aprobador (la encuesta le llegará a esa persona) o como Tarea programada (sin encuesta)."><select className="inp" value={solicOtro} onChange={e=>setSolicOtro(e.target.value)}><option value="">Yo mismo ({user.nombre})</option><option value="__prog">Tarea programada</option>{aprobadores.map(n=><option key={n} value={n}>{n}</option>)}</select></Field>
          {solicOtro!=="__prog" && <Field label="Área del solicitante" req><select className="inp" value={areaOtro} onChange={e=>setAreaOtro(e.target.value)}>{DEPTS.map(d=><option key={d}>{d}</option>)}</select></Field>}</>
        : <Field label={isSis?"Nombre del solicitante":"Solicitante"}><input className="inp" value={user.nombre} disabled/></Field>}
      <Field label="Departamento" req><select className="inp" value={f.Departamento} onChange={e=>ch("Departamento",e.target.value)}>{(isSis?DEPTS_SIS:DEPTS).map(d=><option key={d}>{d}</option>)}</select></Field>
      {isSis ? <>
        <Field label="Urgencia / Prioridad" req>{(chief&&solicOtro==="__prog")?<input className="inp" value="Tarea programada" disabled/>:<select className="inp" value={f.Urgencia} onChange={e=>ch("Urgencia",e.target.value)}>{URGENCIA_SIS.map(d=><option key={d}>{d}</option>)}</select>}</Field>
        <Field label="Título de la tarea" req><input className="inp" value={f.Titulo} onChange={e=>ch("Titulo",e.target.value)} placeholder="Ej. Creación de usuario"/></Field>
        <Field label="Descripción del problema o solicitud" req hint="Describe con el mayor detalle posible."><textarea className="inp" value={f.Descripcion} onChange={e=>ch("Descripcion",e.target.value)}/></Field>
        <PhotoField fotos={fotos} setFotos={setFotos} label="Adjuntos (opcional)" setFoto={setFoto}/>
      </> : <>
        <Field label="Fecha de solicitud" req><input type="date" className="inp" value={f.FechaSolicitud} onChange={e=>ch("FechaSolicitud",e.target.value)}/></Field>
        <Field label="Tipo de solicitud" req>{(chief&&solicOtro==="__prog")?<input className="inp" value="Tarea programada" disabled/>:<select className="inp" value={f.TipoSolicitud} onChange={e=>ch("TipoSolicitud",e.target.value)}><option>Normal</option><option>Urgente</option></select>}</Field>
        <Field label="Descripción de la novedad" req><textarea className="inp" value={f.Descripcion} onChange={e=>ch("Descripcion",e.target.value)} placeholder="Describe la novedad…"/></Field>
        {(chief&&solicOtro==="__prog")
          ? <PhotoField fotos={fotos} setFotos={setFotos} label="Imagen de la tarea (opcional)" setFoto={setFoto}/>
          : <PhotoField fotos={fotos} setFotos={setFotos} label="Imagen de la novedad" req hint="Obligatoria. Sin la foto no se puede crear la orden." setFoto={setFoto}/>}
      </>}
      <button className="btn primary block" disabled={busy} onClick={crear}>{busy?"Enviando…":"Crear ticket"}</button></div>}
    {tab==="mios" && (chief
      ? <ListaFiltrada items={programadas} tipo={tipo} isSis={isSis} chief={chief} equipo={equipo}
          onAction={(t,r)=>setModal({t,item:r})} vacio="Aún no hay tareas programadas" unidad="tarea(s) programada(s)"
          toast={toast} nombreExport={`${tipo}_Programadas_PlayaParaiso`}/>
      : <Listado items={mios} empty="Aún no tienes tickets" render={r=><TicketCard r={r} isSis={isSis} chief={chief} equipo={equipo} onAction={(t)=>setModal({t,item:r})}/>}/>)}
    {tab==="prog" && <ListaFiltrada items={programadas} tipo={tipo} isSis={isSis} chief={chief} equipo={equipo}
      onAction={(t,r)=>setModal({t,item:r})} vacio="No hay tareas programadas" unidad="tarea(s) programada(s)"
      toast={toast} nombreExport={`${tipo}_Programadas_PlayaParaiso`}/>}
    {tab==="equipo" && <Listado items={delEquipo} empty="Tu equipo aún no ha subido tickets" render={r=><TicketCard r={r} isSis={isSis} chief={false} onAction={(t)=>setModal({t,item:r})}/>}/>}
    {tab==="tareas" && <div>
      <div className="row" style={{margin:"0 0 12px",gap:8}}>
        <button className={"btn "+(soloHoy?"ghost":"primary")} onClick={()=>setSoloHoy(false)}>Todas ({asignadas.length})</button>
        <button className={"btn "+(soloHoy?"primary":"ghost")} onClick={()=>setSoloHoy(true)}><Icon name="calendar" size={15} style={{marginRight:6}}/>Hoy ({asignadas.filter(r=>(r.FechaTentativa||"").slice(0,10)===hoyStr).length})</button></div>
      <Listado items={tareasMostrar} empty={soloHoy?"No tienes tareas para hoy":"No tienes tareas asignadas"}
        render={r=><TareaCard r={r} usuario={user.nombre} onAction={(t)=>setModal({t,item:r})}/>}/></div>}
    {tab==="gestion" && <ListaFiltrada items={correctivas} tipo={tipo} isSis={isSis} chief={chief} equipo={equipo}
      onAction={(t,r)=>setModal({t,item:r})} vacio="No hay tickets en este filtro" unidad="ticket(s)"
      toast={toast} nombreExport={`${tipo}_PlayaParaiso`}/>}
    {tab==="tablero" && <Tablero tipo={tipo}/>}
    {tab==="prod" && !isSis && <ProductividadMant rows={rows}/>}
    {modal && <TicketModal tipo={tipo} isSis={isSis} modal={modal} user={user} equipo={equipo} onClose={()=>setModal(null)} apply={apply} toast={toast} setFoto={setFoto}/>}
  </div>;
}
/* ===== Equipo de mantenimiento: responsable + apoyos ===== */
function equipoMTO(r){
  if(Array.isArray(r.Equipo) && r.Equipo.length) return r.Equipo;
  return r.Asignado ? [{nombre:r.Asignado,papel:"responsable",desde:r.FechaCreacion||"",hasta:"",horas:null}] : [];
}
function enEquipoMTO(r,nombre){ return equipoMTO(r).some(p=>p.nombre===nombre && !p.hasta); }
/* Solo el responsable principal cierra la tarea. Los apoyos registran avances. */
function esResponsableMTO(r,nombre){ const p=equipoMTO(r).find(x=>x.papel==="responsable" && !x.hasta); return !!p && p.nombre===nombre; }
/* Quién ve las indicaciones y los avances: mantenimiento, los técnicos asignados,
   Gerencia General y desarrollo. El resto solo ve el comentario final. */
function veInterno(u,r){ return gestionaModulo(u,"mantenimiento") || esGD(u) || esDev(u)
  || (u && u.areas||[]).includes('Mantenimiento') || enEquipoMTO(r,u&&u.nombre); }
function respMTO(r){ const p=equipoMTO(r).find(x=>x.papel==="responsable"); return p?p.nombre:(r.Asignado||""); }
function apoyosMTO(r){ return equipoMTO(r).filter(x=>x.papel==="apoyo").map(x=>x.nombre); }
function horasNum(v){ const h=Number(v); return (isFinite(h)&&h>0)?h:0; }
/* Horas entre la asignación y la conclusión. Solo para registros con historial:
   en los anteriores no existe el sello de la asignación y el dato no sería comparable. */
function ejecucionHrs(r){
  const h=Array.isArray(r.historial)?r.historial:[];
  /* Desde la ASIGNACIÓN hasta la conclusión. Si no hay sello de asignación se
     omite: no se mezcla con la fecha de creación, que mide a la jefatura. */
  const asg=h.find(x=>x.estado==="Asignada") || h.find(x=>x.estado==="En proceso");
  if(!asg || !r.FechaConcluido) return null;
  const ms=new Date(r.FechaConcluido)-new Date(asg.fecha);
  return ms>0 ? ms/3600000 : null;
}
function respuestaHrs(r){
  const h=Array.isArray(r.historial)?r.historial:[];
  const asg=h.find(x=>x.estado==="Asignada");
  if(!asg || !r.FechaCreacion) return null;
  const ms=new Date(asg.fecha)-new Date(r.FechaCreacion);
  return ms>0 ? ms/3600000 : null;
}
function fmtHrs(h){ if(h==null) return "—"; if(h<24) return (Math.round(h*10)/10)+" h";
  return (Math.round(h/24*10)/10)+" d"; }

/* Barra de filtros + listado. La usan Gestión y Tareas programadas, así las dos
   tienen exactamente los mismos filtros y no hay dos copias del mismo código.
   Cada instancia lleva su propio estado: cambiar de pestaña no arrastra el filtro. */
function ListaFiltrada({items,tipo,isSis,chief,equipo,onAction,vacio,unidad,toast,nombreExport}){
  const [fil,setFil]=useState("todas");
  const [soloHoy,setSoloHoy]=useState(false);
  const hoyStr=hoyEC();
  const base = soloHoy ? (items||[]).filter(r=>(r.FechaTentativa||"").slice(0,10)===hoyStr) : (items||[]);
  const porFecha=(a,b)=>new Date(fechaBase(a))-new Date(fechaBase(b));
  let v=base;
  if(fil==="nuevas") v=base.filter(r=>bucketEstado(r.Estado)==="nuevas").sort(porFecha);
  else if(fil==="proceso") v=base.filter(r=>bucketEstado(r.Estado)==="proceso");
  else if(fil==="concluidas") v=base.filter(r=>bucketEstado(r.Estado)==="concluidas");
  else if(fil==="v15") v=base.filter(r=>bucketEstado(r.Estado)==="nuevas" && diasEnEstado(r)>=15).sort(porFecha);
  const venceHoy=(items||[]).filter(r=>(r.FechaTentativa||"").slice(0,10)===hoyStr).length;
  return <div>
    <div className="seg" style={{flexWrap:"wrap"}}>
      <button className={fil==="todas"?"on":""} onClick={()=>setFil("todas")}>Todas</button>
      <button className={fil==="nuevas"?"on":""} onClick={()=>setFil("nuevas")}>🆕 Nuevas</button>
      <button className={fil==="proceso"?"on":""} onClick={()=>setFil("proceso")}>🔄 En proceso</button>
      <button className={fil==="concluidas"?"on":""} onClick={()=>setFil("concluidas")}>✅ Concluidas / cerradas</button>
      <button className={fil==="v15"?"on":""} onClick={()=>setFil("v15")}>⏰ +15 días en nuevo</button>
    </div>
    <div className="row" style={{margin:"8px 0 12px",gap:8,flexWrap:"wrap"}}>
      <button className={"btn "+(soloHoy?"ghost":"primary")} onClick={()=>setSoloHoy(false)}>Todas fechas</button>
      <button className={"btn "+(soloHoy?"primary":"ghost")} onClick={()=>setSoloHoy(true)}>📅 Vencen hoy ({venceHoy})</button>
      <button className="btn ocean" onClick={()=>{ if(!exportXLSX(formatFechasExport(v),tipo,nombreExport||`${tipo}_PlayaParaiso`)) toast("No hay datos para exportar"); else toast("Exportando…"); }}>⬇️ Exportar</button>
    </div>
    <div className="kcount">{v.length} {unidad||"ticket(s)"}{["nuevas","proceso","v15"].includes(fil)?" · de la más antigua a la más reciente":""}</div>
    <Listado items={v} empty={vacio||"No hay registros en este filtro"}
      render={r=><TicketCard r={r} isSis={isSis} chief={chief} equipo={equipo} onAction={(t)=>onAction(t,r)}/>}/>
  </div>;
}

  return <div className="item">
    <div className="top"><div><div className="code">{r.Codigo}</div><div className="ttl">{r.Descripcion}</div>
      <div className="meta">{r.Departamento} · {r.TipoSolicitud} · solicitó: {r.Solicitante}</div>
      {apoyosMTO(r).length>0 && <div className="meta">Equipo: {respMTO(r)} (resp.) · {apoyosMTO(r).join(", ")}</div>}</div>
      <Pill estado={r.Estado} overdue={venc}/></div>
    {r.FechaTentativa && <div className="meta" style={{marginTop:6}}><Icon name="calendar" size={15} style={{marginRight:6}}/>Para: {fmtDate(r.FechaTentativa)}{venc?" · ⚠️ vencida":""}</div>}
    {r.CierreCumplimiento && <div className="meta" style={{marginTop:4,fontWeight:700,color:r.CierreCumplimiento.includes("atraso")?"var(--coral)":"var(--green)"}}>{r.CierreCumplimiento}</div>}
    <div className="acts">
      <button className="btn ghost" onClick={()=>onAction("ver")}>Ver</button>
      {!["Concluido","Cerrado"].includes(r.Estado) && <button className="btn ocean" onClick={()=>onAction("avance")}>📝 Registrar avance</button>}
      {!["Concluido","Cerrado"].includes(r.Estado) && (esResponsableMTO(r,usuario)
        ? <button className="btn green" onClick={()=>onAction("concluirTarea")}>✅ Concluir tarea</button>
        : <span className="hint" style={{alignSelf:"center"}}>Solo {respMTO(r)||"el responsable"} puede concluirla</span>)}
    </div></div>;
}
function TicketCard({r,isSis,chief,equipo,onAction}){
  const titulo=isSis?r.Titulo:r.Descripcion;
  return <div className="item">
    <div className="top"><div><div className="code">{r.Codigo}</div><div className="ttl">{titulo}</div>
      <div className="meta">{r.Solicitante} · {r.Departamento} · {isSis?(r.Urgencia||"").split(" ")[0]:r.TipoSolicitud}</div></div>
      <Pill estado={r.Estado} overdue={isOverdue(r)}/></div>
    {r._pendiente && <div className="meta" style={{marginTop:4,color:"#7a5a12",fontWeight:700}}>📥 Cambio pendiente de enviar</div>}
    {r.FechaTentativa && <div className="meta" style={{marginTop:6}}><Icon name="calendar" size={15} style={{marginRight:6}}/>{fmtDate(r.FechaTentativa)}</div>}
    {(isSis? !!r.Asignado : equipoMTO(r).length>0) && <div className="meta" style={{marginTop:4}}><Icon name="user" size={15} style={{marginRight:6}}/>
      {isSis ? <>Asignado a: {r.Asignado}</> : <>Responsable: {respMTO(r)}{apoyosMTO(r).length>0 && <> · apoyo: {apoyosMTO(r).join(", ")}</>}</>}</div>}
    {r.CierreCumplimiento && <div className="meta" style={{marginTop:4,fontWeight:700,color:r.CierreCumplimiento.includes("atraso")?"var(--coral)":"var(--green)"}}>{r.CierreCumplimiento}</div>}
    <div className="acts">
      <button className="btn ghost" onClick={()=>onAction("ver")}>Ver</button>
      {chief && !isSis && !["Concluido","Cerrado","Rechazado"].includes(r.Estado) && <button className="btn ocean" onClick={()=>onAction("asignar")}><Icon name="user" size={15} style={{marginRight:6}}/>Asignar tarea</button>}
      {chief && isSis && ["Nuevo","Sin fecha asignada"].includes(r.Estado) && <button className="btn ocean" onClick={()=>onAction("tomar")}>Asignar fecha</button>}
      {chief && r.Estado==="En proceso" && <button className="btn green" onClick={()=>onAction("concluir")}>Concluir</button>}
      {chief && !isSis && r.Estado==="Concluido" && <button className="btn warn" onClick={()=>onAction("reactivar")}>↩︎ Reactivar</button>}
      {chief && !["Concluido","Cerrado","Rechazado"].includes(r.Estado) && <button className="btn red" onClick={()=>onAction("rechazar")}>Rechazar</button>}
      {!chief && r.Programada!=="Si" && r.Estado==="Concluido" && !r.EncuestaCal && <button className="btn primary" onClick={()=>onAction("encuesta")}>Calificar</button>}
    </div></div>;
}
function TicketModal({tipo,isSis,modal,user,equipo,onClose,apply,toast,setFoto}){
  const {t,item}=modal;
  const opciones=(equipo&&equipo.length)?equipo:[];
  const [com,setCom]=useState(""); const [fecha,setFecha]=useState(item.FechaTentativa||""); const [cal,setCal]=useState(0);
  const [tecnico,setTecnico]=useState(respMTO(item)||opciones[0]||""); const [fotos,setFotos]=useState([]); const [busy,setBusy]=useState(false);
  const [apoyos,setApoyos]=useState(apoyosMTO(item));
  const eqActual=equipoMTO(item).filter(p=>!p.hasta);
  const [horas,setHoras]=useState(()=>{ const o={}; eqActual.forEach(p=>{ o[p.nombre]=(p.horas!=null?String(p.horas):""); }); return o; });
  const idDe=(n)=>{ const u=USERS.find(x=>x.nombre===n); return u?u.id:""; };
  /* Al cerrar solo se sella la fecha de salida de cada integrante. */
  function equipoConHoras(){ return eqActual.map(p=>({...p,hasta:nowISO()})); }
  function cumplimiento(){ if(!item.FechaTentativa) return "Concluida"; const lim=(item.FechaTentativa||"").slice(0,10);
    return (hoyEC() <= lim) ? "Concluida a tiempo" : "Concluida con atraso"; }
  async function go(){
    if(t==="tomar"){ await apply(item,{Estado:fecha?"En proceso":"Sin fecha asignada",Asignado:user.nombre,FechaTentativa:fecha}); toast(fecha?"En proceso":"Guardado sin fecha"); }
    else if(t==="asignar"){ if(!tecnico){toast("Selecciona un técnico responsable");return;} if(!fecha){toast("Indica la fecha límite de la tarea");return;}
      const nuevos=[tecnico,...apoyos.filter(n=>n&&n!==tecnico)];
      const previos=equipoMTO(item);
      const eq=nuevos.map(n=>{ const ya=previos.find(x=>x.nombre===n && !x.hasta);
        return { personaId:idDe(n), nombre:n, papel:(n===tecnico?"responsable":"apoyo"),
                 desde:(ya?ya.desde:nowISO()), hasta:"", horas:(ya?ya.horas:null) }; });
      /* Quien sale del equipo no se borra: se le cierra la participación con fecha. */
      const salen=previos.filter(x=>!x.hasta && !nuevos.includes(x.nombre)).map(x=>({...x,hasta:nowISO()}));
      const eqFinal=[...eq,...salen];
      const detalle=apoyos.length?`${tecnico} (responsable) + ${apoyos.length} apoyo(s)`:tecnico;
      await apply(item,{Estado:"Asignada",Asignado:tecnico,Equipo:eqFinal,FechaTentativa:fecha,ComentarioJefe:com},"Asignada a "+detalle);
      for(const n of nuevos){ await addNotif(n,`Se te asignó la tarea de mantenimiento ${item.Codigo} como ${n===tecnico?"responsable":"apoyo"} (para el ${fmtDate(fecha)}).`,"",item.Codigo); }
      for(const x of salen){ await addNotif(x.nombre,`Ya no estás asignado a la tarea ${item.Codigo}.`,"",item.Codigo); }
      toast("Tarea asignada a "+detalle); }
    else if(t==="avance"){ if(!com.trim()){toast("Escribe el avance");return;}
      const nuevoAv={fecha:nowISO(),autor:user.nombre,texto:com.trim()};
      /* Se envía como agregado, no como arreglo completo: así dos avances
         registrados sin señal no se pisan entre sí. */
      const fa = fotos.length ? await subirFotos(fotos,`MTO_${item.Codigo}`,item.Codigo+"_avance") : [];
      const nuevoAv2={...nuevoAv, fotos:fa.filter(x=>x&&!x.error)};
      await apply(item,{},com,{appends:[{campo:"Avances",item:nuevoAv2}]});
      const jefes=USERS.filter(u=>gestionaModulo(u,"mantenimiento")).map(u=>u.nombre).filter(n=>n&&n!==user.nombre);
      for(const j of [...new Set(jefes)]) await addNotif(j,`Avance en ${item.Codigo} (${user.nombre}): ${com.trim().slice(0,80)}`,"",item.Codigo);
      toast("Avance registrado"); }
    else if(t==="concluir"){ if(!com.trim()){toast("El comentario de cierre es obligatorio");return;} setBusy(true);
      const cmp=cumplimiento();
      await apply(item,{Estado:"Concluido",ComentarioSoporte:com,FechaConcluido:nowISO(),CierreCumplimiento:cmp,
        ...(isSis?{}:{Equipo:equipoConHoras()})},com,
        fotos.length?{fotos:[...fotos],fotoField:"FotosCierre",fotoDir:"MTO_{COD}",fotoPrefix:"{COD}_cierre"}:null);
      Notif.ticketFinalizado({...item,ComentarioSoporte:com,FechaConcluido:nowISO(),CierreCumplimiento:cmp},tipo); toast("Concluido"); }
    else if(t==="reactivar"){ if(!com.trim()){toast("Explica por qué se reactiva");return;}
      await apply(item,{Estado:"En proceso",FechaConcluido:"",CierreCumplimiento:"",
        ReactivadaPor:user.nombre, ReactivadaFecha:nowISO(), ReactivadaMotivo:com.trim()},"Reactivada: "+com.trim());
      for(const pp of equipoMTO(item).filter(x=>!x.hasta))
        await addNotif(pp.nombre,`La tarea ${item.Codigo} se reactivó: ${com.trim().slice(0,90)}`,"",item.Codigo);
      toast("Tarea reactivada"); }
    else if(t==="concluirTarea"){ if(!com.trim()){toast("Escribe un comentario de la tarea");return;}
      if(!fotos.length){toast("Adjunta al menos una foto de la tarea concluida");return;} setBusy(true);
      const cmp=cumplimiento();
      await apply(item,{Estado:"Concluido",ComentarioSoporte:com,FechaConcluido:nowISO(),CierreCumplimiento:cmp,
        Equipo:equipoConHoras()},com,
        {fotos:[...fotos],fotoField:"FotosCierre",fotoDir:"MTO_{COD}",fotoPrefix:"{COD}_cierre"});
      Notif.ticketFinalizado({...item,ComentarioSoporte:com,FechaConcluido:nowISO(),CierreCumplimiento:cmp},tipo); toast(cmp); }
    else if(t==="rechazar"){ if(!com.trim()){toast("El motivo es obligatorio");return;} await apply(item,{Estado:"Rechazado",ComentarioSoporte:com,Asignado:user.nombre,FechaConcluido:nowISO()}); toast("Rechazado"); }
    else if(t==="encuesta"){ if(!cal){toast("Selecciona calificación");return;} await apply(item,{Estado:"Cerrado",EncuestaCal:cal,EncuestaComentario:com,FechaEncuesta:nowISO()}); toast("¡Gracias por calificar!"); }
    onClose();
  }
  const titles={ver:"Detalle del ticket",tomar:"Asignar fecha tentativa",asignar:"Asignar tarea al equipo",avance:"Registrar avance",concluir:"Concluir ticket",concluirTarea:"Concluir tarea",rechazar:"Rechazar",encuesta:"Calificar el servicio",reactivar:"Reactivar la tarea"};
  return <Modal title={titles[t]} onClose={onClose}>
    {t==="ver" ? <div>
      {[["Código",item.Codigo],["Solicitante",item.Solicitante],
        ...(item.AreaSolicitante?[["Área solicitante",item.AreaSolicitante]]:[]),
        ...(item.CreadoPor&&item.CreadoPor!==item.Solicitante?[["Registrado por",item.CreadoPor]]:[]),
        ["Departamento",item.Departamento],
        isSis?["Urgencia",item.Urgencia]:["Tipo",item.TipoSolicitud],
        isSis?["Título",item.Titulo]:["Fecha solicitud",fmtDate(item.FechaSolicitud)],
        ["Descripción",item.Descripcion],["Estado",item.Estado],["Fecha límite",fmtDate(item.FechaTentativa)],
        isSis?["Asignado",item.Asignado||"—"]:["Responsable",respMTO(item)||"—"],
        ...(!isSis&&apoyosMTO(item).length?[["Apoyos",apoyosMTO(item).join(", ")]]:[]),
        ...(!isSis&&respuestaHrs(item)!=null?[["Tiempo de respuesta",fmtHrs(respuestaHrs(item))]]:[]),
        ...(!isSis&&ejecucionHrs(item)!=null?[["Tiempo de ejecución",fmtHrs(ejecucionHrs(item))]]:[]),
        ["Cumplimiento",item.CierreCumplimiento||"—"],["Cierre",item.ComentarioSoporte||"—"],["Calificación",item.EncuestaCal?item.EncuestaCal+"/10":"—"]].map(([k,v])=>
        <div className="kv" key={k}><b>{k}</b><span style={{textAlign:"right",maxWidth:"62%"}}>{v}</span></div>)}
      {(item.Fotos||[]).length>0 && <><h3 style={{margin:"12px 0 6px"}}>Adjuntos</h3>
        <div className="fgrid">{item.Fotos.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
      {(item.FotosCierre||[]).length>0 && <><h3 style={{margin:"12px 0 6px"}}>Fotos de cierre</h3>
        <div className="fgrid">{item.FotosCierre.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
      {!isSis && veInterno(user,item) && equipoMTO(item).some(pp=>horasNum(pp.horas)>0) && <><h3 style={{margin:"12px 0 6px"}}>⏱️ Horas registradas (histórico)</h3>
        {equipoMTO(item).filter(pp=>horasNum(pp.horas)>0).map((pp,i)=>
          <div className="kv" key={i}><b>{pp.nombre}{pp.papel==="apoyo"?" · apoyo":""}</b><span>{horasNum(pp.horas)} h</span></div>)}</>}
      {!isSis && (item.historial||[]).length>0 && (gestionaModulo(user,"mantenimiento")||esGD(user)||esDev(user)) && <><h3 style={{margin:"12px 0 6px"}}>🕘 Historial</h3>
        {item.historial.map((hh,i)=><div className="kv" key={i} style={{alignItems:"flex-start"}}>
          <b style={{whiteSpace:"nowrap"}}>{fmtDate(hh.fecha)}</b>
          <span style={{textAlign:"right",maxWidth:"70%"}}>{hh.estado}{hh.nota?<><br/><span style={{fontSize:11,color:"var(--muted)"}}>{hh.nota}</span></>:null}<br/>
          <span style={{fontSize:11,color:"var(--muted)"}}>— {hh.quien||"—"}</span></span></div>)}</>}
      {/* Indicaciones y avances son internos del área. Quien no es de mantenimiento
           ni técnico asignado solo ve el comentario final de la tarea. */}
      {!isSis && veInterno(user,item) && (item.ComentarioJefe||"").trim() && <><h3 style={{margin:"12px 0 6px"}}>📋 Indicaciones de la tarea</h3>
        <div className="card" style={{margin:0,background:"var(--ocean-l,#e6f2f3)"}}>{item.ComentarioJefe}</div></>}
      {!isSis && veInterno(user,item) && (item.Avances||[]).length>0 && <><h3 style={{margin:"12px 0 6px"}}>📝 Avances (interno)</h3>
        <div>{item.Avances.map((a,i)=><div key={i} style={{borderTop:i?"1px solid var(--line)":"none",padding:"8px 0"}}>
          <div className="kv" style={{alignItems:"flex-start",padding:0}}>
            <b style={{whiteSpace:"nowrap"}}>{fmtDate(a.fecha)}</b>
            <span style={{textAlign:"right",maxWidth:"70%"}}>{a.texto}<br/><span style={{fontSize:11,color:"var(--muted)"}}>— {a.autor}</span></span></div>
          {(a.fotos||[]).length>0 && <div className="fgrid" style={{marginTop:6}}>

        {opciones.map(n=><option key={n}>{n}</option>)}</select></Field>
        {opciones.filter(n=>n!==tecnico).length>0 && <Field label="Apoyos (opcional)" hint="Marca a quienes acompañan la tarea. Suman carga y horas, pero no rinden cuentas.">
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {opciones.filter(n=>n!==tecnico).map(n=>
              <label key={n} style={{display:"flex",alignItems:"center",gap:6,border:"1px solid var(--line,#e5e5e5)",borderRadius:10,padding:"7px 10px",fontSize:13,cursor:"pointer",background:apoyos.includes(n)?"var(--ocean-l,#e6f2f3)":"#fff"}}>
                <input type="checkbox" checked={apoyos.includes(n)} onChange={e=>setApoyos(a=>e.target.checked?[...a,n]:a.filter(x=>x!==n))}/>{n}
              </label>)}
          </div></Field>}
        <Field label="Fecha límite de la tarea" req hint="Según esta fecha se marcará 'a tiempo' o 'con atraso'."><input type="date" className="inp" value={fecha} onChange={e=>setFecha(e.target.value)}/></Field></>}
      {t==="tomar" && <Field label="Fecha tentativa de solución" hint="Sin fecha: queda 'Sin fecha asignada' y NO se marca vencido."><input type="date" className="inp" value={fecha} onChange={e=>setFecha(e.target.value)}/></Field>}
      {t==="encuesta" && <Field label="Calificación (1-10)"><Stars value={cal} onChange={setCal}/></Field>}
      {["rechazar","concluir","concluirTarea","encuesta","asignar","avance","reactivar"].includes(t) && <Field label={t==="rechazar"?"Motivo del rechazo":t==="avance"?"Describe el avance (no concluye la tarea)":t==="reactivar"?"¿Por qué se reactiva? (lo verán los técnicos)":t==="concluir"||t==="concluirTarea"?"Comentario de la tarea / soporte":t==="asignar"?"Indicaciones para el técnico (opcional)":"Comentario (opcional)"} req={["rechazar","concluir","concluirTarea","avance","reactivar"].includes(t)}>
        <textarea className="inp" value={com} onChange={e=>setCom(e.target.value)}/></Field>}
      {/* Las horas ya no se piden al técnico: el tiempo se mide solo, desde que
           se asigna la tarea hasta que se marca concluida. */}
      {(t==="concluirTarea"||t==="concluir") && <PhotoField fotos={fotos} setFotos={setFotos} label={t==="concluirTarea"?"Foto de la tarea concluida":"Foto de cierre (opcional)"} req={t==="concluirTarea"} setFoto={setFoto}/>}
      {t==="avance" && <PhotoField fotos={fotos} setFotos={setFotos} label="Fotos del avance (opcional)" setFoto={setFoto}/>}
      <div className="row end"><button className="btn ghost" onClick={onClose}>Cancelar</button>
        <button className={"btn "+(t==="rechazar"?"red":"primary")} disabled={busy} onClick={go}>{busy?"Guardando…":"Confirmar"}</button></div></div>}
  </Modal>;
}

/* ===== PRODUCTIVIDAD DE MANTENIMIENTO ===== */
function ProductividadMant({rows}){
  const hoy=hoyEC();
  const ini=hoy.slice(0,8)+"01";
  const [desde,setDesde]=useState(ini); const [hasta,setHasta]=useState(hoy);
  const [tipoF,setTipoF]=useState("todas");
  const fil=rows.filter(r=>{
    const f=ymdEC(r.FechaCreacion||r.FechaSolicitud||"");
    if(!f || f<desde || f>hasta) return false;
    if(tipoF==="programado") return r.Programada==="Si";
    if(tipoF==="correctivo") return r.Programada!=="Si";
    return true;
  });
  const st={};
  const g=n=>st[n]||(st[n]={nombre:n,resp:0,apoyo:0,cerr:0,aTiempo:0,prog:0,calSum:0,calN:0,ejSum:0,ejN:0,salidas:0,abiertas:0});
  fil.forEach(r=>{
    const ej=ejecucionHrs(r); const cerrada=["Concluido","Cerrado"].includes(r.Estado);
    equipoMTO(r).forEach(pp=>{
      if(!pp.nombre) return; const a=g(pp.nombre);
      if(pp.papel==="apoyo") a.apoyo++; else a.resp++;
      if(r.Programada==="Si") a.prog++;
      if(pp.hasta) a.salidas++;
      if(!cerrada && !pp.hasta) a.abiertas++;
      if(pp.papel!=="apoyo" && cerrada){
        a.cerr++;
        if((r.CierreCumplimiento||"").includes("a tiempo")) a.aTiempo++;
        if(ej!=null){ a.ejSum+=ej; a.ejN++; }
        const c=Number(r.EncuestaCal); if(c>0){ a.calSum+=c; a.calN++; }
      }
    });
  });
  const lista=Object.values(st).sort((a,b)=>(b.resp+b.apoyo)-(a.resp+a.apoyo));
  const sinHist=fil.filter(r=>["Concluido","Cerrado"].includes(r.Estado) && ejecucionHrs(r)==null).length;
  const M=({k,v,c})=><div style={{flex:"1 1 82px",minWidth:82}}>
    <div style={{fontSize:10.5,letterSpacing:".04em",textTransform:"uppercase",color:"var(--muted)",fontWeight:700}}>{k}</div>
    <div style={{fontSize:17,fontWeight:800,color:c||"inherit"}}>{v}</div></div>;
  return <div>
    <div className="card">
      <Field label="Desde"><input type="date" className="inp" value={desde} onChange={e=>setDesde(e.target.value)}/></Field>
      <Field label="Hasta"><input type="date" className="inp" value={hasta} onChange={e=>setHasta(e.target.value)}/></Field>
      <div className="seg" style={{flexWrap:"wrap"}}>
        <button className={tipoF==="todas"?"on":""} onClick={()=>setTipoF("todas")}>Todas</button>
        <button className={tipoF==="correctivo"?"on":""} onClick={()=>setTipoF("correctivo")}>Correctivo</button>
        <button className={tipoF==="programado"?"on":""} onClick={()=>setTipoF("programado")}>Programado</button>
      </div>
      <div className="kcount" style={{marginTop:8}}>{fil.length} tarea(s) · {lista.length} persona(s)</div>
    </div>
    {sinHist>0 && <div className="card" style={{background:"#fff8e6",borderColor:"#f0e2bd"}}>
      <b>{sinHist} tarea(s) cerrada(s) sin tiempo de ejecución.</b> Son registros anteriores a esta versión: no guardaban
      la fecha de asignación, así que el tiempo no es comparable y se excluye del promedio.</div>}
    {!lista.length && <div className="empty"><div className="e"><Icon name="filetext" size={44}/></div><div>No hay tareas asignadas en este rango</div></div>}
    {lista.map(a=><div className="item" key={a.nombre}>
      <div className="top"><div><div className="ttl">{a.nombre}</div>
        <div className="meta">{a.resp} como responsable · {a.apoyo} como apoyo{a.abiertas?` · ${a.abiertas} abierta(s)`:""}</div></div></div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginTop:10}}>
        <M k="Cerradas" v={a.cerr}/>
        <M k="A tiempo" v={a.cerr?Math.round(100*a.aTiempo/a.cerr)+"%":"—"} c={a.cerr&&(a.aTiempo/a.cerr)<0.8?"var(--coral)":"var(--green)"}/>
        <M k="Ejecución" v={a.ejN?fmtHrs(a.ejSum/a.ejN):"—"}/>
        <M k="Programadas" v={a.prog}/>
        <M k="Calificación" v={a.calN?(Math.round(a.calSum/a.calN*10)/10)+" ("+a.calN+")":"—"}/>
        {a.salidas>0 && <M k="Reasignadas" v={a.salidas} c="var(--coral)"/>}
      </div>
      {a.calN>0 && a.calN<5 && <div className="meta" style={{marginTop:8}}>La calificación se basa en {a.calN} encuesta(s): tómala como referencia, no como conclusión.</div>}
    </div>)}
  </div>;
}

/* ===== KANBAN ===== */
function KanModal({proc,tabla,r,canEdit,cols,onClose,onSaved,toast,setFoto}){
  const isCom=tabla==="Compras", isSis=tabla==="Sistemas";
  const titulo=isCom?r.Modelo:isSis?r.Titulo:r.Descripcion;
  const area=isCom?r.Area:r.Departamento;
  const [estado,setEstado]=useState(r.Estado); const [com,setCom]=useState(""); const [fecha,setFecha]=useState(r.FechaTentativa||"");
  async function guardar(){ const arr=await Store.read(tabla);
    const upd=arr.map(x=>{ if(x.Codigo!==r.Codigo) return x; const o={...x,Estado:estado};
      if(com.trim()){ o.ComentarioKanban=com; if(isCom)o.ComentarioGG=com; else o.ComentarioSoporte=com; }
      if(fecha) o.FechaTentativa=fecha; return o; });
    await Store.write(tabla,upd); toast("Solicitud actualizada"); onSaved(); onClose();
  }
  return <Modal title={r.Codigo} onClose={onClose}>
    {[["Solicitante",r.Solicitante],["Área/Depto",area||"—"],["Detalle",titulo||"—"],
      isCom?["Tipo",r.TipoCompra||"—"]:["Prioridad",(isSis?r.Urgencia:r.TipoSolicitud)||"—"],
      ["Descripción",r.Descripcion||r.Justificacion||"—"],["Estado",r.Estado],
      ["Asignado",r.Asignado||"—"],["Fecha",fmtDate(r.FechaTentativa)]].map(([k,v])=>
      <div className="kv" key={k}><b>{k}</b><span style={{textAlign:"right",maxWidth:"62%"}}>{v}</span></div>)}
    {(r.Fotos||[]).length>0 && <><h3 style={{margin:"12px 0 6px"}}>Adjuntos</h3>
      <div className="fgrid">{r.Fotos.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
    {isCom && r.Estado==="En compra" && notaPresupBox(12)}
    {["Entregado","Cerrada","Cerrado"].includes(r.Estado) && <button className="btn ocean block" style={{marginTop:10}} onClick={()=>isCom?actaCompra(r):null} disabled={!isCom}>{isCom?<span><Icon name="filetext" size={15} style={{marginRight:6}}/>Acta (PDF)</span>:""}</button>}
    {canEdit ? <div className="card" style={{marginTop:12}}>
      <h3>Gestionar</h3>
      <Field label="Estado"><select className="inp" value={estado} onChange={e=>setEstado(e.target.value)}>{cols.map(c=><option key={c}>{c}</option>)}</select></Field>
      <Field label="Fecha"><input type="date" className="inp" value={fecha} onChange={e=>setFecha(e.target.value)}/></Field>
      <Field label="Comentario"><textarea className="inp" value={com} onChange={e=>setCom(e.target.value)}/></Field>
      <button className="btn primary block" onClick={guardar}>Guardar</button>
    </div> : <div className="hint" style={{marginTop:12}}>Solo lectura.</div>}
  </Modal>;
}
function Kanban({user,toast,setFoto}){
  const allMods=["compras","sistemas","mantenimiento"];
  const verTodo=esDev(user)||user.rol==='gerencia';
  const mods=verTodo?allMods:allMods.filter(m=>gestionaModulo(user,m));
  const [proc,setProc]=useState(mods[0]||"compras");
  const tabla={compras:"Compras",sistemas:"Sistemas",mantenimiento:"Mantenimiento"}[proc];
  const [rows,setRows]=useState([]); const [over,setOver]=useState(null); const drag=useRef(null);
  const [fArea,setFArea]=useState(""); const [fSolic,setFSolic]=useState(""); const [det,setDet]=useState(null);
  /* En Mantenimiento conviven dos trabajos distintos: las tareas programadas
     (planificación propia) y los correctivos (novedades que reporta el hotel).
     Mezclarlos en el tablero distorsiona la lectura de carga. */
  const [fTipo,setFTipo]=useState("todas");
  const esMto = proc==='mantenimiento';
  const load=async()=>cargarConReintento(()=>Store.read(tabla), setRows, toast, tabla); useEffect(()=>{load();setFArea("");setFSolic("");setFTipo("todas");},[proc]);
  const cols=KANBAN[proc];
  const areaOf=r=>tabla==="Compras"?r.Area:r.Departamento;
  const titleOf=r=>tabla==="Compras"?r.Modelo:tabla==="Sistemas"?r.Titulo:r.Descripcion;
  const prioOf=r=>tabla==="Compras"?(r.TiempoCompra||""):tabla==="Sistemas"?(r.Urgencia||""):(r.TipoSolicitud||"");
  const isUrg=r=>{const p=prioOf(r).toLowerCase();return p.includes("urgente")||p.includes("alta");};
  const areas=[...new Set(rows.map(areaOf).filter(Boolean))].sort();
  const solics=[...new Set(rows.map(r=>r.Solicitante).filter(Boolean))].sort();
  const pasaTipo=r=>{ if(!esMto||fTipo==="todas") return true;
    return fTipo==="programadas" ? r.Programada==="Si" : r.Programada!=="Si"; };
  const visibles=rows.filter(r=>(!fArea||areaOf(r)===fArea)&&(!fSolic||r.Solicitante===fSolic)&&pasaTipo(r));
  const nProg=rows.filter(r=>r.Programada==="Si").length;
  const nCorr=rows.length-nProg;
  function canEditCard(r){ if(esCerrada(r)) return false; if(esDev(user)) return true;
    if(gestionaModulo(user,proc)) return true;
    if(user.rol==='gerencia' && proc==='compras' && r.Estado==='En Gerencia') return true;
    return false; }
  async function move(code,estado){ const r=rows.find(x=>x.Codigo===code); if(!r||!canEditCard(r)) return;
    const arr=await Store.read(tabla); const rid=r.id;
    await Store.write(tabla,arr.map(x=>{
      const esteEs = (rid!=null && x.id===rid) || (rid==null && x.Codigo===code);
      if(!esteEs) return x;
      const o={...x,Estado:estado};
      if(estado!==x.Estado){ const h=Array.isArray(x.historial)?x.historial:[];
        o.historial=[...h,{estado,fecha:nowISO(),quien:user.nombre,nota:"Movido en el Kanban"}]; }
      return o;
    })); load(); toast("Movido a "+estado); }
  return <div>
    <h1 className="h1">Tablero Kanban</h1><p className="sub">Toca una tarjeta para abrirla. Podrás editar solo las que te corresponden.</p>
    {!mods.length ? <div className="empty"><div className="e">🔒</div>No tienes un tablero asignado.</div> : <>
    {mods.length>1 && <div className="seg">{mods.map(m=><button key={m} className={proc===m?"on":""} onClick={()=>setProc(m)}>{({compras:"Compras",sistemas:"Sistemas",mantenimiento:"Mantenimiento"})[m]}</button>)}</div>}
    <div className="kfilters">
      <select value={fArea} onChange={e=>setFArea(e.target.value)}><option value="">Todas las áreas</option>{areas.map(a=><option key={a}>{a}</option>)}</select>
      <select value={fSolic} onChange={e=>setFSolic(e.target.value)}><option value="">Todos los solicitantes</option>{solics.map(s=><option key={s}>{s}</option>)}</select>
      {esMto && <select value={fTipo} onChange={e=>setFTipo(e.target.value)}>
        <option value="todas">Programadas y correctivas</option>
        <option value="programadas">Solo tareas programadas ({nProg})</option>
        <option value="correctivas">Solo correctivas ({nCorr})</option></select>}
      {(fArea||fSolic||fTipo!=="todas") && <button className="btn ghost" style={{flex:"0 0 auto"}} onClick={()=>{setFArea("");setFSolic("");setFTipo("todas");}}>Limpiar</button>}
    </div>
    <div className="kcount">{visibles.length} de {rows.length} tarjeta(s){fArea?` · ${fArea}`:""}{fSolic?` · ${fSolic}`:""}{esMto&&fTipo!=="todas"?` · ${fTipo==="programadas"?"programadas":"correctivas"}`:""}</div>
    <div className="kan">{cols.map(col=>{ const cards=visibles.filter(r=>r.Estado===col);
      return <div key={col} className={"kcol"+(over===col?" over":"")} onDragOver={e=>{e.preventDefault();setOver(col);}}
        onDragLeave={()=>setOver(null)} onDrop={e=>{e.preventDefault();setOver(null); if(drag.current) move(drag.current,col);}}>
        <h4><span><span className="dotc" style={{background:colorOf(col)}}></span>{col}</span><span className="cnt">{cards.length}</span></h4>
        {cards.map(r=>{ const ed=canEditCard(r);
          return <div key={r.Codigo} className="kcard" draggable={ed}
          style={{borderLeft:`4px solid ${isOverdue(r)?cssVar("--red"):colorOf(r.Estado)}`,cursor:"pointer"}}
          onClick={()=>setDet(r)} onDragStart={()=>{ if(ed) drag.current=r.Codigo; }} onDragEnd={()=>drag.current=null}>
          <div className="kc">{r.Codigo}{isOverdue(r)?" · ⚠ vencido":""}{esCerrada(r)?" · 🔒":""}</div>
          <div className="kt">{titleOf(r)}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"6px 0 2px"}}>
            <span className="kchip">{areaOf(r)||"—"}</span>
            {prioOf(r) && <span className={"kchip"+(isUrg(r)?" urg":"")}>{prioOf(r).split(" ")[0]}</span>}
            {esMto && <span className="kchip" style={{background:r.Programada==="Si"?"#efe6fb":"#e2f0f1",color:r.Programada==="Si"?"#5b3a95":"#0a565c",fontWeight:700}}>{r.Programada==="Si"?"Programada":"Correctiva"}</span>}</div>
          <div className="km"><Icon name="user" size={15} style={{marginRight:6}}/>{r.Solicitante}{r.FechaTentativa?` · 📅 ${fmtDate(r.FechaTentativa)}`:""}</div>
          <div className="kchip" style={{marginTop:6,display:"inline-block"}}>{ed?"Abrir / editar":"Abrir"}</div></div>;})}
        {!cards.length && <div style={{color:"#aab2b3",fontSize:12,textAlign:"center",padding:"14px 0"}}>—</div>}
      </div>;})}</div>
    {det && <KanModal proc={proc} tabla={tabla} r={det} canEdit={canEditCard(det)} cols={cols}
      onClose={()=>setDet(null)} onSaved={load} toast={toast} setFoto={setFoto}/>}
    </>}
  </div>;
}

/* Aviso permanente de formularios sin enviar. Se ve desde cualquier pantalla,
   así el pendiente no queda escondido dentro de una pestaña. */
/* Estado de la conexión, siempre visible en la barra de arriba.
   Antes nadie sabía si la app estaba en línea, y eso llevaba a reenviar por si acaso. */
function EstadoRed({user}){
  const [online,setOnline]=useState(navigator.onLine);
  const [pend,setPend]=useState(0);
  const [expirada,setExpirada]=useState(false);
  const [reconectando,setReconectando]=useState(false);
  useEffect(()=>{
    const on=()=>setOnline(true), off=()=>setOnline(false);
    window.addEventListener("online",on); window.addEventListener("offline",off);
    const chequear=async()=>{
      try{ const r=await Cola.resumen(user&&user.nombre); setPend(r.porEnviar); }catch(e){}
      if(MODE==="graph") setExpirada(!!SESSION_EXPIRED);
    };
    chequear(); const t=setInterval(chequear,30000);
    return ()=>{ clearInterval(t); window.removeEventListener("online",on); window.removeEventListener("offline",off); };
  },[user]);
  async function reconectar(){ setReconectando(true); const ok=await refreshToken(); setExpirada(!ok); setReconectando(false); if(!ok) msSignIn(); }
  /* Antes "En línea" solo miraba el wifi del dispositivo (navigator.onLine), así que
     se quedaba en verde aunque la sesión de Microsoft/SharePoint hubiera vencido y
     nada se estuviera guardando. Ahora "En línea" exige AMBAS condiciones: wifi Y
     sesión de SharePoint válida. Si falta cualquiera de las dos, se muestra "Offline"
     (el motivo exacto queda en el tooltip y, si es por sesión vencida, es tocable
     para reconectar sin tener que cerrar/abrir la app). */
  const conectado = online && !expirada;
  const motivo = !online ? "Sin conexión a internet" : expirada ? "Sesión de SharePoint vencida — toca para reconectar" : "";
  const estado = conectado
    ? {t:"En línea",c:"#3ddc97",titulo:"Con conexión a internet y a SharePoint"}
    : {t:"Offline",c: !online ? "#FFA11F" : "#ff6b6b",titulo: motivo+". Lo que envíes queda guardado en la tablet y se sincroniza solo."};
  return <span title={estado.titulo} onClick={expirada?reconectar:undefined}
    style={{display:"inline-flex",alignItems:"center",gap:6,background:conectado?"rgba(255,255,255,.16)":"rgba(0,0,0,.28)",
      borderRadius:999,padding:"4px 10px",fontSize:11.5,fontWeight:700,color:"#fff",whiteSpace:"nowrap",cursor:expirada?"pointer":"default",
      border:"1px solid "+(conectado?"rgba(255,255,255,.28)":"#FFA11F")}}>
    <span style={{width:8,height:8,borderRadius:"50%",background:estado.c,flexShrink:0}}></span>
    {reconectando?"Reconectando…":estado.t}
    {pend>0 && <span style={{opacity:.9}}>· {pend} por enviar</span>}
  </span>;
}

function AvisoPendientes({user,toast,onIr}){
  const [res,setRes]=useState({porEnviar:0,enConflicto:0});
  const [enviando,setEnviando]=useState(false); const [limpiando,setLimpiando]=useState(false);
  const [online,setOnline]=useState(navigator.onLine);
  const ref=useRef({ultimo:0});
  const contar=async()=>{ try{ setRes(await Cola.resumen(user.nombre)); }catch(e){} };

  /* El envío automático es MUDO a propósito. Antes avisaba en cada reintento y,
     con la red del hotel parpadeando, eso llenaba la pantalla de mensajes.
     El contador de este aviso ya comunica el estado sin interrumpir a nadie. */
  async function auto(){
    const ahoraMs=Date.now();
    if(ahoraMs-ref.current.ultimo < 15000) return;   // no más de una vez cada 15 s
    ref.current.ultimo=ahoraMs;
    if(Cola.ocupado()) return;
    try{ await Cola.enviar(user.nombre); }catch(e){}
    await contar();
  }
  useEffect(()=>{
    /* Al entrar: primero se limpia lo que ya no aplica, después se cuenta.
       Así el equipo no se encuentra con conflictos que ya están resueltos. */
    (async()=>{ await Cola.autoLimpiar(user.nombre); await contar(); })();
    /* Antes el reintento automático solo se disparaba con el evento "online" del
       navegador, que en un wifi estable de hotel casi nunca vuelve a saltar. Por
       eso lo que fallaba por sesión vencida se quedaba en la tablet todo el día.
       Ahora también se reintenta solo cada 60s si hay señal. */
    const t=setInterval(()=>{ contar(); if(navigator.onLine) auto(); },60000);
    const on=()=>{ setOnline(true); auto(); }, off=()=>setOnline(false);
    window.addEventListener("online",on); window.addEventListener("offline",off);
    return ()=>{ clearInterval(t); window.removeEventListener("online",on); window.removeEventListener("offline",off); };
  },[user]);

  async function enviarAhora(){
    if(Cola.ocupado()) return;
    setEnviando(true);
    try{ const r=await Cola.enviar(user.nombre); await contar();
      if(r.sinRed) toast("Sin conexión todavía.");
      else if(r.fail) toast(`Quedan ${r.fail} por enviar. Se reintentará.`);
      else if(r.ok) toast(`Listo, se enviaron ${r.ok}.`);
    } finally { setEnviando(false); } }

  async function limpiar(){
    setLimpiando(true);
    try{ const r=await Cola.limpiarResueltos(user.nombre); await contar();
      toast(r.quedan ? `Se resolvieron ${r.quitados}. Quedan ${r.quedan} que necesitan tu decisión.`
                     : `Listo, se resolvieron ${r.quitados}.`);
    } finally { setLimpiando(false); } }

  const {porEnviar,enConflicto}=res;
  if(!porEnviar && !enConflicto) return null;
  const caja=(borde,fondo)=>({background:fondo,border:"1px solid "+borde,borderLeft:"4px solid "+borde,
    borderRadius:10,padding:"10px 12px",marginBottom:10,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"});
  return <div>
    {porEnviar>0 && <div style={caja("#F3D9A6","#FFF4E0")}>
      <div style={{flex:1,minWidth:160,fontSize:13,color:"#7a5a12"}}>
        <b>{porEnviar} sin enviar.</b> {online?"Ya hay conexión.":"Se envían solos cuando vuelva el internet."}</div>
      {online && <button className="btn primary" style={{padding:"8px 12px",fontSize:13}} disabled={enviando} onClick={enviarAhora}>
        {enviando?"Enviando…":"Enviar ahora"}</button>}
    </div>}
    {enConflicto>0 && (esGD(user)||esDev(user)) && <div style={caja("#F3C9C9","#FDF0F0")}>
      <div style={{flex:1,minWidth:160,fontSize:13,color:"#8f2020"}}>
        <b>{enConflicto} necesitan tu revisión.</b> Otra persona cambió esos registros mientras no tenías señal.</div>
      <button className="btn ghost" style={{padding:"8px 12px",fontSize:13}} disabled={limpiando} onClick={limpiar}>
        {limpiando?"Revisando…":"Resolver solos"}</button>
      {onIr && <button className="btn ocean" style={{padding:"8px 12px",fontSize:13}} onClick={onIr}>Ver</button>}
    </div>}
  </div>;
}

/* ===== HOUSEKEEPING — Fase 1: Habitaciones (QR + flujo de limpieza + tiempos) =====
   Módulo aparte (ver esHKJefatura/esHKCamarero/tieneHK): reutiliza el mismo
   patrón de cola/Store/ID atómico que ILD/Compras/Sistemas para que quede
   igual de robusto ante doble clic y falta de señal. No inventa habitaciones:
   el catálogo se llena a mano o con el generador de rango, con datos reales. */
const HK_EST_DISPONIBLE = "Disponible";
const HK_EST_LIMPIEZA = "Limpieza en proceso";

/* Catálogo real de habitaciones de Playa Paraíso, tomado del reporte "Habitaciones
   según Estado" (HOTELERA PARAISO S.A. HOPARSA / Zeus, corte 2026.09.10) que
   Shirley adjuntó: son los 47 números de habitación reales del hotel — no se

function HKRoomModal({room,onClose,onSaved,toast,rooms}){
  const esNuevo = !room;
  const [numero,setNumero]=useState(room?room.numero:"");
  const [tipo,setTipo]=useState(room?room.tipo||"":"");
  const [piso,setPiso]=useState(room?room.piso||"":"");
  const [sector,setSector]=useState(room?room.sector||"":"");
  const [busy,unaVez]=useEnvioUnico();
  async function guardar(){
    const num = String(numero||"").trim();
    if(!num){ toast("Escribe el número de habitación"); return; }
    const dup = rooms.some(r=>String(r.numero)===num && (!room || r.id!==room.id));
    if(dup){ toast("Ya existe una habitación con ese número"); return; }
    await unaVez(async()=>{
      try{
        const nueva = esNuevo
          ? { id:gid(), numero:num, tipo:tipo.trim(), piso:piso.trim(), sector:sector.trim(),
              activo:true, estado:HK_EST_DISPONIBLE, creadoEn:nowISO(), ultimaLimpieza:null }
          : { ...room, numero:num, tipo:tipo.trim(), piso:piso.trim(), sector:sector.trim() };
        const arr = await Store.read("HKHabitaciones");
        const resto = arr.filter(r=>r.id!==nueva.id);
        await Store.write("HKHabitaciones", [nueva, ...resto]);
        toast(esNuevo?"Habitación creada":"Habitación actualizada");
        onSaved(); onClose();
      }catch(e){ toast("No se pudo guardar: "+(e.message||e)); }
    });
  }
  return <Modal title={esNuevo?"Nueva habitación":"Editar habitación · "+room.numero} onClose={onClose}>
    <Field label="Número de habitación" req><input className="inp" value={numero} onChange={e=>setNumero(e.target.value)} placeholder="Ej. 101"/></Field>
    <Field label="Tipo (opcional)"><input className="inp" value={tipo} onChange={e=>setTipo(e.target.value)} placeholder="Ej. Standard, Suite…"/></Field>
    <Field label="Piso (opcional)"><input className="inp" value={piso} onChange={e=>setPiso(e.target.value)} placeholder="Ej. 2"/></Field>
    <Field label="Sector (opcional)"><input className="inp" value={sector} onChange={e=>setSector(e.target.value)} placeholder="Ej. Torre A"/></Field>
    <button className="btn primary block" disabled={busy} onClick={guardar}>{busy?"Guardando…":"Guardar"}</button>
  </Modal>;
}

function HKBulkModal({onClose,onSaved,toast,rooms}){
  const [desde,setDesde]=useState(""); const [hasta,setHasta]=useState("");
  const [prefijo,setPrefijo]=useState(""); const [tipo,setTipo]=useState(""); const [piso,setPiso]=useState(""); const [sector,setSector]=useState("");
  const [busy,unaVez]=useEnvioUnico();
  async function generar(){
    const d = parseInt(desde,10), h = parseInt(hasta,10);
    if(!Number.isFinite(d) || !Number.isFinite(h) || h<d){ toast("Rango inválido"); return; }
    if((h-d+1)>300){ toast("Rango demasiado grande (máximo 300 a la vez)"); return; }
    await unaVez(async()=>{
      try{
        const existentes = new Set(rooms.map(r=>String(r.numero)));
        const nuevas=[];
        for(let n=d;n<=h;n++){
          const num = prefijo? (prefijo+n) : String(n);
          if(existentes.has(num)) continue;
          nuevas.push({ id:gid()+"_"+n, numero:num, tipo:tipo.trim(), piso:piso.trim(), sector:sector.trim(),
            activo:true, estado:HK_EST_DISPONIBLE, creadoEn:nowISO(), ultimaLimpieza:null });
        }
        if(!nuevas.length){ toast("No hay habitaciones nuevas que crear en ese rango"); return; }
        const arr = await Store.read("HKHabitaciones");
        await Store.write("HKHabitaciones", [...nuevas, ...arr]);
        toast(`Se crearon ${nuevas.length} habitaciones`);
        onSaved(); onClose();
      }catch(e){ toast("No se pudo generar: "+(e.message||e)); }
    });
  }
  return <Modal title="Generar habitaciones por rango" onClose={onClose}>
    <div className="hint" style={{marginBottom:10}}>Crea varias habitaciones seguidas, por ejemplo de la 101 a la 130. No se duplican números que ya existan.</div>
    <div className="row" style={{gap:10}}>
      <Field label="Desde (número)" req><input className="inp" type="number" value={desde} onChange={e=>setDesde(e.target.value)} placeholder="101"/></Field>
      <Field label="Hasta (número)" req><input className="inp" type="number" value={hasta} onChange={e=>setHasta(e.target.value)} placeholder="130"/></Field>
    </div>
    <Field label="Prefijo (opcional)" hint="Ej. si pones 'A-', quedará A-101, A-102…"><input className="inp" value={prefijo} onChange={e=>setPrefijo(e.target.value)}/></Field>
    <Field label="Tipo para todas (opcional)"><input className="inp" value={tipo} onChange={e=>setTipo(e.target.value)}/></Field>
    <div className="row" style={{gap:10}}>
      <Field label="Piso (opcional)"><input className="inp" value={piso} onChange={e=>setPiso(e.target.value)}/></Field>
      <Field label="Sector (opcional)"><input className="inp" value={sector} onChange={e=>setSector(e.target.value)}/></Field>
    </div>
    <button className="btn primary block" disabled={busy} onClick={generar}>{busy?"Generando…":"Generar habitaciones"}</button>
  </Modal>;
}

/* Checklist de cierre de limpieza: mismos ítems que ya existían para el área
   "Habitaciones" en ILD (CL['Habitaciones']), para no duplicar catálogo ni
   confundir a jefatura con dos listas distintas. */
function HKFinalizar({registro,room,user,toast,setFoto,onDone}){
  const items = CL['Habitaciones']||[];
  const [checks,setChecks]=useState({}); const [fotos,setFotos]=useState([]); const [obs,setObs]=useState("");
  const [busy,unaVez]=useEnvioUnico();
  const reqTotal = fotosReq('Habitaciones');
  const done = items.filter((it,i)=>checks[i]).length;
  async function finalizar(){
    if(done<items.length && !confirm(`${items.length-done} ítem(s) sin marcar. ¿Finalizar igual?`)) return;
    if(fotos.length<reqTotal && !confirm(`Solo ${fotos.length}/${reqTotal} fotos. ¿Continuar?`)) return;
    await unaVez(async()=>{
      try{
        const horaFin = nowISO();
        const tiempoMin = Math.max(0, Math.round((new Date(horaFin) - new Date(registro.horaInicio))/60000));
        await Cola.cambio({ tabla:"HKLimpiezas", recId:registro.id, recCodigo:registro.Codigo, campoEstado:"estado",
          patch:{ estado:"Finalizado", horaFin, tiempoMin, checks:{...checks}, obs },
          fotos:[...fotos], fotoField:"fotos", fotoDir:"HK_{ID}", fotoPrefix:"HK{ID}",
          patchId:"fin-"+registro.id }, user.nombre);
        await Cola.cambio({ tabla:"HKHabitaciones", recId:room.id, campoEstado:"estado",
          patch:{ estado:HK_EST_DISPONIBLE, ultimaLimpieza:{ fecha:horaFin, colaborador:user.nombre, tiempoMin, codigo:registro.Codigo } },
          patchId:"habok-"+registro.id }, user.nombre);
        const r = await Cola.enviar(user.nombre);
        if(r.sinRed) toast("Guardado sin señal. Se envía solo cuando vuelva el internet.");
        else toast(`Limpieza finalizada · ${tiempoMin} min`);
        onDone();
      }catch(e){ toast("No se pudo finalizar: "+(e.message||e)); }
    });
  }
  return <Modal title={"Finalizar limpieza · Hab. "+room.numero} onClose={onDone}>
    <div className="hint" style={{marginBottom:10}}>Inicio: {fmtDT(registro.horaInicio)}. La hora de finalización se registra automáticamente al enviar.</div>
    <div className="card" style={{padding:0,border:"none"}}>
      <h3>Checklist — {done}/{items.length}</h3>
      {items.map((it,i)=>{ const tx = itemText(it);
        return <div key={i} className={"crow"+(checks[i]?" on":"")} onClick={()=>setChecks(c=>({...c,[i]:!c[i]}))}>
          <div className="cbox">{checks[i]?"✓":""}</div><span className="ctext">{i+1}. {tx}</span></div>; })}
    </div>
    <PhotoField fotos={fotos} setFotos={setFotos} setFoto={setFoto} label={`Fotos — ${fotos.length}/${reqTotal}`} hint="Evidencia de la limpieza realizada."/>
    <Field label="Observaciones (opcional)"><textarea className="inp" value={obs} onChange={e=>setObs(e.target.value)} placeholder="Novedades de la habitación…"/></Field>
    <button className="btn primary block" disabled={busy} onClick={finalizar}>{busy?"Enviando…":"Finalizar limpieza y enviar ILD"}</button>
  </Modal>;
}

function HKCamarero({user,toast,setFoto}){
  const [rooms,setRooms]=useState([]); const [limpiezas,setLimpiezas]=useState([]); const [scan,setScan]=useState(false);
  const [pendiente,setPendiente]=useState(null); // {room, otraActiva}
  const [autorizadoPor,setAutorizadoPor]=useState(""); const [motivo,setMotivo]=useState("");
  const [finalizarReg,setFinalizarReg]=useState(null);
  const [busy,unaVez]=useEnvioUnico();
  const load=async()=>{
    try{ setRooms(await hkCargarHabitaciones()); setLimpiezas(await hkCargarLimpiezas()); }catch(e){}
  };
  useEffect(()=>{load();},[]);
  const misActivas = limpiezas.filter(l=>l.colaborador===user.nombre && l.estado==="En proceso");
  function onDetect(texto){
    setScan(false);
    const roomId = hkParseQR(texto);
    if(!roomId){ toast("Ese código no corresponde a una habitación de Playa Paraíso"); return; }
    const room = rooms.find(r=>String(r.id)===String(roomId));
    if(!room){ toast("Habitación no encontrada en el catálogo"); return; }
    if(!room.activo){ toast("Esta habitación está desactivada"); return; }
    const miPropia = misActivas.find(l=>l.habitacionId===room.id);
    if(miPropia){ setFinalizarReg(miPropia); return; }
    if(room.estado===HK_EST_LIMPIEZA){
      const otro = limpiezas.find(l=>l.habitacionId===room.id && l.estado==="En proceso");
      toast(`Esta habitación ya está en limpieza${otro?" por "+otro.colaborador:""}.`);
      return;
    }
    const otraActiva = misActivas[0]||null;
    setAutorizadoPor(""); setMotivo("");
    setPendiente({room, otraActiva});
  }
  async function iniciar(){
    const {room, otraActiva} = pendiente;
    if(otraActiva && (!autorizadoPor.trim() || !motivo.trim())){
      toast("Para tener dos habitaciones a la vez, indica quién lo autorizó y el motivo.");
      return;
    }
    await unaVez(async()=>{
      try{
        const rec = { id:gid(), habitacionId:room.id, habitacionNumero:room.numero, colaborador:user.nombre,
          fecha:hoyEC(), horaInicio:nowISO(), horaFin:"", tiempoMin:null, estado:"En proceso",
          checks:{}, obs:"", fotos:[], cambiosAplicados:[],
          excepcion: otraActiva ? { autorizadoPor:autorizadoPor.trim(), motivo:motivo.trim(), otraHabitacion:otraActiva.habitacionNumero } : null };
        await Cola.add({ tabla:"HKLimpiezas", prefijo:"HK", rec, fotos:[], fotoField:"fotos",
          fotoDir:"HK_{ID}", fotoPrefix:"HK{ID}", notif:null,
          resumen:{ titulo:"Limpieza Hab. "+room.numero, sub:user.nombre } }, user.nombre);
        await Cola.cambio({ tabla:"HKHabitaciones", recId:room.id, campoEstado:"estado",
          patch:{ estado:HK_EST_LIMPIEZA }, patchId:"inicio-"+rec.id }, user.nombre);
        const r = await Cola.enviar(user.nombre);
        if(r.sinRed) toast("Guardado sin señal. Hora de inicio: "+fmtDT(rec.horaInicio));
        else toast("Limpieza iniciada · Hab. "+room.numero);
        setPendiente(null); await load();
      }catch(e){ toast("No se pudo iniciar: "+(e.message||e)); }
    });
  }
  return <div>
    <div className="card">
      <h3>Escanear habitación</h3>
      <div className="hint" style={{marginBottom:10}}>Escanea el QR de la puerta para iniciar o finalizar la limpieza.</div>
      <button className="btn primary block" onClick={()=>setScan(true)}><Icon name="camera" size={16} style={{marginRight:6}}/>Escanear QR</button>
    </div>
    {misActivas.length>0 && <div className="card">
      <h3>En limpieza ahora</h3>
      {misActivas.map(l=><div key={l.id} className="item" onClick={()=>setFinalizarReg(l)} style={{cursor:"pointer"}}>
        <div className="top"><div>
          <div className="code">Hab. {l.habitacionNumero}</div>
          <div className="meta">Inicio: {fmtDT(l.horaInicio)}</div>
          {l.excepcion && <div className="meta" style={{color:"#7a5a12"}}>Excepción autorizada por {l.excepcion.autorizadoPor}</div>}
        </div><Pill estado="En proceso"/></div>
        <div className="hint">Toca para finalizar</div>
      </div>)}
    </div>}
    {scan && <QRScanner onDetect={onDetect} onClose={()=>setScan(false)}/>}
    {pendiente && <Modal title={"Iniciar limpieza · Hab. "+pendiente.room.numero} onClose={()=>setPendiente(null)}>
      <div className="hint" style={{marginBottom:10}}>Hora de inicio (se registra automáticamente): {fmtDT(nowISO())}</div>
      {pendiente.otraActiva && <div style={{background:"#FFF4E0",border:"1px solid #F3D9A6",borderRadius:9,padding:"9px 11px",marginBottom:10,fontSize:12.5,color:"#7a5a12"}}>
        Ya tienes la Hab. {pendiente.otraActiva.habitacionNumero} en limpieza. Para tener dos a la vez necesitas autorización de jefatura.
        <Field label="Autorizado por" req><input className="inp" value={autorizadoPor} onChange={e=>setAutorizadoPor(e.target.value)} placeholder="Nombre de quien autoriza"/></Field>
        <Field label="Motivo" req><input className="inp" value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder="Ej. urgencia de check-in"/></Field>
      </div>}
      <button className="btn primary block" disabled={busy} onClick={iniciar}>{busy?"Iniciando…":"Iniciar limpieza"}</button>
    </Modal>}
    {finalizarReg && <HKFinalizar registro={finalizarReg} room={rooms.find(r=>r.id===finalizarReg.habitacionId)||{numero:finalizarReg.habitacionNumero,id:finalizarReg.habitacionId}}
      user={user} toast={toast} setFoto={setFoto} onDone={()=>{setFinalizarReg(null);load();}}/>}
  </div>;
}

/* ===== HOUSEKEEPING — Áreas Públicas =====
   Mismo patrón que Habitaciones (QR + inicio/fin + tiempos), pero para zonas
   comunes en vez de cuartos de huésped. El catálogo NO se inventa: se siembra
   una sola vez con las mismas 20 zonas reales que ya existían en el checklist
   de ILD para el área "Áreas Públicas" (CL['Áreas Públicas']), así no se
   duplica el dato ni queda desalineado con lo que usa ese módulo. A diferencia
   de Habitaciones, aquí no hay un checklist de tareas por ítem (ese dato no
   existe todavía para áreas comunes): el cierre pide fotos (3 a 5, igual que
   el modo "lista" de ILD) y observaciones. */
const hkQRValorArea = areaId => "PPHK:AREA:" + areaId;
function hkParseQRArea(texto){
  const t = String(texto||"").trim();
  const m = t.match(/^PPHK:AREA:(.+)$/);
  return m ? m[1] : null;
}
function hkSlug(s){ return String(s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // quita tildes (marcas combinantes tras NFD)
  .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,""); }

   embebida (QRCODEJS_DATAURI) para no depender de red al imprimir. */
function hkImprimirQRsAreas(areas){
  const w = window.open("", "_blank");
  if(!w){ alert("El navegador bloqueó la ventana de impresión. Habilita las ventanas emergentes para este sitio."); return; }
  const SCR_OPEN = "<" + "script";
  const SCR_CLOSE = "<" + "/script>";
  const cards = areas.map(a=>`<div class="card"><div id="qr-${a.id}"></div><div class="num">${String(a.nombre||"").replace(/</g,"")}</div>${a.ubicacion?`<div class="sub">${String(a.ubicacion).replace(/</g,"")}</div>`:""}</div>`).join("");
  const script = areas.map(a=>`new QRCode(document.getElementById(${JSON.stringify("qr-"+a.id)}),{text:${JSON.stringify(hkQRValorArea(a.id))},width:170,height:170});`).join("\n");
  const head = `<!doctype html><html><head><meta charset="utf-8"><title>QR Áreas Públicas — Playa Paraíso</title>
${SCR_OPEN} src="${QRCODEJS_DATAURI}">${SCR_CLOSE}
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:16px;background:#fff}
  .card{display:inline-block;width:210px;text-align:center;margin:8px;padding:14px;border:1px solid #ccc;border-radius:10px;page-break-inside:avoid;vertical-align:top}
  .num{font-size:20px;font-weight:800;margin-top:8px}
  .sub{font-size:12px;color:#666;margin-top:2px}
</style></head><body>`;
  const foot = `
${SCR_OPEN}>
  window.onload = function(){
    try{ ${script} }catch(e){}
    setTimeout(function(){ window.print(); }, 700);
  };
${SCR_CLOSE}
</body></html>`;
  const html = head + cards + foot;
  w.document.write(html); w.document.close();
}

function HKAreaModal({area,onClose,onSaved,toast,areas}){
  const esNuevo = !area;
  const [nombre,setNombre]=useState(area?area.nombre:"");
  const [ubicacion,setUbicacion]=useState(area?area.ubicacion||"":"");
  const [busy,unaVez]=useEnvioUnico();
  async function guardar(){
    const nom = String(nombre||"").trim();
    if(!nom){ toast("Escribe el nombre del área"); return; }
    const dup = areas.some(a=>a.nombre.trim().toLowerCase()===nom.toLowerCase() && (!area || a.id!==area.id));
    if(dup){ toast("Ya existe un área con ese nombre"); return; }
    await unaVez(async()=>{
      try{
        const nueva = esNuevo
          ? { id:gid(), nombre:nom, ubicacion:ubicacion.trim(), activo:true, estado:HK_EST_DISPONIBLE, creadoEn:nowISO(), ultimaLimpieza:null }
          : { ...area, nombre:nom, ubicacion:ubicacion.trim() };

function HKAreasFinalizar({registro,area,user,toast,setFoto,onDone}){
  const [obs,setObs]=useState(""); const [fotos,setFotos]=useState([]);
  const [busy,unaVez]=useEnvioUnico();
  async function finalizar(){
    if(fotos.length<3){ toast("Sube al menos 3 fotos como evidencia de la limpieza"); return; }
    await unaVez(async()=>{
      try{
        const horaFin = nowISO();
        const tiempoMin = Math.max(0, Math.round((new Date(horaFin) - new Date(registro.horaInicio))/60000));
        await Cola.cambio({ tabla:"HKAreasLimpiezas", recId:registro.id, recCodigo:registro.Codigo, campoEstado:"estado",
          patch:{ estado:"Finalizado", horaFin, tiempoMin, obs },
          fotos:[...fotos], fotoField:"fotos", fotoDir:"HKA_{ID}", fotoPrefix:"HKA{ID}",
          patchId:"fin-area-"+registro.id }, user.nombre);
        await Cola.cambio({ tabla:"HKAreas", recId:area.id, campoEstado:"estado",
          patch:{ estado:HK_EST_DISPONIBLE, ultimaLimpieza:{ fecha:horaFin, colaborador:user.nombre, tiempoMin, codigo:registro.Codigo } },
          patchId:"areaok-"+registro.id }, user.nombre);
        const r = await Cola.enviar(user.nombre);
        if(r.sinRed) toast("Guardado sin señal. Se envía solo cuando vuelva el internet.");
        else toast(`Limpieza finalizada · ${tiempoMin} min`);
        onDone();
      }catch(e){ toast("No se pudo finalizar: "+(e.message||e)); }
    });
  }
  return <Modal title={"Finalizar limpieza · "+area.nombre} onClose={onDone}>
    <div className="hint" style={{marginBottom:10}}>Inicio: {fmtDT(registro.horaInicio)}. La hora de finalización se registra automáticamente al enviar.</div>
    <PhotoField fotos={fotos} setFotos={setFotos} setFoto={setFoto} label={`Fotos (${fotos.length}) — mínimo 3`} hint="Evidencia de la limpieza realizada (3 a 5 fotos)."/>

    <button className="btn primary block" disabled={busy} onClick={finalizar}>{busy?"Enviando…":"Finalizar limpieza"}</button>
  </Modal>;
}
