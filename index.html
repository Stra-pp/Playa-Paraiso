function actaILD(r){
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const f=d=>d?new Date(d).toLocaleString('es-EC',{timeZone:TZ_EC}):'—';
  const items=itemsDe(r);
  const filas=items.map((it,i)=>{ const tx=itemText(it),tp=itemTipo(it); let val="—";
    if(tp==='sino'||tp==='sino_foto'){ const v=(r.checks&&r.checks['yn-'+i])||""; val=v==='si'?'Sí':v==='no'?'No':'—'; }
    else if(tp==='texto'){ val=(r.textos&&r.textos[i])||'—'; }
    else if(tp==='apertura_cierre'||tp==='comida'){ val=(r.selecciones&&r.selecciones[i])||'—'; }
    else { val=(r.checks&&r.checks[i])?'✓':'○'; }
    return `<tr><td>${i+1}. ${esc(tx)}</td><td style="text-align:center;font-weight:700">${esc(val)}</td></tr>`; }).join("");
  const cod=r.Codigo||("ILD-"+r.id);
  const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>ILD ${esc(cod)}</title>
  <style>body{font-family:'Segoe UI',Arial,sans-serif;color:#1b2a32;max-width:760px;margin:26px auto;padding:0 26px;line-height:1.5}
  h1{font-size:21px;margin:6px 0 4px}.tag{display:inline-block;background:#dff3e6;color:#1c7a4a;padding:4px 12px;border-radius:7px;font-weight:700;font-size:13px}
  .kv{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:4px 0;font-size:14px}.kv b{color:#0b3b46}
  table{width:100%;border-collapse:collapse;margin-top:10px}td{border-bottom:1px solid #f0f0f0;padding:6px 4px;font-size:13px}
  th{text-align:left;border-bottom:2px solid #0b6b7a;padding:6px 4px;font-size:13px}
  .note{margin-top:12px;padding:10px;border-radius:8px;background:#f6f4ee;font-size:13px}</style></head><body>
  <div class="tag">${esc(r.estado)}</div>
  <h1>ILD No. ${esc(cod)} — ${esc(r.area)}${r.turno?` · ${esc(r.turno)}`:""}</h1>
  <div class="kv"><b>Responsable</b><span>${esc(r.usuario)}</span></div>
  <div class="kv"><b>Fecha</b><span>${f(r.fecha)}</span></div>
  <div class="kv"><b>Aprobado por</b><span>${esc(r.aprobador||'—')}</span></div>
  <div class="kv"><b>Fecha de aprobación</b><span>${f(r.fechaAprobacion)}</span></div>
  <div class="kv"><b>Ítems completados</b><span>${esc((r.completados||0)+"/"+(r.totalItems||0))}</span></div>
  <table><tr><th>Ítem del checklist</th><th style="text-align:center">Resultado</th></tr>${filas}</table>
  ${r.obs?`<div class="note"><b>Nota del colaborador:</b> ${esc(r.obs)}</div>`:""}
  ${r.notaJef?`<div class="note"><b>Comentario de ${esc(r.aprobador)}:</b> ${esc(r.notaJef)}</div>`:""}
  ${r.notaGerencia?`<div class="note"><b>Gerencia:</b> ${esc(r.notaGerencia)}</div>`:""}
  <script>window.onload=function(){setTimeout(function(){try{window.print();}catch(e){}},300);};<\/script>
  </body></html>`;
  try{
    const blob=new Blob([html],{type:"text/html"}); const url=URL.createObjectURL(blob);
    const w=window.open(url,"_blank");
    if(!w){ const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(()=>{ try{URL.revokeObjectURL(url);}catch(e){} },60000);
  }catch(e){ alert("No se pudo abrir el PDF: "+(e.message||e)); }
}
function ILDDetail({user,r,onClose,reload,toast,setFoto}){
  const items=itemsDe(r);
  /* ¿Hay ya un cambio de este ILD esperando en la cola? Si lo hay, no se vuelve
     a ofrecer el botón de aprobar: repetirlo solo llenaba la cola de gemelos. */
  const [pendCola,setPendCola]=useState(null);
  useEffect(()=>{ let vivo=true;
    (async()=>{ try{ const c=await Cola.todas();
      const m=c.find(d=>d.payload && d.payload.clase==="cambio" && d.payload.tabla==="ILD"
        && String(d.payload.recId)===String(r.id));
      if(vivo) setPendCola(m||null);
    }catch(e){ if(vivo) setPendCola(null); } })();
    return ()=>{ vivo=false; };
  },[r.id]);
  const esApro=user.rol==='aprobador'&&(user.areas||[]).includes(r.area);
  const esGer=user.rol==='gerencia', esDevv=user.rol==='desarrollador';
  const puedeAprobar=esDevv||esApro||esGer;
  const puedeReAprobar=esApro && r.estado!=='Pendiente';
  const puedeNotaGer=(esGer||esDevv) && r.estado!=='Pendiente';
  const [nota,setNota]=useState(r.notaJef||""); const [notaGer,setNotaGer]=useState(r.notaGerencia||"");
  async function setEstado(ok){
    const cod=r.Codigo||("ILD-"+r.id);
    const nuevoEstado=ok?"Aprobado":"Con observaciones";
    await Cola.cambio({ tabla:"ILD", recId:r.id, recCodigo:r.Codigo||"", campoEstado:"estado",
      estadoPrevio:r.estado,
      patch:{ estado:nuevoEstado, notaJef:nota, aprobador:user.nombre, fechaAprobacion:nowISO() },
      nota:nota||"",
      avisar:{ notif:"ildDecidido", quien:user.nombre, para:[{ nombre:r.usuario,
        texto: nota?`${user.nombre} realizó un comentario sobre el ILD No. ${cod}`:`${user.nombre} revisó tu ILD No. ${cod}`,
        ildId:r.id, codigo:cod }] },
      resumen:{ titulo:"→ "+nuevoEstado+" · "+cod, sub:"ILD · "+(r.area||"") } }, user.nombre);
    const res=await Cola.enviar(user.nombre);
    if(res.ok||res.dup) toast(ok?"ILD aprobado":"Con observaciones");
    else toast(res.sinRed
      ? "Sin señal: la revisión quedó guardada y se aplicará sola cuando vuelva el internet."
      : "La revisión quedó guardada en este equipo. Se reintentará.");
    reload(); onClose();
  }
  async function guardarGer(){
    const cod=r.Codigo||("ILD-"+r.id);
    const txt=`${user.nombre} realizó un comentario sobre el ILD No. ${cod}`;
    const para=[{nombre:r.usuario,texto:txt,ildId:r.id,codigo:cod}];
    if(r.aprobador && r.aprobador!==r.usuario) para.push({nombre:r.aprobador,texto:txt,ildId:r.id,codigo:cod});
    await Cola.cambio({ tabla:"ILD", recId:r.id, recCodigo:r.Codigo||"", campoEstado:"estado",
      patch:{ notaGerencia:notaGer, notaGerenciaAutor:user.nombre, notaGerenciaFecha:nowISO() },
      nota:notaGer||"", avisar:{ para },
      resumen:{ titulo:"Nota de gerencia · "+cod, sub:"ILD · "+(r.area||"") } }, user.nombre);
    const res=await Cola.enviar(user.nombre);
    toast((res.ok||res.dup) ? "Nota de gerencia guardada"
      : res.sinRed ? "Sin señal: la nota quedó guardada y se aplicará sola cuando vuelva el internet."
      : "La nota quedó guardada en este equipo. Se reintentará.");
    reload(); onClose();
  }
  return <Modal title={(r.Codigo||("ILD #"+r.id))} onClose={onClose}>
    {[["Área",r.area+(r.turno?` · ${r.turno}`:"")],["Responsable",r.usuario],["Fecha",fmtDT(r.fecha)],
      ["Aprobador esperado",r.aprobadorEsperado||"—"],["Ítems",`${r.completados}/${r.totalItems}`],
      ["Estado",r.estado]].map(([k,v])=><div className="kv" key={k}><b>{k}</b><span>{v}</span></div>)}
    <button className="btn ocean block" style={{margin:"10px 0"}} onClick={()=>actaILD(r)}><Icon name="filetext" size={15} style={{marginRight:6}}/>Descargar PDF del ILD</button>
    <h3 style={{margin:"14px 0 6px"}}>Checklist</h3>
    {items.map((it,i)=>{ const tx=itemText(it),tp=itemTipo(it);
      let val;
      if(tp==='sino'||tp==='sino_foto'){ const v=(r.checks&&r.checks['yn-'+i])||""; val=v==='si'?<b style={{color:"var(--green)"}}>✅ Sí</b>:v==='no'?<b style={{color:"var(--red)"}}>❌ No</b>:<span style={{color:"#bbb"}}>—</span>; }
      else if(tp==='texto'){ const v=(r.textos&&r.textos[i])||""; val=<span style={{color:v?"#333":"#bbb",fontStyle:"italic"}}>{v||"—"}</span>; }
      else if(tp==='apertura_cierre'||tp==='comida'){ const v=(r.selecciones&&r.selecciones[i])||""; val=v?<b style={{color:"var(--ocean)"}}>{v}</b>:<span style={{color:"#bbb"}}>—</span>; }
      else { val=<span style={{color:r.checks&&r.checks[i]?"var(--green)":"#ccc"}}>{r.checks&&r.checks[i]?"✓":"○"}</span>; }
      return <div key={i} style={{display:"flex",justifyContent:"space-between",gap:10,padding:"7px 0",borderBottom:"1px solid #f3efe6",fontSize:13}}>
        <span style={{flex:1}}>{i+1}. {tx}</span>{val}</div>;
    })}
    {(r.fotos||[]).length>0 && <><h3 style={{margin:"14px 0 6px"}}>Fotos ({r.fotos.length})</h3>
      <div className="fgrid">{r.fotos.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
    {r.obs && <div className="note obs"><b><Icon name="edit" size={15} style={{marginRight:6}}/>Nota del colaborador</b><div>{r.obs}</div></div>}
    {r.notaJef && <div className="note jef"><b><Icon name="chat" size={15} style={{marginRight:6}}/>{r.aprobador} · {fmtDT(r.fechaAprobacion)}</b><div>{r.notaJef}</div></div>}
    {r.notaGerencia && <div className="note ger"><b><Icon name="building" size={15} style={{marginRight:6}}/>Gerencia</b><div>{r.notaGerencia}</div></div>}

    {pendCola && !pendCola.conflicto && <div className="card" style={{marginTop:12,background:"#FFF4E0",borderColor:"#F3D9A6"}}>
      <b style={{color:"#7a5a12"}}>Tu revisión ya está guardada, esperando señal</b>
      <div style={{fontSize:13,marginTop:4}}>No hace falta volver a aprobar: se enviará sola cuando vuelva el internet.
      Repetirla no la adelanta.</div>
    </div>}
    {esDuplicado(r) && <div className="card" style={{marginTop:12,background:"#FDF0F0",borderColor:"#F3C9C9"}}>
      <b style={{color:"#8f2020"}}>Marcado como duplicado</b>
      <div style={{fontSize:13,marginTop:4}}>Este ILD repite a <b>{r.duplicadoCodigo||r.duplicadoDe}</b>. Se conserva con sus fotos como respaldo,
      pero no cuenta para métricas ni necesita aprobación.</div>
      <div className="hint" style={{marginTop:6}}>Marcado por {r.duplicadoMarcadoPor||"—"}{r.duplicadoFecha?" el "+fmtDate(r.duplicadoFecha):""}.</div>
    </div>}
    {puedeAprobar && !esDuplicado(r) && !(pendCola && !pendCola.conflicto) && r.estado==='Pendiente' && <div className="card" style={{marginTop:12}}>
      <h3>Aprobación</h3>
      <textarea className="inp" placeholder="Observación (opcional)…" value={nota} onChange={e=>setNota(e.target.value)}/>
      <div className="row" style={{marginTop:10}}>
        <button className="btn green" onClick={()=>setEstado(true)}>✅ Aprobar</button>
        <button className="btn amber" onClick={()=>setEstado(false)}><Icon name="edit" size={15} style={{marginRight:6}}/>Con obs.</button></div></div>}
    {puedeReAprobar && <div className="card" style={{marginTop:12}}><h3>Modificar evaluación</h3>
      <textarea className="inp" value={nota} onChange={e=>setNota(e.target.value)}/>
      <div className="row" style={{marginTop:10}}>
        <button className="btn green" onClick={()=>setEstado(true)}>Cambiar a Aprobado</button>
        <button className="btn amber" onClick={()=>setEstado(false)}>Cambiar a Con obs.</button></div></div>}
    {puedeNotaGer && <div className="card" style={{marginTop:12}}><h3>Nota de Gerencia</h3>
      <textarea className="inp" value={notaGer} onChange={e=>setNotaGer(e.target.value)}/>
      <button className="btn ocean block" style={{marginTop:10}} onClick={guardarGer}>Guardar nota</button></div>}
  </Modal>;
}

function colorCumpl(p){ return p>=85?"--green":p>=50?"--amber":"--red"; }

/* ===== v6.7 · ILD de servicio con selector Desayuno/Almuerzo/Cena =====
   Estos ILD no se miden por outlet sino por COMIDA: desayuno, almuerzo y cena
   deben reportarse todos los días del mes, sin importar si ese día el servicio
   salió A la carta, Buffet o Buffet Plaza. La detección es estructural (checklist
   con un ítem tipo 'comida'), así que sobrevive a que se renombre el ILD. */
const COMIDAS = ['Desayuno','Almuerzo','Cena'];
const tieneComida = a => (CL[a]||[]).some(it=>itemTipo(it)==='comida');
/* Tener una pregunta de comida NO basta para agrupar: los ILD de apertura y
   cierre también la tienen y deben medirse individualmente. Se agrupan solo los
   ILD de servicio de sala (a la carta y buffets), y siempre se puede corregir a
   mano desde Config › ILD › Comidas. */
function agrupaComidaDefault(a){
  if(!tieneComida(a)) return false;
  const n=_nrm(a);
  if(n.indexOf('apertura')>=0 || n.indexOf('cierre')>=0) return false;
  return n.indexOf('alacarta')>=0 || n.indexOf('buffet')>=0;
}
function agrupaComida(a){
  if(!tieneComida(a)) return false;
  return (AGRUPA_COMIDA[a]!=null) ? !!AGRUPA_COMIDA[a] : agrupaComidaDefault(a);
}
/* Nombre corto para el desglose: quita el prefijo "ILD" y el sufijo "- Grupo" */
function cortoILD(a){
  return String(a).replace(/^\s*ILD\s+/i,"").replace(/\s*[-–]\s*[^-–]+$/,"").trim() || a;
}
/* Comida elegida en un registro (el índice depende del checklist vigente al enviar) */
function comidaDe(r){
  const its = (r && r.clItems && r.clItems.length) ? r.clItems : (CL[r.area]||[]);
  for(let i=0;i<its.length;i++){ if(itemTipo(its[i])==='comida') return (r.selecciones && r.selecciones[i])||""; }
  return "";
}
/* Etiqueta bajo el nombre del ILD: Apertura / Cierre. "Diurno" no se muestra. */
function subTurno(area,turno){
  if(AC[area] && AC[area].turno) return turno||"";
  const t=(AC[area] && AC[area].t)||"";
  return (t==='Diurno')?"":t;
}

function ILDDash({user}){
  const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const hoy=hoyDateEC();
  const areasUser = esGD(user)?Object.keys(AC):(user.areas||[]);
  const grupos=[...new Set(areasUser.map(a=>AC[a]?.g).filter(Boolean))];
  const [grp,setGrp]=useState("todas"); const [mes,setMes]=useState(hoy.getMonth()); const year=hoy.getFullYear();
  const esMesActual = mes===hoy.getMonth();
  /* El Dashboard mira el mes elegido, que puede caer fuera de la "vigencia" de
     45 días de la bandeja (ver load() en el módulo ILD). Por eso trae SU PROPIO
     dato por mes con Store.readMes, igual que hace ResumenGerencialILD, en vez
     de depender del "regs" recortado que usan la bandeja y "Mis ILD". */
  const [regs,setRegs]=useState([]); const [cargando,setCargando]=useState(true);
  useEffect(()=>{ let vivo=true; setCargando(true);
    (async()=>{ try{ const d=await Store.readMes("ILD",year,mes); if(vivo) setRegs(d); }
      catch(e){ if(vivo) setRegs([]); } finally{ if(vivo) setCargando(false); } })();
    return ()=>{vivo=false;}; },[year,mes]);
  const diaDe = r => ymdEC(r.fecha);
  const delMes = r => { const f=ymdEC(r.fecha); return Number(f.slice(0,4))===year && Number(f.slice(5,7))-1===mes; };
  /* Métricas comunes. Se cuentan DÍAS CUBIERTOS, no registros: dos ILD del mismo
     día son un día, y solo cuentan los días en que al área le tocaba. Así no
     pasa de 100% aunque el desayuno se reporte por dos outlets el mismo día. */
  function metricas(recs,areaDia){
    const ap=recs.filter(r=>r.estado==='Aprobado').length;
    const ob=recs.filter(r=>r.estado==='Con observaciones').length;
    const pe=recs.filter(r=>r.estado==='Pendiente').length;
    const cubiertos=new Set(recs.filter(r=>r.estado!=='Pendiente' && aplicaDia(areaDia,diaDe(r))).map(diaDe)).size;
    const aprob=recs.filter(r=>r.fechaAprobacion);
    const horas=aprob.length?(aprob.reduce((s,r)=>s+(new Date(r.fechaAprobacion)-new Date(r.fecha)),0)/aprob.length/3600000):0;
    return {ap,ob,pe,cubiertos,horas};
  }
  // filas por grupo -> área -> turno
  const filasDe=area=>{ const ac=AC[area]; if(!ac) return [];
    return ac.turno ? ["Apertura","Cierre"] : [ac.t||"Diurno"]; };
  function rowData(area,turno){
    const recs=regs.filter(r=>!esDuplicado(r) && r.area===area && (AC[area]?.turno ? r.turno===turno : true) && delMes(r));
    const {ap,ob,pe,cubiertos,horas}=metricas(recs,area);
    const dias=diasEsperados(area,year,mes,esMesActual);
    const diasMes=diasEsperados(area,year,mes,false);
    const cumpl=dias?Math.min(100,Math.round(cubiertos/dias*100)):0;
    return {area,turno,nombre:area,sub:subTurno(area,turno),mix:"",
      subidos:recs.length,ap,ob,pe,dias,diasMes,cubiertos,cumpl,horas};
  }
  /* Una fila por comida, sumando todos los outlets de servicio visibles */
  function rowComida(comida,areas){
    const recs=regs.filter(r=>!esDuplicado(r) && areas.indexOf(r.area)>=0 && comidaDe(r)===comida && delMes(r));
    const ref=areas[0];
    const {ap,ob,pe,cubiertos,horas}=metricas(recs,ref);
    const dias=diasEsperados(ref,year,mes,esMesActual);
    const diasMes=diasEsperados(ref,year,mes,false);
    const cumpl=dias?Math.min(100,Math.round(cubiertos/dias*100)):0;
    const mix=areas.map(a=>`${cortoILD(a)} ${recs.filter(r=>r.area===a).length}`).join(" · ");
    return {area:ref,turno:comida,nombre:comida,sub:"",mix,esComida:true,
      subidos:recs.length,ap,ob,pe,dias,diasMes,cubiertos,cumpl,horas};
  }
  const gruposVis=(grp==="todas"?grupos:[grp]);
  const tablas=gruposVis.map(g=>{
    const areasG=areasUser.filter(a=>AC[a]?.g===g);
    const comidaG=areasG.filter(agrupaComida);
    const normales=areasG.filter(a=>comidaG.indexOf(a)<0);
    const rows=[]; normales.forEach(a=>filasDe(a).forEach(t=>rows.push(rowData(a,t))));
    if(comidaG.length) COMIDAS.forEach(c=>rows.push(rowComida(c,comidaG)));
    return {g,rows,comidaG};
  }).filter(t=>t.rows.length);
  // resumen global del mes
  const allRows=tablas.flatMap(t=>t.rows);
  const tot=allRows.reduce((s,r)=>s+r.subidos,0), tAp=allRows.reduce((s,r)=>s+r.ap,0),
        tOb=allRows.reduce((s,r)=>s+r.ob,0), tPe=allRows.reduce((s,r)=>s+r.pe,0),
        tDias=allRows.reduce((s,r)=>s+r.dias,0), tCub=allRows.reduce((s,r)=>s+r.cubiertos,0),
        cumGlobal=tDias?Math.min(100,Math.round(tCub/tDias*100)):0;

  /* Detalle por ítem de los ILD en modo lista (Áreas Públicas): cuántos envíos
     hubo en el mes por cada zona. Detectado por modo, no por nombre. */
  const areasLista = areasUser.filter(a=>areaModo(a)==='lista' && (grp==="todas" || AC[a]?.g===grp));
  const detallesLista = areasLista.map(a=>{
    const recs=regs.filter(r=>!esDuplicado(r) && r.area===a && delMes(r));
    const items=(CL[a]||[]).map(it=>{ const tx=itemText(it); const rs=recs.filter(r=>r.zona===tx);
      return {tx,n:rs.length,ap:rs.filter(r=>r.estado==='Aprobado').length,
              ob:rs.filter(r=>r.estado==='Con observaciones').length,
              pe:rs.filter(r=>r.estado==='Pendiente').length}; });
    const sinZona=recs.filter(r=>!r.zona).length;
    return {area:a,items,total:recs.length,sinZona,max:Math.max(1,...items.map(i=>i.n))};
  }).filter(d=>d.items.length);

  function exportar(){
    const rows=allRows.map(r=>({Grupo:AC[r.area]?.g,ILD:r.nombre,Turno:r.sub||r.turno,Desglose:r.mix||"",
      DiasEsperados:r.dias,DiasMes:r.diasMes,DiasCubiertos:r.cubiertos,Subidos:r.subidos,
      Aprobados:r.ap,ConObs:r.ob,Pendientes:r.pe,Cumplimiento:r.cumpl+"%",TiempoPromHoras:r.horas.toFixed(2)}));
    detallesLista.forEach(d=>d.items.forEach(i=>rows.push({Grupo:AC[d.area]?.g,ILD:d.area,Turno:"Zona: "+i.tx,Desglose:"",
      DiasEsperados:"",DiasMes:"",DiasCubiertos:"",Subidos:i.n,Aprobados:i.ap,ConObs:i.ob,Pendientes:i.pe,
      Cumplimiento:"",TiempoPromHoras:""})));
    exportXLSX(rows,"Dashboard",`Dashboard_ILD_${meses[mes]}_${year}`); }

  return <div>
    <div className="row" style={{marginBottom:12}}>
      <select className="inp" style={{flex:1}} value={grp} onChange={e=>setGrp(e.target.value)}>
        <option value="todas">Todos los grupos</option>{grupos.map(g=><option key={g}>{g}</option>)}</select>
      <select className="inp" style={{flex:1}} value={mes} onChange={e=>setMes(Number(e.target.value))}>
        {meses.map((m,i)=><option key={i} value={i}>{m}</option>)}</select>
    </div>
    {cargando && <div className="hint" style={{marginBottom:10}}>Cargando {meses[mes]}…</div>}
    <div className="row" style={{justifyContent:"flex-end",marginBottom:10}}>
      <button className="btn green" style={{padding:"8px 14px"}} onClick={exportar}><Icon name="download" size={15} style={{marginRight:6}}/>Excel</button></div>
    <div className="kpis">
      {[["Total",tot,"--blue"],["Aprobados",tAp,"--green"],["Con obs.",tOb,"--purple"],
        ["Pendientes",tPe,"--amber"],["% Cumplimiento",tDias?cumGlobal+"%":"—",colorCumpl(cumGlobal)]].map(([l,v,c])=>
        <div className="kpi" key={l} style={{borderTop:"3px solid "+cssVar(c)}}>
          <div className="kn" style={{color:cssVar(c)}}>{v}</div><div className="kl">{l}</div></div>)}
    </div>
    <div className="hint" style={{margin:"-4px 0 12px"}}>Cumplimiento = (Aprobados + Con obs.) ÷ días esperados{esMesActual?` hasta hoy (día ${hoy.getDate()})`:" del mes"}. Se cuenta por día: si un mismo día llegan dos reportes, el día cuenta una sola vez.</div>
    {!tablas.length && <div className="empty"><div className="e"><Icon name="inbox" size={44}/></div>Sin ILD en {meses[mes]}</div>}
    {tablas.map(({g,rows,comidaG})=><div className="dgrp" key={g}>
      <div className="ghead"><Icon name="folder" size={15} style={{marginRight:6}}/>{g.toUpperCase()}</div>
      <div className="dscroll"><table className="dtable">
        <thead><tr><th>ILD</th><th>Días</th><th>Subidos</th><th>Aprob.</th><th>Obs.</th><th>Cumplimiento</th><th>Tiempo (h)</th></tr></thead>
        <tbody>{rows.map((r,i)=><tr key={i}>
          <td><div className="dild">{r.nombre}</div>
              {r.sub && <div className="dsub">{r.sub}</div>}
              {r.mix && <div className="dmix">{r.mix}</div>}</td>
          <td><span className="dnum">{r.dias}</span><div className="ddias">/{r.diasMes} mes</div></td>
          <td><span className="dnum">{r.subidos}</span></td>
          <td><span className="dnum g">{r.ap}</span></td>
          <td>{r.ob?<span className="dnum p">{r.ob}</span>:<span style={{color:"#ccc"}}>–</span>}</td>
          <td><span className="dcirc" style={{borderColor:cssVar(colorCumpl(r.cumpl)),color:cssVar(colorCumpl(r.cumpl))}}>{r.cumpl}%</span>
            <div className="ddias">{r.cubiertos}/{r.dias} días</div></td>
          <td>{r.horas?r.horas.toFixed(2):"0.00"}</td></tr>)}</tbody>
      </table></div>
      {comidaG && comidaG.length>0 && <div className="hint" style={{padding:"9px 14px",borderTop:"1px solid #f0ebe1",margin:0}}>
        Desayuno, Almuerzo y Cena se miden por comida: cada una debe reportarse todos los días del mes, sea {comidaG.map(a=>cortoILD(a)).join(", ")}. El desglose bajo cada comida indica cuántos ILD aportó cada uno.</div>}
    </div>)}

    {detallesLista.map(d=><div className="dgrp" key={"lst-"+d.area}>
      <div className="ghead"><Icon name="clipboard" size={15} style={{marginRight:6}}/>{d.area.toUpperCase()} · ENVÍOS POR ÍTEM EN {meses[mes].toUpperCase()}</div>
      <div style={{padding:"10px 14px 14px"}}>
        <div className="hint" style={{marginBottom:10}}>Total del mes: <b>{d.total}</b> envío(s) en {d.items.filter(i=>i.n>0).length} de {d.items.length} ítems.{d.sinZona?` ${d.sinZona} sin ítem registrado.`:""}</div>
        {d.items.map((i,k)=><div key={k} className="apitem">
          <div className="apname">{i.tx}</div>
          <div className="apbar"><span style={{width:(i.n/d.max*100)+"%",background:i.n?"var(--ocean)":"transparent"}}/></div>
          <div className="apnum">{i.n?<b>{i.n}</b>:<span style={{color:"#c9c2b6"}}>0</span>}</div>
          <div className="apmeta">{i.n?<>{i.ap} aprob.{i.ob?` · ${i.ob} obs.`:""}{i.pe?` · ${i.pe} pend.`:""}</>:"sin envíos"}</div>
        </div>)}
      </div>
    </div>)}
  </div>;
}

/* ===== EDITOR DE CHECKLIST (jefaturas / gerencia / desarrollador) ===== */
function ChecklistEditor({user,toast,onSave}){
  const [,force]=useState(0);
  const [teamsDraft,setTeamsDraft]=useState(()=>({...(NOTIF.teamsPorArea||{})}));
  const areas = esGD(user)?Object.keys(AC):(user.areas||[]);
  const norm = it => (typeof it==='object'&&it)?{t:it.t,tipo:it.tipo||'foto'}:{t:it,tipo:'foto'};
  const [area,setArea]=useState(areas[0]||"");
  const [items,setItems]=useState(()=> (CL[area]||[]).map(norm));
  useEffect(()=>{ setItems((CL[area]||[]).map(norm)); },[area]);
  const TIPOS=[["foto","Foto"],["sino","Sí/No"],["sino_foto","Sí/No (foto obligatoria si es Sí)"],["texto","Texto"],["apertura_cierre","Apertura/Cierre"],["comida","Desayuno/Almuerzo/Cena"]];
  const upd=(i,k,v)=>setItems(arr=>arr.map((it,j)=>j===i?{...it,[k]:v}:it));
  const del=i=>setItems(arr=>arr.filter((_,j)=>j!==i));
  const mover=(i,d)=>setItems(arr=>{ const j=i+d; if(j<0||j>=arr.length)return arr; const c=[...arr]; [c[i],c[j]]=[c[j],c[i]]; return c; });
  const add=()=>setItems(arr=>[...arr,{t:"",tipo:"foto"}]);
  async function guardar(){ const prev=(CL[area]||[]).map(norm);
    const clean=items.filter(it=>String(it.t).trim()).map(it=>({t:it.t.trim(),tipo:it.tipo}));
    const pT=prev.map(x=>x.t), nT=clean.map(x=>x.t);
    const agreg=nT.filter(t=>!pT.includes(t)), elim=pT.filter(t=>!nT.includes(t));
    CL[area]=clean; onSave(); toast("Checklist actualizado: "+area);
    if(user.rol!=='desarrollador'){
      let det=[]; if(agreg.length) det.push(`agregó ${agreg.length} ítem(s): ${agreg.slice(0,3).join(", ")}${agreg.length>3?"…":""}`);
      if(elim.length) det.push(`eliminó ${elim.length} ítem(s): ${elim.slice(0,3).join(", ")}${elim.length>3?"…":""}`);
      if(!det.length) det.push("modificó ítems o tipos");
      await addNotif("Desarrollador", `${user.nombre} cambió el checklist de "${area}" (${det.join("; ")}).`, "", area);
    }
  }
  const [modo,setModo]=useState(()=>areaModo(area));
  useEffect(()=>{ setModo(areaModo(area)); },[area]);
  function cambiarModo(v){ setModo(v); AMODO[area]=v; }
  async function renombrarArea(a){ const nv=prompt("Nuevo nombre del ILD:", a); if(nv==null) return;
    const v=nv.trim(); if(!v||v===a) return; if(AC[v]){ toast("Ya existe un ILD con ese nombre"); return; }
    AC[v]=AC[a]; delete AC[a];
    if(APR[a]!==undefined){ APR[v]=APR[a]; delete APR[a]; }
    if(CL[a]!==undefined){ CL[v]=CL[a]; delete CL[a]; }
    if(AMODO[a]!==undefined){ AMODO[v]=AMODO[a]; delete AMODO[a]; }
    USERS.forEach(u=>{ if(u.areas) u.areas=u.areas.map(x=>x===a?v:x); });
    onSave(); if(area===a) setArea(v); force(x=>x+1);
    if(confirm(`ILD renombrado. ¿Actualizar también los registros ya guardados de "${a}" al nuevo nombre? (recomendado, para que cuenten en el dashboard)`)){
      try{ const all=await Store.read("ILD"); let n=0;
        const upd=all.map(r=>{ if(r.area===a){ n++; return {...r,area:v}; } return r; });
        if(n){ await Store.write("ILD",upd); toast(`Renombrado · ${n} registro(s) actualizados`); } else toast("ILD renombrado");
      }catch(e){ toast("Renombrado, pero no pude actualizar registros: "+(e.message||"")); }
    } else toast("ILD renombrado a: "+v); }
  function borrarArea(a){ if(!confirm(`¿Eliminar el ILD "${a}"? Los registros ya guardados NO se borran.`)) return;
    delete AC[a]; delete APR[a]; delete CL[a]; delete AMODO[a];
    USERS.forEach(u=>{ if(u.areas) u.areas=u.areas.filter(x=>x!==a); });
    onSave(); if(area===a){ const rest=Object.keys(AC); setArea(rest[0]||""); } force(x=>x+1); toast("ILD eliminado: "+a); }
  if(!areas.length) return <div className="empty"><div className="e"><Icon name="lock" size={44}/></div>No tienes áreas asignadas para personalizar.</div>;
  const nFotos=items.filter(it=>it.tipo==='foto').length;
  const nFotoSiNo=items.filter(it=>it.tipo==='sino_foto').length;
  const grupos=[...new Set(Object.values(AC).map(v=>v&&v.g).filter(Boolean))].sort();
  const nombres=[...new Set(USERS.map(u=>u.nombre))].sort();
  function setGrupo(a,g){ if(AC[a]){ AC[a].g=g; onSave(); force(x=>x+1); } }
  function setApr(a,v){ APR[a]=v; onSave(); force(x=>x+1); }
  function saveTeams(a){ NOTIF.teamsPorArea={...(NOTIF.teamsPorArea||{}),[a]:(teamsDraft[a]||"").trim()}; onSave(); toast("Canal de Teams guardado"); }
  async function probarCanal(a){ const to=(teamsDraft[a]||"").trim()||NOTIF.teamsILD;
    if(!to){ toast("Pon el correo del canal (o configura el canal ILD por defecto)"); return; }
    NOTIF.teamsPorArea={...(NOTIF.teamsPorArea||{}),[a]:(teamsDraft[a]||"").trim()};
    const res=await sendMail(to,`[Prueba] Canal de ${a}`,mailHTML("Prueba de notificación · "+a,["Correo de prueba del canal de Teams de este ILD.","Si lo ves publicado en el grupo, el canal está bien configurado."],"ILD","PRUEBA"));
    toast(res.ok?("Prueba enviada a: "+to):("No se pudo: "+res.reason)); }
  const lbl={fontSize:11,color:"var(--muted)",marginBottom:2};
  return <div>
    {esDev(user) && <div className="card"><h3>Administrar ILD ({Object.keys(AC).length})</h3>
      <div className="hint" style={{marginBottom:8}}>Aquí asignas todo en un solo lugar: <b>grupo</b>, <b>aprobador</b> y <b>canal de Teams</b> de cada ILD. Los registros históricos no se borran.</div>
      <div style={{maxHeight:"62vh",overflow:"auto",border:"1px solid var(--line)",borderRadius:12}}>
        {Object.keys(AC).map(a=><div key={a} style={{padding:"11px 12px",borderBottom:"1px solid #f0ece3"}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:7,color:"var(--ink)"}}>{a}</div>
          <div className="row" style={{gap:8,flexWrap:"wrap"}}>
            <div style={{flex:"1 1 140px"}}><div style={lbl}>Grupo</div>
              <select className="inp" value={(AC[a]&&AC[a].g)||""} onChange={e=>setGrupo(a,e.target.value)}>{grupos.map(g=><option key={g}>{g}</option>)}</select></div>
            <div style={{flex:"1 1 140px"}}><div style={lbl}>Aprobador</div>
              <select className="inp" value={APR[a]||""} onChange={e=>setApr(a,e.target.value)}><option value="">—</option>{nombres.map(n=><option key={n}>{n}</option>)}</select></div>
          </div>
          <div className="row" style={{gap:8,marginTop:8,alignItems:"flex-end"}}>
            <div style={{flex:1}}><div style={lbl}>Canal de Teams (correo)</div>
              <input className="inp" value={teamsDraft[a]||""} placeholder="(usa el canal ILD por defecto)"
                onChange={e=>setTeamsDraft(d=>({...d,[a]:e.target.value}))} onBlur={()=>saveTeams(a)}/></div>
            <button className="btn ghost" style={{padding:"9px 12px",flex:"0 0 auto"}} onClick={()=>probarCanal(a)}>✉️ Probar</button>
          </div>
          <div className="row" style={{gap:8,marginTop:8}}>
            <button className="btn ghost" style={{flex:1,padding:"7px"}} onClick={()=>renombrarArea(a)}>✏️ Renombrar</button>
            <button className="btn red" style={{flex:1,padding:"7px"}} onClick={()=>borrarArea(a)}>🗑 Eliminar</button>
          </div>
        </div>)}
      </div></div>}
    <div className="card"><Field label="Área a personalizar">
      <select className="inp" value={area} onChange={e=>setArea(e.target.value)}>{areas.map(a=><option key={a}>{a}</option>)}</select></Field>
      <Field label="Modo del ILD" hint="'Lista' = el usuario elige UNA opción de la lista y sube de 3 a 5 fotos (ideal Áreas Públicas). 'Normal' = checklist completo.">
        <select className="inp" value={modo} onChange={e=>cambiarModo(e.target.value)}>
          <option value="normal">Checklist normal</option>
          <option value="lista">Lista (elegir una opción + 3 a 5 fotos)</option></select></Field>
      <div className="hint">{items.length} {modo==='lista'?"opciones de la lista":"ítems"} · {modo==='lista'?"el usuario elige una opción":`Fotos siempre requeridas = ${nFotos}`}{modo!=='lista' && nFotoSiNo>0 && ` · +${nFotoSiNo} foto(s) solo si se responde "Sí" en el/los ítem(s) Sí/No-con-foto`}.</div></div>
    {items.map((it,i)=><div key={i} className="card" style={{padding:12}}>
      <div className="row" style={{gap:8,alignItems:"flex-start"}}>
        <div style={{flex:"0 0 20px",color:"var(--muted)",fontWeight:700,paddingTop:11}}>{i+1}</div>
        <div style={{flex:1}}>
          <input className="inp" value={it.t} onChange={e=>upd(i,"t",e.target.value)} placeholder="Texto del ítem"/>
          <select className="inp" style={{marginTop:8}} value={it.tipo} onChange={e=>upd(i,"tipo",e.target.value)}>{TIPOS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
          <div className="row" style={{marginTop:8,gap:6}}>
            <button className="btn ghost" style={{padding:"6px 11px"}} onClick={()=>mover(i,-1)}><Icon name="chevronUp" size={16}/></button>
            <button className="btn ghost" style={{padding:"6px 11px"}} onClick={()=>mover(i,1)}><Icon name="chevronDown" size={16}/></button>
            <button className="btn red" style={{padding:"6px 11px"}} onClick={()=>del(i)}><Icon name="trash" size={16} style={{marginRight:6}}/>Quitar</button>
          </div>
        </div></div></div>)}
    <button className="btn ghost block" onClick={add}><Icon name="plus" size={15} style={{marginRight:6}}/>Agregar ítem</button>
    <button className="btn primary block" style={{marginTop:10}} onClick={guardar}><Icon name="save" size={15} style={{marginRight:6}}/>Guardar checklist</button>
  </div>;
}

/* Config › ILD › Comidas: decide qué ILD se consolidan en Desayuno/Almuerzo/Cena
   y cuáles se miden uno por uno. Solo aparecen los que tienen la pregunta. */
function ComidasEditor({user,toast,onSave}){
  const [,force]=useState(0); const re=()=>force(x=>x+1);
  const areas=(esGD(user)?Object.keys(AC):(user.areas||[])).filter(tieneComida);
  const set=(a,v)=>{ AGRUPA_COMIDA[a]=v; re(); };
  const reset=a=>{ delete AGRUPA_COMIDA[a]; re(); };
  const agrupados=areas.filter(agrupaComida);
  return <div>
    <div className="card">
      <h3>Medición de los ILD con Desayuno / Almuerzo / Cena</h3>
      <div className="hint">Los ILD <b>agrupados</b> desaparecen como fila propia y se suman en tres filas — Desayuno, Almuerzo y Cena — donde cada comida debe reportarse todos los días del mes, sin importar por cuál de ellos haya salido. Los ILD <b>individuales</b> se miden uno por uno, como cualquier otro.</div>
      {!areas.length && <div className="hint" style={{marginTop:8}}>Ningún ILD tiene la pregunta de Desayuno/Almuerzo/Cena.</div>}
      {agrupados.length>0 && <div className="hint" style={{marginTop:8}}>Se consolidan <b>{agrupados.length}</b> ILD en las filas de comida.</div>}
      {agrupados.length===1 && <div className="note obs" style={{marginTop:8}}>Solo hay un ILD agrupado. Agrupar sirve cuando la misma comida puede salir por dos o más ILD; con uno solo, el resultado es igual a medirlo individual.</div>}
    </div>
    {areas.map(a=>{ const on=agrupaComida(a); const manual=AGRUPA_COMIDA[a]!=null;
      return <div key={a} className="card" style={{padding:12,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
        <div style={{minWidth:0}}>
          <div style={{fontWeight:700,fontSize:13.5}}>{a}</div>
          <div className="meta">{AC[a]?.g||"—"}{manual?" · definido a mano":" · por defecto"}{manual&&<> · <span style={{cursor:"pointer",color:"var(--ocean-d)"}} onClick={()=>reset(a)}>volver a automático</span></>}</div>
        </div>
        <button className={"btn "+(on?"green":"ghost")} style={{flex:"0 0 auto"}} onClick={()=>set(a,!on)}>{on?"Agrupado ✓":"Individual"}</button>
      </div>; })}
    {areas.length>0 && <button className="btn primary block" onClick={()=>{onSave();toast("Configuración de comidas guardada");}}>
      <Icon name="save" size={15} style={{marginRight:6}}/>Guardar</button>}
  </div>;
}
function AccesosEditor({toast,onSave}){
  const roles=[["gerencia","Gerencia General"],["aprobador","Jefaturas / Aprobadores"],["colaborador","Colaboradores"]];
  const caps=[["compras","Ver módulo Compras"],["sistemas","Ver módulo Sistemas"],["mantenimiento","Ver módulo Mantenimiento"],
    ["kanban","Ver Tablero Kanban"],["kanban.editar","Editar (mover) en Kanban"],
    ["compras.tablero","Compras · Tablero"],["sistemas.tablero","Sistemas · Tablero"],["mantenimiento.tablero","Mantenimiento · Tablero"]];
  const [rol,setRol]=useState("gerencia"); const [,force]=useState(0);
  const fake={rol,areas:[],gestiona:[]};
  const valor=cap=>(ACCESOS&&ACCESOS[rol]&&(cap in ACCESOS[rol]))?!!ACCESOS[rol][cap]:defaultPuede(fake,cap);
  const overridden=cap=>!!(ACCESOS&&ACCESOS[rol]&&(cap in ACCESOS[rol]));
  function set(cap,v){ ACCESOS=ACCESOS||{}; ACCESOS[rol]=ACCESOS[rol]||{}; ACCESOS[rol][cap]=v; force(x=>x+1); }
  function reset(cap){ if(ACCESOS&&ACCESOS[rol]) delete ACCESOS[rol][cap]; force(x=>x+1); }
  async function guardar(){ onSave(); toast("Accesos guardados"); }
  return <div>
    <div className="card"><Field label="Rol a configurar"><select className="inp" value={rol} onChange={e=>setRol(e.target.value)}>{roles.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></Field>
      <div className="hint">Activa o desactiva qué pantallas y tableros ve cada rol, sin actualizar la app. El Desarrollador siempre tiene acceso total. La "Gestión" de cada módulo se mantiene para el jefe responsable de ese módulo.</div></div>
    {caps.map(([cap,l])=><div key={cap} className="card" style={{padding:12,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
      <div><div style={{fontWeight:700}}>{l}</div>{overridden(cap)&&<div className="meta">Personalizado · <span style={{cursor:"pointer",color:"var(--ocean-d)"}} onClick={()=>reset(cap)}>volver a predeterminado</span></div>}</div>
      <button className={"btn "+(valor(cap)?"green":"ghost")} style={{flex:"0 0 auto"}} onClick={()=>set(cap,!valor(cap))}>{valor(cap)?"Sí ✓":"No"}</button></div>)}
    <button className="btn primary block" onClick={guardar}><Icon name="save" size={15} style={{marginRight:6}}/>Guardar accesos</button>
  </div>;
}
function CalendarioAplicabilidad({user,toast,onSave}){
  const [,force]=useState(0); const re=()=>force(x=>x+1);
  const hoy=hoyDateEC();
  const [year,setYear]=useState(hoy.getFullYear());
  const [mes,setMes]=useState(hoy.getMonth());
  const areas=esGD(user)?Object.keys(AC):(user.areas||[]);
  const nd=new Date(year,mes+1,0).getDate();
  const ds=[]; for(let d=1;d<=nd;d++) ds.push(d);
  const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DN=["D","L","M","X","J","V","S"];
  const [ocF,setOcF]=useState(""); const [ocV,setOcV]=useState("");

  function mover(n){ let m=mes+n, y=year; if(m<0){m=11;y--;} if(m>11){m=0;y++;} setMes(m); setYear(y); }

  /* Un toque alterna entre lo que dice el patrón y lo contrario.
     Si ya había una decisión manual, el toque la quita y vuelve al patrón. */
  function toggleCelda(area,iso){
    const ex={...(DIAS_CFG.excepciones||{})}; const cur={...(ex[iso]||{})};
    const areasEx={...(cur.areas||{})};
    if(areasEx[area]!=null) delete areasEx[area];
    else areasEx[area]= aplicaDia(area,iso) ? 0 : 1;
    if(Object.keys(areasEx).length) cur.areas=areasEx; else delete cur.areas;
    if(Object.keys(cur).length) ex[iso]=cur; else delete ex[iso];
    DIAS_CFG.excepciones=ex; re();
  }
  /* Toca el número del día: marca o desmarca el día entero como no operativo. */
  function toggleDiaEntero(iso){
    const ex={...(DIAS_CFG.excepciones||{})}; const cur={...(ex[iso]||{})};
    if(cur.todas===0) delete cur.todas; else cur.todas=0;
    if(Object.keys(cur).length) ex[iso]=cur; else delete ex[iso];
    DIAS_CFG.excepciones=ex; re();
  }
  function guardarOcup(){
    if(!ocF){ toast("Elige la fecha"); return; }
    const o={...(DIAS_CFG.ocupacion||{})};
    if(String(ocV).trim()==="") delete o[ocF]; else o[ocF]=Number(ocV);
    DIAS_CFG.ocupacion=o; setOcV(""); re();
    toast(String(ocV).trim()===""?"Ocupación borrada":"Ocupación registrada");
  }
  const rg=DIAS_CFG.reglaOcup||{activa:false,umbral:40,areas:[]};
  function setRegla(patch){ DIAS_CFG.reglaOcup={...rg,...patch}; re(); }
  function toggleAreaRegla(a){
    const l=rg.areas||[];
    setRegla({areas: l.indexOf(a)>=0 ? l.filter(x=>x!==a) : [...l,a]});
  }

  const celda=(ap,ex)=>({ width:26,minWidth:26,height:28,textAlign:"center",cursor:"pointer",
    borderRight:"1px solid #eee",borderBottom:"1px solid #eee",fontSize:10,fontWeight:700,
    background: ap ? (ex?"#BFE3D2":"#E8F5EE") : (ex?"#F6C9C9":"#F2F2F2"),
    color: ap ? "#0d6e5a" : "#8a8a8a" });

  return <div>
    <div className="card">
      <div className="row" style={{alignItems:"center",gap:8}}>
        <button className="btn ghost" onClick={()=>mover(-1)}>‹</button>
        <div style={{flex:1,textAlign:"center",fontWeight:800}}>{MESES[mes]} {year}</div>
        <button className="btn ghost" onClick={()=>mover(1)}>›</button>
      </div>
      <div className="hint" style={{marginTop:8}}>Toca una casilla para cambiar si ese día le toca a esa área.
        Toca el número del día para marcar la jornada completa como no operativa.</div>
      <div className="row" style={{marginTop:10,gap:12,flexWrap:"wrap",fontSize:11.5}}>
        <span><b style={{color:"#0d6e5a"}}>■</b> aplica</span>
        <span><b style={{color:"#c0c0c0"}}>■</b> no aplica</span>
        <span><b style={{color:"#7fc9ab"}}>■</b> decidido a mano</span>
      </div>
    </div>

    <div className="card" style={{padding:8}}>
      <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
        <table style={{borderCollapse:"separate",borderSpacing:0}}>
          <thead><tr>
            <th style={{position:"sticky",left:0,background:"#fff",zIndex:2,textAlign:"left",padding:"6px 8px",
              minWidth:128,fontSize:11,borderBottom:"1px solid #ddd",borderRight:"1px solid #ddd"}}>Área</th>
            {ds.map(d=>{ const iso=isoYMD(year,mes,d); const wd=new Date(iso+"T00:00:00").getDay();
              const cerrado=((DIAS_CFG.excepciones||{})[iso]||{}).todas===0;
              const oc=(DIAS_CFG.ocupacion||{})[iso];
              return <th key={d} onClick={()=>toggleDiaEntero(iso)} title={oc!=null?("Ocupación "+oc+"%"):""}
                style={{minWidth:26,padding:"3px 0",fontSize:9.5,cursor:"pointer",borderBottom:"1px solid #ddd",
                  background:cerrado?"#F6C9C9":(wd===0||wd===6?"#FAF7F0":"#fff"),color:cerrado?"#8f2020":"#555"}}>
                {DN[wd]}<br/>{d}{oc!=null?<><br/><span style={{fontSize:8,color:"#0d6e75"}}>{oc}</span></>:null}</th>; })}
          </tr></thead>
          <tbody>
            {areas.map(a=><tr key={a}>
              <th style={{position:"sticky",left:0,background:"#fff",zIndex:1,textAlign:"left",padding:"4px 8px",
                fontSize:10.5,fontWeight:600,borderRight:"1px solid #ddd",borderBottom:"1px solid #eee",maxWidth:128,
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a}</th>
              {ds.map(d=>{ const iso=isoYMD(year,mes,d); const ap=aplicaDia(a,iso); const ex=esExcepcion(a,iso);
                return <td key={d} onClick={()=>toggleCelda(a,iso)} style={celda(ap,ex)}>{ap?"·":""}</td>; })}
            </tr>)}
          </tbody>
        </table>
      </div>
      {!areas.length && <div className="hint">No tienes áreas asignadas.</div>}
    </div>

    <div className="card">
      <h3 style={{margin:"0 0 8px"}}>Ocupación del día</h3>
      <div className="hint">Sirve para la regla de abajo. Si no registras ocupación de un día, la regla no se aplica y manda el patrón.</div>
      <div className="row" style={{marginTop:10,gap:8,alignItems:"flex-end"}}>
        <div style={{flex:1,minWidth:140}}><Field label="Fecha"><input type="date" className="inp" value={ocF} onChange={e=>setOcF(e.target.value)}/></Field></div>
        <div style={{width:96}}><Field label="%"><input type="number" min="0" max="100" className="inp" value={ocV} onChange={e=>setOcV(e.target.value)} placeholder="0"/></Field></div>
        <button className="btn primary" onClick={guardarOcup}>Guardar</button>
      </div>
      <div className="hint" style={{marginTop:6}}>Deja el % vacío y guarda para borrar la ocupación de esa fecha.</div>
    </div>

    <div className="card">
      <h3 style={{margin:"0 0 8px"}}>Regla por ocupación</h3>
      <div className="row" style={{gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <button className={"btn "+(rg.activa?"green":"ghost")} onClick={()=>setRegla({activa:!rg.activa})}>{rg.activa?"Activa ✓":"Desactivada"}</button>
        <span style={{fontSize:13}}>Si la ocupación es menor a</span>
        <input type="number" min="0" max="100" className="inp" style={{width:78}} value={rg.umbral} onChange={e=>setRegla({umbral:Number(e.target.value)})}/>
        <span style={{fontSize:13}}>% no aplican:</span>
      </div>
      <div className="row" style={{marginTop:10,gap:6,flexWrap:"wrap"}}>
        {areas.map(a=><button key={a} className={"opt"+((rg.areas||[]).indexOf(a)>=0?" on":"")}
          style={{fontSize:11.5,padding:"6px 10px"}} onClick={()=>toggleAreaRegla(a)}>{a}</button>)}
      </div>
      <div className="hint" style={{marginTop:8}}>Una excepción marcada a mano en el calendario siempre gana sobre esta regla.</div>
    </div>

    <button className="btn primary block" onClick={()=>{onSave();toast("Calendario guardado");}}>
      <Icon name="save" size={15} style={{marginRight:6}}/>Guardar calendario</button>
  </div>;
}

function DiasEsperadosEditor({user,toast,onSave}){
  const [,force]=useState(0); const re=()=>force(x=>x+1);
  const areas=esGD(user)?Object.keys(AC):(user.areas||[]);
  const [fer,setFer]=useState(""); const hoy=hoyDateEC();

function ResumenGerencialILD(){
  const now=hoyDateEC();
  const [anio,setAnio]=useState(now.getFullYear()); const [mes,setMes]=useState(now.getMonth());
  const [regs,setRegs]=useState([]); const [cargando,setCargando]=useState(true);
  const anios=[now.getFullYear()-2,now.getFullYear()-1,now.getFullYear()];
  const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  useEffect(()=>{ let v=true; (async()=>{ setCargando(true);
    try{ const d=mes==null?await Store.readAnio("ILD",anio):await Store.readMes("ILD",anio,mes); if(v)setRegs(d); }
    catch(e){ if(v)setRegs([]); } finally{ if(v)setCargando(false); } })(); return ()=>{v=false;}; },[anio,mes]);
  const grupoDe=r=>AC[r.area]&&AC[r.area].g;
  /* Los duplicados no cuentan para métricas en ninguna otra pantalla de la app
     (bandeja, Dashboard) — antes acá sí se contaban, y eso era parte de por qué
     los totales de esta pantalla no cuadraban con el Dashboard. */
  const regsValidos = sinDuplicados(regs);
  /* El Dashboard arma sus filas recorriendo las áreas de la configuración
     actual (AC): un ILD cuya "área" ya no existe ahí (se renombró o se borró
     del Checklist) simplemente no aparece en ninguna fila suya, ni en su
     numerador ni en su denominador. Acá pasaba lo contrario: cualquier área
     desconocida caía en un grupo "(otros)" que SÍ sumaba al numerador
     (Aprobados+Obs) pero no tenía días esperados propios (no existe en AC),
     así que inflaba el % de cumplimiento en vez de bajarlo. Para que ambas
     pantallas cuadren de verdad, este resumen tiene que excluir esos registros
     exactamente igual que el Dashboard — y avisarlo, en vez de perderlos en
     silencio dentro de "(otros)". */
  const regsSinArea = regsValidos.filter(r=>!grupoDe(r));
  const regsConfigurados = regsValidos.filter(r=>grupoDe(r));
  const byG={};
  regsConfigurados.forEach(r=>{ const g0=grupoDe(r); const g=(byG[g0]=byG[g0]||{label:g0,total:0,aprob:0,obs:0,pend:0});
    g.total++; if(r.estado==="Aprobado")g.aprob++; else if(r.estado==="Con observaciones")g.obs++; else g.pend++; });
  /* Días esperados por grupo: se suman TODAS las áreas de ese grupo (según la
     configuración de checklist), no solo las que llegaron a tener un ILD este
     período — así un área que no reportó nada sí resta en el cumplimiento, en
     vez de simplemente no aparecer. Es la misma idea que usa el Dashboard,
     llevada a nivel de grupo en vez de área/turno. */
  const areasPorGrupo={};
  Object.keys(AC).forEach(a=>{ const g=AC[a]&&AC[a].g; if(g) (areasPorGrupo[g]=areasPorGrupo[g]||[]).push(a); });
  const grupos=Object.values(byG).map(g=>{
    const dias=(areasPorGrupo[g.label]||[]).reduce((s,a)=>s+diasEsperadosPeriodo(a,anio,mes),0);
    return {...g, dias,
      revisados:g.aprob+g.obs, cumpl:dias?Math.min(100,Math.round((g.aprob+g.obs)/dias*100)):0,
      calidad:g.total?Math.round(g.aprob/g.total*100):0, pObs:g.total?Math.round(g.obs/g.total*100):0 };
  });
  const tot=regsConfigurados.length, tAprob=grupos.reduce((s,g)=>s+g.aprob,0), tObs=grupos.reduce((s,g)=>s+g.obs,0), tPend=grupos.reduce((s,g)=>s+g.pend,0);
  const tDias=grupos.reduce((s,g)=>s+g.dias,0);
  const cumplGlobal=tDias?Math.min(100,Math.round((tAprob+tObs)/tDias*100)):0;
  const calidadGlobal=tot?Math.round(tAprob/tot*100):0;
  const pObsGlobal=tot?Math.round(tObs/tot*100):0;
  const diasActivos=new Set(regsConfigurados.map(r=>ymdEC(r.fecha))).size;
  const areasSinConfig=[...new Set(regsSinArea.map(r=>r.area||"(sin área)"))];
  const cumplBar=[...grupos].sort((a,b)=>b.cumpl-a.cumpl||b.total-a.total).map(g=>({label:g.label,value:g.cumpl}));
  const obsBar=[...grupos].filter(g=>g.obs>0).sort((a,b)=>b.obs-a.obs).slice(0,10).map(g=>({label:g.label,value:g.obs}));
  const pendBar=[...grupos].filter(g=>g.pend>0).sort((a,b)=>b.pend-a.pend).slice(0,10).map(g=>({label:g.label,value:g.pend}));
  const tabla=[...grupos].sort((a,b)=>a.cumpl-b.cumpl||b.total-a.total); // peor primero (los que requieren atención arriba)
  const mejor=[...grupos].filter(g=>g.total>=3).sort((a,b)=>b.cumpl-a.cumpl)[0];
  const peor=[...grupos].filter(g=>g.total>=3).sort((a,b)=>a.cumpl-b.cumpl)[0];
  const masObs=[...grupos].sort((a,b)=>b.obs-a.obs)[0];
  const sem=c=>c>=90?"🟢":c>=70?"🟡":"🔴";
  const colCumpl=cumplGlobal>=90?cssVar("--green"):cumplGlobal>=70?cssVar("--amber"):cssVar("--coral");
  const per=mes==null?`año ${anio}`:`${MESES[mes]} ${anio}`;
  return <div>
    <h2 style={{margin:"4px 0 2px"}}>Resumen Gerencial de ILD</h2>
    <p className="sub">Resultado de la gestión de inspecciones · {per}.</p>
    <div className="seg" style={{flexWrap:"wrap"}}>{anios.map(a=><button key={a} className={anio===a?"on":""} onClick={()=>setAnio(a)}>{a}</button>)}</div>
    <div className="seg" style={{flexWrap:"wrap"}}><button className={mes==null?"on":""} onClick={()=>setMes(null)}>Año</button>
      {MESES.map((m,i)=><button key={m} className={mes===i?"on":""} onClick={()=>setMes(i)}>{m}</button>)}</div>
    {cargando ? <div className="hint" style={{padding:"20px 0"}}>Cargando…</div> : (tot===0 && !regsSinArea.length) ? <div className="empty"><div className="e">📊</div>Sin ILD registrados en {per}.</div> : <>
      <div className="kpis">
        <KpiBox label="ILD registrados" value={tot} color={cssVar("--ocean")}/>
        <KpiBox label="% Cumplimiento" value={cumplGlobal+"%"} color={colCumpl}/>
        <KpiBox label="Aprobados sin observación" value={calidadGlobal+"%"} color={cssVar("--green")}/>
        <KpiBox label="% Con observaciones" value={pObsGlobal+"%"} color={cssVar("--amber")}/>
        <KpiBox label="Pendientes por revisar" value={tPend} color={tPend?cssVar("--coral"):cssVar("--green")}/>
        <KpiBox label="Días con inspección" value={diasActivos} color={cssVar("--ocean")}/>
      </div>
      <div className="hint" style={{margin:"-4px 0 12px"}}>% Cumplimiento = (Aprobados + Con obs.) ÷ días esperados del período, igual que en el Dashboard — así ambas pantallas coinciden. No cuenta los ILD marcados como duplicados.</div>
      {regsSinArea.length>0 && <div className="card" style={{marginBottom:14,background:"#FDF0F0",borderLeft:"4px solid var(--coral)"}}>
        <b style={{color:"#8f2020"}}>⚠️ {regsSinArea.length} ILD con un área que ya no existe en la configuración actual</b>
        <div style={{fontSize:13,marginTop:4}}>No se cuentan en este resumen (igual que ya no cuentan en el Dashboard), para que ambos números
          cuadren. Área(s) involucrada(s): <b>{areasSinConfig.join(", ")}</b>. Probablemente el nombre del área cambió en
          "Configurar → Checklist" después de que estos ILD se subieran — conviene revisarlo con Desarrollador/Configuración.</div>
      </div>}
      <div className="card" style={{background:"#f4f9f9",borderLeft:"4px solid var(--ocean)"}}>
        <h3 style={{marginTop:0}}>🧭 Lectura gerencial</h3>
        <div style={{fontSize:13.5,lineHeight:1.6}}>
          Se registraron <b>{tot}</b> ILD en {per}, con un cumplimiento global del <b>{cumplGlobal}%</b> ({sem(cumplGlobal)}). De cada 100 inspecciones, <b>{calidadGlobal}</b> se aprobaron sin observaciones y <b>{pObsGlobal}</b> presentaron observaciones.
          {mejor && <> El grupo más consistente es <b>{mejor.label}</b> ({mejor.cumpl}%).</>}
          {peor && peor.label!==(mejor&&mejor.label) && <> El que requiere más atención es <b>{peor.label}</b> ({peor.cumpl}%).</>}
          {masObs && masObs.obs>0 && <> Las observaciones se concentran en <b>{masObs.label}</b> ({masObs.obs}).</>}
          {tPend>0 ? <> Hay <b>{tPend}</b> ILD <b>pendientes de revisión por los jefes</b>.</> : <> No hay ILD pendientes de revisión. ✅</>}
        </div>
      </div>
      <div className="card"><h3>Cumplimiento por grupo (%)</h3><BarsH data={cumplBar} color="var(--green)"/></div>
      <div className="card"><h3>Observaciones por grupo</h3><BarsH data={obsBar} color="var(--amber)"/></div>
      {pendBar.length>0 && <div className="card"><h3>Pendientes de revisión por grupo</h3><BarsH data={pendBar} color="var(--coral)"/></div>}
      <div className="card"><h3>Semáforo por grupo</h3>
        <div className="hint" style={{marginBottom:8}}>Ordenado del que más atención requiere al que mejor cumple. 🟢 ≥90% · 🟡 70–89% · 🔴 &lt;70%.</div>
        <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{borderBottom:"2px solid var(--ocean)"}}>
            {["","Grupo","ILD","Aprob.","Obs.","Pend.","Cumpl."].map(h=><th key={h} style={{textAlign:h==="Grupo"?"left":"center",padding:"6px 4px"}}>{h}</th>)}</tr></thead>
          <tbody>{tabla.map(g=><tr key={g.label} style={{borderBottom:"1px solid #f0ece3"}}>
            <td style={{textAlign:"center"}}>{sem(g.cumpl)}</td>
            <td style={{padding:"6px 4px"}}>{g.label}</td>
            <td style={{textAlign:"center"}}>{g.total}</td><td style={{textAlign:"center",fontWeight:700}}>{g.aprob}</td>
            <td style={{textAlign:"center",color:"#b8860b"}}>{g.obs}</td><td style={{textAlign:"center",color:"var(--coral)"}}>{g.pend}</td>
            <td style={{textAlign:"center",fontWeight:800}}>{g.cumpl}%</td></tr>)}</tbody>
        </table></div></div>
    </>}
  </div>;
}
/* ===== TABLEROS EN TIEMPO REAL (Compras / Sistemas / Mantenimiento) ===== */
function dFiltro(rows,campo,anio,mes){
  return rows.filter(r=>{ const f=r[campo]?ymdEC(r[campo]):""; if(!f) return false;
    if(anio && Number(f.slice(0,4))!==anio) return false;
    if(mes!=null && Number(f.slice(5,7))-1!==mes) return false; return true; });
}
function dCuenta(rows,campo){ const m={}; rows.forEach(r=>{ const k=(r[campo]||"—"); m[k]=(m[k]||0)+1; });
  return Object.entries(m).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value); }
function dPromDias(rows,ini,fin){ const ds=rows.map(r=>{ if(!r[ini]||!r[fin])return null; const a=new Date(r[ini]),b=new Date(r[fin]);
    if(isNaN(a)||isNaN(b))return null; return (b-a)/86400000; }).filter(x=>x!=null);
  return ds.length?(ds.reduce((s,x)=>s+x,0)/ds.length).toFixed(1):"—"; }
function fmtDur(min){ if(min==null||isNaN(min)) return "—"; let m=Math.round(min);
  const d=Math.floor(m/1440); m-=d*1440; const h=Math.floor(m/60); m-=h*60;
  const p=[]; if(d) p.push(d+"d"); if(h) p.push(h+"h"); p.push(m+"min"); return p.join(" "); }
function dPromMin(rows,ini,fin){ const ds=rows.map(r=>{ if(!r[ini]||!r[fin])return null; const a=new Date(r[ini]),b=new Date(r[fin]);
    if(isNaN(a)||isNaN(b))return null; return (b-a)/60000; }).filter(x=>x!=null);
  return ds.length?fmtDur(ds.reduce((s,x)=>s+x,0)/ds.length):"—"; }
function dPromCal(rows){ const cs=rows.map(r=>Number(r.EncuestaCal)).filter(x=>x>0);
  return cs.length?(cs.reduce((s,x)=>s+x,0)/cs.length).toFixed(2):"—"; }
function KpiBox({label,value,color}){ return <div className="kpi" style={{borderTop:"3px solid "+(color||"var(--ocean)")}}>
  <div className="kn" style={{color:color||"var(--ocean)"}}>{value}</div><div className="kl">{label}</div></div>; }
function BarsH({data,color}){ const max=Math.max(1,...data.map(d=>d.value));
  if(!data.length) return <div className="hint">Sin datos en el período</div>;
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>{data.map(d=>

      <div style={{flex:1,background:"#eef1f3",borderRadius:6,height:18}}><div style={{width:(d.value/max*100)+"%",background:color||"var(--ocean)",height:"100%",borderRadius:6,minWidth:d.value?4:0}}></div></div>

}
function Tablero({tipo}){
  const isCom=tipo==="Compras"; const isSis=tipo==="Sistemas";
  const now=hoyDateEC();
  const [anio,setAnio]=useState(now.getFullYear()); const [mes,setMes]=useState(null);
  const [f,setF]=useState([]); const [cargando,setCargando]=useState(true);
  const anios=[now.getFullYear()-2,now.getFullYear()-1,now.getFullYear()];
  const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  useEffect(()=>{ let vivo=true; (async()=>{ setCargando(true);
    try{ const data=mes==null?await Store.readAnio(tipo,anio):await Store.readMes(tipo,anio,mes); if(vivo) setF(data); }
    catch(e){ if(vivo) setF([]); } finally{ if(vivo) setCargando(false); } })(); return ()=>{vivo=false;}; },[anio,mes]);
  let kpis=[], extra=null;
  if(isCom){
    const aprob=f.filter(r=>["En compra","Listo para entregar","Entregado","Cerrada"].includes(r.Estado)).length;
    const rech=f.filter(r=>r.Estado==="Rechazada").length;
    const pend=f.filter(r=>["Solicitado","En Gerencia"].includes(r.Estado)).length;
    const entr=f.filter(r=>["Entregado","Cerrada"].includes(r.Estado)).length;
    kpis=[["Recibidas",f.length,"--ocean"],["Aprobadas",aprob,"--green"],["Rechazadas",rech,"--coral"],["Pendientes",pend,"--amber"],
      ["Entregadas",entr,"--blue"],["T. prom. aprobación",dPromMin(f,"FechaSolicitud","FechaAprob"),"--purple"],
      ["Calificación",dPromCal(f),"--green"],["Encuestas",f.filter(r=>r.EncuestaCal).length,"--blue"]];
    extra=<div className="card"><h3>Solicitudes por departamento</h3><BarsH data={dCuenta(f,"Area")} color="var(--ocean)"/></div>;
  } else {
    /* Tareas programadas y tickets se miden aparte: son trabajos distintos y
       promediarlos escondía el desempeño de los dos. */
    const prog=f.filter(r=>r.Programada==="Si");
    const tick=f.filter(r=>r.Programada!=="Si");
    const bloque=(a)=>{
      const c=a.filter(r=>["Concluido","Cerrado"].includes(r.Estado)).length;
      const val=a.filter(r=>r.Estado!=="Rechazado");
      const ejs=a.map(ejecucionHrs).filter(x=>x!=null);
      return { total:a.length, concl:c, cumpl:val.length?Math.round(c/val.length*100):0,
        ejec:ejs.length?fmtHrs(ejs.reduce((x,y)=>x+y,0)/ejs.length):"—", medibles:ejs.length };
    };
    const bT=bloque(tick), bP=bloque(prog);
    kpis=[["Recibidas",f.length,"--ocean"],["Concluidas",bT.concl+bP.concl,"--green"],
      ["Calificación",dPromCal(f),"--green"],["Encuestas",f.filter(r=>r.EncuestaCal).length,"--blue"]];
    const prioCampo=isSis?"Urgencia":"TipoSolicitud";
    const Panel=({t,b,col})=><div className="card">
      <h3>{t}</h3>
      <div style={{display:"flex",flexWrap:"wrap",gap:14,marginTop:6}}>
        {[["Total",b.total],["Concluidas",b.concl],["Cumplimiento",b.cumpl+"%"],["Ejecución prom.",b.ejec]].map(([l,v])=>
          <div key={l} style={{flex:"1 1 92px",minWidth:92}}>
            <div style={{fontSize:10.5,letterSpacing:".04em",textTransform:"uppercase",color:"var(--muted)",fontWeight:700}}>{l}</div>
            <div style={{fontSize:18,fontWeight:800,color:col}}>{v}</div></div>)}
      </div>
      {b.total>0 && b.medibles<b.concl && <div className="hint" style={{marginTop:8}}>
        {b.concl-b.medibles} concluida(s) sin fecha de asignación registrada: no entran en el promedio de ejecución.</div>}
    </div>;
    extra=<>
      {!isSis && <Panel t="Tareas programadas" b={bP} col={cssVar("--purple")}/>}
      {!isSis && <Panel t="Tickets (correctivos)" b={bT} col={cssVar("--ocean")}/>}
      <div className="card"><h3>Solicitudes por departamento</h3><BarsH data={dCuenta(tick,"Departamento")} color="var(--ocean)"/></div>
      <div className="card"><h3>Por prioridad</h3><BarsH data={dCuenta(tick,prioCampo)} color="var(--blue)"/></div>
      {!isSis && <div className="card"><h3>Cumplimiento de cierre</h3><BarsH data={dCuenta(f.filter(r=>r.CierreCumplimiento),"CierreCumplimiento")} color="var(--green)"/></div>}
    </>;
  }
  return <div>
    <div className="seg" style={{flexWrap:"wrap"}}>{anios.map(a=><button key={a} className={anio===a?"on":""} onClick={()=>setAnio(a)}>{a}</button>)}</div>
    <div className="seg" style={{flexWrap:"wrap"}}>
      <button className={mes==null?"on":""} onClick={()=>setMes(null)}>Año</button>
      {MESES.map((m,i)=><button key={m} className={mes===i?"on":""} onClick={()=>setMes(i)}>{m}</button>)}</div>
    {cargando ? <div className="hint" style={{padding:"20px 0"}}>Cargando datos del período…</div>
      : <><div className="kpis">{kpis.map(([l,v,c])=><KpiBox key={l} label={l} value={v} color={cssVar(c)}/>)}</div>{extra}</>}
  </div>;
}

function CotizField({cotiz,setCotiz}){
  const ref=useRef();
  async function onFile(e){ const file=e.target.files&&e.target.files[0]; e.target.value="";
    if(!file) return;
    const dataUrl=await new Promise(r=>{const rd=new FileReader();rd.onload=ev=>r(ev.target.result);rd.readAsDataURL(file);});
    if(file.type==="application/pdf"){ setCotiz(dataUrl); }
    else if((file.type||"").startsWith("image/")){ setCotiz(await comprimirImg(dataUrl,1000,.7)); }
    else { alert("La cotización debe ser un PDF o una imagen."); }
  }
  const esPdf=/^data:application\/pdf/i.test(cotiz||"");
  return <Field label="Cotización (PDF o imagen) — opcional" hint="Adjunta la proforma del proveedor. Acepta PDF o foto.">
    <input ref={ref} type="file" accept="application/pdf,image/*" style={{display:"none"}} onChange={onFile}/>
    <button className="btn ghost block" onClick={()=>ref.current.click()}>📎 {cotiz?"Cambiar cotización":"Adjuntar cotización"}</button>
    {cotiz && <div className="row" style={{marginTop:8,gap:8,alignItems:"center"}}>
      {esPdf ? <span className="kchip">📄 PDF adjunto</span> : <div className="fthumb" style={{width:64,height:64}}><img src={cotiz}/></div>}
      <button className="btn red" style={{padding:"6px 10px"}} onClick={()=>setCotiz(null)}>Quitar</button></div>}
  </Field>;
}

    ${item.Aprobador?`<div class="firma"><b>Aprobó / entregó:</b> ${esc(item.Aprobador)}<br><span class="meta">${f(item.FechaAprob)}</span></div>`:''}
    <div class="firma"><b>Solicitado por:</b> ${esc(item.Solicitante)}<br><span class="meta">${f(item.FechaSolicitud)}</span></div>
  </div>
  </body></html>`;
  const w=window.open("","_blank");
  if(!w){ alert("Permite ventanas emergentes para exportar el acta en PDF."); return; }
  w.document.write(html); w.document.close(); w.focus();
  setTimeout(function(){ try{ w.print(); }catch(e){} },350);
}
