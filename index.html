function AccesosEditor({toast,onSave}){
  const roles=[["gerencia","Gerencia General"],["aprobador","Jefaturas / Aprobadores"],["colaborador","Colaboradores"]];
  const caps=[["compras","Ver módulo Compras"],["sistemas","Ver módulo Sistemas"],["mantenimiento","Ver módulo Mantenimiento"],
    ["kanban","Ver Tablero Kanban"],["kanban.editar","Editar (mover) en Kanban"],
    ["compras.tablero","Compras · Tablero"],["sistemas.tablero","Sistemas · Tablero"],["mantenimiento.tablero","Mantenimiento · Tablero"]];
  const [rol,setRol]=useState("gerencia"); const [,force]=useState(0);
  const fake={rol,areas:[],gestiona:[]};
  const valor=cap=>(ACCESOS&&ACCESOS[rol]&&(cap in ACCESOS[rol]))?!!ACCESOS[rol][cap]:defaultPuede(fake,cap);
  const overridden=cap=>!!(ACCESOS&&ACCESOS[rol]&&(cap in ACCESOS[rol]));
  function set(cap,v){ ACCESOS=ACCESOS||{}; ACCESOS[rol]=ACCESOS[rol]||{}; ACCESOS[rol][cap]=v; force(x=>x+1); }
  function reset(cap){ if(ACCESOS&&ACCESOS[rol]) delete ACCESOS[rol][cap]; force(x=>x+1); }
  async function guardar(){ onSave(); toast("Accesos guardados"); }
  return <div>
    <div className="card"><Field label="Rol a configurar"><select className="inp" value={rol} onChange={e=>setRol(e.target.value)}>{roles.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></Field>
      <div className="hint">Activa o desactiva qué pantallas y tableros ve cada rol, sin actualizar la app. El Desarrollador siempre tiene acceso total. La "Gestión" de cada módulo se mantiene para el jefe responsable de ese módulo.</div></div>
    {caps.map(([cap,l])=><div key={cap} className="card" style={{padding:12,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
      <div><div style={{fontWeight:700}}>{l}</div>{overridden(cap)&&<div className="meta">Personalizado · <span style={{cursor:"pointer",color:"var(--ocean-d)"}} onClick={()=>reset(cap)}>volver a predeterminado</span></div>}</div>
      <button className={"btn "+(valor(cap)?"green":"ghost")} style={{flex:"0 0 auto"}} onClick={()=>set(cap,!valor(cap))}>{valor(cap)?"Sí ✓":"No"}</button></div>)}
    <button className="btn primary block" onClick={guardar}><Icon name="save" size={15} style={{marginRight:6}}/>Guardar accesos</button>
  </div>;
}
function CalendarioAplicabilidad({user,toast,onSave}){
  const [,force]=useState(0); const re=()=>force(x=>x+1);
  const hoy=new Date();
  const [year,setYear]=useState(hoy.getFullYear());
  const [mes,setMes]=useState(hoy.getMonth());
  const areas=esGD(user)?Object.keys(AC):(user.areas||[]);
  const nd=new Date(year,mes+1,0).getDate();
  const ds=[]; for(let d=1;d<=nd;d++) ds.push(d);
  const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DN=["D","L","M","X","J","V","S"];
  const [ocF,setOcF]=useState(""); const [ocV,setOcV]=useState("");

  function mover(n){ let m=mes+n, y=year; if(m<0){m=11;y--;} if(m>11){m=0;y++;} setMes(m); setYear(y); }

  /* Un toque alterna entre lo que dice el patrón y lo contrario.
     Si ya había una decisión manual, el toque la quita y vuelve al patrón. */
  function toggleCelda(area,iso){
    const ex={...(DIAS_CFG.excepciones||{})}; const cur={...(ex[iso]||{})};
    const areasEx={...(cur.areas||{})};
    if(areasEx[area]!=null) delete areasEx[area];
    else areasEx[area]= aplicaDia(area,iso) ? 0 : 1;
    if(Object.keys(areasEx).length) cur.areas=areasEx; else delete cur.areas;
    if(Object.keys(cur).length) ex[iso]=cur; else delete ex[iso];
    DIAS_CFG.excepciones=ex; re();
  }
  /* Toca el número del día: marca o desmarca el día entero como no operativo. */
  function toggleDiaEntero(iso){
    const ex={...(DIAS_CFG.excepciones||{})}; const cur={...(ex[iso]||{})};
    if(cur.todas===0) delete cur.todas; else cur.todas=0;
    if(Object.keys(cur).length) ex[iso]=cur; else delete ex[iso];
    DIAS_CFG.excepciones=ex; re();
  }
  function guardarOcup(){
    if(!ocF){ toast("Elige la fecha"); return; }
    const o={...(DIAS_CFG.ocupacion||{})};
    if(String(ocV).trim()==="") delete o[ocF]; else o[ocF]=Number(ocV);
    DIAS_CFG.ocupacion=o; setOcV(""); re();
    toast(String(ocV).trim()===""?"Ocupación borrada":"Ocupación registrada");
  }
  const rg=DIAS_CFG.reglaOcup||{activa:false,umbral:40,areas:[]};
  function setRegla(patch){ DIAS_CFG.reglaOcup={...rg,...patch}; re(); }
  function toggleAreaRegla(a){
    const l=rg.areas||[];
    setRegla({areas: l.indexOf(a)>=0 ? l.filter(x=>x!==a) : [...l,a]});
  }

  const celda=(ap,ex)=>({ width:26,minWidth:26,height:28,textAlign:"center",cursor:"pointer",
    borderRight:"1px solid #eee",borderBottom:"1px solid #eee",fontSize:10,fontWeight:700,
    background: ap ? (ex?"#BFE3D2":"#E8F5EE") : (ex?"#F6C9C9":"#F2F2F2"),
    color: ap ? "#0d6e5a" : "#8a8a8a" });

  return <div>
    <div className="card">
      <div className="row" style={{alignItems:"center",gap:8}}>
        <button className="btn ghost" onClick={()=>mover(-1)}>‹</button>
        <div style={{flex:1,textAlign:"center",fontWeight:800}}>{MESES[mes]} {year}</div>
        <button className="btn ghost" onClick={()=>mover(1)}>›</button>
      </div>
      <div className="hint" style={{marginTop:8}}>Toca una casilla para cambiar si ese día le toca a esa área.
        Toca el número del día para marcar la jornada completa como no operativa.</div>
      <div className="row" style={{marginTop:10,gap:12,flexWrap:"wrap",fontSize:11.5}}>
        <span><b style={{color:"#0d6e5a"}}>■</b> aplica</span>
        <span><b style={{color:"#c0c0c0"}}>■</b> no aplica</span>
        <span><b style={{color:"#7fc9ab"}}>■</b> decidido a mano</span>
      </div>
    </div>

    <div className="card" style={{padding:8}}>
      <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
        <table style={{borderCollapse:"separate",borderSpacing:0}}>
          <thead><tr>
            <th style={{position:"sticky",left:0,background:"#fff",zIndex:2,textAlign:"left",padding:"6px 8px",
              minWidth:128,fontSize:11,borderBottom:"1px solid #ddd",borderRight:"1px solid #ddd"}}>Área</th>
            {ds.map(d=>{ const iso=isoYMD(year,mes,d); const wd=new Date(iso+"T00:00:00").getDay();
              const cerrado=((DIAS_CFG.excepciones||{})[iso]||{}).todas===0;
              const oc=(DIAS_CFG.ocupacion||{})[iso];
              return <th key={d} onClick={()=>toggleDiaEntero(iso)} title={oc!=null?("Ocupación "+oc+"%"):""}
                style={{minWidth:26,padding:"3px 0",fontSize:9.5,cursor:"pointer",borderBottom:"1px solid #ddd",
                  background:cerrado?"#F6C9C9":(wd===0||wd===6?"#FAF7F0":"#fff"),color:cerrado?"#8f2020":"#555"}}>
                {DN[wd]}<br/>{d}{oc!=null?<><br/><span style={{fontSize:8,color:"#0d6e75"}}>{oc}</span></>:null}</th>; })}
          </tr></thead>
          <tbody>
            {areas.map(a=><tr key={a}>
              <th style={{position:"sticky",left:0,background:"#fff",zIndex:1,textAlign:"left",padding:"4px 8px",
                fontSize:10.5,fontWeight:600,borderRight:"1px solid #ddd",borderBottom:"1px solid #eee",maxWidth:128,
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a}</th>
              {ds.map(d=>{ const iso=isoYMD(year,mes,d); const ap=aplicaDia(a,iso); const ex=esExcepcion(a,iso);
                return <td key={d} onClick={()=>toggleCelda(a,iso)} style={celda(ap,ex)}>{ap?"·":""}</td>; })}
            </tr>)}
          </tbody>
        </table>
      </div>
      {!areas.length && <div className="hint">No tienes áreas asignadas.</div>}
    </div>

    <div className="card">
      <h3 style={{margin:"0 0 8px"}}>Ocupación del día</h3>
      <div className="hint">Sirve para la regla de abajo. Si no registras ocupación de un día, la regla no se aplica y manda el patrón.</div>
      <div className="row" style={{marginTop:10,gap:8,alignItems:"flex-end"}}>
        <div style={{flex:1,minWidth:140}}><Field label="Fecha"><input type="date" className="inp" value={ocF} onChange={e=>setOcF(e.target.value)}/></Field></div>
        <div style={{width:96}}><Field label="%"><input type="number" min="0" max="100" className="inp" value={ocV} onChange={e=>setOcV(e.target.value)} placeholder="0"/></Field></div>
        <button className="btn primary" onClick={guardarOcup}>Guardar</button>
      </div>
      <div className="hint" style={{marginTop:6}}>Deja el % vacío y guarda para borrar la ocupación de esa fecha.</div>
    </div>

    <div className="card">
      <h3 style={{margin:"0 0 8px"}}>Regla por ocupación</h3>

function ResumenGerencialILD(){
  const now=new Date();
  const [anio,setAnio]=useState(now.getFullYear()); const [mes,setMes]=useState(now.getMonth());
  const [regs,setRegs]=useState([]); const [cargando,setCargando]=useState(true);
  const anios=[now.getFullYear()-2,now.getFullYear()-1,now.getFullYear()];
  const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  useEffect(()=>{ let v=true; (async()=>{ setCargando(true);
    try{ const d=mes==null?await Store.readAnio("ILD",anio):await Store.readMes("ILD",anio,mes); if(v)setRegs(d); }
    catch(e){ if(v)setRegs([]); } finally{ if(v)setCargando(false); } })(); return ()=>{v=false;}; },[anio,mes]);
  const grupoDe=r=>(AC[r.area]&&AC[r.area].g)||"(otros)";
  const byG={};
  regs.forEach(r=>{ const g0=grupoDe(r); const g=(byG[g0]=byG[g0]||{label:g0,total:0,aprob:0,obs:0,pend:0});
    g.total++; if(r.estado==="Aprobado")g.aprob++; else if(r.estado==="Con observaciones")g.obs++; else g.pend++; });
  const grupos=Object.values(byG).map(g=>({...g,
    revisados:g.aprob+g.obs, cumpl:g.total?Math.round((g.aprob+g.obs)/g.total*100):0,
    calidad:g.total?Math.round(g.aprob/g.total*100):0, pObs:g.total?Math.round(g.obs/g.total*100):0 }));
  const tot=regs.length, tAprob=grupos.reduce((s,g)=>s+g.aprob,0), tObs=grupos.reduce((s,g)=>s+g.obs,0), tPend=grupos.reduce((s,g)=>s+g.pend,0);
  const cumplGlobal=tot?Math.round((tAprob+tObs)/tot*100):0;
  const calidadGlobal=tot?Math.round(tAprob/tot*100):0;
  const pObsGlobal=tot?Math.round(tObs/tot*100):0;
  const diasActivos=new Set(regs.map(r=>String(r.fecha).slice(0,10))).size;
  const cumplBar=[...grupos].sort((a,b)=>b.cumpl-a.cumpl||b.total-a.total).map(g=>({label:g.label,value:g.cumpl}));
  const obsBar=[...grupos].filter(g=>g.obs>0).sort((a,b)=>b.obs-a.obs).slice(0,10).map(g=>({label:g.label,value:g.obs}));
  const pendBar=[...grupos].filter(g=>g.pend>0).sort((a,b)=>b.pend-a.pend).slice(0,10).map(g=>({label:g.label,value:g.pend}));
  const tabla=[...grupos].sort((a,b)=>a.cumpl-b.cumpl||b.total-a.total); // peor primero (los que requieren atención arriba)
  const mejor=[...grupos].filter(g=>g.total>=3).sort((a,b)=>b.cumpl-a.cumpl)[0];
  const peor=[...grupos].filter(g=>g.total>=3).sort((a,b)=>a.cumpl-b.cumpl)[0];
  const masObs=[...grupos].sort((a,b)=>b.obs-a.obs)[0];
  const sem=c=>c>=90?"🟢":c>=70?"🟡":"🔴";
  const colCumpl=cumplGlobal>=90?cssVar("--green"):cumplGlobal>=70?cssVar("--amber"):cssVar("--coral");
  const per=mes==null?`año ${anio}`:`${MESES[mes]} ${anio}`;
  return <div>
    <h2 style={{margin:"4px 0 2px"}}>Resumen Gerencial de ILD</h2>
    <p className="sub">Resultado de la gestión de inspecciones · {per}.</p>
    <div className="seg" style={{flexWrap:"wrap"}}>{anios.map(a=><button key={a} className={anio===a?"on":""} onClick={()=>setAnio(a)}>{a}</button>)}</div>
    <div className="seg" style={{flexWrap:"wrap"}}><button className={mes==null?"on":""} onClick={()=>setMes(null)}>Año</button>
      {MESES.map((m,i)=><button key={m} className={mes===i?"on":""} onClick={()=>setMes(i)}>{m}</button>)}</div>
    {cargando ? <div className="hint" style={{padding:"20px 0"}}>Cargando…</div> : tot===0 ? <div className="empty"><div className="e">📊</div>Sin ILD registrados en {per}.</div> : <>
      <div className="kpis">
        <KpiBox label="ILD registrados" value={tot} color={cssVar("--ocean")}/>
        <KpiBox label="% Cumplimiento" value={cumplGlobal+"%"} color={colCumpl}/>
        <KpiBox label="Aprobados sin observación" value={calidadGlobal+"%"} color={cssVar("--green")}/>
        <KpiBox label="% Con observaciones" value={pObsGlobal+"%"} color={cssVar("--amber")}/>
        <KpiBox label="Pendientes por revisar" value={tPend} color={tPend?cssVar("--coral"):cssVar("--green")}/>
        <KpiBox label="Días con inspección" value={diasActivos} color={cssVar("--ocean")}/>
      </div>
      <div className="card" style={{background:"#f4f9f9",borderLeft:"4px solid var(--ocean)"}}>
        <h3 style={{marginTop:0}}>🧭 Lectura gerencial</h3>
        <div style={{fontSize:13.5,lineHeight:1.6}}>
          Se registraron <b>{tot}</b> ILD en {per}, con un cumplimiento global del <b>{cumplGlobal}%</b> ({sem(cumplGlobal)}). De cada 100 inspecciones, <b>{calidadGlobal}</b> se aprobaron sin observaciones y <b>{pObsGlobal}</b> presentaron observaciones.
          {mejor && <> El grupo más consistente es <b>{mejor.label}</b> ({mejor.cumpl}%).</>}
          {peor && peor.label!==(mejor&&mejor.label) && <> El que requiere más atención es <b>{peor.label}</b> ({peor.cumpl}%).</>}
          {masObs && masObs.obs>0 && <> Las observaciones se concentran en <b>{masObs.label}</b> ({masObs.obs}).</>}
          {tPend>0 ? <> Hay <b>{tPend}</b> ILD <b>pendientes de revisión por los jefes</b>.</> : <> No hay ILD pendientes de revisión. ✅</>}
        </div>
      </div>
      <div className="card"><h3>Cumplimiento por grupo (%)</h3><BarsH data={cumplBar} color="var(--green)"/></div>
      <div className="card"><h3>Observaciones por grupo</h3><BarsH data={obsBar} color="var(--amber)"/></div>
      {pendBar.length>0 && <div className="card"><h3>Pendientes de revisión por grupo</h3><BarsH data={pendBar} color="var(--coral)"/></div>}
      <div className="card"><h3>Semáforo por grupo</h3>
        <div className="hint" style={{marginBottom:8}}>Ordenado del que más atención requiere al que mejor cumple. 🟢 ≥90% · 🟡 70–89% · 🔴 &lt;70%.</div>
        <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{borderBottom:"2px solid var(--ocean)"}}>
            {["","Grupo","ILD","Aprob.","Obs.","Pend.","Cumpl."].map(h=><th key={h} style={{textAlign:h==="Grupo"?"left":"center",padding:"6px 4px"}}>{h}</th>)}</tr></thead>
          <tbody>{tabla.map(g=><tr key={g.label} style={{borderBottom:"1px solid #f0ece3"}}>
            <td style={{textAlign:"center"}}>{sem(g.cumpl)}</td>
            <td style={{padding:"6px 4px"}}>{g.label}</td>
            <td style={{textAlign:"center"}}>{g.total}</td><td style={{textAlign:"center",fontWeight:700}}>{g.aprob}</td>
            <td style={{textAlign:"center",color:"#b8860b"}}>{g.obs}</td><td style={{textAlign:"center",color:"var(--coral)"}}>{g.pend}</td>
            <td style={{textAlign:"center",fontWeight:800}}>{g.cumpl}%</td></tr>)}</tbody>
        </table></div></div>
    </>}
  </div>;
}
/* ===== TABLEROS EN TIEMPO REAL (Compras / Sistemas / Mantenimiento) ===== */
function dFiltro(rows,campo,anio,mes){
  return rows.filter(r=>{ const d=r[campo]?new Date(r[campo]):null; if(!d||isNaN(d)) return false;
    if(anio && d.getFullYear()!==anio) return false;
    if(mes!=null && d.getMonth()!==mes) return false; return true; });
}
function dCuenta(rows,campo){ const m={}; rows.forEach(r=>{ const k=(r[campo]||"—"); m[k]=(m[k]||0)+1; });
  return Object.entries(m).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value); }
function dPromDias(rows,ini,fin){ const ds=rows.map(r=>{ if(!r[ini]||!r[fin])return null; const a=new Date(r[ini]),b=new Date(r[fin]);
    if(isNaN(a)||isNaN(b))return null; return (b-a)/86400000; }).filter(x=>x!=null);
  return ds.length?(ds.reduce((s,x)=>s+x,0)/ds.length).toFixed(1):"—"; }
function fmtDur(min){ if(min==null||isNaN(min)) return "—"; let m=Math.round(min);
  const d=Math.floor(m/1440); m-=d*1440; const h=Math.floor(m/60); m-=h*60;
  const p=[]; if(d) p.push(d+"d"); if(h) p.push(h+"h"); p.push(m+"min"); return p.join(" "); }
function dPromMin(rows,ini,fin){ const ds=rows.map(r=>{ if(!r[ini]||!r[fin])return null; const a=new Date(r[ini]),b=new Date(r[fin]);
    if(isNaN(a)||isNaN(b))return null; return (b-a)/60000; }).filter(x=>x!=null);
  return ds.length?fmtDur(ds.reduce((s,x)=>s+x,0)/ds.length):"—"; }
function dPromCal(rows){ const cs=rows.map(r=>Number(r.EncuestaCal)).filter(x=>x>0);
  return cs.length?(cs.reduce((s,x)=>s+x,0)/cs.length).toFixed(2):"—"; }
function KpiBox({label,value,color}){ return <div className="kpi" style={{borderTop:"3px solid "+(color||"var(--ocean)")}}>
  <div className="kn" style={{color:color||"var(--ocean)"}}>{value}</div><div className="kl">{label}</div></div>; }
function BarsH({data,color}){ const max=Math.max(1,...data.map(d=>d.value));
  if(!data.length) return <div className="hint">Sin datos en el período</div>;
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>{data.map(d=>

function Tablero({tipo}){
  const isCom=tipo==="Compras"; const isSis=tipo==="Sistemas";
  const now=new Date();
  const [anio,setAnio]=useState(now.getFullYear()); const [mes,setMes]=useState(null);
  const [f,setF]=useState([]); const [cargando,setCargando]=useState(true);
  const anios=[now.getFullYear()-2,now.getFullYear()-1,now.getFullYear()];
  const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  useEffect(()=>{ let vivo=true; (async()=>{ setCargando(true);
    try{ const data=mes==null?await Store.readAnio(tipo,anio):await Store.readMes(tipo,anio,mes); if(vivo) setF(data); }
    catch(e){ if(vivo) setF([]); } finally{ if(vivo) setCargando(false); } })(); return ()=>{vivo=false;}; },[anio,mes]);
  let kpis=[], extra=null;
  if(isCom){
    const aprob=f.filter(r=>["En compra","Listo para entregar","Entregado","Cerrada"].includes(r.Estado)).length;
    const rech=f.filter(r=>r.Estado==="Rechazada").length;
    const pend=f.filter(r=>["Solicitado","En Gerencia"].includes(r.Estado)).length;
    const entr=f.filter(r=>["Entregado","Cerrada"].includes(r.Estado)).length;
    kpis=[["Recibidas",f.length,"--ocean"],["Aprobadas",aprob,"--green"],["Rechazadas",rech,"--coral"],["Pendientes",pend,"--amber"],
      ["Entregadas",entr,"--blue"],["T. prom. aprobación",dPromMin(f,"FechaSolicitud","FechaAprob"),"--purple"],
      ["Calificación",dPromCal(f),"--green"],["Encuestas",f.filter(r=>r.EncuestaCal).length,"--blue"]];
    extra=<div className="card"><h3>Solicitudes por departamento</h3><BarsH data={dCuenta(f,"Area")} color="var(--ocean)"/></div>;
  } else {
    const concl=f.filter(r=>["Concluido","Cerrado"].includes(r.Estado)).length;
    const validas=f.filter(r=>r.Estado!=="Rechazado");
    const cumpl=validas.length?Math.round(concl/validas.length*100):0;
    kpis=[["Recibidas",f.length,"--ocean"],["Concluidas",concl,"--green"],["Cumplimiento",cumpl+"%",cumpl>=100?"--green":"--amber"],
      ["T. prom. respuesta",dPromMin(f,"FechaCreacion","FechaConcluido"),"--purple"],
      ["Calificación",dPromCal(f),"--green"],["Encuestas",f.filter(r=>r.EncuestaCal).length,"--blue"]];
    const prioCampo=isSis?"Urgencia":"TipoSolicitud";
    extra=<>
      <div className="card"><h3>Solicitudes por departamento</h3><BarsH data={dCuenta(f,"Departamento")} color="var(--ocean)"/></div>
      <div className="card"><h3>Por prioridad</h3><BarsH data={dCuenta(f,prioCampo)} color="var(--blue)"/></div>
      {!isSis && <div className="card"><h3>Cumplimiento de cierre</h3><BarsH data={dCuenta(f.filter(r=>r.CierreCumplimiento),"CierreCumplimiento")} color="var(--green)"/></div>}
    </>;
  }
  return <div>
    <div className="seg" style={{flexWrap:"wrap"}}>{anios.map(a=><button key={a} className={anio===a?"on":""} onClick={()=>setAnio(a)}>{a}</button>)}</div>
    <div className="seg" style={{flexWrap:"wrap"}}>
      <button className={mes==null?"on":""} onClick={()=>setMes(null)}>Año</button>
      {MESES.map((m,i)=><button key={m} className={mes===i?"on":""} onClick={()=>setMes(i)}>{m}</button>)}</div>
    {cargando ? <div className="hint" style={{padding:"20px 0"}}>Cargando datos del período…</div>
      : <><div className="kpis">{kpis.map(([l,v,c])=><KpiBox key={l} label={l} value={v} color={cssVar(c)}/>)}</div>{extra}</>}
  </div>;
}

function CotizField({cotiz,setCotiz}){
  const ref=useRef();
  async function onFile(e){ const file=e.target.files&&e.target.files[0]; e.target.value="";
    if(!file) return;
    const dataUrl=await new Promise(r=>{const rd=new FileReader();rd.onload=ev=>r(ev.target.result);rd.readAsDataURL(file);});
    if(file.type==="application/pdf"){ setCotiz(dataUrl); }
    else if((file.type||"").startsWith("image/")){ setCotiz(await comprimirImg(dataUrl,1000,.7)); }
    else { alert("La cotización debe ser un PDF o una imagen."); }
  }
  const esPdf=/^data:application\/pdf/i.test(cotiz||"");
  return <Field label="Cotización (PDF o imagen) — opcional" hint="Adjunta la proforma del proveedor. Acepta PDF o foto.">
    <input ref={ref} type="file" accept="application/pdf,image/*" style={{display:"none"}} onChange={onFile}/>
    <button className="btn ghost block" onClick={()=>ref.current.click()}>📎 {cotiz?"Cambiar cotización":"Adjuntar cotización"}</button>
    {cotiz && <div className="row" style={{marginTop:8,gap:8,alignItems:"center"}}>
      {esPdf ? <span className="kchip">📄 PDF adjunto</span> : <div className="fthumb" style={{width:64,height:64}}><img src={cotiz}/></div>}
      <button className="btn red" style={{padding:"6px 10px"}} onClick={()=>setCotiz(null)}>Quitar</button></div>}
  </Field>;
}

  const MSG_PRESU=NOTA_PRESUP;

    if(t==="aprobar"){ await apply(item,{Estado:"En compra",Aprobador:user.nombre,FechaAprob:nowISO(),Comentario:com,FechaTentativa:fecha}); toast(MSG_PRESU); }
    else if(t==="enviarGG"){ await apply(item,{Estado:"En Gerencia",EnviadoGG:"Si",Aprobador:user.nombre,FechaAprob:nowISO(),Comentario:com}); Notif.comprasGerencia(item,user.nombre); toast("Enviada a Gerencia"); }
    else if(t==="aprobarGG"){ await apply(item,{Estado:"En compra",AprobadorGG:user.nombre,FechaGG:nowISO(),ComentarioGG:com}); toast(MSG_PRESU); }
    else if(t==="rechazar"){ if(!com.trim()){toast("El motivo es obligatorio");return;} await apply(item,{Estado:"Rechazada",Aprobador:user.nombre,FechaAprob:nowISO(),Comentario:com}); toast("Rechazada"); }
    else if(t==="rechazarGG"){ if(!com.trim()){toast("El motivo es obligatorio");return;} await apply(item,{Estado:"Rechazada",AprobadorGG:user.nombre,FechaGG:nowISO(),ComentarioGG:com}); toast("Rechazada por Gerencia"); }
    else if(t==="reprogramar"){ if(!fecha){toast("Indica la nueva fecha de entrega");return;} await apply(item,{FechaTentativa:fecha,Comentario:com?("Reprogramada — "+com):item.Comentario,Reprogramada:"Si"}); toast("Fecha reprogramada"); }
    else if(t==="baja"){ if(!com.trim()){toast("Indica el motivo de la baja");return;} await apply(item,{Estado:"Baja por presupuesto",Comentario:com,FechaCierre:nowISO()}); toast("Solicitud dada de baja"); }
    else if(t==="listo"){ await apply(item,{Estado:"Listo para entregar",FechaEntrega:nowISO()}); toast("Listo para entregar"); }
    else if(t==="recibir"){ await apply(item,{Estado:"Entregado",ActaEntrega:acta,ComentarioActa:com,Receptor:user.nombre,FechaCierre:nowISO()}); toast("Recibido registrado · acta generada"); }
    else if(t==="encuesta"){ if(!calT||!calC){toast("Califica el tiempo de entrega y la calidad");return;}
      await apply(item,{Estado:"Cerrada",EncuestaTiempo:calT,EncuestaCalidad:calC,EncuestaCal:Math.round((calT+calC)/2),EncuestaComentario:com,FechaEncuesta:nowISO()}); toast("¡Gracias por calificar!"); }
    onClose();
  }
  const titles={ver:"Detalle de la solicitud",aprobar:"Aprobar (Compras)",enviarGG:"Enviar a Gerencia General",aprobarGG:"Aprobar (Gerencia)",rechazar:"Rechazar",rechazarGG:"Rechazar (Gerencia)",reprogramar:"Reprogramar fecha de entrega",baja:"Dar de baja por presupuesto",listo:"Marcar listo",recibir:"Confirmar recibido · Acta de entrega",encuesta:"Calificar el servicio"};
  const needCom = t.startsWith("rechazar")||t==="baja";
  return <Modal title={titles[t]} onClose={onClose}>
    {t==="ver" ? <div>
      {[["Código",item.Codigo],["Solicitante",item.Solicitante],["Área",item.Area],["Tiempo de compra",item.TiempoCompra],
        ["Tipo de compra",item.TipoCompra],["Necesaria para",fmtDate(item.FechaNecesidad)],["Presupuesto",item.Presupuesto],
        ["Cantidad",`${item.Cantidad} ${item.Unidad}`],["Modelo",item.Modelo],["Descripción",item.Descripcion],
        ["Justificación",item.Justificacion],["Proveedores",item.Proveedores],["Estado",item.Estado],
        ["Tentativa entrega",fmtDate(item.FechaTentativa)],["Aprobó Compras",item.Aprobador||"—"],["Comentario",item.Comentario||"—"],
        ["Decisión Gerencia",item.AprobadorGG?`${item.AprobadorGG} · ${item.ComentarioGG||""}`:"—"],
        ["Acta",item.ActaEntrega||"—"],["Recibió",item.Receptor||"—"],["Calificación",item.EncuestaCal?item.EncuestaCal+"/10":"—"]].map(([k,v])=>
        <div className="kv" key={k}><b>{k}</b><span style={{textAlign:"right",maxWidth:"62%"}}>{v}</span></div>)}
      {(item.Fotos||[]).length>0 && <><h3 style={{margin:"12px 0 6px"}}>Foto</h3>
        <div className="fgrid">{item.Fotos.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
      {item.Cotizacion && <><h3 style={{margin:"12px 0 6px"}}>🧾 Cotización</h3>
        {item.Cotizacion.tipo==="pdf"
          ? <button className="btn ocean block" onClick={()=>abrirCotiz(item.Cotizacion)}>📄 Ver cotización (PDF)</button>
          : <div className="fgrid"><SpImg foto={item.Cotizacion} idx="C" onClick={setFoto}/></div>}</>}
      {["Entregado","Cerrada"].includes(item.Estado) && <button className="btn ocean block" style={{marginTop:12}} onClick={()=>actaCompra(item)}><Icon name="filetext" size={15} style={{marginRight:6}}/>Exportar Acta de Entrega (PDF)</button>}
      {item.Estado==="En compra" && notaPresupBox(12)}
    </div> : <div>
      {(t==="aprobar"||t==="reprogramar") && <Field label="Fecha tentativa de entrega" req={t==="reprogramar"} hint="La asigna el Coordinador de Compras. Vacía = no se marca como vencida."><input type="date" className="inp" value={fecha} onChange={e=>setFecha(e.target.value)}/></Field>}
      {t==="recibir" && <><Field label="Resultado de la entrega"><select className="inp" value={acta} onChange={e=>setActa(e.target.value)}><option>Recibido conforme</option><option>Recibido con observaciones</option></select></Field>
        <div className="hint">Al confirmar, el ítem queda como <b>Entregado</b> y podrás exportar el Acta en PDF.</div></>}
      {t==="encuesta" && <><Field label="Califica el tiempo de entrega (1-10)"><Stars value={calT} onChange={setCalT}/></Field>
        <Field label="Califica la calidad de la compra (1-10)"><Stars value={calC} onChange={setCalC}/></Field></>}
      <Field label={t.startsWith("rechazar")?"Motivo del rechazo":t==="baja"?"Motivo de la baja (p. ej. falta de presupuesto)":t==="reprogramar"?"Motivo de la reprogramación (opcional)":"Comentario"} req={needCom}><textarea className="inp" value={com} onChange={e=>setCom(e.target.value)}/></Field>
      <div className="row end"><button className="btn ghost" onClick={onClose}>Cancelar</button>
        <button className={"btn "+(needCom?"red":"primary")} onClick={go}>Confirmar</button></div></div>}
  </Modal>;
}

/* ===== TICKETS (Sistemas / Mantenimiento) con campos exactos del Form ===== */
function Tickets({tipo,user,toast,setFoto}){
  const isSis=tipo==="Sistemas";
  const chief=gestionaModulo(user,tipo.toLowerCase());
  const [tab,setTab]=useState("nuevo"); const [rows,setRows]=useState([]); const [modal,setModal]=useState(null);
  const load=async()=>setRows(await Store.read(tipo)); useEffect(()=>{load();},[]);
  const hoy=hoyEC();
  const vacioSis={Departamento:DEPTS_SIS[0],Urgencia:URGENCIA_SIS[1],Titulo:"",Descripcion:""};
  const vacioMto={Departamento:DEPTS[0],FechaSolicitud:hoy,TipoSolicitud:"Normal",Descripcion:""};
  const [f,setF]=useState(isSis?vacioSis:vacioMto); const [fotos,setFotos]=useState([]); const [busy,setBusy]=useState(false); const aprobadores=USERS.filter(u=>u.rol==='aprobador').map(u=>u.nombre).sort(); const [solicOtro,setSolicOtro]=useState(""); const [areaOtro,setAreaOtro]=useState(DEPTS[0]);
  const ch=(k,v)=>setF(s=>({...s,[k]:v}));
  async function crear(){
    if(isSis){ if(!f.Titulo.trim()){toast("Falta el título de la tarea");return;} if(!f.Descripcion.trim()){toast("Falta la descripción");return;} }
    else { if(!f.Descripcion.trim()){toast("Falta la descripción de la novedad");return;} }
    if(busy) return; setBusy(true);
    try{
      const esProg=chief&&solicOtro==="__prog";
      const solicitanteFinal=esProg?"Tarea programada":((chief&&solicOtro)?solicOtro:user.nombre);
      const base={id:gid(),FechaCreacion:nowISO(),Solicitante:solicitanteFinal,...f,
        ...(esProg?(isSis?{Urgencia:"Tarea programada"}:{TipoSolicitud:"Tarea programada"}):{}),Programada:esProg?"Si":"",
        CreadoPor:user.nombre,AreaSolicitante:(chief&&solicOtro&&!esProg)?areaOtro:"",
        Estado:"Nuevo",FechaTentativa:"",Asignado:"",ComentarioSoporte:"",FechaConcluido:"",
        EncuestaCal:"",EncuestaComentario:"",FechaEncuesta:""};
      await Cola.add({ tabla:tipo, prefijo:isSis?"SIS":"MTO", rec:base, fotos:[...fotos], fotoField:"Fotos",
        fotoDir:(isSis?"SIS":"MTO")+"_{COD}", fotoPrefix:"{COD}",
        notif:{t:"ticket",usuario:user.nombre,tipo},
        resumen:{ titulo:(isSis?f.Titulo:f.Descripcion)||"Ticket", sub:f.Departamento||"" } }, user.nombre);
      const rr=await Cola.enviar(user.nombre);
      toast(rr.ok||rr.dup ? ("Ticket creado"+(rr.ultimo?": "+rr.ultimo:""))
        : rr.sinRed ? "Sin señal: el ticket quedó guardado y se enviará solo cuando vuelva el internet."
        : "Guardado en el equipo. No se pudo enviar ahora. Se reintentará.");
      setF(isSis?vacioSis:vacioMto); setFotos([]); setSolicOtro(""); load(); setTab("mios");
    } finally { setBusy(false); }
  }
  /* Todo cambio pasa por la cola: con señal se aplica en el momento, sin señal
     queda guardado y se aplica solo. El historial lo escribe la cola. */
  async function apply(ref,patch,nota,extras){
    const rid=(ref&&typeof ref==="object")?ref.id:ref;
    const cod=(ref&&typeof ref==="object")?(ref.Codigo||""):"";
    const prev=(ref&&typeof ref==="object")?ref.Estado:undefined;
    await Cola.cambio({ tabla:tipo, recId:rid, recCodigo:cod, patch:patch||{}, nota:nota||"",
      estadoPrevio:prev, campoEstado:"Estado", ...(extras||{}),
      resumen:{ titulo:((patch&&patch.Estado)?"→ "+patch.Estado:"Cambio")+(cod?" · "+cod:""), sub:tipo } }, user.nombre);
    const r=await Cola.enviar(user.nombre);
    if(r.ok||r.dup){ load(); return r; }
    /* Se refleja en pantalla lo que quedó pendiente, y el aviso se muestra con
       un pequeño retraso porque el módulo lanza el suyo justo después. */
    setRows(rs=>rs.map(x=>x.id===rid?{...x,...(patch||{}),_pendiente:true}:x));
    setTimeout(()=>toast(r.sinRed
      ? "Sin señal: el cambio quedó guardado y se aplicará solo cuando vuelva el internet."
      : "El cambio quedó guardado en este equipo. Se reintentará."),60);
    return r; }
  const mios=rows.filter(r=>r.Solicitante===user.nombre);
  const equipo=equipoDe(user); const verEquipo=user.rol==='aprobador' && equipo.length>0;
  const delEquipo=rows.filter(r=>equipo.includes(r.Solicitante));
  const asignadas=rows.filter(r=>!isSis && enEquipoMTO(r,user.nombre) && !["Cerrado","Rechazado"].includes(r.Estado));
  const verTareas=!isSis && ildAreasDe(user).includes('Mantenimiento') && user.rol==='colaborador';
  const [soloHoy,setSoloHoy]=useState(false); const [gHoy,setGHoy]=useState(false); const [gFiltro,setGFiltro]=useState("todas");
  const hoyStr=hoyEC();
  const tareasMostrar=soloHoy?asignadas.filter(r=>(r.FechaTentativa||"").slice(0,10)===hoyStr):asignadas;
  let gestionRows=gHoy?rows.filter(r=>(r.FechaTentativa||"").slice(0,10)===hoyStr):rows;
  let gView=gestionRows;
  if(gFiltro==="nuevas") gView=gView.filter(r=>bucketEstado(r.Estado)==="nuevas").sort((a,b)=>new Date(fechaBase(a))-new Date(fechaBase(b)));
  else if(gFiltro==="proceso") gView=gView.filter(r=>bucketEstado(r.Estado)==="proceso");
  else if(gFiltro==="concluidas") gView=gView.filter(r=>bucketEstado(r.Estado)==="concluidas");
  else if(gFiltro==="v15") gView=gView.filter(r=>bucketEstado(r.Estado)==="nuevas" && diasEnEstado(r)>=15).sort((a,b)=>new Date(fechaBase(a))-new Date(fechaBase(b)));
  return <div>
    <h1 className="h1">{isSis?"Soporte de Sistemas":"Mantenimiento"}</h1>
    <p className="sub">{isSis?"Requerimiento de TI.":"Requerimiento de mantenimiento."}</p>
    <div className="seg" style={{flexWrap:"wrap"}}>
      <button className={tab==="nuevo"?"on":""} onClick={()=>setTab("nuevo")}>Nuevo</button>
      <button className={tab==="mios"?"on":""} onClick={()=>{setTab("mios");load();}}>{chief?"Tareas programadas":"Mis tickets"}</button>
      {user.rol==='gerencia' && <button className={tab==="prog"?"on":""} onClick={()=>{setTab("prog");load();}}>Tareas programadas</button>}
      {verTareas&&<button className={tab==="tareas"?"on":""} onClick={()=>{setTab("tareas");load();}}>Mis tareas{asignadas.length?` (${asignadas.length})`:""}</button>}
      {verEquipo&&<button className={tab==="equipo"?"on":""} onClick={()=>{setTab("equipo");load();}}>Mi equipo</button>}
      {puede(user,`${tipo.toLowerCase()}.gestion`)&&<button className={tab==="gestion"?"on":""} onClick={()=>{setTab("gestion");load();}}>Gestión {esDev(user)?"(todo)":""}</button>}
      {puede(user,`${tipo.toLowerCase()}.tablero`)&&<button className={tab==="tablero"?"on":""} onClick={()=>{setTab("tablero");load();}}><Icon name="chart" size={15} style={{marginRight:6}}/>Tablero</button>}
      {!isSis && puede(user,`${tipo.toLowerCase()}.tablero`)&&<button className={tab==="prod"?"on":""} onClick={()=>{setTab("prod");load();}}><Icon name="trendup" size={15} style={{marginRight:6}}/>Productividad</button>}
    </div>
    {tab==="nuevo" && <div className="card">
      {chief
        ? <><Field label="Usuario que solicita" req hint="Puedes registrar a nombre de un aprobador (la encuesta le llegará a esa persona) o como Tarea programada (sin encuesta)."><select className="inp" value={solicOtro} onChange={e=>setSolicOtro(e.target.value)}><option value="">Yo mismo ({user.nombre})</option><option value="__prog">Tarea programada</option>{aprobadores.map(n=><option key={n} value={n}>{n}</option>)}</select></Field>
          {solicOtro!=="__prog" && <Field label="Área del solicitante" req><select className="inp" value={areaOtro} onChange={e=>setAreaOtro(e.target.value)}>{DEPTS.map(d=><option key={d}>{d}</option>)}</select></Field>}</>
        : <Field label={isSis?"Nombre del solicitante":"Solicitante"}><input className="inp" value={user.nombre} disabled/></Field>}
      <Field label="Departamento" req><select className="inp" value={f.Departamento} onChange={e=>ch("Departamento",e.target.value)}>{(isSis?DEPTS_SIS:DEPTS).map(d=><option key={d}>{d}</option>)}</select></Field>
      {isSis ? <>
        <Field label="Urgencia / Prioridad" req>{(chief&&solicOtro==="__prog")?<input className="inp" value="Tarea programada" disabled/>:<select className="inp" value={f.Urgencia} onChange={e=>ch("Urgencia",e.target.value)}>{URGENCIA_SIS.map(d=><option key={d}>{d}</option>)}</select>}</Field>
        <Field label="Título de la tarea" req><input className="inp" value={f.Titulo} onChange={e=>ch("Titulo",e.target.value)} placeholder="Ej. Creación de usuario"/></Field>
        <Field label="Descripción del problema o solicitud" req hint="Describe con el mayor detalle posible."><textarea className="inp" value={f.Descripcion} onChange={e=>ch("Descripcion",e.target.value)}/></Field>
        <PhotoField fotos={fotos} setFotos={setFotos} label="Adjuntos (opcional)" setFoto={setFoto}/>
      </> : <>
        <Field label="Fecha de solicitud" req><input type="date" className="inp" value={f.FechaSolicitud} onChange={e=>ch("FechaSolicitud",e.target.value)}/></Field>
        <Field label="Tipo de solicitud" req>{(chief&&solicOtro==="__prog")?<input className="inp" value="Tarea programada" disabled/>:<select className="inp" value={f.TipoSolicitud} onChange={e=>ch("TipoSolicitud",e.target.value)}><option>Normal</option><option>Urgente</option></select>}</Field>
        <Field label="Descripción de la novedad" req><textarea className="inp" value={f.Descripcion} onChange={e=>ch("Descripcion",e.target.value)} placeholder="Describe la novedad…"/></Field>
        <PhotoField fotos={fotos} setFotos={setFotos} label="Imagen de la novedad (opcional)" setFoto={setFoto}/>
      </>}
      <button className="btn primary block" disabled={busy} onClick={crear}>{busy?"Enviando…":"Crear ticket"}</button></div>}
    {tab==="mios" && <Listado items={chief?rows.filter(r=>r.Programada==="Si"):mios} empty={chief?"Aún no hay tareas programadas":"Aún no tienes tickets"} render={r=><TicketCard r={r} isSis={isSis} chief={chief} equipo={equipo} onAction={(t)=>setModal({t,item:r})}/>}/>}
    {tab==="prog" && <Listado items={rows.filter(r=>r.Programada==="Si")} empty="No hay tareas programadas" render={r=><TicketCard r={r} isSis={isSis} chief={chief} equipo={equipo} onAction={(t)=>setModal({t,item:r})}/>}/>}
    {tab==="equipo" && <Listado items={delEquipo} empty="Tu equipo aún no ha subido tickets" render={r=><TicketCard r={r} isSis={isSis} chief={false} onAction={(t)=>setModal({t,item:r})}/>}/>}
    {tab==="tareas" && <div>
      <div className="row" style={{margin:"0 0 12px",gap:8}}>
        <button className={"btn "+(soloHoy?"ghost":"primary")} onClick={()=>setSoloHoy(false)}>Todas ({asignadas.length})</button>
        <button className={"btn "+(soloHoy?"primary":"ghost")} onClick={()=>setSoloHoy(true)}><Icon name="calendar" size={15} style={{marginRight:6}}/>Hoy ({asignadas.filter(r=>(r.FechaTentativa||"").slice(0,10)===hoyStr).length})</button></div>
      <Listado items={tareasMostrar} empty={soloHoy?"No tienes tareas para hoy":"No tienes tareas asignadas"}
        render={r=><TareaCard r={r} onAction={(t)=>setModal({t,item:r})}/>}/></div>}
    {tab==="gestion" && <div>
      <div className="seg" style={{flexWrap:"wrap"}}>
        <button className={gFiltro==="todas"?"on":""} onClick={()=>setGFiltro("todas")}>Todas</button>
        <button className={gFiltro==="nuevas"?"on":""} onClick={()=>setGFiltro("nuevas")}>🆕 Nuevas</button>
        <button className={gFiltro==="proceso"?"on":""} onClick={()=>setGFiltro("proceso")}>🔄 En proceso</button>
        <button className={gFiltro==="concluidas"?"on":""} onClick={()=>setGFiltro("concluidas")}>✅ Concluidas / cerradas</button>
        <button className={gFiltro==="v15"?"on":""} onClick={()=>setGFiltro("v15")}>⏰ +15 días en nuevo</button>
      </div>
      <div className="row" style={{margin:"8px 0 12px",gap:8,flexWrap:"wrap"}}>
        <button className={"btn "+(gHoy?"ghost":"primary")} onClick={()=>setGHoy(false)}>Todas fechas</button>
        <button className={"btn "+(gHoy?"primary":"ghost")} onClick={()=>setGHoy(true)}>📅 Vencen hoy ({rows.filter(r=>(r.FechaTentativa||"").slice(0,10)===hoyStr).length})</button>
        <button className="btn ocean" onClick={()=>{ if(!exportXLSX(gView,tipo,`${tipo}_PlayaParaiso`)) toast("No hay datos para exportar"); else toast("Exportando…"); }}>⬇️ Exportar</button></div>
      <div className="kcount">{gView.length} ticket(s)</div>
      <Listado items={gView} empty="No hay tickets en este filtro" render={r=><TicketCard r={r} isSis={isSis} chief={chief} equipo={equipo} onAction={(t)=>setModal({t,item:r})}/>}/></div>}
    {tab==="tablero" && <Tablero tipo={tipo}/>}
    {tab==="prod" && !isSis && <ProductividadMant rows={rows}/>}
    {modal && <TicketModal tipo={tipo} isSis={isSis} modal={modal} user={user} equipo={equipo} onClose={()=>setModal(null)} apply={apply} toast={toast} setFoto={setFoto}/>}
  </div>;
}
/* ===== Equipo de mantenimiento: responsable + apoyos ===== */
function equipoMTO(r){
  if(Array.isArray(r.Equipo) && r.Equipo.length) return r.Equipo;
  return r.Asignado ? [{nombre:r.Asignado,papel:"responsable",desde:r.FechaCreacion||"",hasta:"",horas:null}] : [];
}
function enEquipoMTO(r,nombre){ return equipoMTO(r).some(p=>p.nombre===nombre && !p.hasta); }
function respMTO(r){ const p=equipoMTO(r).find(x=>x.papel==="responsable"); return p?p.nombre:(r.Asignado||""); }
function apoyosMTO(r){ return equipoMTO(r).filter(x=>x.papel==="apoyo").map(x=>x.nombre); }
function horasNum(v){ const h=Number(v); return (isFinite(h)&&h>0)?h:0; }
/* Horas entre la asignación y la conclusión. Solo para registros con historial:
   en los anteriores no existe el sello de la asignación y el dato no sería comparable. */
function ejecucionHrs(r){
  const h=Array.isArray(r.historial)?r.historial:[];
  const asg=h.find(x=>x.estado==="Asignada"||x.estado==="En proceso");
  if(!asg || !r.FechaConcluido) return null;
  const ms=new Date(r.FechaConcluido)-new Date(asg.fecha);
  return ms>0 ? ms/3600000 : null;
}
function respuestaHrs(r){
  const h=Array.isArray(r.historial)?r.historial:[];
  const asg=h.find(x=>x.estado==="Asignada");
  if(!asg || !r.FechaCreacion) return null;
  const ms=new Date(asg.fecha)-new Date(r.FechaCreacion);
  return ms>0 ? ms/3600000 : null;
}
function fmtHrs(h){ if(h==null) return "—"; if(h<24) return (Math.round(h*10)/10)+" h";
  return (Math.round(h/24*10)/10)+" d"; }

function TareaCard({r,onAction}){
  const venc = r.FechaTentativa && (r.FechaTentativa||"").slice(0,10) < hoyEC() && !["Concluido","Cerrado"].includes(r.Estado);
  return <div className="item">
    <div className="top"><div><div className="code">{r.Codigo}</div><div className="ttl">{r.Descripcion}</div>
      <div className="meta">{r.Departamento} · {r.TipoSolicitud} · solicitó: {r.Solicitante}</div>
      {apoyosMTO(r).length>0 && <div className="meta">Equipo: {respMTO(r)} (resp.) · {apoyosMTO(r).join(", ")}</div>}</div>
      <Pill estado={r.Estado} overdue={venc}/></div>
    {r.FechaTentativa && <div className="meta" style={{marginTop:6}}><Icon name="calendar" size={15} style={{marginRight:6}}/>Para: {fmtDate(r.FechaTentativa)}{venc?" · ⚠️ vencida":""}</div>}

function TicketModal({tipo,isSis,modal,user,equipo,onClose,apply,toast,setFoto}){

  function equipoConHoras(){ return eqActual.map(p=>({...p,horas:horasNum(horas[p.nombre]),hasta:nowISO()})); }
  function cumplimiento(){ if(!item.FechaTentativa) return "Concluida"; const lim=(item.FechaTentativa||"").slice(0,10);
    return (hoyEC() <= lim) ? "Concluida a tiempo" : "Concluida con atraso"; }
  async function go(){
    if(t==="tomar"){ await apply(item,{Estado:fecha?"En proceso":"Sin fecha asignada",Asignado:user.nombre,FechaTentativa:fecha}); toast(fecha?"En proceso":"Guardado sin fecha"); }

      const nuevos=[tecnico,...apoyos.filter(n=>n&&n!==tecnico)];
      const previos=equipoMTO(item);
      const eq=nuevos.map(n=>{ const ya=previos.find(x=>x.nombre===n && !x.hasta);
        return { personaId:idDe(n), nombre:n, papel:(n===tecnico?"responsable":"apoyo"),
                 desde:(ya?ya.desde:nowISO()), hasta:"", horas:(ya?ya.horas:null) }; });
      /* Quien sale del equipo no se borra: se le cierra la participación con fecha. */
      const salen=previos.filter(x=>!x.hasta && !nuevos.includes(x.nombre)).map(x=>({...x,hasta:nowISO()}));
      const eqFinal=[...eq,...salen];
      const detalle=apoyos.length?`${tecnico} (responsable) + ${apoyos.length} apoyo(s)`:tecnico;
      await apply(item,{Estado:"Asignada",Asignado:tecnico,Equipo:eqFinal,FechaTentativa:fecha,ComentarioJefe:com},"Asignada a "+detalle);
      for(const n of nuevos){ await addNotif(n,`Se te asignó la tarea de mantenimiento ${item.Codigo} como ${n===tecnico?"responsable":"apoyo"} (para el ${fmtDate(fecha)}).`,"",item.Codigo); }

      toast("Tarea asignada a "+detalle); }
    else if(t==="avance"){ if(!com.trim()){toast("Escribe el avance");return;}
      const nuevoAv={fecha:nowISO(),autor:user.nombre,texto:com.trim()};
      /* Se envía como agregado, no como arreglo completo: así dos avances
         registrados sin señal no se pisan entre sí. */
      await apply(item,{},com,{appends:[{campo:"Avances",item:nuevoAv}]});
      const jefes=USERS.filter(u=>gestionaModulo(u,"mantenimiento")).map(u=>u.nombre).filter(n=>n&&n!==user.nombre);
      for(const j of [...new Set(jefes)]) await addNotif(j,`Avance en ${item.Codigo} (${user.nombre}): ${com.trim().slice(0,80)}`,"",item.Codigo);
      toast("Avance registrado"); }
    else if(t==="concluir"){ if(!com.trim()){toast("El comentario de cierre es obligatorio");return;} setBusy(true);
      const cmp=cumplimiento();
      await apply(item,{Estado:"Concluido",ComentarioSoporte:com,FechaConcluido:nowISO(),CierreCumplimiento:cmp,
        ...(isSis?{}:{Equipo:equipoConHoras()})},com,
        fotos.length?{fotos:[...fotos],fotoField:"FotosCierre",fotoDir:"MTO_{COD}",fotoPrefix:"{COD}_cierre"}:null);
      Notif.ticketFinalizado({...item,ComentarioSoporte:com,FechaConcluido:nowISO(),CierreCumplimiento:cmp},tipo); toast("Concluido"); }
    else if(t==="concluirTarea"){ if(!com.trim()){toast("Escribe un comentario de la tarea");return;}
      if(!fotos.length){toast("Adjunta al menos una foto de la tarea concluida");return;} setBusy(true);
      const cmp=cumplimiento();
      await apply(item,{Estado:"Concluido",ComentarioSoporte:com,FechaConcluido:nowISO(),CierreCumplimiento:cmp,
        Equipo:equipoConHoras()},com,
        {fotos:[...fotos],fotoField:"FotosCierre",fotoDir:"MTO_{COD}",fotoPrefix:"{COD}_cierre"});
      Notif.ticketFinalizado({...item,ComentarioSoporte:com,FechaConcluido:nowISO(),CierreCumplimiento:cmp},tipo); toast(cmp); }
    else if(t==="rechazar"){ if(!com.trim()){toast("El motivo es obligatorio");return;} await apply(item,{Estado:"Rechazado",ComentarioSoporte:com,Asignado:user.nombre,FechaConcluido:nowISO()}); toast("Rechazado"); }
    else if(t==="encuesta"){ if(!cal){toast("Selecciona calificación");return;} await apply(item,{Estado:"Cerrado",EncuestaCal:cal,EncuestaComentario:com,FechaEncuesta:nowISO()}); toast("¡Gracias por calificar!"); }
    onClose();
  }
  const titles={ver:"Detalle del ticket",tomar:"Asignar fecha tentativa",asignar:"Asignar tarea al equipo",avance:"Registrar avance",concluir:"Concluir ticket",concluirTarea:"Concluir tarea",rechazar:"Rechazar",encuesta:"Calificar el servicio"};
  return <Modal title={titles[t]} onClose={onClose}>
    {t==="ver" ? <div>
      {[["Código",item.Codigo],["Solicitante",item.Solicitante],
        ...(item.AreaSolicitante?[["Área solicitante",item.AreaSolicitante]]:[]),
        ...(item.CreadoPor&&item.CreadoPor!==item.Solicitante?[["Registrado por",item.CreadoPor]]:[]),
        ["Departamento",item.Departamento],
        isSis?["Urgencia",item.Urgencia]:["Tipo",item.TipoSolicitud],
        isSis?["Título",item.Titulo]:["Fecha solicitud",fmtDate(item.FechaSolicitud)],
        ["Descripción",item.Descripcion],["Estado",item.Estado],["Fecha límite",fmtDate(item.FechaTentativa)],
        isSis?["Asignado",item.Asignado||"—"]:["Responsable",respMTO(item)||"—"],
        ...(!isSis&&apoyosMTO(item).length?[["Apoyos",apoyosMTO(item).join(", ")]]:[]),
        ...(!isSis&&respuestaHrs(item)!=null?[["Tiempo de respuesta",fmtHrs(respuestaHrs(item))]]:[]),
        ...(!isSis&&ejecucionHrs(item)!=null?[["Tiempo de ejecución",fmtHrs(ejecucionHrs(item))]]:[]),
        ["Cumplimiento",item.CierreCumplimiento||"—"],["Cierre",item.ComentarioSoporte||"—"],["Calificación",item.EncuestaCal?item.EncuestaCal+"/10":"—"]].map(([k,v])=>
        <div className="kv" key={k}><b>{k}</b><span style={{textAlign:"right",maxWidth:"62%"}}>{v}</span></div>)}
      {(item.Fotos||[]).length>0 && <><h3 style={{margin:"12px 0 6px"}}>Adjuntos</h3>
        <div className="fgrid">{item.Fotos.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
      {(item.FotosCierre||[]).length>0 && <><h3 style={{margin:"12px 0 6px"}}>Fotos de cierre</h3>
        <div className="fgrid">{item.FotosCierre.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
      {!isSis && equipoMTO(item).some(pp=>horasNum(pp.horas)>0) && <><h3 style={{margin:"12px 0 6px"}}>⏱️ Horas dedicadas</h3>
        {equipoMTO(item).filter(pp=>horasNum(pp.horas)>0).map((pp,i)=>
          <div className="kv" key={i}><b>{pp.nombre}{pp.papel==="apoyo"?" · apoyo":""}</b><span>{horasNum(pp.horas)} h</span></div>)}</>}
      {!isSis && (item.historial||[]).length>0 && (gestionaModulo(user,"mantenimiento")||esGD(user)||esDev(user)) && <><h3 style={{margin:"12px 0 6px"}}>🕘 Historial</h3>
        {item.historial.map((hh,i)=><div className="kv" key={i} style={{alignItems:"flex-start"}}>
          <b style={{whiteSpace:"nowrap"}}>{fmtDate(hh.fecha)}</b>
          <span style={{textAlign:"right",maxWidth:"70%"}}>{hh.estado}{hh.nota?<><br/><span style={{fontSize:11,color:"var(--muted)"}}>{hh.nota}</span></>:null}<br/>
          <span style={{fontSize:11,color:"var(--muted)"}}>— {hh.quien||"—"}</span></span></div>)}</>}
      {!isSis && (item.Avances||[]).length>0 && (enEquipoMTO(item,user.nombre)||gestionaModulo(user,"mantenimiento")||esGD(user)||esDev(user)) && <><h3 style={{margin:"12px 0 6px"}}>📝 Avances (interno)</h3>
        <div>{item.Avances.map((a,i)=><div key={i} className="kv" style={{alignItems:"flex-start"}}><b style={{whiteSpace:"nowrap"}}>{fmtDate(a.fecha)}</b><span style={{textAlign:"right",maxWidth:"70%"}}>{a.texto}<br/><span style={{fontSize:11,color:"var(--muted)"}}>— {a.autor}</span></span></div>)}</div></>}
    </div> : <div>
      {t==="asignar" && <><Field label="Técnico responsable" req hint="Es quien rinde cuentas por la tarea y declara las horas al cerrarla."><select className="inp" value={tecnico} onChange={e=>{setTecnico(e.target.value); setApoyos(a=>a.filter(x=>x!==e.target.value));}}>

                <input type="checkbox" checked={apoyos.includes(n)} onChange={e=>setApoyos(a=>e.target.checked?[...a,n]:a.filter(x=>x!==n))}/>{n}

        <Field label="Fecha límite de la tarea" req hint="Según esta fecha se marcará 'a tiempo' o 'con atraso'."><input type="date" className="inp" value={fecha} onChange={e=>setFecha(e.target.value)}/></Field></>}

/* ===== PRODUCTIVIDAD DE MANTENIMIENTO ===== */
function ProductividadMant({rows}){
  const hoy=hoyEC();
  const ini=hoy.slice(0,8)+"01";
  const [desde,setDesde]=useState(ini); const [hasta,setHasta]=useState(hoy);
  const [tipoF,setTipoF]=useState("todas");
  const fil=rows.filter(r=>{
    const f=(r.FechaCreacion||r.FechaSolicitud||"").slice(0,10);
    if(!f || f<desde || f>hasta) return false;
    if(tipoF==="programado") return r.Programada==="Si";
    if(tipoF==="correctivo") return r.Programada!=="Si";
    return true;
  });
  const st={};
  const g=n=>st[n]||(st[n]={nombre:n,resp:0,apoyo:0,cerr:0,aTiempo:0,horas:0,calSum:0,calN:0,ejSum:0,ejN:0,salidas:0,abiertas:0});
  fil.forEach(r=>{
    const ej=ejecucionHrs(r); const cerrada=["Concluido","Cerrado"].includes(r.Estado);
    equipoMTO(r).forEach(pp=>{
      if(!pp.nombre) return; const a=g(pp.nombre);
      if(pp.papel==="apoyo") a.apoyo++; else a.resp++;
      a.horas+=horasNum(pp.horas);
      if(pp.hasta) a.salidas++;
      if(!cerrada && !pp.hasta) a.abiertas++;
      if(pp.papel!=="apoyo" && cerrada){
        a.cerr++;
        if((r.CierreCumplimiento||"").includes("a tiempo")) a.aTiempo++;
        if(ej!=null){ a.ejSum+=ej; a.ejN++; }
        const c=Number(r.EncuestaCal); if(c>0){ a.calSum+=c; a.calN++; }
      }
    });
  });
  const lista=Object.values(st).sort((a,b)=>(b.resp+b.apoyo)-(a.resp+a.apoyo));
  const sinHist=fil.filter(r=>["Concluido","Cerrado"].includes(r.Estado) && ejecucionHrs(r)==null).length;
  const M=({k,v,c})=><div style={{flex:"1 1 82px",minWidth:82}}>
    <div style={{fontSize:10.5,letterSpacing:".04em",textTransform:"uppercase",color:"var(--muted)",fontWeight:700}}>{k}</div>
    <div style={{fontSize:17,fontWeight:800,color:c||"inherit"}}>{v}</div></div>;
  return <div>
    <div className="card">
      <Field label="Desde"><input type="date" className="inp" value={desde} onChange={e=>setDesde(e.target.value)}/></Field>
      <Field label="Hasta"><input type="date" className="inp" value={hasta} onChange={e=>setHasta(e.target.value)}/></Field>
      <div className="seg" style={{flexWrap:"wrap"}}>
        <button className={tipoF==="todas"?"on":""} onClick={()=>setTipoF("todas")}>Todas</button>
        <button className={tipoF==="correctivo"?"on":""} onClick={()=>setTipoF("correctivo")}>Correctivo</button>
        <button className={tipoF==="programado"?"on":""} onClick={()=>setTipoF("programado")}>Programado</button>
      </div>
      <div className="kcount" style={{marginTop:8}}>{fil.length} tarea(s) · {lista.length} persona(s)</div>
    </div>
    {sinHist>0 && <div className="card" style={{background:"#fff8e6",borderColor:"#f0e2bd"}}>
      <b>{sinHist} tarea(s) cerrada(s) sin tiempo de ejecución.</b> Son registros anteriores a esta versión: no guardaban
      la fecha de asignación, así que el tiempo no es comparable y se excluye del promedio.</div>}
    {!lista.length && <div className="empty"><div className="e"><Icon name="filetext" size={44}/></div><div>No hay tareas asignadas en este rango</div></div>}
    {lista.map(a=><div className="item" key={a.nombre}>
      <div className="top"><div><div className="ttl">{a.nombre}</div>
        <div className="meta">{a.resp} como responsable · {a.apoyo} como apoyo{a.abiertas?` · ${a.abiertas} abierta(s)`:""}</div></div></div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginTop:10}}>
        <M k="Cerradas" v={a.cerr}/>
        <M k="A tiempo" v={a.cerr?Math.round(100*a.aTiempo/a.cerr)+"%":"—"} c={a.cerr&&(a.aTiempo/a.cerr)<0.8?"var(--coral)":"var(--green)"}/>
        <M k="Ejecución" v={a.ejN?fmtHrs(a.ejSum/a.ejN):"—"}/>
        <M k="Horas" v={a.horas?Math.round(a.horas*10)/10:"—"}/>
        <M k="Calificación" v={a.calN?(Math.round(a.calSum/a.calN*10)/10)+" ("+a.calN+")":"—"}/>
        {a.salidas>0 && <M k="Reasignadas" v={a.salidas} c="var(--coral)"/>}
      </div>
      {a.calN>0 && a.calN<5 && <div className="meta" style={{marginTop:8}}>La calificación se basa en {a.calN} encuesta(s): tómala como referencia, no como conclusión.</div>}
    </div>)}
  </div>;
}

/* ===== LISTADO genérico ===== */
function Listado({items,render,empty}){
  if(!items.length) return <div className="empty"><div className="e"><Icon name="filetext" size={44}/></div><div>{empty}</div></div>;
  return <div>{items.map((r,i)=><div key={r.Codigo||r.id||i}>{render(r)}</div>)}</div>;
}

/* ===== KANBAN ===== */
function KanModal({proc,tabla,r,canEdit,cols,onClose,onSaved,toast,setFoto}){
  const isCom=tabla==="Compras", isSis=tabla==="Sistemas";
  const titulo=isCom?r.Modelo:isSis?r.Titulo:r.Descripcion;
  const area=isCom?r.Area:r.Departamento;
  const [estado,setEstado]=useState(r.Estado); const [com,setCom]=useState(""); const [fecha,setFecha]=useState(r.FechaTentativa||"");
  async function guardar(){ const arr=await Store.read(tabla);
    const upd=arr.map(x=>{ if(x.Codigo!==r.Codigo) return x; const o={...x,Estado:estado};
      if(com.trim()){ o.ComentarioKanban=com; if(isCom)o.ComentarioGG=com; else o.ComentarioSoporte=com; }
      if(fecha) o.FechaTentativa=fecha; return o; });
    await Store.write(tabla,upd); toast("Solicitud actualizada"); onSaved(); onClose();
  }

function Kanban({user,toast,setFoto}){
  const allMods=["compras","sistemas","mantenimiento"];
  const verTodo=esDev(user)||user.rol==='gerencia';
  const mods=verTodo?allMods:allMods.filter(m=>gestionaModulo(user,m));
  const [proc,setProc]=useState(mods[0]||"compras");
  const tabla={compras:"Compras",sistemas:"Sistemas",mantenimiento:"Mantenimiento"}[proc];
  const [rows,setRows]=useState([]); const [over,setOver]=useState(null); const drag=useRef(null);
  const [fArea,setFArea]=useState(""); const [fSolic,setFSolic]=useState(""); const [det,setDet]=useState(null);
  const load=async()=>setRows(await Store.read(tabla)); useEffect(()=>{load();setFArea("");setFSolic("");},[proc]);
  const cols=KANBAN[proc];
  const areaOf=r=>tabla==="Compras"?r.Area:r.Departamento;
  const titleOf=r=>tabla==="Compras"?r.Modelo:tabla==="Sistemas"?r.Titulo:r.Descripcion;
  const prioOf=r=>tabla==="Compras"?(r.TiempoCompra||""):tabla==="Sistemas"?(r.Urgencia||""):(r.TipoSolicitud||"");
  const isUrg=r=>{const p=prioOf(r).toLowerCase();return p.includes("urgente")||p.includes("alta");};
  const areas=[...new Set(rows.map(areaOf).filter(Boolean))].sort();
  const solics=[...new Set(rows.map(r=>r.Solicitante).filter(Boolean))].sort();
  const visibles=rows.filter(r=>(!fArea||areaOf(r)===fArea)&&(!fSolic||r.Solicitante===fSolic));
  function canEditCard(r){ if(esCerrada(r)) return false; if(esDev(user)) return true;
    if(gestionaModulo(user,proc)) return true;
    if(user.rol==='gerencia' && proc==='compras' && r.Estado==='En Gerencia') return true;
    return false; }
  async function move(code,estado){ const r=rows.find(x=>x.Codigo===code); if(!r||!canEditCard(r)) return;
    const arr=await Store.read(tabla); const rid=r.id;
    await Store.write(tabla,arr.map(x=>{
      const esteEs = (rid!=null && x.id===rid) || (rid==null && x.Codigo===code);
      if(!esteEs) return x;
      const o={...x,Estado:estado};
      if(estado!==x.Estado){ const h=Array.isArray(x.historial)?x.historial:[];
        o.historial=[...h,{estado,fecha:nowISO(),quien:user.nombre,nota:"Movido en el Kanban"}]; }
      return o;
    })); load(); toast("Movido a "+estado); }
  return <div>
    <h1 className="h1">Tablero Kanban</h1><p className="sub">Toca una tarjeta para abrirla. Podrás editar solo las que te corresponden.</p>
    {!mods.length ? <div className="empty"><div className="e">🔒</div>No tienes un tablero asignado.</div> : <>
    {mods.length>1 && <div className="seg">{mods.map(m=><button key={m} className={proc===m?"on":""} onClick={()=>setProc(m)}>{({compras:"Compras",sistemas:"Sistemas",mantenimiento:"Mantenimiento"})[m]}</button>)}</div>}
    <div className="kfilters">
      <select value={fArea} onChange={e=>setFArea(e.target.value)}><option value="">Todas las áreas</option>{areas.map(a=><option key={a}>{a}</option>)}</select>
      <select value={fSolic} onChange={e=>setFSolic(e.target.value)}><option value="">Todos los solicitantes</option>{solics.map(s=><option key={s}>{s}</option>)}</select>
      {(fArea||fSolic) && <button className="btn ghost" style={{flex:"0 0 auto"}} onClick={()=>{setFArea("");setFSolic("");}}>Limpiar</button>}
    </div>
    <div className="kcount">{visibles.length} de {rows.length} tarjeta(s){fArea?` · ${fArea}`:""}{fSolic?` · ${fSolic}`:""}</div>
    <div className="kan">{cols.map(col=>{ const cards=visibles.filter(r=>r.Estado===col);
      return <div key={col} className={"kcol"+(over===col?" over":"")} onDragOver={e=>{e.preventDefault();setOver(col);}}
        onDragLeave={()=>setOver(null)} onDrop={e=>{e.preventDefault();setOver(null); if(drag.current) move(drag.current,col);}}>
        <h4><span><span className="dotc" style={{background:colorOf(col)}}></span>{col}</span><span className="cnt">{cards.length}</span></h4>
        {cards.map(r=>{ const ed=canEditCard(r);
          return <div key={r.Codigo} className="kcard" draggable={ed}
          style={{borderLeft:`4px solid ${isOverdue(r)?cssVar("--red"):colorOf(r.Estado)}`,cursor:"pointer"}}
          onClick={()=>setDet(r)} onDragStart={()=>{ if(ed) drag.current=r.Codigo; }} onDragEnd={()=>drag.current=null}>
          <div className="kc">{r.Codigo}{isOverdue(r)?" · ⚠ vencido":""}{esCerrada(r)?" · 🔒":""}</div>
          <div className="kt">{titleOf(r)}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"6px 0 2px"}}>
            <span className="kchip">{areaOf(r)||"—"}</span>
            {prioOf(r) && <span className={"kchip"+(isUrg(r)?" urg":"")}>{prioOf(r).split(" ")[0]}</span>}</div>
          <div className="km"><Icon name="user" size={15} style={{marginRight:6}}/>{r.Solicitante}{r.FechaTentativa?` · 📅 ${fmtDate(r.FechaTentativa)}`:""}</div>
          <div className="kchip" style={{marginTop:6,display:"inline-block"}}>{ed?"Abrir / editar":"Abrir"}</div></div>;})}
        {!cards.length && <div style={{color:"#aab2b3",fontSize:12,textAlign:"center",padding:"14px 0"}}>—</div>}
      </div>;})}</div>
    {det && <KanModal proc={proc} tabla={tabla} r={det} canEdit={canEditCard(det)} cols={cols}
      onClose={()=>setDet(null)} onSaved={load} toast={toast} setFoto={setFoto}/>}
    </>}
  </div>;
}

      <div className="kv" style={{flexDirection:"column",alignItems:"flex-start",gap:4}}><b>Redirect URI (regístralo en Azure)</b>
        <code style={{fontSize:12,wordBreak:"break-all",background:"#f3efe6",padding:"4px 8px",borderRadius:8,width:"100%"}}>{APP.ms.redirectUri}</code></div>
      <div className="row" style={{marginTop:10}}>
        <button className="btn ocean" onClick={()=>setReloadKey(k=>k+1)}><Icon name="refresh" size={15} style={{marginRight:6}}/>Sincronizar</button>
        <button className="btn ghost" onClick={toggleMode}>{MODE==="graph"?"Cambiar a demo local":"Conectar a SharePoint"}</button></div>
      <div className="hint" style={{marginTop:8}}>El histórico se guarda en {MODE==="graph"?"SharePoint y se abre desde cualquier dispositivo al iniciar sesión.":"este navegador (modo demo)."}</div>
    </div>
    {MODE==="graph" && <div className="card"><h3>Diagnóstico de Listas</h3>
      <div className="hint">Si algo no se graba, toca “Probar conexión”: te dirá exactamente dónde está el problema (sitio, listas o permiso de escritura).</div>
      <div className="row" style={{marginTop:10}}>
        <button className="btn ocean" disabled={diag==="...probando..."} onClick={async()=>{ setDiag("...probando..."); try{ setDiag(await diagListas()); }catch(e){ setDiag("Error: "+(e.message||e)); } }}><Icon name="play" size={14} style={{marginRight:6}}/>Probar conexión</button>
        <button className="btn ghost" onClick={()=>{ if(confirm("Cerrar sesión de Microsoft y volver a entrar? Sirve para refrescar permisos recién concedidos.")) msSignOut(); }}><Icon name="refresh" size={15} style={{marginRight:6}}/>Reconectar Microsoft</button>
      </div>
      {diag && <pre style={{whiteSpace:"pre-wrap",background:"#0e1b22",color:"#d6f0f4",padding:12,borderRadius:10,fontSize:12.5,marginTop:10,lineHeight:1.5}}>{diag}</pre>}
    </div>}
    <div className="card"><h3>App Registration propia</h3>
      <div className="hint">Pega aquí el <b>Client ID</b> de tu propia App Registration de Azure (queda separada de la del ILD). El Tenant ID es opcional (por defecto usa el mismo).</div>
      <ClientIdForm toast={toast}/></div>
    <div className="card"><h3>Exportar histórico a Excel</h3>
      <div className="row">{["ILD","Compras","Sistemas","Mantenimiento"].map(t=><button key={t} className="btn green" onClick={()=>exportar(t)}><Icon name="download" size={15} style={{marginRight:6}}/>{t}</button>)}</div>
      <div className="hint" style={{marginTop:8}}>Cada jefatura también puede exportar sus ILD desde ILD → bandeja.</div></div>
    <div className="card"><h3>Histórico de ILD</h3>
      <div className="hint">Carga los <b>{typeof ILD_SEED!=="undefined"?ILD_SEED.length:0} ILD reales</b> (junio) en el almacenamiento, sin duplicar los ya cargados.</div>
      <button className="btn ocean block" style={{marginTop:10}} onClick={cargarHistorico}><Icon name="inbox" size={15} style={{marginRight:6}}/>Cargar histórico de ILD</button></div>
    <NotifConfig toast={toast}/>
    <DeleteRecords toast={toast}/>
    <RenombrarPersona toast={toast}/>
    <ReasignarResp toast={toast}/>
    <div className="card"><h3>Usuarios y aprobadores</h3>
      <div className="hint">La gestión de colaboradores, áreas asignadas, PINs y aprobadores se hace en <b>ILD → Configurar</b> (rol Desarrollador). Personalización de checklists en <b>ILD → Checklist</b>.</div></div>
  </div>;
}

/* Aviso permanente de formularios sin enviar. Se ve desde cualquier pantalla,
   así el pendiente no queda escondido dentro de una pestaña. */
function AvisoPendientes({user,toast}){
  const [n,setN]=useState(0); const [enviando,setEnviando]=useState(false);
  const [online,setOnline]=useState(navigator.onLine);
  const contar=async()=>{ try{ setN((await Cola.todas(user.nombre)).length); }catch(e){} };
  useEffect(()=>{ contar(); const t=setInterval(contar,20000);
    const on=()=>{ setOnline(true); auto(); }, off=()=>setOnline(false);
    window.addEventListener("online",on); window.addEventListener("offline",off);
    return ()=>{ clearInterval(t); window.removeEventListener("online",on); window.removeEventListener("offline",off); }; },[user]);
  async function auto(){ if(Cola.ocupado()) return; const r=await Cola.enviar(user.nombre); await contar();
    if(r.ok) toast(`Se enviaron ${r.ok} formulario(s) que estaban pendientes. ✅`); }
  async function ahora(){ if(Cola.ocupado()){ toast("Ya se está enviando."); return; }
    setEnviando(true);
    try{ const r=await Cola.enviar(user.nombre); await contar();
      if(r.sinRed) toast("Sigues sin conexión.");
      else if(r.conf) toast(`${r.conf} cambio(s) quedaron en conflicto: revísalos en “Sin enviar”.`);
      else if(r.fail) toast(`Enviados ${r.ok} de ${r.total}. ${r.fail} siguen pendientes.`);
      else toast(`Listo: ${r.ok} pendiente(s) enviado(s). ✅`);
    } finally { setEnviando(false); } }
  if(!n) return null;
  return <div style={{background:"#FFF4E0",border:"1px solid #F3D9A6",borderLeft:"4px solid #FFA11F",
    borderRadius:10,padding:"10px 12px",marginBottom:10,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
    <div style={{flex:1,minWidth:170,fontSize:13,color:"#7a5a12"}}>
      📥 <b>{n} formulario(s) sin enviar.</b> {online?"Ya hay conexión.":"Se enviarán solos cuando vuelva el internet."}</div>
    <button className="btn primary" style={{padding:"8px 12px",fontSize:13}} disabled={!online||enviando} onClick={ahora}>
      {enviando?"Enviando…":"Enviar ahora"}</button>
  </div>;
}

function BottomNav({user,view,go,counts}){
  const items=[{id:"home",t:"Inicio",icon:"home"}];
  if(puede(user,'ild')) items.push({id:"ild",t:"ILD",icon:"clipboard"});
  if(puede(user,'compras')) items.push({id:"compras",t:"Compras",icon:"cart"});
  if(puede(user,'sistemas')) items.push({id:"sistemas",t:"Sistemas",icon:"monitor"});
  if(puede(user,'mantenimiento')) items.push({id:"mantenimiento",t:"Manten.",icon:"wrench"});
  if(puede(user,'kanban')) items.push({id:"kanban",t:"Kanban",icon:"kanban"});
  if(esDev(user)) items.push({id:"admin",t:"Config",icon:"gear"});
  if(items.length<2) return null;
  return <nav className="bnav">{items.map(it=>{ const on=view===it.id;
    return <button key={it.id} className={on?"on":""} onClick={()=>go(it.id)}>
      <span className="bic"><Icon name={it.icon} size={21}/>
        {it.id!=="home" && counts[it.id]>0 && <span className="bbadge"/>}</span>
      <span className="bl">{it.t}</span></button>; })}</nav>;
}

/* ===== APP ROOT ===== */
function App(){
  const [user,setUser]=useState(()=>{ try{return JSON.parse(sessionStorage.getItem("pp_user"))}catch{return null} });
  const [view,setView]=useState("home"); const [toastMsg,setToastMsg]=useState(""); const [counts,setCounts]=useState({});
  const [foto,setFoto]=useState(null); const [gerr,setGerr]=useState(""); const [cfgVer,setCfgVer]=useState(0);
  const [connected,setConnected]=useState(MODE!=="graph"); const [checking,setChecking]=useState(MODE==="graph");
  const [notifs,setNotifs]=useState([]); const [notifOpen,setNotifOpen]=useState(false); const [detailIld,setDetailIld]=useState(null); const [detailKan,setDetailKan]=useState(null);
  const bump=()=>setCfgVer(v=>v+1);
  async function loadNotifs(u){ const who=u||user; if(!who) return;
    try{ const all=await Store.read("Notif"); setNotifs(all.filter(n=>n.para===who.nombre)); }catch{} }
  async function abrirNotif(n){
    try{ await Store.remove("Notif", n.id); }catch{}
    try{ const ilds=await Store.read("ILD"); const rec=ilds.find(r=>r.id===n.ildId); if(rec) setDetailIld(rec); }catch{}
    setNotifOpen(false); loadNotifs();
  }
  useEffect(()=>{ (async()=>{
    if(MODE==="graph"){ const ok=await msEnsure(); setConnected(ok);
      if(ok){ try{ applyIldConfig(await cfgRead()); }catch{}
        try{ if(!localStorage.getItem("pp_hist_v1")){
          const pares=[["ILD",ILD_SEED],["Compras",COMPRAS_SEED],["Sistemas",SISTEMAS_SEED],["Mantenimiento",MANT_SEED]];
          for(const [t,seed] of pares){ if(seed && seed.length){ const cur=await Store.read(t); if(!cur.length){ await Store.write(t,seed); } } }
          localStorage.setItem("pp_hist_v1","1"); } }catch(e){}
        bump(); } }
    setChecking(false);
  })(); },[]);
  const toast=m=>{ setToastMsg(m); const dur=/no se pudo|error|❌|403|falló|no encontr|presupuesto/i.test(m)?8000:2600; setTimeout(()=>setToastMsg(""),dur); };
  async function reloadCounts(u){ const who=u||user; if(!who) return;
    const c=await Store.read("Compras"), s=await Store.read("Sistemas"), m=await Store.read("Mantenimiento"), il=await Store.read("ILD");
    const pendChief=(arr,mod,abiertos)=> gestionaModulo(who,mod) ? arr.filter(r=>abiertos.includes(r.Estado)).length
      : arr.filter(r=>r.Solicitante===who.nombre&&!cerrados.includes(r.Estado)).length;
    setCounts({
      compras:pendChief(c,"compras",["Solicitado","En Gerencia","En compra","Listo para entregar"]),
      sistemas:pendChief(s,"sistemas",["Nuevo","Sin fecha asignada","En proceso"]),
      mantenimiento:pendChief(m,"mantenimiento",["Nuevo","Sin fecha asignada","En proceso"]),
      ild:(esGD(who)||who.rol==='aprobador')?il.filter(r=>r.estado==='Pendiente'&&(esGD(who)||(who.areas||[]).includes(r.area))).length:0
    });
  }
  useEffect(()=>{ if(user){ reloadCounts(); loadNotifs(); } },[user,view,cfgVer]);
  useEffect(()=>{ if(!user || !DEEPLINK || window.__deepDone) return; window.__deepDone=true;
    const map={ILD:"ild",Compras:"compras",Sistemas:"sistemas",Mantenimiento:"mantenimiento"};
    const v=map[DEEPLINK.mod]; if(!v) return; setView(v);
    if(!DEEPLINK.code) return;
    (async()=>{ try{
      if(DEEPLINK.mod==="ILD"){ const ilds=await Store.read("ILD");
        const rec=ilds.find(r=>String(r.id)===String(DEEPLINK.code)||r.Codigo===DEEPLINK.code); if(rec) setDetailIld(rec); }
      else { const tabla=DEEPLINK.mod; const arr=await Store.read(tabla);
        const rec=arr.find(r=>r.Codigo===DEEPLINK.code||String(r.id)===String(DEEPLINK.code)); if(rec) setDetailKan({tabla,r:rec}); }
    }catch(e){} })();
  },[user]);
  async function onLogin(u){ sessionStorage.setItem("pp_user",JSON.stringify(u)); setUser(u); setView("home"); }
  function logout(){ sessionStorage.removeItem("pp_user"); setUser(null); setView("home"); }
  if(MODE==="graph" && checking) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Playa Paraíso</div>
    <div className="ltag" style={{marginBottom:0}}>Conectando con SharePoint…</div></div></div>;
  if(MODE==="graph" && !connected) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Playa Paraíso</div>
    <div className="ltag">Inicia sesión con tu cuenta Microsoft para usar la app. El histórico se guarda en SharePoint (Prueba7).</div>
    <button className="btn ocean block" onClick={()=>msSignIn()}><Icon name="link" size={15} style={{marginRight:6}}/>Iniciar sesión con Microsoft</button>
    {msErr && <div className="lerr" style={{marginTop:12,whiteSpace:"normal"}}>{msErr}</div>}
  </div></div>;
  if(!user) return <Login onLogin={onLogin}/>;
  const rolLbl={desarrollador:"Desarrollador",gerencia:"Gerencia",aprobador:"Aprobador",colaborador:"Colaborador"}[user.rol]||user.rol;
  const titles={ild:"ILD",compras:"Compras",sistemas:"Sistemas",mantenimiento:"Mantenimiento",kanban:"Kanban",admin:"Configuración"};
  return <div className="app">
    <div className="topbar"><div className="brand"><span className="logobox" onClick={()=>setView("home")} style={{cursor:"pointer"}}><img src={LOGO} alt="Playa Paraíso"/></span></div><div className="sp"></div>
      <div className="who">{user.nombre}<br/><span style={{opacity:.85}}>{rolLbl}</span></div>
      <button className="iconbtn" title="Notificaciones" style={{position:"relative"}} onClick={()=>setNotifOpen(true)}><Icon name="bell" size={19}/>
        {notifs.length>0 && <span style={{position:"absolute",top:-4,right:-4,background:"var(--coral)",color:"#fff",borderRadius:"999px",fontSize:10,fontWeight:800,minWidth:18,height:18,display:"grid",placeItems:"center",padding:"0 4px"}}>{notifs.length}</span>}</button>
      <button className="iconbtn" title="Salir" onClick={logout}><Icon name="logout" size={19}/></button></div>
    <div className="content">
      {gerr && <div className="banner"><Icon name="alert" size={15} style={{marginRight:6}}/>{gerr}</div>}
      <AvisoPendientes user={user} toast={toast}/>
      {view!=="home" && <div className="backrow"><button className="backbtn" onClick={()=>setView("home")}><Icon name="chevronLeft" size={16} style={{marginRight:6,marginLeft:-2}}/>Inicio</button>
        <span style={{color:"var(--muted)",fontWeight:600}}>{titles[view]}</span></div>}
      {view==="home" && <Home user={user} go={setView} counts={counts}/>}
      {view==="ild" && <ILD key={cfgVer} user={user} toast={toast} setFoto={setFoto} bump={bump}/>}
      {view==="compras" && <Compras user={user} toast={toast} setFoto={setFoto}/>}
      {view==="sistemas" && <Tickets tipo="Sistemas" user={user} toast={toast} setFoto={setFoto}/>}
      {view==="mantenimiento" && <Tickets tipo="Mantenimiento" user={user} toast={toast} setFoto={setFoto}/>}
      {view==="kanban" && <Kanban user={user} toast={toast} setFoto={setFoto}/>}
      {view==="admin" && <Admin user={user} toast={toast}/>}
    </div>
    <BottomNav user={user} view={view} go={setView} counts={counts}/>
    {toastMsg && <div className="toast">{toastMsg}</div>}
    <FotoModal src={foto} onClose={()=>setFoto(null)}/>
    {notifOpen && <Modal title="Notificaciones" onClose={()=>setNotifOpen(false)}>
      {!notifs.length && <div className="empty"><div className="e"><Icon name="inbox" size={44}/></div>No tienes notificaciones</div>}
      {notifs.map(n=><div key={n.id} className="item" style={{cursor:"pointer"}} onClick={()=>abrirNotif(n)}>
        <div className="ttl" style={{fontSize:14}}>{n.texto}</div>
        <div className="meta">{fmtDT(n.fecha)} · toca para ver el ILD</div></div>)}
      {notifs.length>0 && <div className="hint">Al abrir una notificación, se marca como leída y desaparece.</div>}
    </Modal>}
    {detailIld && <ILDDetail user={user} r={detailIld} onClose={()=>{setDetailIld(null);loadNotifs();}} reload={()=>{}} toast={toast} setFoto={setFoto}/>}
    {detailKan && <KanModal proc={detailKan.tabla.toLowerCase()} tabla={detailKan.tabla} r={detailKan.r} canEdit={false} cols={[]} onClose={()=>setDetailKan(null)} onSaved={()=>{}} toast={toast} setFoto={setFoto}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
(function(){
  function show(msg){ var r=document.getElementById("root"); if(r&&r.children.length>0)return;
    r.innerHTML='<div style="max-width:560px;margin:40px auto;padding:20px;font-family:Inter,system-ui,sans-serif;color:#1f2a2c">'+
      '<h2 style="color:#0d6e75">Playa Paraíso no pudo cargar</h2><p style="color:#6c7a7c">'+msg+'</p>'+
      '<p style="color:#6c7a7c;font-size:13px">Si lo ves en la vista previa, descarga el archivo y ábrelo en tu navegador o súbelo a Netlify.</p></div>'; }
  window.addEventListener("error",function(e){ show("Detalle: "+(e.message||"error al cargar un recurso")); });
  window.addEventListener("load",function(){ setTimeout(function(){
    if(typeof React==="undefined") return show("No se cargó React (la red bloqueó la CDN).");
    show("La aplicación no se inició. Abre la consola (F12) para más detalle."); },1800); });
})();
</script>
