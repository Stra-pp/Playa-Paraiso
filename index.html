<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<title>Playa Paraíso</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
:root{
  --ocean:#0d6e75; --ocean-d:#0a565c; --ocean-l:#e6f2f3;
  --sand:#f7f4ee; --surface:#ffffff; --line:#e7e2d8;
  --ink:#1f2a2c; --muted:#6c7a7c;
  --coral:#e8663d; --coral-d:#cf5530;
  --green:#1f9d6b; --amber:#e0a32e; --red:#d34c4c; --blue:#3a78c2; --gray:#9aa6a7; --purple:#7e57c2;
  --shadow:0 1px 2px rgba(16,40,42,.06),0 8px 24px rgba(16,40,42,.08);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px}
.app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--ocean);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;padding-top:max(14px,env(safe-area-inset-top))}
.topbar .brand{font-weight:800;letter-spacing:.2px;font-size:18px;display:flex;align-items:center;gap:9px}
.topbar .logobox{background:#fff;border-radius:9px;padding:5px 11px;display:inline-flex;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.topbar .logobox img{height:26px;display:block}
.loginlogo{display:flex;justify-content:center;margin:2px 0 14px}
.loginlogo img{height:62px;max-width:80%;object-fit:contain}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(232,102,61,.25)}
.topbar .sp{flex:1}
.topbar .who{font-size:13px;opacity:.95;text-align:right;line-height:1.2}
.iconbtn{color:#fff;background:rgba(255,255,255,.14);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.iconbtn:active{transform:scale(.96)}
.content{flex:1;padding:16px;padding-bottom:46px}
.backrow{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
.backbtn{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.h1{font-size:22px;font-weight:800;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px;transition:transform .08s}
.tile:active{transform:translateY(1px) scale(.995)}
.tile .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;color:#fff}
.tile .t{font-weight:700;font-size:16px}
.tile .d{color:var(--muted);font-size:12.5px;line-height:1.35}
.tile .badge{align-self:flex-start;background:var(--ocean-l);color:var(--ocean-d);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:16px}
.field{margin-bottom:13px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
.field .req{color:var(--coral)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink)}
.inp:focus,textarea.inp:focus,select.inp:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 3px var(--ocean-l)}
textarea.inp{min-height:88px;resize:vertical}
.hint{color:var(--muted);font-size:12px;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:13px;padding:13px 18px;font-size:15px}
.btn.primary{background:var(--coral);color:#fff}
.btn.primary:active{background:var(--coral-d)}
.btn.ocean{background:var(--ocean);color:#fff}
.btn.ocean:active{background:var(--ocean-d)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn.amber{background:var(--amber);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill .pdot{width:7px;height:7px;border-radius:50%}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:11px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .code{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.item .ttl{font-weight:700;font-size:15px;margin:3px 0 2px;line-height:1.3}
.item .meta{font-size:12.5px;color:var(--muted)}
.item .acts{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:46px 16px}
.empty .e{font-size:40px}
.seg{display:flex;background:#eee9df;border-radius:13px;padding:4px;gap:4px;margin-bottom:14px;overflow:auto}
.seg button{flex:1;white-space:nowrap;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ocean-d);box-shadow:var(--shadow)}
/* checklist ILD */
.crow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;background:#fff;cursor:pointer}
.crow.on{border-color:var(--green);background:#f1faf5}
.cbox{width:26px;height:26px;border-radius:8px;border:2px solid #cdd5d4;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
.crow.on .cbox{background:var(--green);border-color:var(--green)}
.ctext{font-size:14px;font-weight:500}
.qcard{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;background:#fff}
.qcard .qt{font-weight:600;font-size:13.5px;margin-bottom:9px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:84px;text-align:center;border:2px solid var(--line);border-radius:10px;padding:9px 8px;font-weight:700;font-size:13px;color:var(--muted)}
.opt.on{border-color:var(--ocean);background:var(--ocean-l);color:var(--ocean-d)}
.opt.si.on{border-color:var(--green);background:#e9f7f0;color:var(--green)}
.opt.no.on{border-color:var(--red);background:#fdeeee;color:var(--red)}
.pbar{height:8px;background:#e8e2d6;border-radius:6px;overflow:hidden;margin:8px 0 14px}
.pbar i{display:block;height:100%;background:var(--ocean);transition:width .25s}
.fgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fthumb{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.fthumb img{width:100%;height:100%;object-fit:cover}
.fdel{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px}
.fnum{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;font-size:10px;padding:0 5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv b{color:var(--muted);font-weight:600}
.note{border-radius:12px;padding:12px 13px;margin:10px 0;font-size:13.5px}
.note.obs{background:#fff8e1;border:1px solid #ffe0a3}
.note.jef{background:#f3eafc;border:1px solid #d9c2f0}
.note.ger{background:#e9f7f0;border:1px solid #aedcc6}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.kpi .kn{font-size:22px;font-weight:800}
.kpi .kl{font-size:11px;color:var(--muted);margin-top:2px}
.barline{margin-bottom:11px}
.barline .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
.barwrap{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#eee7da}
.stars{display:flex;gap:4px;font-size:24px}
.stars span{cursor:pointer;color:#d8d2c5}
.stars span.on{color:var(--amber)}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.kcol{flex:0 0 80%;max-width:300px;background:#efe9de;border-radius:16px;padding:11px}
@media(min-width:760px){.kcol{flex:0 0 250px}}
.kcol h4{margin:2px 4px 10px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.kcol h4 .cnt{background:#fff;border-radius:999px;font-size:12px;padding:1px 9px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;box-shadow:var(--shadow)}
.kcol.over{outline:2px dashed var(--ocean);outline-offset:-4px}
.kchip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#eef3f6;color:#3c5b66}
.kchip.urg{background:#fbe6e6;color:#a83232}
.kcol h4 .dotc{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
.kfilters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kfilters select{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:14px}
.kcount{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.dgrp{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.dgrp .ghead{background:var(--ocean);color:#fff;font-weight:800;font-size:13px;letter-spacing:.4px;padding:11px 14px;display:flex;align-items:center;gap:8px}
.dscroll{overflow-x:auto}
.dtable{width:100%;border-collapse:collapse;min-width:560px}
.dtable th{background:#f6f2ea;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:9px 8px;text-align:center;white-space:nowrap}
.dtable th:first-child{text-align:left;padding-left:14px}
.dtable td{padding:11px 8px;text-align:center;border-top:1px solid #f0ebe1;font-size:13.5px;white-space:nowrap}
.dtable td:first-child{text-align:left;padding-left:14px;font-weight:700}
.dnum{display:inline-block;min-width:34px;border:1px solid var(--line);border-radius:9px;padding:3px 6px;font-weight:700;background:#fff}
.dnum.g{color:var(--green);border-color:#bfe6d3}
.dnum.p{color:var(--purple);border-color:#ddccf0}
.dcirc{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;font-weight:800;font-size:12px;border:2.5px solid}
.ddias{font-size:11px;color:var(--muted)}
.kcard .kc{font-size:11px;color:var(--muted);font-weight:700}
.kcard .kt{font-weight:600;font-size:13.5px;margin:3px 0;line-height:1.3}
.kcard .km{font-size:11.5px;color:var(--muted)}
.kcard select{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:12.5px}
.ovl{position:fixed;inset:0;background:rgba(16,30,32,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.ovl{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:620px){.modal{border-radius:20px}}
.modal h3{margin:0 0 12px;font-size:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:13px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:90%;text-align:center}
.banner{background:#fff7e8;border:1px solid #f0d9a0;color:#8a6512;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.ver{font-size:11px;color:var(--muted);text-align:center;padding:18px 0 8px}
.fotomodal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.fotomodal img{max-width:96vw;max-height:90vh;border-radius:10px;object-fit:contain}
.fotomodal .x{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px}
/* ===== LOGIN (rediseñado) ===== */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;
  background:radial-gradient(120% 80% at 50% -10%, #14808a 0%, var(--ocean) 42%, var(--ocean-d) 78%, #073e43 100%)}
.login .sun{position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,196,140,.45) 0%, rgba(232,102,61,.12) 55%, transparent 70%);pointer-events:none}
.login .wave{position:absolute;bottom:0;left:0;right:0;height:120px;background:
  radial-gradient(120% 100% at 50% 120%, rgba(255,255,255,.10), transparent 60%);pointer-events:none}
.lcard{position:relative;z-index:2;background:rgba(255,255,255,.97);border-radius:24px;padding:26px 22px;width:100%;max-width:380px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);text-align:center}
.lbrand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:800;color:var(--ocean-d)}
.lbrand .dot{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px rgba(232,102,61,.18)}
.ltag{color:var(--muted);font-size:13px;margin:4px 0 20px}
.lchoice{display:flex;flex-direction:column;gap:11px}
.lbig{display:flex;align-items:center;gap:13px;text-align:left;border:1.5px solid var(--line);border-radius:15px;padding:15px;background:#fff;transition:.12s}
.lbig:active{transform:scale(.99)}
.lbig.pri{border-color:var(--ocean);background:var(--ocean-l)}
.lbig .e{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;flex:0 0 auto}
.lbig .tt{font-weight:700;font-size:15px;color:var(--ink)}
.lbig .dd{font-size:12px;color:var(--muted);margin-top:1px}
.lsel{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:13px;font-size:15px;background:#fff;margin-bottom:14px}
.ldots{display:flex;gap:13px;justify-content:center;margin:4px 0 18px;height:16px}
.ldots i{width:14px;height:14px;border-radius:50%;background:#e2ddd2;transition:.15s}
.ldots i.f{background:var(--coral);transform:scale(1.05)}
.lpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lpad button{height:58px;border-radius:14px;background:#f3efe6;color:var(--ink);font-size:22px;font-weight:600;border:1px solid var(--line)}
.lpad button:active{background:var(--ocean-l)}
.lpad button.fn{font-size:14px;font-weight:700;color:var(--muted);background:#fff}
.lback{margin-top:16px;color:var(--ocean-d);font-weight:700;font-size:14px;background:none}
.lerr{color:var(--red);font-weight:600;font-size:13px;min-height:18px;margin-top:8px}
.lfoot{position:relative;z-index:2;color:rgba(255,255,255,.8);font-size:11px;margin-top:18px}

/* ===== Pulido visual (Fase 1) ===== */
svg{display:inline-block;vertical-align:middle}
.h1{letter-spacing:-.3px}
.tile{transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease}
.tile .ico{transition:transform .12s ease}
.card{transition:box-shadow .14s ease}
.item{transition:box-shadow .12s ease, transform .08s ease}
.iconbtn{transition:background .12s ease, transform .06s ease}
.btn{transition:filter .12s ease, background .12s ease, transform .06s ease}
.btn:active{transform:translateY(1px)}
@media(hover:hover){
  .tile:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(16,40,42,.15);border-color:#d8d2c5}
  .tile:hover .ico{transform:scale(1.06)}
  .item:hover{box-shadow:0 8px 22px rgba(16,40,42,.11)}
  .btn.primary:hover,.btn.ocean:hover,.btn.green:hover,.btn.amber:hover,.btn.red:hover{filter:brightness(1.05)}
  .btn.ghost:hover,.backbtn:hover{background:#faf8f3;border-color:#d8d2c5}
  .iconbtn:hover{background:rgba(255,255,255,.24)}
  .lbig:hover{border-color:var(--ocean);box-shadow:0 6px 18px rgba(13,110,117,.10)}
  .seg button:not(.on):hover{color:var(--ocean-d)}
}

/* ===== Navegación inferior (Fase 2) ===== */
.content{padding-bottom:86px}
.bnav{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:920px;z-index:40;
  display:flex;gap:2px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding:6px 6px max(6px,env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(16,40,42,.07)}
@supports((-webkit-backdrop-filter:blur(8px)) or (backdrop-filter:blur(8px))){
  .bnav{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}}
.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;border-radius:12px;color:var(--muted);font-weight:700;font-size:10.5px;line-height:1;transition:color .12s,background .12s}
.bnav button .bic{position:relative;display:grid;place-items:center;height:22px}
.bnav button .bl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav button.on{color:var(--ocean-d);background:var(--ocean-l)}
.bnav button:active{transform:scale(.93)}
.bbadge{position:absolute;top:-3px;right:-6px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:1.5px solid #fff}
@media(hover:hover){.bnav button:not(.on):hover{color:var(--ocean-d);background:#f3efe6}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef} = React;

const AC={
  'Recepción Apertura':        {r:9,  g:'Recepción',    t:'Apertura', turno:false},
  'Recepción Cierre':          {r:7,  g:'Recepción',    t:'Cierre',   turno:false},
  'Áreas Públicas':            {r:10, g:'Housekeeping', t:'Diurno',   turno:false},
  'Habitaciones':              {r:6,  g:'Housekeeping', t:'Diurno',   turno:false},
  'Servicio A la Carta':       {r:2,  g:'Servicio',     t:'Diurno',   turno:false},

function defaultPuede(u,cap){
  if(!u) return false;
  const [mod,sub]=cap.split(".");
  if(!sub){
    if(cap==='compras') return u.rol!=='colaborador';
    if(cap==='sistemas'||cap==='mantenimiento') return true;
    if(cap==='ild') return ildAreasDe(u).length>0 || esGD(u);
    if(cap==='kanban') return esGD(u) || ["compras","sistemas","mantenimiento"].some(m=>(u.gestiona||[]).includes(m));
    return true;
  }
  if(sub==='gestion') return gestionaModulo(u,mod);
  if(sub==='tablero') return gestionaModulo(u,mod) || esGD(u);
  if(cap==='kanban.editar') return esDev(u) || (u.gestiona||[]).length>0;
  return false;
}

  if(ACCESOS && ACCESOS[u.rol] && (cap in ACCESOS[u.rol])) return !!ACCESOS[u.rol][cap];

/* Identificador único, en texto.
   El esquema original (Date.now()%100000 y sumar 1) repetía la semilla cada 100
   segundos: dos equipos que abrían la app con esa diferencia generaban los mismos
   ids, y uno terminaba sobrescribiendo los registros del otro sin aviso.
   Un número tampoco alcanza: por encima de 2^53 se pierde precisión, así que solo
   quedan 3 dígitos libres por milisegundo (1000 valores) y en ráfaga colisiona.
   Con texto se combinan tres cosas y la unicidad queda garantizada:
     - el milisegundo
     - 4 caracteres al azar, fijos por dispositivo y sesión
     - un contador que avanza dentro del mismo milisegundo
   Se usa solo [a-z0-9] para que también sirva como nombre de carpeta. */
const _gidDev = Math.random().toString(36).slice(2,6).padEnd(4,"0");
let _gidT = 0, _gidN = 0;
const gid = () => {
  const t = Date.now();
  if(t === _gidT) _gidN++; else { _gidT = t; _gidN = 0; }
  return t.toString(36) + _gidDev + _gidN.toString(36);
};

function comprimirImg(dataUrl,maxPx=900,q=0.75){
  return new Promise(res=>{ const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){const s=Math.min(maxPx/w,maxPx/h);w=Math.round(w*s);h=Math.round(h*s);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q)); };
    img.onerror=()=>res(dataUrl); img.src=dataUrl; });
}

const GBASE="https://graph.microsoft.com/v1.0";
async function gfetch(path,method="GET",body=null,raw=false,headers=null){
  const h={Authorization:`Bearer ${graphToken}`};
  if(headers) Object.assign(h,headers);
  if(body && !(body instanceof ArrayBuffer)) h["Content-Type"]="application/json";
  else if(body instanceof ArrayBuffer) h["Content-Type"]="application/octet-stream";
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),30000);
  let r; try{ r=await fetch(GBASE+path,{method,headers:h,body:body?(body instanceof ArrayBuffer?body:JSON.stringify(body)):null,signal:ctrl.signal}); }
  catch(e){ clearTimeout(to); throw new Error("conexión: "+(e.name==="AbortError"?"tiempo de espera agotado":e.message)); }
  clearTimeout(to);
  if(r.status===204) return null;
  if(!r.ok){ let extra=""; try{ const j=await r.json(); extra=j.error&&j.error.message?(" — "+j.error.message):""; }catch{} throw new Error(method+" "+path.split("?")[0]+": "+r.status+extra); }
  return raw?r.arrayBuffer():r.json();
}

      return JSON.parse(new TextDecoder().decode(buf)); }catch{ return []; } },
  async write(t,arr){
    const buf=new TextEncoder().encode(JSON.stringify(arr));

  async ensureCarpeta(carpetaId){ const folder=`${APP.ms.base}/${APP.ms.fotosFolder}`;

const recFecha=r=>String(r.fecha||r.FechaSolicitud||r.FechaCreacion||"").slice(0,10);
const recEstado=r=>String(r.estado||r.Estado||"");

async function spSite(){ if(SP_SITE) return SP_SITE;

// Descubre el nombre INTERNO real de cada columna y asegura una columna de datos multilínea
async function spEnsureCols(site,lid,t){ if(SP_COLS[t]) return;
  let cols=[]; try{ const r=await gfetch(`/sites/${site}/lists/${lid}/columns?$select=name,displayName,text,readOnly,hidden`); cols=r.value||[]; }catch(e){}
  const findBy=pred=>cols.find(pred);
  // 1. columna de datos: busca "Data" (interno o visible); si no, cualquier multilínea editable; si no, la crea
  let dcol = findBy(c=>c.name==="Data") || findBy(c=>norm(c.displayName)==="data")
          || findBy(c=>c.text&&c.text.allowMultipleLines&&!c.readOnly&&!c.hidden&&c.name!=="Title");
  if(!dcol){ try{ const c=await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Data",text:{allowMultipleLines:true}}); dcol=c; }catch(e){} }
  SP_DCOL[t]=dcol?dcol.name:"Data";
  // 2. Fecha / Estado opcionales: usa el nombre interno real si existe; si no, intenta crear
  const fcol=findBy(c=>norm(c.displayName)==="fecha"||c.name==="Fecha");
  const ecol=findBy(c=>norm(c.displayName)==="estado"||c.name==="Estado");
  SP_COLS[t]={d:SP_DCOL[t], f:fcol?fcol.name:null, e:ecol?ecol.name:null};
  if(!fcol){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Fecha",text:{}}); SP_COLS[t].f="Fecha"; }catch(e){} }
  if(!ecol){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Estado",text:{}}); SP_COLS[t].e="Estado"; }catch(e){} }
}
async function spEnsureList(t){ const site=await spSite();
  if(SP_LIST[t]){ await spEnsureCols(site,SP_LIST[t],t); return SP_LIST[t]; }
  const name=APP.ms.lists[t];
  const all=await gfetch(`/sites/${site}/lists?$select=id,displayName,name&$top=200`);
  SP_LISTNAMES=(all.value||[]).map(l=>l.displayName);
  let hit=(all.value||[]).find(l=>l.displayName===name||l.name===name)
        ||(all.value||[]).find(l=>norm(l.displayName)===norm(name)||norm(l.name)===norm(name));
  if(hit){ SP_LIST[t]=hit.id; await spEnsureCols(site,hit.id,t); return hit.id; }
  try{ const created=await gfetch(`/sites/${site}/lists`,"POST",{displayName:name,
      columns:[{name:"Data",text:{allowMultipleLines:true}},{name:"Fecha",text:{}},{name:"Estado",text:{}}],
      list:{template:"genericList"}}); SP_LIST[t]=created.id; await spEnsureCols(site,created.id,t); return created.id;
  }catch(e){ throw new Error(`No encontré la lista "${name}". Existentes: ${SP_LISTNAMES.join(", ")||"(ninguna)"}. Crea esa lista o renómbrala.`); } }
function spMerge(t,items){ const dcol=SP_DCOL[t]||"Data"; const map=SP_MAP[t]||new Map();
  items.forEach(it=>{ const d=it.fields&&it.fields[dcol]; if(!d) return; let rec; try{rec=JSON.parse(d);}catch{return;}
    map.set(rec.id,{spId:it.id,hash:d}); }); SP_MAP[t]=map; }
async function spPages(t,query){ const site=await spSite(); const lid=await spEnsureList(t);
  let url=`/sites/${site}/lists/${lid}/items?$expand=fields&$top=500${query?("&"+query):""}`;
  const items=[]; while(url){ const page=await gfetch(url.replace(GBASE,""),"GET",null,false,PREFER_NX);
    (page.value||[]).forEach(x=>items.push(x)); url=page["@odata.nextLink"]||null; } return items; }
function spParse(t,items){ const dcol=SP_DCOL[t]||"Data";
  return items.map(it=>{ try{return JSON.parse(it.fields[dcol]);}catch{return null;} }).filter(Boolean); }
const ListStore={
  async read(t){ const items=await spPages(t,""); spMerge(t,items); return spParse(t,items); },
  async readDesde(t,since){ await spEnsureList(t); const c=SP_COLS[t]||{};
    if(!c.f) return (await this.read(t)).filter(r=>recFecha(r)>=since);
    try{ const items=await spPages(t,`$filter=fields/${c.f} ge '${since}'`); spMerge(t,items); return spParse(t,items); }
    catch(e){ return (await this.read(t)).filter(r=>recFecha(r)>=since); } },
  async readRango(t,desde,hasta){ await spEnsureList(t); const c=SP_COLS[t]||{};
    if(!c.f) return (await this.read(t)).filter(r=>recFecha(r)>=desde&&recFecha(r)<hasta);
    try{ const items=await spPages(t,`$filter=fields/${c.f} ge '${desde}' and fields/${c.f} lt '${hasta}'`); spMerge(t,items); return spParse(t,items); }
    catch(e){ return (await this.read(t)).filter(r=>recFecha(r)>=desde&&recFecha(r)<hasta); } },
  async write(t,arr){ const site=await spSite(); const lid=await spEnsureList(t); const c=SP_COLS[t]||{d:"Data"};
    if(!SP_MAP[t]) await this.read(t); const map=SP_MAP[t]||new Map();
    for(const rec of arr){ const j=JSON.stringify(rec); const m=map.get(rec.id);
      const full={Title:String(rec.Codigo||rec.id||"").slice(0,255)}; full[c.d||"Data"]=j;
      if(c.f) full[c.f]=recFecha(rec); if(c.e) full[c.e]=recEstado(rec);
      const basico={Title:full.Title}; basico[c.d||"Data"]=j;
      if(!m){ let cr; try{ cr=await gfetch(`/sites/${site}/lists/${lid}/items`,"POST",{fields:full}); }
          catch(e){ cr=await gfetch(`/sites/${site}/lists/${lid}/items`,"POST",{fields:basico}); }
        map.set(rec.id,{spId:cr.id,hash:j}); }
      else if(m.hash!==j){ try{ await gfetch(`/sites/${site}/lists/${lid}/items/${m.spId}/fields`,"PATCH",full); }
          catch(e){ await gfetch(`/sites/${site}/lists/${lid}/items/${m.spId}/fields`,"PATCH",basico); } m.hash=j; } }
    SP_MAP[t]=map; },
  async remove(t,id){ const site=await spSite(); const lid=await spEnsureList(t); const dcol=SP_DCOL[t]||"Data";
    const items=await spPages(t,""); let n=0;
    for(const it of items){ let r; try{ r=JSON.parse(it.fields[dcol]); }catch{ continue; }
      if(r && (r.id===id || r.Codigo===id)){ await gfetch(`/sites/${site}/lists/${lid}/items/${it.id}`,"DELETE"); n++; } }
    if(SP_MAP[t]) SP_MAP[t].delete(id);
    if(!n) throw new Error("No se encontró ese registro en la lista (quizá ya estaba borrado)."); }
};

/* ===== CONFIGURACIÓN ILD (checklist, áreas, aprobadores, usuarios, días esperados) ===== */
const DIAS_CFG = {
  feriados: [],            // fechas YYYY-MM-DD marcadas como feriado
  feriadosOpera: true,     // ¿en feriado se sigue inspeccionando? (por defecto sí)
  areas: {},               // areas[area] = {patron:'diario'|'finde'|'vsd'|'personalizado', dias:[0..6]}
  excepciones: {},         // excepciones["YYYY-MM-DD"] = { todas:0|1, areas:{ [area]:0|1 }, motivo:"" }
  ocupacion: {},           // ocupacion["YYYY-MM-DD"] = porcentaje
  reglaOcup: { activa:false, umbral:40, areas:[] }  // bajo ese umbral, estas áreas no aplican
};
function patronDias(p){ return p==='finde'?[0,6]:p==='vsd'?[0,5,6]:p==='diario'?[0,1,2,3,4,5,6]:null; }
function isoYMD(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }

/* ¿Le toca a esta área inspeccionar este día? Se resuelve en tres capas,
   y la primera que decide manda:
     1. Excepción puntual de esa fecha (lo que dijo la jefatura ese día)
     2. Regla por ocupación (si el hotel está bajo, ciertas áreas no aplican)
     3. Patrón base del área por día de la semana
   Sirve para responder "hoy cocina no, pero recepción sí". */
function aplicaDia(area, iso){
  if(!iso) return false;
  const ex = (DIAS_CFG.excepciones||{})[iso];
  if(ex){
    if(ex.areas && ex.areas[area]!=null) return !!ex.areas[area];
    if(ex.todas!=null) return !!ex.todas;
  }
  const rg = DIAS_CFG.reglaOcup||{};
  if(rg.activa && (rg.areas||[]).indexOf(area)>=0){
    const oc = (DIAS_CFG.ocupacion||{})[iso];
    if(oc!=null && oc!=="" && Number(oc) < Number(rg.umbral||0)) return false;
  }
  if((DIAS_CFG.feriados||[]).indexOf(iso)>=0 && DIAS_CFG.feriadosOpera===false) return false;
  const cfg = DIAS_CFG.areas[area] || {patron:'diario'};
  let set = cfg.patron==='personalizado' ? (cfg.dias||[]) : patronDias(cfg.patron);
  if(!set) set=[0,1,2,3,4,5,6];
  return set.indexOf(new Date(iso+"T00:00:00").getDay())>=0;
}
/* ¿Este día tiene una decisión manual, distinta de lo que dice el patrón? */
function esExcepcion(area, iso){
  const ex=(DIAS_CFG.excepciones||{})[iso];
  if(!ex) return false;
  if(ex.areas && ex.areas[area]!=null) return true;
  return ex.todas!=null;
}
function diasEsperados(area,year,month,hastaHoy){
  const hoy=new Date(); const lastDay=new Date(year,month+1,0).getDate();
  const limit = (hastaHoy && hoy.getFullYear()===year && hoy.getMonth()===month) ? hoy.getDate() : lastDay;
  let n=0; for(let d=1; d<=limit; d++) if(aplicaDia(area,isoYMD(year,month,d))) n++;
  return n;
}

async function sendMail(to,subject,html){
  if(!NOTIF.enabled) return {ok:false,reason:"notificaciones desactivadas"};
  if(!APP.useGraph) return {ok:false,reason:"estás en modo demo local; inicia sesión con Microsoft"};
  if(!graphToken) return {ok:false,reason:"sin sesión de Microsoft (vuelve a iniciar sesión)"};
  const dest=(Array.isArray(to)?to:[to]).filter(Boolean).map(a=>({emailAddress:{address:String(a).trim()}}));
  if(!dest.length) return {ok:false,reason:"sin destinatario configurado"};
  try{
    let r=await postMail(graphToken,dest,subject,html);
    if(r.status===401||r.status===403){ const tk=await mailStepUp(); if(tk){ r=await postMail(tk,dest,subject,html); } }
    if(r.ok || r.status===202) return {ok:true};
    let m=""; try{ const j=await r.json(); m=(j.error&&j.error.message)?j.error.message:(j.error&&j.error.code)||""; }catch{}
    let ayuda="";
    if(r.status===403) ayuda=" · Falta consentimiento de Mail.Send o el buzón no permite envío. Usa 'Reconectar Microsoft'.";
    else if(r.status===401) ayuda=" · Sesión vencida: usa 'Reconectar Microsoft'.";
    else if(/MailboxNotEnabled|inactive|on-premise/i.test(m)) ayuda=" · La cuenta con la que iniciaste sesión no tiene buzón de correo activo.";
    return {ok:false,reason:(r.status+(m?(" — "+m):""))+ayuda};
  }catch(e){ return {ok:false,reason:e.message}; }
}

/* ===== MÓDULO ILD ===== */
function ILD({user,toast,setFoto,bump}){
  const esDevv = esDev(user); const esGer = user.rol==='gerencia';
  const puedeRevisar = esGD(user) || user.rol==='aprobador';
  const showNuevo = !esGer;                                  // Gerencia no ingresa ILD
  const showChecklist = (user.rol==='aprobador' || esDevv);  // Gerencia no edita checklist
  const [tab,setTab]=useState(esGer?"bandeja":"nuevo");
  const [regs,setRegs]=useState([]);
  const [drafts,setDrafts]=useState([]);
  const cargarDrafts=async()=>{ try{ setDrafts(await Cola.todas(user.nombre)); }catch(e){} };
  async function enviarPendientes(silencioso){
    if(!navigator.onLine){ if(!silencioso)toast("Aún sin conexión. Intenta cuando tengas internet."); return; }
    const pend=await Cola.todas(user.nombre); if(!pend.length){ if(!silencioso)toast("No hay formularios pendientes por enviar."); return; }
    if(Cola.ocupado()){ if(!silencioso)toast("Ya se está enviando. Espera un momento."); return; }
    if(!silencioso) toast("Enviando pendientes…");
    const r=await Cola.enviar(user.nombre, cargarDrafts); await cargarDrafts(); load();
    if(r.ocupado) return;
    const yaEstaban = r.dup ? ` ${r.dup} ya se habían aplicado antes (no se duplicaron).` : "";
    const enConflicto = r.conf ? ` ${r.conf} en conflicto: revísalos abajo.` : "";
    toast(r.fail ? `Enviados ${r.ok} de ${r.total}. ${r.fail} siguen pendientes (revisa la señal).${yaEstaban}${enConflicto}`
                 : `Listo: ${r.ok} pendiente(s) enviado(s).${yaEstaban}${enConflicto} ✅`);
  }
  const load=async()=>setRegs(await Store.readDesde("ILD", desdeDias(150)));
  useEffect(()=>{load(); cargarDrafts();},[]);
  useEffect(()=>{ const h=()=>enviarPendientes(true); window.addEventListener("online",h); return ()=>window.removeEventListener("online",h); },[user]);
  const guardarCfg=()=>{ cfgSave(); bump&&bump(); };
  return <div>
    <h1 className="h1">ILD · Inspección diaria</h1>
    <p className="sub">Lista de verificación por área y turno.</p>
    {(showNuevo||puedeRevisar||showChecklist||esDevv) && <div className="seg">
      {showNuevo && <button className={tab==="nuevo"?"on":""} onClick={()=>setTab("nuevo")}>Nuevo</button>}
      {showNuevo && <button className={tab==="mios"?"on":""} onClick={()=>{setTab("mios");load();}}>Mis ILD</button>}
      {drafts.length>0 && <button className={tab==="drafts"?"on":""} style={{color:"#7a5a12"}} onClick={()=>{setTab("drafts");cargarDrafts();}}>📥 Sin enviar ({drafts.length})</button>}
      {puedeRevisar && <button className={tab==="bandeja"?"on":""} onClick={()=>{setTab("bandeja");load();}}>{esGD(user)?"Todos":"Por aprobar"}</button>}
      {puedeRevisar && <button className={tab==="dash"?"on":""} onClick={()=>{setTab("dash");load();}}>Dashboard</button>}
      {esGD(user) && <button className={tab==="resumen"?"on":""} onClick={()=>setTab("resumen")}><Icon name="trendup" size={15} style={{marginRight:6}}/>Resumen Gerencial</button>}
      {showChecklist && <button className={tab==="check"?"on":""} onClick={()=>setTab("check")}>Checklist</button>}
      {esDevv && <button className={tab==="conf"?"on":""} onClick={()=>setTab("conf")}>Configurar</button>}
    </div>}
    {tab==="nuevo" && showNuevo && <ILDForm user={user} toast={toast} onSaved={()=>{load();setTab("mios");}} onDraft={()=>{cargarDrafts();setTab("drafts");}} setFoto={setFoto}/>}
    {tab==="mios" && showNuevo && <ILDMios user={user} regs={regs} setFoto={setFoto}/>}
    {tab==="drafts" && showNuevo && <DraftsPanel drafts={drafts} onEnviar={()=>enviarPendientes(false)} onReload={cargarDrafts} setFoto={setFoto} toast={toast}/>}
    {tab==="bandeja" && <ILDPanel user={user} regs={regs} reload={load} toast={toast} setFoto={setFoto}/>}
    {tab==="dash" && <ILDDash user={user} regs={regs}/>}
    {tab==="resumen" && <ResumenGerencialILD/>}
    {tab==="check" && showChecklist && <ChecklistEditor user={user} toast={toast} onSave={guardarCfg}/>}
    {tab==="conf" && esDevv && <ILDConfig user={user} toast={toast} onSave={guardarCfg}/>}
  </div>;
}

/* ===== Borradores offline (IndexedDB): guardar ILD en la tablet sin señal ===== */
const DDB={ _db:null,
  open(){ return new Promise((res,rej)=>{ if(this._db) return res(this._db);
    let rq; try{ rq=indexedDB.open("pp_offline",1); }catch(e){ return rej(e); }
    rq.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains("drafts")) db.createObjectStore("drafts",{keyPath:"id"}); };
    rq.onsuccess=e=>{ this._db=e.target.result; res(this._db); };
    rq.onerror=()=>rej(rq.error); }); },
  async all(){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const r=db.transaction("drafts","readonly").objectStore("drafts").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }catch(e){ return []; } },
  async put(d){ const db=await this.open(); return new Promise((res,rej)=>{ const r=db.transaction("drafts","readwrite").objectStore("drafts").put(d); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  async del(id){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const r=db.transaction("drafts","readwrite").objectStore("drafts").delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }catch(e){} }
};
/* =========================================================================
   COLA DE ENVÍO ÚNICA — ILD, Compras, Sistemas y Mantenimiento
   -------------------------------------------------------------------------
   Todo formulario se guarda primero en esta cola y luego se envía. Un solo
   camino para con señal y sin señal, así no hay dos formas de crear un registro.

   Cómo se evita el envío duplicado:
   1. El id del registro se crea al LLENAR el formulario, no al enviarlo.
      Si un envío se corta a medias y se reintenta, la capa de datos reconoce
      ese id y actualiza el registro en vez de crear otro.
   2. Antes de crear se consulta si el id ya está en SharePoint. Si el intento
      anterior sí llegó, no se vuelve a crear: solo se limpia la cola.
   3. Un candado permite un solo envío a la vez. El evento "online" se dispara
      varias veces cuando la señal va y viene, y antes eso lanzaba envíos en paralelo.
   4. Si una foto no se sube, el envío falla completo y el formulario se queda
      en la cola para reintentarlo. Antes se guardaba la referencia rota y la
      evidencia se perdía sin aviso.
   ========================================================================= */

/* Código secuencial a partir del mayor existente (no del conteo: si se borraba
   un registro, el conteo volvía atrás y repetía un código ya usado). */
function nextCodeUnico(prefix, arr){
  const pre = prefix + "-" + yr() + "-";
  let max = 0;
  const usados = new Set();
  (arr||[]).forEach(x=>{ const c = String(x.Codigo||""); usados.add(c);
    if(c.indexOf(pre)===0){ const n = parseInt(c.slice(pre.length),10); if(isFinite(n) && n>max) max = n; } });
  let n = max + 1;
  while(usados.has(pre + String(n).padStart(4,"0"))) n++;
  return pre + String(n).padStart(4,"0");
}

/* Sube las fotos y falla si alguna no llegó, para poder reintentar. */
async function subirFotosEstricto(fotos, dir, prefijo){
  const r = await subirFotos(fotos, dir, prefijo);
  const malas = (r||[]).filter(f=>f && f.error).length;
  if(malas) throw new Error(`No se pudieron subir ${malas} de ${r.length} foto(s)`);
  return r;
}

const Cola = {
  /* Encola un CAMBIO sobre un registro que ya existe (aprobar, concluir, asignar…). */
  async cambio(payload, quien){
    const it = { id: gid(), tabla: payload.tabla, quien: quien||"", conflicto:"",
                 payload: { ...payload, clase:"cambio", patchId: payload.patchId || ("p"+gid()), creado: nowISO() },
                 intentos: 0, error: "", createdAt: nowISO() };
    await DDB.put(it); return it;
  },
  /* Reintenta un cambio que quedó marcado como conflicto, pisando lo que haya. */
  async forzar(id){
    const ds = await DDB.all(); const d = ds.find(x=>x.id===id); if(!d) return;
    await DDB.put({ ...d, conflicto:"", error:"", payload:{ ...d.payload, forzar:true } });
  },
  /* Encola un registro ya construido por su módulo. rec.id debe venir puesto. */
  async add(payload, quien){
    const it = { id: gid(), tabla: payload.tabla, quien: quien||"", payload,
                 intentos: 0, error: "", createdAt: nowISO() };
    await DDB.put(it); return it;
  },
  /* Incluye los borradores del formato anterior (kind:"ILD") para no perderlos. */
  async todas(quien){
    const ds = await DDB.all();
    const out = [];
    for(const d of ds){
      if(d.payload && d.payload.tabla){ out.push(d); }
      else if(d.kind==="ILD" && d.payload){
        out.push({ ...d, tabla:"ILD", quien:(d.payload.usuario||""), viejo:true,
          payload:{ tabla:"ILD", viejo:true, rec:null, crudo:d.payload,
            fotos:d.payload.fotos||[], fotoField:"fotos", prefijo:"ILD",
            resumen:{ titulo:d.payload.area||"ILD", sub:d.payload.zona||d.payload.turno||"" } } });
      }
    }
    return quien ? out.filter(d=>(d.quien||"")===quien) : out;
  },
  async del(id){ await DDB.del(id); },
  _enviando: false,
  ocupado(){ return this._enviando; },
  async enviar(quien, onPaso){
    if(this._enviando) return { ocupado:true, ok:0, fail:0, dup:0, conf:0, total:0 };
    if(!navigator.onLine) return { sinRed:true, ok:0, fail:0, dup:0, conf:0, total:0 };
    this._enviando = true;
    let ok=0, fail=0, dup=0, conf=0, ultimo="", err="";
    try{
      const ds = await this.todas(quien);
      for(const d of ds){
        try{
          const esCambio = d.payload && d.payload.clase==="cambio";
          const r = esCambio ? await colaAplicarCambio(d) : await colaEnviarUno(d);
          if(r.conflicto){
            conf++;
            await DDB.put({ ...d, conflicto:`Mientras estabas sin señal, alguien lo cambió a "${r.actual}". Tu cambio esperaba "${r.esperado}".` });
            if(onPaso) try{ await onPaso(); }catch(_){}
            continue;
          }
          if(r.dup) dup++; else { ok++; ultimo = r.codigo || ""; }
          await DDB.del(d.id);
        }catch(e){
          fail++; err = String((e && e.message) || e).slice(0,200);
          try{ await DDB.put({ ...d, intentos:(d.intentos||0)+1, error:err }); }catch(_){}
        }
        if(onPaso) try{ await onPaso(); }catch(_){}
      }
      return { ok, fail, dup, conf, total: ds.length, ultimo, err };
    } finally { this._enviando = false; }
  }
};

async function colaEnviarUno(d){
  const pl = d.payload;
  const tabla = pl.tabla;

  /* Los borradores del formato viejo no traían id: se les asigna uno y se
     guarda ANTES de intentar, para que un reintento use el mismo. */
  if(pl.viejo && !pl.recId){
    pl.recId = gid();
    await DDB.put({ ...d, payload: pl });
  }
  const idReg = pl.viejo ? pl.recId : (pl.rec && pl.rec.id);
  if(!idReg) throw new Error("El registro no tiene id");

  const arr = await Store.read(tabla);

  /* ¿El intento anterior sí llegó? Entonces no se crea nada. */
  const ya = arr.find(x=>x.id===idReg);
  if(ya) return { dup:true, codigo: ya.Codigo };

  const Codigo = nextCodeUnico(pl.prefijo, arr);
  const campoFotos = pl.fotoField || "Fotos";

  /* Carpeta y prefijo de las fotos: {COD} y {ID} se reemplazan al enviar. */
  const sust = t => String(t||"").replace(/\{COD\}/g, Codigo).replace(/\{ID\}/g, idReg);
  let fotosData = [];
  if((pl.fotos||[]).length) fotosData = await subirFotosEstricto(pl.fotos, sust(pl.fotoDir), sust(pl.fotoPrefix));

  let cotizData = null;
  if(pl.cotiz){
    cotizData = await subirCotiz(pl.cotiz, sust(pl.fotoDir), Codigo);
    if(cotizData && cotizData.error) throw new Error("No se pudo subir la cotización");
  }

  let nuevo;
  if(pl.viejo){
    /* Reconstruye un ILD del formato anterior. */
    const c = pl.crudo;
    nuevo = { id:idReg, Codigo, area:c.area, turno:c.turno||"", selecciones:c.sel||{}, usuario:c.usuario,
      fecha:c.fecha||nowISO(), checks:c.checks||{}, textos:c.txt||{}, fotos:fotosData, obs:c.obs||"",
      estado:"Pendiente", notaJef:"", aprobador:"", fechaAprobacion:"", notaGerencia:"",
      totalItems:c.totalItems||1, completados:c.completados||0,
      clItems:c.clItems||(CL[c.area]||[]), aprobadorEsperado:APR[c.area]||"—" };
    if(c.zona) nuevo.zona = c.zona;
  } else {
    nuevo = { ...pl.rec, Codigo, [campoFotos]: fotosData };
    if(pl.cotizField && cotizData) nuevo[pl.cotizField] = cotizData;
  }

  await Store.write(tabla, [nuevo, ...arr]);
  try{ colaNotificar(pl.notif, nuevo); }catch(e){}
  return { codigo: Codigo };
}

/* Aplica un cambio sobre un registro existente.
   Tres protecciones:
   - Si el cambio ya se aplicó antes (patchId registrado), no se repite: evita
     que un avance o una línea de historial se duplique al reintentar.
   - Si el registro cambió de estado mientras el equipo estaba sin señal, NO se
     pisa: se marca como conflicto y la persona decide.
   - Los agregados a arreglos (avances) se calculan sobre el registro fresco,
     no sobre la copia vieja que tenía el equipo. */
async function colaAplicarCambio(d){
  const pl = d.payload, tabla = pl.tabla;
  const arr = await Store.read(tabla);
  const rec = arr.find(x=>x.id===pl.recId) || (pl.recCodigo ? arr.find(x=>x.Codigo===pl.recCodigo) : null);
  if(!rec) throw new Error("El registro ya no existe: "+(pl.recCodigo||pl.recId));

  const hechos = Array.isArray(rec.cambiosAplicados) ? rec.cambiosAplicados : [];
  if(pl.patchId && hechos.indexOf(pl.patchId)>=0) return { dup:true, codigo:rec.Codigo };

  /* ILD guarda el estado en "estado" y los demás módulos en "Estado". */
  const campoEst = pl.campoEstado || "Estado";
  if(!pl.forzar && pl.estadoPrevio!=null && rec[campoEst]!=null && rec[campoEst]!==pl.estadoPrevio)
    return { conflicto:true, actual:rec[campoEst], esperado:pl.estadoPrevio, codigo:rec.Codigo };

  const extra = {};
  if((pl.fotos||[]).length){
    const sust = t => String(t||"").replace(/\{COD\}/g, rec.Codigo).replace(/\{ID\}/g, rec.id);
    extra[pl.fotoField||"FotosCierre"] = await subirFotosEstricto(pl.fotos, sust(pl.fotoDir), sust(pl.fotoPrefix));
  }

  const nuevo = { ...rec, ...(pl.patch||{}), ...extra };
  (pl.appends||[]).forEach(a=>{ const prev = Array.isArray(rec[a.campo]) ? rec[a.campo] : []; nuevo[a.campo] = [...prev, a.item]; });

  if(pl.patch && pl.patch.Estado && pl.patch.Estado!==rec.Estado){
    const h = Array.isArray(rec.historial) ? rec.historial : [];
    nuevo.historial = [...h, { estado:pl.patch.Estado, fecha:pl.creado||nowISO(), quien:d.quien||"", nota:(pl.nota||"").slice(0,300) }];
  }
  if(pl.patch && pl.patch.estado && pl.patch.estado!==rec.estado){
    const h = Array.isArray(rec.historial) ? rec.historial : [];
    nuevo.historial = [...h, { estado:pl.patch.estado, fecha:pl.creado||nowISO(), quien:d.quien||"", nota:(pl.nota||"").slice(0,300) }];
  }
  if(pl.patchId) nuevo.cambiosAplicados = [...hechos, pl.patchId].slice(-50);

  /* Se escribe el arreglo completo a propósito: en modo local la escritura
     reemplaza la tabla. En SharePoint solo se actualiza el registro que cambió. */
  await Store.write(tabla, arr.map(x=>x===rec ? nuevo : x));
  try{ if(pl.avisar) await avisarCambio(pl, nuevo); }catch(e){}
  return { codigo: rec.Codigo };
}

async function avisarCambio(pl, nuevo){
  const a = pl.avisar;
  if(a.notif==="ildDecidido"){ Notif.ildDecidido(nuevo, a.quien); }
  else if(a.notif==="ticketFinalizado"){ Notif.ticketFinalizado(nuevo, a.tipo); }
  for(const p of (a.para||[])) await addNotif(p.nombre, p.texto, p.ildId||"", p.codigo||nuevo.Codigo||"");
}

function colaNotificar(n, nuevo){
  if(!n) return;
  if(n.t==="ild") Notif.ildSubido(nuevo, n.usuario);
  else if(n.t==="ticket") Notif.ticketNuevo(nuevo, n.usuario, n.tipo);
  else if(n.t==="compra") Notif.comprasNueva(nuevo, n.usuario);
}

function ILDPanel({user,regs,reload,toast,setFoto}){
  const [filtro,setFiltro]=useState("todos"); const [per,setPer]=useState(90); const [det,setDet]=useState(null); const [fGrupo,setFGrupo]=useState("__todas");
  const lim=new Date(); lim.setDate(lim.getDate()-per);
  let base=regs.filter(r=>new Date(r.fecha)>=lim);
  const esSuyo=r=>(user.areas||[]).includes(r.area)||r.aprobadorEsperado===user.nombre||r.aprobador===user.nombre;
  if(!esGD(user)) base=base.filter(esSuyo);
  const grupoDe=r=>(AC[r.area]&&AC[r.area].g)||"(otros)";
  const gruposBandeja=[...new Set(base.map(grupoDe).filter(Boolean))].sort();
  if(filtro!=="todos") base=base.filter(r=>r.estado===filtro);
  if(fGrupo!=="__todas") base=base.filter(r=>grupoDe(r)===fGrupo);
  // Histórico completo de la jefatura (para exportar, sin filtro de período)
  const mios=esGD(user)?regs:regs.filter(esSuyo);
  function exportar(){ if(!mios.length){toast("No hay ILD para exportar");return;}
    const ok=exportXLSX(mios.map(ildToRow),"ILD",`ILD_${esGD(user)?"General":user.nombre.replace(/\s+/g,"_")}_${yr()}`);
    if(ok) toast("Exportando "+mios.length+" ILD…"); }
  return <div>
    <div className="row" style={{justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <span style={{color:"var(--muted)",fontSize:13}}>{mios.length} ILD en tu histórico</span>
      <button className="btn green" style={{padding:"9px 14px"}} onClick={exportar}><Icon name="download" size={15} style={{marginRight:6}}/>Exportar Excel</button>
    </div>
    <div className="seg">
      {[["todos","Todos"],["Pendiente","Pendientes"],["Aprobado","Aprobados"],["Con observaciones","Con obs."]].map(([k,l])=>
        <button key={k} className={filtro===k?"on":""} onClick={()=>setFiltro(k)}>{l}</button>)}
    </div>
    <Field label="Filtrar por grupo"><select className="inp" value={fGrupo} onChange={e=>setFGrupo(e.target.value)}>
      <option value="__todas">Todos los grupos ({gruposBandeja.length})</option>
      {gruposBandeja.map(g=><option key={g} value={g}>{g}</option>)}</select></Field>
    <div className="row" style={{marginBottom:12}}>
      {[[30,"30d"],[90,"90d"],[365,"1 año"]].map(([d,l])=>
        <button key={d} className={"btn "+(per===d?"ocean":"ghost")} style={{padding:"8px 14px"}} onClick={()=>setPer(d)}>{l}</button>)}
    </div>
    {!base.length && <div className="empty"><div className="e"><Icon name="inbox" size={44}/></div>No hay ILD en este período</div>}
    {base.map(r=><div key={r.id} className="item" onClick={()=>setDet(r)}>
      <div className="top"><div>
        <div className="code">{r.Codigo||("ILD #"+r.id)}</div>
        <div className="ttl">{r.area}{r.turno?` · ${r.turno}`:""}</div>
        <div className="meta">{r.usuario} · {fmtDT(r.fecha)} · 📷 {(r.fotos||[]).length} · ✓ {r.completados}/{r.totalItems}</div>
      </div><Pill estado={r.estado==="Con observaciones"?"Con observaciones":r.estado==="Aprobado"?"Aprobado":"Solicitado"}/></div></div>)}
    {det && <ILDDetail user={user} r={det} onClose={()=>setDet(null)} reload={reload} toast={toast} setFoto={setFoto}/>}
  </div>;
}

function ILDMios({user,regs,setFoto}){
  const [det,setDet]=useState(null);
  const mios=regs.filter(r=>r.usuario===user.nombre).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const ap=mios.filter(r=>r.estado==='Aprobado').length, ob=mios.filter(r=>r.estado==='Con observaciones').length, pe=mios.filter(r=>r.estado==='Pendiente').length;
  return <div>
    <div className="kpis">
      {[["Total",mios.length,"--blue"],["Aprobados",ap,"--green"],["Con obs.",ob,"--purple"],["Pendientes",pe,"--amber"]].map(([l,v,c])=>
        <div className="kpi" key={l} style={{borderTop:"3px solid "+cssVar(c)}}><div className="kn" style={{color:cssVar(c)}}>{v}</div><div className="kl">{l}</div></div>)}
    </div>
    {!mios.length && <div className="empty"><div className="e"><Icon name="clipboard" size={44}/></div>Aún no has subido ILD</div>}
    {mios.map(r=><div key={r.id} className="item" onClick={()=>setDet(r)} style={{cursor:"pointer"}}>
      <div className="top"><div>
        <div className="code">{r.Codigo||("ILD-"+r.id)}</div>
        <div className="ttl">{r.area}{r.turno?` · ${r.turno}`:""}</div>
        <div className="meta">{fmtDT(r.fecha)}{r.aprobador?` · revisó: ${r.aprobador}`:""}</div></div>
        <Pill estado={r.estado==="Con observaciones"?"Con observaciones":r.estado==="Aprobado"?"Aprobado":"Solicitado"}/></div>
      {(r.notaJef||r.notaGerencia) && <div className="meta" style={{marginTop:6}}><Icon name="chat" size={15} style={{marginRight:6}}/>Toca para ver el comentario</div>}</div>)}
    {det && <ILDDetail user={user} r={det} onClose={()=>setDet(null)} reload={()=>{}} toast={()=>{}} setFoto={setFoto}/>}
  </div>;
}
function SpImg({foto,idx,onClick}){
  const [src,setSrc]=useState(foto.data||"");
  useEffect(()=>{ let url; let vivo=true;
    if(!foto.data && foto.path && MODE==="graph"){
      (async()=>{ try{ url=await GraphStore.getImg(foto.path); if(vivo) setSrc(url); }catch(e){} })(); }
    return ()=>{ vivo=false; if(url) URL.revokeObjectURL(url); };
  },[]);
  if(src) return <div className="fthumb"><img src={src} onClick={()=>onClick&&onClick(src)}/><span className="fnum">{idx}</span></div>;
  if(foto.spUrl) return <a className="fthumb" href={foto.spUrl} target="_blank" rel="noreferrer" style={{display:"grid",placeItems:"center",background:"#eef3f6",color:"var(--ocean-d)",fontSize:11,fontWeight:700,textDecoration:"none",textAlign:"center"}}><Icon name="link" size={15}/><br/>Foto {idx}</a>;
  if(foto.error) return <div className="fthumb" style={{display:"grid",placeItems:"center",background:"#f6efe9",fontSize:11,color:"#b06a4a",textAlign:"center"}}><Icon name="alert" size={15}/><br/>No subió</div>;
  if(!foto.data && !foto.path) return <div className="fthumb" style={{display:"grid",placeItems:"center",background:"#f3efe6",fontSize:11,color:"#999"}}>—</div>;
  return <div className="fthumb" style={{display:"grid",placeItems:"center",background:"#f3efe6",fontSize:18}}><Icon name="clock" size={16}/></div>;
}
function actaILD(r){
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const f=d=>d?new Date(d).toLocaleString('es-EC'):'—';
  const items=itemsDe(r);
  const filas=items.map((it,i)=>{ const tx=itemText(it),tp=itemTipo(it); let val="—";
    if(tp==='sino'){ const v=(r.checks&&r.checks['yn-'+i])||""; val=v==='si'?'Sí':v==='no'?'No':'—'; }
    else if(tp==='texto'){ val=(r.textos&&r.textos[i])||'—'; }
    else if(tp==='apertura_cierre'||tp==='comida'){ val=(r.selecciones&&r.selecciones[i])||'—'; }
    else { val=(r.checks&&r.checks[i])?'✓':'○'; }
    return `<tr><td>${i+1}. ${esc(tx)}</td><td style="text-align:center;font-weight:700">${esc(val)}</td></tr>`; }).join("");
  const cod=r.Codigo||("ILD-"+r.id);
  const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>ILD ${esc(cod)}</title>
  <style>body{font-family:'Segoe UI',Arial,sans-serif;color:#1b2a32;max-width:760px;margin:26px auto;padding:0 26px;line-height:1.5}
  h1{font-size:21px;margin:6px 0 4px}.tag{display:inline-block;background:#dff3e6;color:#1c7a4a;padding:4px 12px;border-radius:7px;font-weight:700;font-size:13px}
  .kv{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:4px 0;font-size:14px}.kv b{color:#0b3b46}
  table{width:100%;border-collapse:collapse;margin-top:10px}td{border-bottom:1px solid #f0f0f0;padding:6px 4px;font-size:13px}
  th{text-align:left;border-bottom:2px solid #0b6b7a;padding:6px 4px;font-size:13px}
  .note{margin-top:12px;padding:10px;border-radius:8px;background:#f6f4ee;font-size:13px}</style></head><body>
  <div class="tag">${esc(r.estado)}</div>
  <h1>ILD No. ${esc(cod)} — ${esc(r.area)}${r.turno?` · ${esc(r.turno)}`:""}</h1>
  <div class="kv"><b>Responsable</b><span>${esc(r.usuario)}</span></div>
  <div class="kv"><b>Fecha</b><span>${f(r.fecha)}</span></div>
  <div class="kv"><b>Aprobado por</b><span>${esc(r.aprobador||'—')}</span></div>
  <div class="kv"><b>Fecha de aprobación</b><span>${f(r.fechaAprobacion)}</span></div>
  <div class="kv"><b>Ítems completados</b><span>${esc((r.completados||0)+"/"+(r.totalItems||0))}</span></div>
  <table><tr><th>Ítem del checklist</th><th style="text-align:center">Resultado</th></tr>${filas}</table>
  ${r.obs?`<div class="note"><b>Nota del colaborador:</b> ${esc(r.obs)}</div>`:""}
  ${r.notaJef?`<div class="note"><b>Comentario de ${esc(r.aprobador)}:</b> ${esc(r.notaJef)}</div>`:""}
  ${r.notaGerencia?`<div class="note"><b>Gerencia:</b> ${esc(r.notaGerencia)}</div>`:""}
  <script>window.onload=function(){setTimeout(function(){try{window.print();}catch(e){}},300);};<\/script>
  </body></html>`;
  try{
    const blob=new Blob([html],{type:"text/html"}); const url=URL.createObjectURL(blob);
    const w=window.open(url,"_blank");
    if(!w){ const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(()=>{ try{URL.revokeObjectURL(url);}catch(e){} },60000);
  }catch(e){ alert("No se pudo abrir el PDF: "+(e.message||e)); }
}
function ILDDetail({user,r,onClose,reload,toast,setFoto}){
  const items=itemsDe(r);
  const esApro=user.rol==='aprobador'&&(user.areas||[]).includes(r.area);
  const esGer=user.rol==='gerencia', esDevv=user.rol==='desarrollador';
  const puedeAprobar=esDevv||esApro||esGer;
  const puedeReAprobar=esApro && r.estado!=='Pendiente';
  const puedeNotaGer=(esGer||esDevv) && r.estado!=='Pendiente';
  const [nota,setNota]=useState(r.notaJef||""); const [notaGer,setNotaGer]=useState(r.notaGerencia||"");
  async function setEstado(ok){
    const cod=r.Codigo||("ILD-"+r.id);
    const nuevoEstado=ok?"Aprobado":"Con observaciones";
    await Cola.cambio({ tabla:"ILD", recId:r.id, recCodigo:r.Codigo||"", campoEstado:"estado",
      estadoPrevio:r.estado,
      patch:{ estado:nuevoEstado, notaJef:nota, aprobador:user.nombre, fechaAprobacion:nowISO() },
      nota:nota||"",
      avisar:{ notif:"ildDecidido", quien:user.nombre, para:[{ nombre:r.usuario,
        texto: nota?`${user.nombre} realizó un comentario sobre el ILD No. ${cod}`:`${user.nombre} revisó tu ILD No. ${cod}`,
        ildId:r.id, codigo:cod }] },
      resumen:{ titulo:"→ "+nuevoEstado+" · "+cod, sub:"ILD · "+(r.area||"") } }, user.nombre);
    const res=await Cola.enviar(user.nombre);
    if(res.ok||res.dup) toast(ok?"ILD aprobado":"Con observaciones");
    else toast(res.sinRed
      ? "Sin señal: la revisión quedó guardada y se aplicará sola cuando vuelva el internet."
      : "La revisión quedó guardada en este equipo. Se reintentará.");
    reload(); onClose();
  }
  async function guardarGer(){
    const cod=r.Codigo||("ILD-"+r.id);
    const txt=`${user.nombre} realizó un comentario sobre el ILD No. ${cod}`;
    const para=[{nombre:r.usuario,texto:txt,ildId:r.id,codigo:cod}];
    if(r.aprobador && r.aprobador!==r.usuario) para.push({nombre:r.aprobador,texto:txt,ildId:r.id,codigo:cod});
    await Cola.cambio({ tabla:"ILD", recId:r.id, recCodigo:r.Codigo||"", campoEstado:"estado",
      patch:{ notaGerencia:notaGer, notaGerenciaAutor:user.nombre, notaGerenciaFecha:nowISO() },
      nota:notaGer||"", avisar:{ para },
      resumen:{ titulo:"Nota de gerencia · "+cod, sub:"ILD · "+(r.area||"") } }, user.nombre);
    const res=await Cola.enviar(user.nombre);
    toast((res.ok||res.dup) ? "Nota de gerencia guardada"
      : res.sinRed ? "Sin señal: la nota quedó guardada y se aplicará sola cuando vuelva el internet."
      : "La nota quedó guardada en este equipo. Se reintentará.");
    reload(); onClose();
  }
  return <Modal title={(r.Codigo||("ILD #"+r.id))} onClose={onClose}>
    {[["Área",r.area+(r.turno?` · ${r.turno}`:"")],["Responsable",r.usuario],["Fecha",fmtDT(r.fecha)],
      ["Aprobador esperado",r.aprobadorEsperado||"—"],["Ítems",`${r.completados}/${r.totalItems}`],
      ["Estado",r.estado]].map(([k,v])=><div className="kv" key={k}><b>{k}</b><span>{v}</span></div>)}
    <button className="btn ocean block" style={{margin:"10px 0"}} onClick={()=>actaILD(r)}><Icon name="filetext" size={15} style={{marginRight:6}}/>Descargar PDF del ILD</button>
    <h3 style={{margin:"14px 0 6px"}}>Checklist</h3>
    {items.map((it,i)=>{ const tx=itemText(it),tp=itemTipo(it);
      let val;
      if(tp==='sino'){ const v=(r.checks&&r.checks['yn-'+i])||""; val=v==='si'?<b style={{color:"var(--green)"}}>✅ Sí</b>:v==='no'?<b style={{color:"var(--red)"}}>❌ No</b>:<span style={{color:"#bbb"}}>—</span>; }
      else if(tp==='texto'){ const v=(r.textos&&r.textos[i])||""; val=<span style={{color:v?"#333":"#bbb",fontStyle:"italic"}}>{v||"—"}</span>; }
      else if(tp==='apertura_cierre'||tp==='comida'){ const v=(r.selecciones&&r.selecciones[i])||""; val=v?<b style={{color:"var(--ocean)"}}>{v}</b>:<span style={{color:"#bbb"}}>—</span>; }
      else { val=<span style={{color:r.checks&&r.checks[i]?"var(--green)":"#ccc"}}>{r.checks&&r.checks[i]?"✓":"○"}</span>; }
      return <div key={i} style={{display:"flex",justifyContent:"space-between",gap:10,padding:"7px 0",borderBottom:"1px solid #f3efe6",fontSize:13}}>
        <span style={{flex:1}}>{i+1}. {tx}</span>{val}</div>;
    })}
    {(r.fotos||[]).length>0 && <><h3 style={{margin:"14px 0 6px"}}>Fotos ({r.fotos.length})</h3>
      <div className="fgrid">{r.fotos.map((f,i)=><SpImg key={i} foto={f} idx={i+1} onClick={setFoto}/>)}</div></>}
    {r.obs && <div className="note obs"><b><Icon name="edit" size={15} style={{marginRight:6}}/>Nota del colaborador</b><div>{r.obs}</div></div>}
    {r.notaJef && <div className="note jef"><b><Icon name="chat" size={15} style={{marginRight:6}}/>{r.aprobador} · {fmtDT(r.fechaAprobacion)}</b><div>{r.notaJef}</div></div>}
    {r.notaGerencia && <div className="note ger"><b><Icon name="building" size={15} style={{marginRight:6}}/>Gerencia</b><div>{r.notaGerencia}</div></div>}

    {puedeAprobar && r.estado==='Pendiente' && <div className="card" style={{marginTop:12}}>
      <h3>Aprobación</h3>
      <textarea className="inp" placeholder="Observación (opcional)…" value={nota} onChange={e=>setNota(e.target.value)}/>
      <div className="row" style={{marginTop:10}}>
        <button className="btn green" onClick={()=>setEstado(true)}>✅ Aprobar</button>
        <button className="btn amber" onClick={()=>setEstado(false)}><Icon name="edit" size={15} style={{marginRight:6}}/>Con obs.</button></div></div>}
    {puedeReAprobar && <div className="card" style={{marginTop:12}}><h3>Modificar evaluación</h3>
      <textarea className="inp" value={nota} onChange={e=>setNota(e.target.value)}/>
      <div className="row" style={{marginTop:10}}>
        <button className="btn green" onClick={()=>setEstado(true)}>Cambiar a Aprobado</button>
        <button className="btn amber" onClick={()=>setEstado(false)}>Cambiar a Con obs.</button></div></div>}
    {puedeNotaGer && <div className="card" style={{marginTop:12}}><h3>Nota de Gerencia</h3>
      <textarea className="inp" value={notaGer} onChange={e=>setNotaGer(e.target.value)}/>
      <button className="btn ocean block" style={{marginTop:10}} onClick={guardarGer}>Guardar nota</button></div>}
  </Modal>;
}

function colorCumpl(p){ return p>=85?"--green":p>=50?"--amber":"--red"; }
function ILDDash({user,regs}){
  const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const hoy=new Date();
  const areasUser = esGD(user)?Object.keys(AC):(user.areas||[]);
  const grupos=[...new Set(areasUser.map(a=>AC[a]?.g).filter(Boolean))];
  const [grp,setGrp]=useState("todas"); const [mes,setMes]=useState(hoy.getMonth()); const year=hoy.getFullYear();
  const esMesActual = mes===hoy.getMonth();
  // filas por grupo -> área -> turno
  const filasDe=area=>{ const ac=AC[area]; if(!ac) return [];
    const turnos = ac.turno ? ["Apertura","Cierre"] : [ac.t||"Diurno"]; return turnos; };
  function rowData(area,turno){
    const recs=regs.filter(r=>r.area===area && (AC[area]?.turno ? r.turno===turno : true)
      && new Date(r.fecha).getFullYear()===year && new Date(r.fecha).getMonth()===mes);
    const ap=recs.filter(r=>r.estado==='Aprobado').length;
    const ob=recs.filter(r=>r.estado==='Con observaciones').length;
    const pe=recs.filter(r=>r.estado==='Pendiente').length;
    const dias=diasEsperados(area,year,mes,esMesActual);
    const diasMes=diasEsperados(area,year,mes,false);
    /* Se cuentan DÍAS CUBIERTOS, no registros: dos ILD del mismo día son un día,
       y solo cuentan los días en que al área le tocaba. Así no pasa de 100%. */
    const diaDe=r=>String(r.fecha||"").slice(0,10);
    const cubiertos=new Set(recs.filter(r=>aplicaDia(area,diaDe(r))).map(diaDe)).size;
    const revisados=new Set(recs.filter(r=>r.estado!=='Pendiente'&&aplicaDia(area,diaDe(r))).map(diaDe)).size;
    /* Dos indicadores separados: enviar es del operativo, revisar es de la jefatura. */
    const cumpl=dias?Math.min(100,Math.round(cubiertos/dias*100)):0;
    const cumplRev=dias?Math.min(100,Math.round(revisados/dias*100)):0;
    const aprob=recs.filter(r=>r.fechaAprobacion);
    const horas=aprob.length?(aprob.reduce((s,r)=>s+(new Date(r.fechaAprobacion)-new Date(r.fecha)),0)/aprob.length/3600000):0;
    return {area,turno,subidos:recs.length,ap,ob,pe,dias,diasMes,cumpl,cumplRev,cubiertos,revisados,horas};
  }
  const gruposVis=(grp==="todas"?grupos:[grp]);
  const tablas=gruposVis.map(g=>{ const areasG=areasUser.filter(a=>AC[a]?.g===g);
    const rows=[]; areasG.forEach(a=>filasDe(a).forEach(t=>rows.push(rowData(a,t))));
    return {g,rows};
  }).filter(t=>t.rows.length);
  // resumen global del mes
  const allRows=tablas.flatMap(t=>t.rows);
  const tot=allRows.reduce((s,r)=>s+r.subidos,0), tAp=allRows.reduce((s,r)=>s+r.ap,0),
        tOb=allRows.reduce((s,r)=>s+r.ob,0), tPe=allRows.reduce((s,r)=>s+r.pe,0),
        tDias=allRows.reduce((s,r)=>s+r.dias,0), cumGlobal=tDias?Math.round(((tAp+tOb)/tDias)*100):0;
  function exportar(){ const rows=allRows.map(r=>({Grupo:AC[r.area]?.g,Area:r.area,Turno:r.turno,
    DiasEsperados:r.dias,DiasMes:r.diasMes,Subidos:r.subidos,Aprobados:r.ap,ConObs:r.ob,Pendientes:r.pe,
    CumplEnvio:r.cumpl+"%",CumplRevision:r.cumplRev+"%",DiasCubiertos:r.cubiertos,TiempoPromHoras:r.horas.toFixed(2)}));
    exportXLSX(rows,"Dashboard",`Dashboard_ILD_${meses[mes]}_${year}`); }
  return <div>
    <div className="row" style={{marginBottom:12}}>
      <select className="inp" style={{flex:1}} value={grp} onChange={e=>setGrp(e.target.value)}>
        <option value="todas">Todos los grupos</option>{grupos.map(g=><option key={g}>{g}</option>)}</select>
      <select className="inp" style={{flex:1}} value={mes} onChange={e=>setMes(Number(e.target.value))}>
        {meses.map((m,i)=><option key={i} value={i}>{m}</option>)}</select>
    </div>
    <div className="row" style={{justifyContent:"flex-end",marginBottom:10}}>
      <button className="btn green" style={{padding:"8px 14px"}} onClick={exportar}><Icon name="download" size={15} style={{marginRight:6}}/>Excel</button></div>
    <div className="kpis">
      {[["Total",tot,"--blue"],["Aprobados",tAp,"--green"],["Con obs.",tOb,"--purple"],
        ["Pendientes",tPe,"--amber"],["% Cumplimiento",tDias?cumGlobal+"%":"—",colorCumpl(cumGlobal)]].map(([l,v,c])=>
        <div className="kpi" key={l} style={{borderTop:"3px solid "+cssVar(c)}}>
          <div className="kn" style={{color:cssVar(c)}}>{v}</div><div className="kl">{l}</div></div>)}
    </div>
    <div className="hint" style={{margin:"-4px 0 12px"}}>Cumplimiento = (Aprobados + Con obs.) ÷ días esperados{esMesActual?` hasta hoy (día ${hoy.getDate()})`:" del mes"}.</div>

    {tablas.map(({g,rows})=><div className="dgrp" key={g}>
      <div className="ghead"><Icon name="folder" size={15} style={{marginRight:6}}/>{g.toUpperCase()}</div>
      <div className="dscroll"><table className="dtable">
        <thead><tr><th>Turno</th><th>Días</th><th>Subidos</th><th>Aprob.</th><th>Obs.</th><th>Envío</th><th>Revisión</th><th>Tiempo (h)</th></tr></thead>
        <tbody>{rows.map((r,i)=><tr key={i}>
          <td>{r.turno}<div className="ddias">{r.area}</div></td>
          <td><span className="dnum">{r.dias}</span><div className="ddias">/{r.diasMes} mes</div></td>
          <td><span className="dnum">{r.subidos}</span></td>
          <td><span className="dnum g">{r.ap}</span></td>
          <td>{r.ob?<span className="dnum p">{r.ob}</span>:<span style={{color:"#ccc"}}>–</span>}</td>
          <td><span className="dcirc" style={{borderColor:cssVar(colorCumpl(r.cumpl)),color:cssVar(colorCumpl(r.cumpl))}}>{r.cumpl}%</span>
            <div className="ddias">{r.cubiertos}/{r.dias} días</div></td>
          <td><span className="dcirc" style={{borderColor:cssVar(colorCumpl(r.cumplRev)),color:cssVar(colorCumpl(r.cumplRev))}}>{r.cumplRev}%</span></td>
          <td>{r.horas?r.horas.toFixed(2):"0.00"}</td></tr>)}</tbody>
      </table></div>
    </div>)}
  </div>;
}

/* ===== EDITOR DE CHECKLIST (jefaturas / gerencia / desarrollador) ===== */
function ChecklistEditor({user,toast,onSave}){
  const [,force]=useState(0);
  const [teamsDraft,setTeamsDraft]=useState(()=>({...(NOTIF.teamsPorArea||{})}));
  const areas = esGD(user)?Object.keys(AC):(user.areas||[]);
  const norm = it => (typeof it==='object'&&it)?{t:it.t,tipo:it.tipo||'foto'}:{t:it,tipo:'foto'};
  const [area,setArea]=useState(areas[0]||"");
  const [items,setItems]=useState(()=> (CL[area]||[]).map(norm));
  useEffect(()=>{ setItems((CL[area]||[]).map(norm)); },[area]);
  const TIPOS=[["foto","Foto"],["sino","Sí/No"],["texto","Texto"],["apertura_cierre","Apertura/Cierre"],["comida","Desayuno/Almuerzo/Cena"]];
  const upd=(i,k,v)=>setItems(arr=>arr.map((it,j)=>j===i?{...it,[k]:v}:it));
  const del=i=>setItems(arr=>arr.filter((_,j)=>j!==i));
  const mover=(i,d)=>setItems(arr=>{ const j=i+d; if(j<0||j>=arr.length)return arr; const c=[...arr]; [c[i],c[j]]=[c[j],c[i]]; return c; });
  const add=()=>setItems(arr=>[...arr,{t:"",tipo:"foto"}]);
  async function guardar(){ const prev=(CL[area]||[]).map(norm);
    const clean=items.filter(it=>String(it.t).trim()).map(it=>({t:it.t.trim(),tipo:it.tipo}));
    const pT=prev.map(x=>x.t), nT=clean.map(x=>x.t);
    const agreg=nT.filter(t=>!pT.includes(t)), elim=pT.filter(t=>!nT.includes(t));
    CL[area]=clean; onSave(); toast("Checklist actualizado: "+area);
    if(user.rol!=='desarrollador'){
      let det=[]; if(agreg.length) det.push(`agregó ${agreg.length} ítem(s): ${agreg.slice(0,3).join(", ")}${agreg.length>3?"…":""}`);
      if(elim.length) det.push(`eliminó ${elim.length} ítem(s): ${elim.slice(0,3).join(", ")}${elim.length>3?"…":""}`);
      if(!det.length) det.push("modificó ítems o tipos");
      await addNotif("Desarrollador", `${user.nombre} cambió el checklist de "${area}" (${det.join("; ")}).`, "", area);
    }
  }
  const [modo,setModo]=useState(()=>areaModo(area));
  useEffect(()=>{ setModo(areaModo(area)); },[area]);
  function cambiarModo(v){ setModo(v); AMODO[area]=v; }
  async function renombrarArea(a){ const nv=prompt("Nuevo nombre del ILD:", a); if(nv==null) return;
    const v=nv.trim(); if(!v||v===a) return; if(AC[v]){ toast("Ya existe un ILD con ese nombre"); return; }
    AC[v]=AC[a]; delete AC[a];
    if(APR[a]!==undefined){ APR[v]=APR[a]; delete APR[a]; }
    if(CL[a]!==undefined){ CL[v]=CL[a]; delete CL[a]; }
    if(AMODO[a]!==undefined){ AMODO[v]=AMODO[a]; delete AMODO[a]; }
    USERS.forEach(u=>{ if(u.areas) u.areas=u.areas.map(x=>x===a?v:x); });
    onSave(); if(area===a) setArea(v); force(x=>x+1);
    if(confirm(`ILD renombrado. ¿Actualizar también los registros ya guardados de "${a}" al nuevo nombre? (recomendado, para que cuenten en el dashboard)`)){
      try{ const all=await Store.read("ILD"); let n=0;
        const upd=all.map(r=>{ if(r.area===a){ n++; return {...r,area:v}; } return r; });
        if(n){ await Store.write("ILD",upd); toast(`Renombrado · ${n} registro(s) actualizados`); } else toast("ILD renombrado");
      }catch(e){ toast("Renombrado, pero no pude actualizar registros: "+(e.message||"")); }
    } else toast("ILD renombrado a: "+v); }
  function borrarArea(a){ if(!confirm(`¿Eliminar el ILD "${a}"? Los registros ya guardados NO se borran.`)) return;
    delete AC[a]; delete APR[a]; delete CL[a]; delete AMODO[a];
    USERS.forEach(u=>{ if(u.areas) u.areas=u.areas.filter(x=>x!==a); });
    onSave(); if(area===a){ const rest=Object.keys(AC); setArea(rest[0]||""); } force(x=>x+1); toast("ILD eliminado: "+a); }
  if(!areas.length) return <div className="empty"><div className="e"><Icon name="lock" size={44}/></div>No tienes áreas asignadas para personalizar.</div>;
  const nFotos=items.filter(it=>it.tipo==='foto').length;
  const grupos=[...new Set(Object.values(AC).map(v=>v&&v.g).filter(Boolean))].sort();
  const nombres=[...new Set(USERS.map(u=>u.nombre))].sort();
  function setGrupo(a,g){ if(AC[a]){ AC[a].g=g; onSave(); force(x=>x+1); } }
  function setApr(a,v){ APR[a]=v; onSave(); force(x=>x+1); }
  function saveTeams(a){ NOTIF.teamsPorArea={...(NOTIF.teamsPorArea||{}),[a]:(teamsDraft[a]||"").trim()}; onSave(); toast("Canal de Teams guardado"); }
  async function probarCanal(a){ const to=(teamsDraft[a]||"").trim()||NOTIF.teamsILD;
    if(!to){ toast("Pon el correo del canal (o configura el canal ILD por defecto)"); return; }
    NOTIF.teamsPorArea={...(NOTIF.teamsPorArea||{}),[a]:(teamsDraft[a]||"").trim()};
    const res=await sendMail(to,`[Prueba] Canal de ${a}`,mailHTML("Prueba de notificación · "+a,["Correo de prueba del canal de Teams de este ILD.","Si lo ves publicado en el grupo, el canal está bien configurado."],"ILD","PRUEBA"));
    toast(res.ok?("Prueba enviada a: "+to):("No se pudo: "+res.reason)); }
  const lbl={fontSize:11,color:"var(--muted)",marginBottom:2};
  return <div>
    {esDev(user) && <div className="card"><h3>Administrar ILD ({Object.keys(AC).length})</h3>
      <div className="hint" style={{marginBottom:8}}>Aquí asignas todo en un solo lugar: <b>grupo</b>, <b>aprobador</b> y <b>canal de Teams</b> de cada ILD. Los registros históricos no se borran.</div>
      <div style={{maxHeight:"62vh",overflow:"auto",border:"1px solid var(--line)",borderRadius:12}}>
        {Object.keys(AC).map(a=><div key={a} style={{padding:"11px 12px",borderBottom:"1px solid #f0ece3"}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:7,color:"var(--ink)"}}>{a}</div>
          <div className="row" style={{gap:8,flexWrap:"wrap"}}>
            <div style={{flex:"1 1 140px"}}><div style={lbl}>Grupo</div>
              <select className="inp" value={(AC[a]&&AC[a].g)||""} onChange={e=>setGrupo(a,e.target.value)}>{grupos.map(g=><option key={g}>{g}</option>)}</select></div>
            <div style={{flex:"1 1 140px"}}><div style={lbl}>Aprobador</div>
              <select className="inp" value={APR[a]||""} onChange={e=>setApr(a,e.target.value)}><option value="">—</option>{nombres.map(n=><option key={n}>{n}</option>)}</select></div>
          </div>
          <div className="row" style={{gap:8,marginTop:8,alignItems:"flex-end"}}>
            <div style={{flex:1}}><div style={lbl}>Canal de Teams (correo)</div>
              <input className="inp" value={teamsDraft[a]||""} placeholder="(usa el canal ILD por defecto)"
                onChange={e=>setTeamsDraft(d=>({...d,[a]:e.target.value}))} onBlur={()=>saveTeams(a)}/></div>
            <button className="btn ghost" style={{padding:"9px 12px",flex:"0 0 auto"}} onClick={()=>probarCanal(a)}>✉️ Probar</button>
          </div>
          <div className="row" style={{gap:8,marginTop:8}}>
            <button className="btn ghost" style={{flex:1,padding:"7px"}} onClick={()=>renombrarArea(a)}>✏️ Renombrar</button>
            <button className="btn red" style={{flex:1,padding:"7px"}} onClick={()=>borrarArea(a)}>🗑 Eliminar</button>
          </div>
        </div>)}
      </div></div>}
    <div className="card"><Field label="Área a personalizar">
      <select className="inp" value={area} onChange={e=>setArea(e.target.value)}>{areas.map(a=><option key={a}>{a}</option>)}</select></Field>
      <Field label="Modo del ILD" hint="'Lista' = el usuario elige UNA opción de la lista y sube de 3 a 5 fotos (ideal Áreas Públicas). 'Normal' = checklist completo.">
        <select className="inp" value={modo} onChange={e=>cambiarModo(e.target.value)}>
          <option value="normal">Checklist normal</option>
          <option value="lista">Lista (elegir una opción + 3 a 5 fotos)</option></select></Field>
      <div className="hint">{items.length} {modo==='lista'?"opciones de la lista":"ítems"} · {modo==='lista'?"el usuario elige una opción":`Fotos requeridas = ${nFotos}`}.</div></div>
    {items.map((it,i)=><div key={i} className="card" style={{padding:12}}>
      <div className="row" style={{gap:8,alignItems:"flex-start"}}>
        <div style={{flex:"0 0 20px",color:"var(--muted)",fontWeight:700,paddingTop:11}}>{i+1}</div>
        <div style={{flex:1}}>
          <input className="inp" value={it.t} onChange={e=>upd(i,"t",e.target.value)} placeholder="Texto del ítem"/>
          <select className="inp" style={{marginTop:8}} value={it.tipo} onChange={e=>upd(i,"tipo",e.target.value)}>{TIPOS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
          <div className="row" style={{marginTop:8,gap:6}}>
            <button className="btn ghost" style={{padding:"6px 11px"}} onClick={()=>mover(i,-1)}><Icon name="chevronUp" size={16}/></button>
            <button className="btn ghost" style={{padding:"6px 11px"}} onClick={()=>mover(i,1)}><Icon name="chevronDown" size={16}/></button>
            <button className="btn red" style={{padding:"6px 11px"}} onClick={()=>del(i)}><Icon name="trash" size={16} style={{marginRight:6}}/>Quitar</button>
          </div>
        </div></div></div>)}
    <button className="btn ghost block" onClick={add}><Icon name="plus" size={15} style={{marginRight:6}}/>Agregar ítem</button>
    <button className="btn primary block" style={{marginTop:10}} onClick={guardar}><Icon name="save" size={15} style={{marginRight:6}}/>Guardar checklist</button>
  </div>;
}
