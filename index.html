/* ===== HOUSEKEEPING — Auditorías de calidad (jefatura) =====

/* ===== HOUSEKEEPING — Auditorías de calidad (jefatura) =====
   Jefatura NUNCA elige a mano qué habitación auditar: la app selecciona sola,
   de forma pseudo-aleatoria y balanceada (procura no repetir siempre al mismo
   camarero/a), un mínimo de 3 limpiezas terminadas por día. Esto existe para
   que la auditoría sea una muestra de control de calidad, no una selección
   sesgada por la persona que audita. */
const HK_AUD_ESTADOS = ["Pendiente","En revisión","Auditada"];
const HK_AUD_RESULTADOS = ["Cumple","Cumple parcialmente","No cumple"];

/* Baraja un arreglo con Fisher-Yates usando Math.random(): alcanza para que la
   selección no sea manipulable por jefatura (ellos no la disparan a mano, se
   dispara sola al abrir la pantalla) y para repartir parejo entre camareros. */
function hkBarajar(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* Elige hasta n limpiezas de "candidatas" procurando no repetir camarero/a
   mientras haya opciones de otros; si ya no hay variedad, completa con lo que
   quede. Es la regla "balanceada" del punto de la especificación. */
function hkSeleccionBalanceada(candidatas, n){
  const barajadas = hkBarajar(candidatas);
  const elegidas=[]; const usados=new Set();
  for(const c of barajadas){ if(elegidas.length>=n) break;
    if(!usados.has(c.colaborador)){ elegidas.push(c); usados.add(c.colaborador); } }
  if(elegidas.length<n){
    for(const c of barajadas){ if(elegidas.length>=n) break;
      if(!elegidas.includes(c)) elegidas.push(c); }
  }
  return elegidas;
}
const HK_AUD_MIN_DIA = 3;
/* Se ejecuta sola al abrir la pantalla de Auditorías (nunca a pedido de una
   persona eligiendo habitaciones): si el día ya tiene su mínimo de auditorías
   asignadas, no hace nada; si faltan y ya hay limpiezas terminadas ese día sin
   auditar, completa hasta el mínimo. */
async function hkAsignarAuditoriasDelDia(fecha){
  try{
    const [auds, limpiezas] = await Promise.all([Store.read("HKAuditorias"), Store.read("HKLimpiezas")]);
    const audsHoy = auds.filter(a=>a.fecha===fecha);
    const faltan = HK_AUD_MIN_DIA - audsHoy.length;
    if(faltan<=0) return;
    const yaAuditadas = new Set(auds.map(a=>a.limpiezaId));
    const candidatas = limpiezas.filter(l=>l.fecha===fecha && l.estado==="Finalizado" && !yaAuditadas.has(l.id));
    if(!candidatas.length) return;
    const elegidas = hkSeleccionBalanceada(candidatas, faltan);
    const nuevas = elegidas.map(l=>({
      id: gid(), habitacionId:l.habitacionId, habitacionNumero:l.habitacionNumero, limpiezaId:l.id, limpiezaCodigo:l.Codigo,
      colaborador:l.colaborador, fecha, asignadoEn:nowISO(), horaEnvioILD:l.horaFin||l.horaInicio,
      estado:"Pendiente", auditor:"", resultado:"", observaciones:"", hallazgos:"", incidencias:"", correcciones:"",
      accionCorrectiva:"", fotos:[], fechaAuditoria:"", horaCierreAuditoria:"", cambiosAplicados:[]
    }));
    /* Re-chequeo antes de escribir: si otra persona (otro dispositivo) ya
       completó el mínimo del día mientras se armaba esta selección, no se
       agregan de más. */
    const fresco = await Store.read("HKAuditorias");
    const yaHoy = fresco.filter(a=>a.fecha===fecha).length;
    const permitir = Math.max(0, HK_AUD_MIN_DIA - yaHoy);
    if(!permitir) return;
    await Store.write("HKAuditorias", [...nuevas.slice(0,permitir), ...fresco]);
  }catch(e){ /* si falla, simplemente no se asignaron auditorías hoy: no rompe la pantalla */ }
}
function hkDiasDelMes(anio,mesIdx,modo){
  const total = new Date(anio, mesIdx+1, 0).getDate();
  if(modo==="laborables"){
    let n=0; for(let d=1; d<=total; d++){ const dow=new Date(anio,mesIdx,d).getDay(); if(dow!==0) n++; } return n; // excluye domingo
  }
  return total; // "calendario"
}

function HKAuditorias({user,toast,setFoto}){
  const [auds,setAuds]=useState([]); const [detalle,setDetalle]=useState(null);
  const [horarios,setHorarios]=useState([]);
  const [modo,setModo]=useState(()=>{ try{return localStorage.getItem("pp_hk_audit_denom")||"calendario";}catch(e){return "calendario";} });
  const load=()=>cargarConReintento(async()=>Store.read("HKAuditorias"), setAuds, toast, "las auditorías");
  useEffect(()=>{ (async()=>{ await hkAsignarAuditoriasDelDia(hoyEC()); load(); try{ setHorarios(await hkCargarHorarios()); }catch(e){} })(); },[]);
  function cambiarModo(m){ setModo(m); try{localStorage.setItem("pp_hk_audit_denom",m);}catch(e){} }
  const hoy = new Date();
  const auditoriasVencidas = a => a.estado!=="Auditada" && a.fecha < hoyEC();
  const ordenadas = [...auds].sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||"") || (b.asignadoEn||"").localeCompare(a.asignadoEn||""));
  const delMes = auds.filter(a=>{ const d=new Date(a.fecha); return d.getFullYear()===hoy.getFullYear() && d.getMonth()===hoy.getMonth(); });
  /* "programados" ya no está pendiente: sale de datos reales de Horarios (ver
     hkDiasProgramadosJefatura). null = nadie tiene el perfil "Jefatura HK"
     asignado todavía; 0 = sí hay perfil pero aún no se programó ningún día
     de este mes; ambos casos se explican en vez de mostrar un % engañoso. */
  const diasProgramados = modo==="programados" ? hkDiasProgramadosJefatura(hoy.getFullYear(),hoy.getMonth(),horarios) : null;
  const sinDatosProgramados = modo==="programados" && (diasProgramados==null || diasProgramados===0);
  const requeridas = modo==="programados"
    ? (diasProgramados||0)*HK_AUD_MIN_DIA
    : HK_AUD_MIN_DIA*hkDiasDelMes(hoy.getFullYear(),hoy.getMonth(),modo);
  const realizadas = delMes.filter(a=>a.estado==="Auditada").length;

  return <div>
    <div className="card">

      <Field label="Días aplicables del mes (denominador)">
        <select className="inp" value={modo} onChange={e=>cambiarModo(e.target.value)}>
          <option value="calendario">Días calendario</option>
          <option value="laborables">Días laborables (excl. domingo)</option>
          <option value="programados">Días programados de jefatura (según Horarios)</option>
        </select>
      </Field>
      {sinDatosProgramados
        ? <div className="hint">{diasProgramados==null
            ? '[PENDIENTE: ningún usuario tiene el perfil "Jefatura HK" asignado (Config › Usuarios). Usa "calendario" o "laborables" mientras tanto.]'
            : `Aún no se ha programado ningún día de jefatura este mes en Housekeeping › Horarios. Usa "calendario" o "laborables" mientras se programa, o ve a Horarios y asigna los días.`}</div>
        : <div className="row" style={{gap:24,marginTop:6}}>
            <div><div style={{fontSize:22,fontWeight:800}}>{realizadas}/{requeridas}</div><div className="hint">Auditadas / requeridas (3 × días{modo==="programados"?" programados":" del mes"})</div></div>
            <div><div style={{fontSize:22,fontWeight:800,color:pct>=100?"var(--green)":pct>=60?"var(--amber)":"var(--red)"}}>{pct}%</div><div className="hint">Cumplimiento del mes</div></div>
          </div>}
    </div>
    <div className="row" style={{justifyContent:"space-between",marginBottom:8}}>
      <span style={{color:"var(--muted)",fontSize:13}}>{ordenadas.length} auditoría(s) — mínimo {HK_AUD_MIN_DIA}/día, seleccionadas automáticamente</span>
    </div>
    {!ordenadas.length && <div className="empty"><div className="e">🔍</div>Aún no hay auditorías. Se asignan solas cuando haya limpiezas terminadas en el día.</div>}
    {ordenadas.map(a=>{ const vencida=auditoriasVencidas(a);
      const tiempoRevision = a.estado==="Auditada" ? Math.round((new Date(a.horaCierreAuditoria)-new Date(a.horaEnvioILD))/60000)+" min" : "No aplica";
      return <div key={a.id} className="item" style={{cursor:"pointer"}} onClick={()=>setDetalle(a)}>
        <div className="top"><div>
          <div className="code">Hab. {a.habitacionNumero} · {a.fecha}</div>
          <div className="ttl">{a.colaborador}</div>
          <div className="meta">Tiempo de revisión: {tiempoRevision}{a.resultado?" · "+a.resultado:""}</div>
        </div><Pill estado={vencida?"Vencida":a.estado} overdue={vencida}/></div>
      </div>; })}
    {detalle && <HKAuditoriaDetalle aud={detalle} user={user} toast={toast} setFoto={setFoto} onClose={()=>setDetalle(null)} onSaved={()=>{setDetalle(null);load();}}/>}
  </div>;
}

/* ===== HOUSEKEEPING — Horarios y productividad (jefatura) =====
   Dos cosas en un mismo módulo porque comparten la misma fuente de datos
   (PP_HK_Horarios): 1) un calendario semanal para programar quién trabaja
   qué día (camareras/os, áreas públicas y jefatura), y 2) un reporte de
   productividad que cruza esos días programados con las limpiezas
   realmente finalizadas. También es lo que le faltaba a Auditorías para
   poder calcular "días programados de jefatura" con datos reales en vez
   de dejarlo marcado [PENDIENTE]. */
const HK_JORNADA_TIPOS = ["Trabajo","Libre","Vacaciones","Incapacidad"];
const HK_JORNADA_COLOR = { Trabajo:"var(--green)", Libre:"var(--gray)", Vacaciones:"var(--blue)", Incapacidad:"var(--red)" };
const HK_JORNADA_LETRA = { Trabajo:"T", Libre:"L", Vacaciones:"V", Incapacidad:"I" };
const HK_PERFIL_LABEL = { jefatura_hk:"Jefatura", camarero_hab:"Camarero/a", areas_publicas:"Áreas públicas" };
const HK_DOW_CORTO = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

async function hkCargarHorarios(){ try{ return await Store.read("HKHorarios"); }catch(e){ return []; } }
/* Roster de personas de Housekeeping (cualquier perfil), para Horarios/Productividad. */
function hkRoster(){ return USERS.filter(u=>tieneHK(u)).sort((a,b)=>a.nombre.localeCompare(b.nombre)); }
/* Lunes→domingo de la semana que contiene "fechaYMD" (YYYY-MM-DD), como 7 fechas YYYY-MM-DD. */
function hkSemanaDe(fechaYMD){
  const d = new Date(fechaYMD+"T00:00:00");
  const dow = d.getDay(); // 0=domingo
  const lunes = new Date(d); lunes.setDate(d.getDate() - ((dow+6)%7));
  return Array.from({length:7},(_,i)=>{ const x=new Date(lunes); x.setDate(lunes.getDate()+i); return x.toLocaleDateString("en-CA"); });
}
function hkSumarSemanas(fechaYMD, delta){ const d=new Date(fechaYMD+"T00:00:00"); d.setDate(d.getDate()+delta*7); return d.toLocaleDateString("en-CA"); }
/* Cuenta, dentro del mes (anio,mesIdx), cuántos días DISTINTOS tienen al menos
   una persona con perfil "jefatura_hk" programada con tipo "Trabajo".
   Devuelve null si nadie tiene ese perfil asignado (para no mostrar un 0
   engañoso: es "no configurado", no "cero días programados"). */
function hkDiasProgramadosJefatura(anio, mesIdx, horarios){
  const jefas = new Set(USERS.filter(u=>u.hk && u.hk.perfil==='jefatura_hk').map(u=>u.nombre));
  if(!jefas.size) return null;
  const dias = new Set();
  (horarios||[]).forEach(h=>{
    if(h.tipo!=="Trabajo" || !jefas.has(h.colaborador)) return;
    const d = new Date(h.fecha+"T00:00:00");
    if(d.getFullYear()===anio && d.getMonth()===mesIdx) dias.add(h.fecha);
  });
  return dias.size;
}

function HKTurnoModal({colaborador,fecha,existente,onClose,onSaved,toast}){
  const [tipo,setTipo]=useState(existente?existente.tipo:"Trabajo");
  const [horaInicio,setHoraInicio]=useState(existente&&existente.horaInicio?existente.horaInicio:"08:00");
  const [horaFin,setHoraFin]=useState(existente&&existente.horaFin?existente.horaFin:"16:00");
  const [busy,unaVez]=useEnvioUnico();
  async function guardar(){
    await unaVez(async()=>{
      try{
        const arr = await Store.read("HKHorarios");
        const resto = arr.filter(h=>!(h.colaborador===colaborador && h.fecha===fecha));
        const nuevo = { id: existente?existente.id:gid(), colaborador, fecha, tipo,
          horaInicio: tipo==="Trabajo"?horaInicio:"", horaFin: tipo==="Trabajo"?horaFin:"",
          creadoEn: existente?existente.creadoEn:nowISO(), actualizadoEn: nowISO() };
        await Store.write("HKHorarios", [nuevo, ...resto]);
        toast("Horario guardado"); onSaved(); onClose();
      }catch(e){ toast("No se pudo guardar: "+(e.message||e)); }
    });
  }
  async function quitar(){
    await unaVez(async()=>{
      try{
        const arr = await Store.read("HKHorarios");
        await Store.write("HKHorarios", arr.filter(h=>!(h.colaborador===colaborador && h.fecha===fecha)));
        toast("Se quitó la asignación"); onSaved(); onClose();
      }catch(e){ toast("No se pudo quitar: "+(e.message||e)); }
    });
  }
  return <Modal title={colaborador+" · "+fecha} onClose={onClose}>
    <Field label="Tipo de jornada">
      <div className="opts">
        {HK_JORNADA_TIPOS.map(t=><button key={t} className={"opt"+(tipo===t?" on":"")} onClick={()=>setTipo(t)}>{t}</button>)}
      </div>
    </Field>
    {tipo==="Trabajo" && <div className="row" style={{gap:10}}>
      <Field label="Hora inicio"><input className="inp" type="time" value={horaInicio} onChange={e=>setHoraInicio(e.target.value)}/></Field>
      <Field label="Hora fin"><input className="inp" type="time" value={horaFin} onChange={e=>setHoraFin(e.target.value)}/></Field>
    </div>}
    <button className="btn primary block" disabled={busy} onClick={guardar}>{busy?"Guardando…":"Guardar"}</button>
    {existente && <button className="btn ghost block" style={{marginTop:8}} disabled={busy} onClick={quitar}>Quitar asignación</button>}
  </Modal>;
}

function HKProductividad({toast}){
  const [horarios,setHorarios]=useState([]); const [limpiezas,setLimpiezas]=useState([]); const [auds,setAuds]=useState([]);
  const [mes,setMes]=useState(()=>{ const d=new Date(); return {anio:d.getFullYear(), mesIdx:d.getMonth()}; });
  const load=()=>cargarConReintento(async()=>({
      horarios: await hkCargarHorarios(), limpiezas: await hkCargarLimpiezas(), auds: await Store.read("HKAuditorias")
    }), d=>{setHorarios(d.horarios);setLimpiezas(d.limpiezas);setAuds(d.auds);}, toast, "la productividad");
  useEffect(()=>{load();},[]);
  const {anio,mesIdx} = mes;
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const enElMes = f => { const d=new Date(f+"T00:00:00"); return d.getFullYear()===anio && d.getMonth()===mesIdx; };
  const roster = hkRoster().filter(u=>esHKCamarero(u)||esHKAreasPublicas(u)); // productividad de quienes limpian, no de jefatura
  const filas = roster.map(u=>{
    const diasProgramados = horarios.filter(h=>h.colaborador===u.nombre && h.tipo==="Trabajo" && enElMes(h.fecha)).length;
    const finalizadas = limpiezas.filter(l=>l.colaborador===u.nombre && l.estado==="Finalizado" && enElMes(l.fecha));
    const tiempos = finalizadas.map(l=>l.tiempoMin).filter(n=>Number.isFinite(n));
    const tiempoProm = tiempos.length ? Math.round(tiempos.reduce((a,b)=>a+b,0)/tiempos.length) : null;
    const promDia = diasProgramados ? (finalizadas.length/diasProgramados) : null;
    const audsDe = auds.filter(a=>a.colaborador===u.nombre && a.estado==="Auditada" && enElMes(a.fechaAuditoria||a.fecha));
    const cumple = audsDe.filter(a=>a.resultado==="Cumple").length;
    const parcial = audsDe.filter(a=>a.resultado==="Cumple parcialmente").length;
    const noCumple = audsDe.filter(a=>a.resultado==="No cumple").length;
    return { u, diasProgramados, finalizadas:finalizadas.length, tiempoProm, promDia, cumple, parcial, noCumple, auditadas:audsDe.length };
  });
  const totFinalizadas = filas.reduce((a,f)=>a+f.finalizadas,0);
  function cambiarMes(delta){
    setMes(m=>{ let mesIdx=m.mesIdx+delta, anio=m.anio; if(mesIdx<0){mesIdx=11;anio--;} if(mesIdx>11){mesIdx=0;anio++;} return {anio,mesIdx}; });
  }
  return <div>
    <div className="row" style={{justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
      <div className="row" style={{gap:8}}>
        <button className="btn ghost" style={{padding:"8px 12px"}} onClick={()=>cambiarMes(-1)}><Icon name="chevronLeft" size={16}/></button>
        <span style={{fontWeight:800,textTransform:"capitalize"}}>{meses[mesIdx]} {anio}</span>
        <button className="btn ghost" style={{padding:"8px 12px",fontWeight:800}} onClick={()=>cambiarMes(1)}>›</button>
      </div>
      <span style={{color:"var(--muted)",fontSize:13}}>{totFinalizadas} limpieza(s) finalizada(s) en el mes</span>
    </div>
    {!roster.length && <div className="empty"><div className="e">👥</div>Aún no hay camareros/as ni áreas públicas asignados en Usuarios.</div>}
    {roster.length>0 && <div className="dscroll"><table className="dtable">
      <thead><tr><th>Colaborador/a</th><th>Días prog.</th><th>Limpiezas</th><th>Prom./día</th><th>Tiempo prom.</th><th>Auditadas</th><th>Cumple / Parcial / No cumple</th></tr></thead>
      <tbody>{filas.map(f=><tr key={f.u.id}>
        <td><div>{f.u.nombre}</div><div className="dsub">{HK_PERFIL_LABEL[f.u.hk&&f.u.hk.perfil]||""}</div></td>
        <td>{f.diasProgramados}</td>
        <td>{f.finalizadas}</td>
        <td>{f.promDia==null?"—":f.promDia.toFixed(1)}</td>
        <td>{f.tiempoProm==null?"—":f.tiempoProm+" min"}</td>
        <td>{f.auditadas}</td>
        <td>{f.auditadas ? `${f.cumple} / ${f.parcial} / ${f.noCumple}` : "—"}</td>
      </tr>)}</tbody>
    </table></div>}
    <div className="hint" style={{marginTop:10}}>"Días prog." y "Prom./día" salen de lo programado en Housekeeping › Horarios para el mes elegido. Si no se ha programado a alguien todavía, esas columnas quedan en "—" en vez de mostrar un promedio inventado.</div>
  </div>;
}

        try{ if(!localStorage.getItem("pp_hist_v1")){
          const pares=[["ILD",ILD_SEED],["Compras",COMPRAS_SEED],["Sistemas",SISTEMAS_SEED],["Mantenimiento",MANT_SEED]];
          for(const [t,seed] of pares){ if(seed && seed.length){ const cur=await Store.read(t); if(!cur.length){ await Store.write(t,seed); } } }
          localStorage.setItem("pp_hist_v1","1"); } }catch(e){}
        /* Semilla real de las 47 habitaciones (ver HK_HAB_SEED), una sola vez y
           solo si el catálogo sigue vacío: si alguien ya cargó/editó habitaciones
           a mano, esto no las toca ni las duplica. */
        try{ if(!localStorage.getItem("pp_hk_hab_seed_v1")){
          const curHab = await Store.read("HKHabitaciones");
          if(!curHab.length) await Store.write("HKHabitaciones", HK_HAB_SEED);
          localStorage.setItem("pp_hk_hab_seed_v1","1"); } }catch(e){}
        /* Semilla real de las 20 áreas públicas (ver HK_AREAS_SEED, tomadas del
           mismo catálogo que ya usa ILD para esa área), una sola vez y solo si
           el catálogo de áreas de Housekeeping sigue vacío. */
        try{ if(!localStorage.getItem("pp_hk_areas_seed_v1")){
          const curAreas = await Store.read("HKAreas");
          if(!curAreas.length && HK_AREAS_SEED.length) await Store.write("HKAreas", HK_AREAS_SEED);
          localStorage.setItem("pp_hk_areas_seed_v1","1"); } }catch(e){}
        bump(); } }
    setChecking(false);
  })(); },[]);
  /* Renueva el token de Microsoft solo, cada 20 min, mientras la tablet quede
     encendida todo el turno. Antes solo se pedía al abrir la app; a media
     jornada vencía y cada envío fallaba en silencio (ver refreshToken en gfetch). */
  useEffect(()=>{ if(MODE!=="graph") return;
    const t=setInterval(async()=>{ const ok=await refreshToken(); if(ok) setConnected(true); }, 20*60*1000);
    return ()=>clearInterval(t);
  },[]);
  const toast=m=>{ setToastMsg(m); const dur=/no se pudo|error|❌|403|falló|no encontr|presupuesto/i.test(m)?8000:2600; setTimeout(()=>setToastMsg(""),dur); };
  async function reloadCounts(u, _retry){ const who=u||user; if(!who) return;
    try{
      const c=await Store.read("Compras"), s=await Store.read("Sistemas"), m=await Store.read("Mantenimiento"), il=await Store.read("ILD");
      const pendChief=(arr,mod,abiertos)=> gestionaModulo(who,mod) ? arr.filter(r=>abiertos.includes(r.Estado)).length
        : arr.filter(r=>r.Solicitante===who.nombre&&!cerrados.includes(r.Estado)).length;
      setCounts({
        compras:pendChief(c,"compras",["Solicitado","En Gerencia","En compra","Listo para entregar"]),
        sistemas:pendChief(s,"sistemas",["Nuevo","Sin fecha asignada","En proceso"]),
        mantenimiento:pendChief(m,"mantenimiento",["Nuevo","Sin fecha asignada","En proceso"]),
        ild:(esGD(who)||who.rol==='aprobador')?il.filter(r=>!esDuplicado(r)&&r.estado==='Pendiente'&&(esGD(who)||(who.areas||[]).includes(r.area))).length:0
      });
      setGerr("");
    }catch(e){
      /* Antes esto quedaba en silencio y el Dashboard/Resumen se veían "vacíos"
         aunque el badge dijera "En línea". Si es el token vencido, se renueva
         solo y se reintenta una vez; si vuelve a fallar, sí se avisa. */
      if(!_retry){ const ok=await refreshToken(); if(ok) return reloadCounts(who, true); }
      setGerr("No se pudo actualizar la información (Compras/Sistemas/Mantenimiento/ILD). Toca 'Reconectar Microsoft' arriba. Detalle: "+(e.message||e));
    }
  }
  useEffect(()=>{ if(user){ reloadCounts(); loadNotifs(); } },[user,view,cfgVer]);
  useEffect(()=>{ if(!user || !DEEPLINK || window.__deepDone) return; window.__deepDone=true;
    const map={ILD:"ild",Compras:"compras",Sistemas:"sistemas",Mantenimiento:"mantenimiento"};
    const v=map[DEEPLINK.mod]; if(!v) return; setView(v);
    if(!DEEPLINK.code) return;
    (async()=>{ try{
      if(DEEPLINK.mod==="ILD"){ const ilds=await Store.read("ILD");
        const rec=ilds.find(r=>String(r.id)===String(DEEPLINK.code)||r.Codigo===DEEPLINK.code); if(rec) setDetailIld(rec); }
      else { const tabla=DEEPLINK.mod; const arr=await Store.read(tabla);
        const rec=arr.find(r=>r.Codigo===DEEPLINK.code||String(r.id)===String(DEEPLINK.code)); if(rec) setDetailKan({tabla,r:rec}); }
    }catch(e){} })();
  },[user]);
  async function onLogin(u){ sessionStorage.setItem("pp_user",JSON.stringify(u)); setUser(u); setView("home"); }
  function logout(){ sessionStorage.removeItem("pp_user"); setUser(null); setView("home"); }
  if(MODE==="graph" && checking) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Playa Paraíso</div>
    <div className="ltag" style={{marginBottom:0}}>Conectando con SharePoint…</div></div></div>;
  if(MODE==="graph" && !connected) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Playa Paraíso</div>
    <div className="ltag">Inicia sesión con tu cuenta Microsoft para usar la app. El histórico se guarda en SharePoint (Prueba7).</div>
    <button className="btn ocean block" onClick={()=>msSignIn()}><Icon name="link" size={15} style={{marginRight:6}}/>Iniciar sesión con Microsoft</button>
    {msErr && <div className="lerr" style={{marginTop:12,whiteSpace:"normal"}}>{msErr}</div>}
  </div></div>;
  if(!user) return <Login onLogin={onLogin}/>;
  const rolLbl={desarrollador:"Desarrollador",gerencia:"Gerencia",aprobador:"Aprobador",colaborador:"Colaborador"}[user.rol]||user.rol;
  const titles={ild:"ILD",compras:"Compras",sistemas:"Sistemas",mantenimiento:"Mantenimiento",kanban:"Kanban",housekeeping:"Housekeeping",admin:"Configuración"};
  return <div className="app">
    <div className="topbar"><div className="brand"><span className="logobox" onClick={()=>setView("home")} style={{cursor:"pointer"}}><img src={LOGO} alt="Playa Paraíso"/></span></div><div className="sp"></div>
      <EstadoRed user={user}/>
      <div className="who">{user.nombre}<br/><span style={{opacity:.85}}>{rolLbl}</span></div>
      <button className="iconbtn" title="Notificaciones" style={{position:"relative"}} onClick={()=>setNotifOpen(true)}><Icon name="bell" size={19}/>
        {notifs.length>0 && <span style={{position:"absolute",top:-4,right:-4,background:"var(--coral)",color:"#fff",borderRadius:"999px",fontSize:10,fontWeight:800,minWidth:18,height:18,display:"grid",placeItems:"center",padding:"0 4px"}}>{notifs.length}</span>}</button>
      <button className="iconbtn" title="Salir" onClick={logout}><Icon name="logout" size={19}/></button></div>
    <div className="content">
      {gerr && <div className="banner"><Icon name="alert" size={15} style={{marginRight:6}}/>{gerr}</div>}
      <AvisoPendientes user={user} toast={toast} onIr={()=>setView('ild')}/>
      {view!=="home" && <div className="backrow"><button className="backbtn" onClick={()=>setView("home")}><Icon name="chevronLeft" size={16} style={{marginRight:6,marginLeft:-2}}/>Inicio</button>
        <span style={{color:"var(--muted)",fontWeight:600}}>{titles[view]}</span></div>}
      {view==="home" && <Home user={user} go={setView} counts={counts}/>}
      {view==="ild" && <ILD key={cfgVer} user={user} toast={toast} setFoto={setFoto} bump={bump}/>}
      {view==="compras" && <Compras user={user} toast={toast} setFoto={setFoto}/>}
      {view==="sistemas" && <Tickets tipo="Sistemas" user={user} toast={toast} setFoto={setFoto}/>}
      {view==="mantenimiento" && <Tickets tipo="Mantenimiento" user={user} toast={toast} setFoto={setFoto}/>}
      {view==="kanban" && <Kanban user={user} toast={toast} setFoto={setFoto}/>}
      {view==="housekeeping" && <Housekeeping user={user} toast={toast} setFoto={setFoto}/>}
      {view==="admin" && <Admin user={user} toast={toast}/>}
    </div>
    <BottomNav user={user} view={view} go={setView} counts={counts}/>
    {toastMsg && <div className="toast">{toastMsg}</div>}
    <FotoModal src={foto} onClose={()=>setFoto(null)}/>
    {notifOpen && <Modal title="Notificaciones" onClose={()=>setNotifOpen(false)}>
      {!notifs.length && <div className="empty"><div className="e"><Icon name="inbox" size={44}/></div>No tienes notificaciones</div>}
      {notifs.map(n=><div key={n.id} className="item" style={{cursor:"pointer"}} onClick={()=>abrirNotif(n)}>
        <div className="ttl" style={{fontSize:14}}>{n.texto}</div>
        <div className="meta">{fmtDT(n.fecha)} · toca para ver el ILD</div></div>)}
      {notifs.length>0 && <div className="hint">Al abrir una notificación, se marca como leída y desaparece.</div>}
    </Modal>}
    {detailIld && <ILDDetail user={user} r={detailIld} onClose={()=>{setDetailIld(null);loadNotifs();}} reload={()=>{}} toast={toast} setFoto={setFoto}/>}
    {detailKan && <KanModal proc={detailKan.tabla.toLowerCase()} tabla={detailKan.tabla} r={detailKan.r} canEdit={false} cols={[]} onClose={()=>setDetailKan(null)} onSaved={()=>{}} toast={toast} setFoto={setFoto}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
(function(){
  function show(msg){ var r=document.getElementById("root"); if(r&&r.children.length>0)return;
    r.innerHTML='<div style="max-width:560px;margin:40px auto;padding:20px;font-family:Inter,system-ui,sans-serif;color:#1f2a2c">'+
      '<h2 style="color:#0d6e75">Playa Paraíso no pudo cargar</h2><p style="color:#6c7a7c">'+msg+'</p>'+
      '<p style="color:#6c7a7c;font-size:13px">Si lo ves en la vista previa, descarga el archivo y ábrelo en tu navegador o súbelo a Netlify.</p></div>'; }
  window.addEventListener("error",function(e){ show("Detalle: "+(e.message||"error al cargar un recurso")); });
  window.addEventListener("load",function(){ setTimeout(function(){
    if(typeof React==="undefined") return show("No se cargó React (la red bloqueó la CDN).");
    show("La aplicación no se inició. Abre la consola (F12) para más detalle."); },1800); });
})();
</script>
</body>
</html>
